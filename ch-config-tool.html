  <script>
  /* =============================================================================
   * MODULE: App.adapters.android
   * PURPOSE: The Android (ADB) dataset adapters (spec Appendix B) + the two-layer
   *          shell-escaping helpers + tactical path/flatten/rebuild utilities.
   *          ALL Android/format-specific knowledge lives here; the rest of the app
   *          is platform-blind (spec §5, §5.4). No literal dataset-id branching
   *          exists outside this file.
   * PURITY:  pure (parse/generate are pure functions over plain data; no DOM/IO)
   * DEPENDS: App.util.html (esc, for report fragments), App.util.stable
   * INVARIANTS:
   *   * Keys / package tokens are charset-restricted at parse so ONLY values ever
   *     need shell escaping (spec §9, Appendix B).
   *   * Every data-derived value sent to the device shell is quoted through BOTH
   *     the PowerShell and POSIX layers — total over arbitrary bytes.
   *   * Tactical preserves JSON types; arrays of scalars are whole leaves.
   * ============================================================================= */
  (function (App) {
    'use strict';

    var esc = App.util.html.esc;
    var stableStringify = App.util.stable.stableStringify;

    /** Resolve an item's control ids to control titles via ctx.project.controls (§18.3). */
    function controlTitles(refs, ctx) {
      var by = {}; ((ctx && ctx.project && ctx.project.controls) || []).forEach(function (c) { by[c.id] = c.title; });
      return (refs || []).map(function (r) { return by[r] || r; }).join(', ');
    }

    // ---- Injection-safety: two-layer shell quoting (spec Appendix B, MUST) -----
    /**
     * PowerShell single-quoted literal: wrap in ' … ', double embedded single quotes.
     * @param {*} s @returns {string}
     */
    function psSingleQuote(s) { return "'" + String(s).replace(/'/g, "''") + "'"; }
    /**
     * POSIX-shell single-quoted literal: wrap in ' … ', replace each ' with '\'' .
     * @param {*} s @returns {string}
     */
    function shSingleQuote(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }

    // ---- Tactical path helpers (spec §8.2) -------------------------------------
    /**
     * Parse a dotted/bracketed path into segments.
     * @param {string} path e.g. 'radios[0].mode'
     * @returns {Array<{key?:string,index?:number}>}
     */
    function parsePath(path) {
      var segs = [], re = /([^.\[\]]+)|\[(\d+)\]/g, m;
      while ((m = re.exec(path)) !== null) {
        if (m[2] !== undefined) segs.push({ index: parseInt(m[2], 10) });
        else segs.push({ key: m[1] });
      }
      return segs;
    }
    function segKey(s) { return s.key !== undefined ? s.key : s.index; }

    /** Set a value at a path within obj, creating intermediate containers. */
    function setAtPath(obj, segs, value) {
      var cur = obj;
      for (var i = 0; i < segs.length - 1; i++) {
        var k = segKey(segs[i]);
        if (cur[k] === undefined || cur[k] === null) cur[k] = (segs[i + 1].index !== undefined) ? [] : {};
        cur = cur[k];
      }
      cur[segKey(segs[segs.length - 1])] = value;
    }
    /** Read a value at a path (undefined if any segment is missing). */
    function getAtPath(obj, segs) {
      var cur = obj;
      for (var i = 0; i < segs.length; i++) { if (cur == null) return undefined; cur = cur[segKey(segs[i])]; }
      return cur;
    }
    // A `policyList` (spec/review-3 #3) is an array of {name, checked} objects where
    // `name` is the policy identity and `checked` is its (boolean) setting.
    function isPolicyObj(o) { return o && typeof o === 'object' && !Array.isArray(o) && ('name' in o) && ('checked' in o); }
    function isPolicyArray(arr) { return Array.isArray(arr) && arr.length > 0 && arr.every(isPolicyObj); }

    function isScalar(v) { return v === null || typeof v !== 'object'; }
    function jsType(v) {
      if (v === null) return 'null';
      if (typeof v === 'boolean') return 'bool';
      if (typeof v === 'number') return Number.isInteger(v) ? 'int' : 'float';
      return 'string';
    }

    /**
     * Flatten a tactical JSON document into leaf items (spec §8.2).
     * Rules: objects recurse (.key); arrays whose elements are ALL scalars (or
     * empty) are WHOLE leaves; arrays containing objects/arrays recurse ([i]);
     * scalars (incl. null) are leaves. JSON types are preserved.
     * @param {*} doc
     * @returns {Array<{key:string,value:*,type:string}>}
     */
    function flattenTactical(doc) {
      var leaves = [];
      (function walk(node, path) {
        if (isScalar(node)) { leaves.push({ key: path, value: node, type: jsType(node) }); return; }
        if (Array.isArray(node)) {
          if (node.length === 0 || node.every(isScalar)) { leaves.push({ key: path, value: node, type: 'array' }); return; }
          for (var i = 0; i < node.length; i++) walk(node[i], path + '[' + i + ']');
          return;
        }
        // plain object
        var keys = Object.keys(node);
        for (var j = 0; j < keys.length; j++) {
          var k = keys[j], childPath = path ? path + '.' + k : k;
          // policyList special-case (review-3 #3): one leaf per policy, keyed (for
          // STORAGE/ROUTING) by `…policyList.<name>` and valued by `checked` (e.g.
          // {name:'Disable Bluetooth', checked:false} -> key 'policyList.Disable
          // Bluetooth' = false). Rebuild mirrors this. The `policyList.` segment is a
          // stable internal identity; it is stripped for DISPLAY only via
          // `tactical.displayKey` (review-4 #1) so it never collides with sibling
          // keys nor breaks already-saved projects.
          if (k === 'policyList' && isPolicyArray(node[k])) {
            node[k].forEach(function (pol) { leaves.push({ key: childPath + '.' + pol.name, value: pol.checked, type: jsType(pol.checked) }); });
            continue;
          }
          walk(node[k], childPath);
        }
      })(doc, '');
      return leaves;
    }

    /**
     * Strip the `policyList.` segment from a tactical key for DISPLAY only
     * (review-4 #1): `policyList.Disable Bluetooth` -> `Disable Bluetooth`, and a
     * nested `foo.policyList.Bar` -> `foo.Bar`. The STORED/routed key keeps the
     * segment, so this is purely cosmetic and never affects rebuild, storage, or
     * already-saved projects. Idempotent on keys without the segment.
     * @param {string} key
     * @returns {string}
     */
    function stripPolicyPrefix(key) {
      if (typeof key !== 'string') return key;
      if (key.indexOf('policyList.') === 0) return key.slice('policyList.'.length);
      var m = key.indexOf('.policyList.');
      if (m >= 0) return key.slice(0, m) + '.' + key.slice(m + '.policyList.'.length);
      return key;
    }

    /**
     * Rebuild a tactical document by applying decided values onto a deep clone of
     * the template (spec §8.2). Untouched keys/types/nesting/arrays are preserved.
     * @param {*} template
     * @param {RegisterItem[]} items  Only non-null decisions are applied.
     * @returns {*} the rebuilt document object
     */
    function rebuildTacticalDoc(template, items) {
      var doc = JSON.parse(JSON.stringify(template));
      items.forEach(function (it) {
        if (!it.decision || !Object.prototype.hasOwnProperty.call(it.decision, 'value')) return;
        // policyList items (review-3 #3): set the matching policy's `checked` by name.
        var arrPath = null, polName = null;
        if (it.key.indexOf('policyList.') === 0) { arrPath = 'policyList'; polName = it.key.slice('policyList.'.length); }
        else { var mk = it.key.indexOf('.policyList.'); if (mk >= 0) { arrPath = it.key.slice(0, mk) + '.policyList'; polName = it.key.slice(mk + '.policyList.'.length); } }
        if (arrPath !== null) {
          var arr = getAtPath(doc, parsePath(arrPath));
          if (Array.isArray(arr)) { var pol = arr.filter(function (p) { return p && p.name === polName; })[0]; if (pol) { pol.checked = it.decision.value; return; } }
        }
        setAtPath(doc, parsePath(it.key), it.decision.value);
      });
      return doc;
    }

    // ===========================================================================
    // android.packages
    // ===========================================================================
    var PKG_TOKEN_RE = /^[A-Za-z0-9._]+$/;

    var packages = {
      id: 'android.packages',
      label: 'Packages',
      inputKind: 'text',
      captureHint: 'adb -s <serial> shell pm list packages  >  pm_list.txt',

      /** @param {string} raw @returns {ParseResult} */
      parse: function (raw) {
        var warnings = [], errors = [], seen = {}, keys = [];
        var lines = String(raw).split(/\r?\n/);
        var anyToken = false;
        lines.forEach(function (line, idx) {
          var loc = 'line ' + (idx + 1);
          var s = line.trim();
          if (s === '' || s.charAt(0) === '#') return;       // blank / comment
          if (s.indexOf('package:') === 0) s = s.slice('package:'.length);
          var eq = s.indexOf('=');
          if (eq !== -1) s = s.slice(0, eq);                  // strip =path/installer
          s = s.trim();
          if (s === '') return;
          if (!PKG_TOKEN_RE.test(s)) {

        'function Verify-Package($pkg, $action) { Write-Output "CHECK package $pkg expect $action" }',
        'function Verify-Setting($getCmd, $expected) { Write-Output "CHECK $getCmd expect $expected" }',
        '',
        'Start-Transcript -Path ("ch-" + $Serial + ".log") -Append | Out-Null',
        ''
      ].join('\n');
    }

    function scriptPostamble(ctx) {
      return ['', '# --- End ---', 'Stop-Transcript | Out-Null'].join('\n');
    }

    var captureInstructions =
      'Capture three files from the target device (the tool never contacts a device):\n' +
      '  1. Packages (packages.txt): adb -s <serial> shell pm list packages\n' +
      '       (one "package:<name>" per line)\n' +
      '  2. Settings (settings.txt): adb shell settings list system, secure, global —\n' +
      '       concatenate the three, each section preceded by a "<namespace>:" header line,\n' +
      '       e.g.  system:\\n key=value ...  secure:\\n key=value ...  global:\\n key=value ...\n' +
      '  3. Tactical (policy json): export the device tactical/policy configuration as a JSON object';

    App.platforms = App.platforms || {};
    App.platforms.androidAdb = {
      id: 'android-adb',
      label: 'Android (ADB)',
      outputLanguage: 'powershell',
      scriptExtension: '.ps1',   // generator wraps these files with preamble/postamble
      datasets: [A.packages, A.settings, A.tactical],
      captureInstructions: captureInstructions,
      scriptPreamble: scriptPreamble,
      scriptPostamble: scriptPostamble
    };
  })(App);
  </script>

  <!-- ===== PHASE-2 SELF-TEST SUITES (Android adapters) ===== -->
  <script>
  (function (App) {
    'use strict';
    var T = App.test;
    var A = App.adapters.android;

    T.suite('android.packages parse', function (s) {
      s.test('strips package: prefix, =path, dedupes, sorts', function () {
        var r = A.packages.parse('package:com.b\npackage:com.a=/data/app/a\ncom.a\n# comment\n\n');
        T.assertDeepEqual(r.keys, ['com.a', 'com.b']);
        T.assertEqual(r.errors.length, 0);
        T.assertEqual(r.warnings.length, 1); // duplicate com.a
      });
      s.test('empty file errors', function () {
        var r = A.packages.parse('\n\n# only comments\n');
        T.assertEqual(r.errors.length, 1);
      });
      s.test('line with a space errors (malformed token)', function () {
        var r = A.packages.parse('com.foo bar');
        T.assert(r.errors.some(function (e) { return /valid package token/.test(e.message); }));
      });
    });

    T.suite('android.settings parse (sectioned key=value)', function (s) {
      s.test('parses "<namespace>:" sections, key = ns/key, value verbatim', function () {
        var raw = 'system:\nfont_scale=1.0\nsecure:\nlocation_mode=0\nglobal:\nadb_enabled=1';
        var r = A.settings.parse(raw);
        T.assertDeepEqual(r.keys, ['global/adb_enabled', 'secure/location_mode', 'system/font_scale']);
        T.assertEqual(r.values['secure/location_mode'], '0');
        T.assertEqual(r.errors.length, 0);
      });
      s.test('key may contain # (Samsung add_info_* keys)', function () {
        var r = A.settings.parse('system:\nadd_info_com_x#dashboard=1');
        T.assertEqual(r.errors.length, 0);
        T.assertEqual(r.values['system/add_info_com_x#dashboard'], '1');
      });
      s.test('first "=" splits; value may contain "=" and spaces', function () {
        var r = A.settings.parse('global:\nbar=a=b=c\nsystem:\nname=Galaxy Tab Active5 5G');
        T.assertEqual(r.values['global/bar'], 'a=b=c');
        T.assertEqual(r.values['system/name'], 'Galaxy Tab Active5 5G');
      });
      s.test('adversarial value stored verbatim', function () {
        var v = "a'b\"c$(whoami)` d;e";
        var r = A.settings.parse('secure:\nfoo=' + v);
        T.assertEqual(r.values['secure/foo'], v);
        T.assertEqual(r.errors.length, 0);
      });
      s.test('setting before any namespace section errors', function () {
        var r = A.settings.parse('foo=1');
        T.assert(r.errors.some(function (e) { return /before any namespace/.test(e.message); }));
      });
      s.test('malformed key (space) errors', function () {
        var r = A.settings.parse('secure:\nbad key=v');
        T.assert(r.errors.some(function (e) { return /Malformed key/.test(e.message); }));
      });
      s.test('line that is neither header nor key=value errors', function () {
        var r = A.settings.parse('secure:\nnotakeyvalue');
        T.assert(r.errors.some(function (e) { return /key=value/.test(e.message); }));
      });
      s.test('duplicate key within a namespace errors', function () {
        var r = A.settings.parse('secure:\nk=0\nk=1');
        T.assert(r.errors.some(function (e) { return /Duplicate key/.test(e.message); }));
      });
      s.test('blank lines between sections tolerated', function () {
        var r = A.settings.parse('system:\na=1\n\nsecure:\nb=2\n');
        T.assertEqual(r.errors.length, 0);
        T.assertEqual(r.keys.length, 2);
      });
    });

    T.suite('android.tactical flatten/rebuild', function (s) {
      var doc = {
        radios: [{ mode: 'a' }, { mode: 'b' }],
        enabled: true,
        dns: ['1.1.1.1', '8.8.8.8'],
        count: 3, ratio: 1.5, name: 'x',
        nested: { deep: { flag: false } }
      };
      s.test('flatten produces expected leaves & types', function () {
        var leaves = A.flattenTactical(doc);
        var byKey = {};
        leaves.forEach(function (l) { byKey[l.key] = l; });
        T.assertEqual(byKey['radios[0].mode'].value, 'a');
        T.assertEqual(byKey['enabled'].type, 'bool');
        T.assertEqual(byKey['dns'].type, 'array');
        T.assertDeepEqual(byKey['dns'].value, ['1.1.1.1', '8.8.8.8']);
        T.assertEqual(byKey['count'].type, 'int');
        T.assertEqual(byKey['ratio'].type, 'float');
        T.assertEqual(byKey['nested.deep.flag'].value, false);
      });
      s.test('rebuild from decided values round-trips to original', function () {
        var leaves = A.flattenTactical(doc);
        var items = leaves.map(function (l) { return { key: l.key, decision: { value: l.value, type: l.type }, controlRefs: [], status: 'decided' }; });
        var rebuilt = A.rebuildTacticalDoc(doc, items);
        T.assertEqual(App.util.stable.stableStringify(rebuilt), App.util.stable.stableStringify(doc));
      });
      s.test('rebuild preserves untouched keys (partial decisions)', function () {
        var rebuilt = A.rebuildTacticalDoc(doc, [{ key: 'count', decision: { value: 9, type: 'int' }, controlRefs: [], status: 'decided' }]);
        T.assertEqual(rebuilt.count, 9);
        T.assertEqual(rebuilt.enabled, true); // untouched
        T.assertEqual(rebuilt.nested.deep.flag, false);
      });
      s.test('invalid JSON errors', function () {
        var r = A.tactical.parse('{ bad ');
        T.assertEqual(r.errors.length, 1);
      });
      s.test('non-object root rejected (D-002)', function () {
        T.assert(A.tactical.parse('[1,2,3]').errors.some(function (e) { return /root must be a JSON object/.test(e.message); }));
        T.assert(A.tactical.parse('5').errors.length === 1);
        T.assert(A.tactical.parse('"x"').errors.length === 1);
      });
      s.test('type fidelity: bool/number preserved as JSON types', function () {
        var r = A.tactical.parse('{"a":true,"b":2}');
        var item = { key: 'a', decision: { value: true, type: 'bool' }, controlRefs: [], status: 'decided' };
        var out = A.rebuildTacticalDoc(r.template, [item]);
        T.assertEqual(out.a, true);
        T.assert(JSON.stringify(out).indexOf('"a":true') !== -1, 'bool serialized as string');
      });
    });

    T.suite('decisionSchema / isComplete / validateDecision', function (s) {
      s.test('packages isComplete only when action valid', function () {
        T.assertEqual(A.packages.isComplete({ key: 'x', decision: null, controlRefs: [] }), false);
        T.assertEqual(A.packages.isComplete({ key: 'x', decision: { action: 'disable' }, controlRefs: [] }), true);
        T.assertEqual(A.packages.isComplete({ key: 'x', decision: { action: 'nope' }, controlRefs: [] }), false);
      });
      s.test('settings validateDecision: any string value valid; non-string invalid (no type field)', function () {
        T.assertEqual(A.settings.validateDecision({ key: 's/k', decision: { value: "a'b\"c$(x); long value" } }).length, 0);
        T.assertEqual(A.settings.validateDecision({ key: 's/k', decision: null }).length, 0);
        T.assertEqual(A.settings.validateDecision({ key: 's/k', decision: { value: 5 } }).length, 1);
      });
      s.test('tactical isComplete with falsey value', function () {
        T.assertEqual(A.tactical.isComplete({ key: 't', decision: { value: false, type: 'bool' }, controlRefs: [] }), true);
        T.assertEqual(A.tactical.isComplete({ key: 't', decision: null, controlRefs: [] }), false);
      });
    });

    T.suite('two-layer shell escaping (injection-safety, Appendix B)', function (s) {
      function psUnquote(str) { return str.slice(1, -1).replace(/''/g, "'"); }
      function shUnquote(str) {
        var out = '', i = 0;
        while (i < str.length) {
          if (str[i] === "'") { i++; while (i < str.length && str[i] !== "'") { out += str[i]; i++; } i++; }
          else if (str[i] === '\\' && str[i + 1] === "'") { out += "'"; i += 2; }
          else { i++; }
        }
        return out;
      }
      s.test('psSingleQuote/shSingleQuote round-trip the adversarial value', function () {
        var v = "a'b\"c$(whoami)` d;e";
        var deviceCmd = 'settings put secure foo ' + A.shSingleQuote(v);
        var psArg = A.psSingleQuote(deviceCmd);
        // Unwrap PowerShell layer, then POSIX layer, recover the value.
        var afterPs = psUnquote(psArg);
        T.assertEqual(afterPs, deviceCmd, 'PS layer did not round-trip');
        var quotedVal = afterPs.slice('settings put secure foo '.length);
        T.assertEqual(shUnquote(quotedVal), v, 'POSIX layer did not round-trip');
      });
      s.test('generated settings line embeds the doubly-quoted value', function () {
        var v = "x'y";
        var line = A.settings.generateImplementation(
          [{ key: 'secure/foo', decision: { value: v, type: 'string' }, controlRefs: [], status: 'decided' }], {})[0].content;
        // The PowerShell arg must begin and end with single quotes (one PS token).
        T.assert(/adb -s \$Serial shell '.*'$/m.test(line.split('\n').pop()), 'value not a single PS-quoted arg');
      });
    });

    T.suite('platform registration (android-adb)', function (s) {
      s.test('profile exposes three datasets', function () {
        var p = App.platforms.androidAdb;
        T.assertEqual(p.id, 'android-adb');
        T.assertDeepEqual(p.datasets.map(function (d) { return d.id; }), ['android.packages', 'android.settings', 'android.tactical']);
      });
      s.test('tactical generateImplementation emits ONLY the rebuilt JSON (Knox upload; no script)', function () {
        var tac = App.platforms.androidAdb.datasets[2];
        var files = tac.generateImplementation(
          [{ key: 'enabled', decision: { value: false, type: 'bool' }, controlRefs: [], status: 'decided' }],
          { device: { snapshots: { 'android.tactical': { template: { enabled: true, mode: 'x' } } } } });
        T.assertEqual(files.length, 1, 'tactical impl should emit exactly one file');
        T.assertEqual(files[0].name, 'tactical.json');
        T.assert(!/\.ps1$/.test(files[0].name), 'tactical impl must not emit a script');
        // Rebuilt JSON is valid and in the same shape as the input, with the decision applied.
        T.assertDeepEqual(JSON.parse(files[0].content), { enabled: false, mode: 'x' });
      });
    });

  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.diff
   * PURPOSE: Triage a snapshot's keys against the register (spec §8.1): split into
   *          new (append as undecided) and existing (inherited). Keys present in the
   *          register but not the snapshot are simply not-applicable — no action.
   * PURITY:  pure
   * DEPENDS: (none)
   * INVARIANTS: input order of parsedKeys is preserved; duplicates collapsed.
   * ============================================================================= */
  (function (App) {
    'use strict';
    /**
     * @param {string[]|Set<string>} parsedKeys
     * @param {string[]|Set<string>} registerKeys
     * @returns {{newKeys:string[], existingKeys:string[]}}
     * @example App.diff.triage(['a','b'], ['a']) // {newKeys:['b'], existingKeys:['a']}
     */
    function triage(parsedKeys, registerKeys) {
      var reg = {}; (registerKeys.forEach ? registerKeys : Array.from(registerKeys)).forEach(function (k) { reg[k] = true; });
      var seen = {}, newKeys = [], existingKeys = [];
      (parsedKeys.forEach ? parsedKeys : Array.from(parsedKeys)).forEach(function (k) {
        if (seen[k]) return; seen[k] = true;
        if (reg[k]) existingKeys.push(k); else newKeys.push(k);
      });
      return { newKeys: newKeys, existingKeys: existingKeys };
    }
    App.diff = { triage: triage };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.validation
   * PURPOSE: Cross-cutting structural checks beyond projectIo's schema validation
   *          (spec §7, §12): onboarding input validation and a whole-project pass.
   * PURITY:  pure
   * DEPENDS: App.registry (adapter validateDecision)
   * INVARIANTS: returns located Issues; never throws for expected conditions.
   * ============================================================================= */
  (function (App) {
    'use strict';

    /**
     * Validate onboarding inputs before committing (spec §11.4, §12).
     * @param {{name:string, parsed:Object<string,ParseResult>}} input
     * @param {string[]} datasetIds
     * @returns {Issue[]}
     */
    function validateOnboarding(input, datasetIds) {
      var issues = [];
      if (!input.name || !input.name.trim()) {
        issues.push({ category: 'state', severity: 'error', message: 'Device name is required.', location: 'name', fix: 'Enter a device name.' });
      }
      datasetIds.forEach(function (dsId) {
        var pr = input.parsed && input.parsed[dsId];
        if (!pr) { issues.push({ category: 'parse', severity: 'error', message: 'Missing input for ' + dsId + '.', location: dsId, fix: 'Provide the capture file.' }); return; }
        (pr.errors || []).forEach(function (e) { issues.push({ category: 'parse', severity: 'error', message: e.message, location: dsId + (e.location ? ' / ' + e.location : ''), fix: e.fix }); });
      });
      return issues;
    }

    /**
     * Whole-project cross-cutting validation: per-item adapter decision validity.
     * @param {Project} project
     * @returns {Issue[]}
     */
    function validateProject(project) {
      var issues = [];
      var ids = App.registry.datasetIds(project.platformProfileId);
      ids.forEach(function (dsId) {
        var adapter = App.registry.getDataset(project.platformProfileId, dsId);
        if (!adapter) return;
        (project.items[dsId] || []).forEach(function (it) {
          (adapter.validateDecision(it) || []).forEach(function (i) {
            issues.push({ category: 'validation', severity: i.severity, message: i.message, location: dsId + ' / ' + it.key, fix: i.fix });
          });
        });
      });
      return issues;
    }

    App.validation = { validateOnboarding: validateOnboarding, validateProject: validateProject };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.completeness
   * PURPOSE: Item completeness & device readiness (spec §6.5, §8.3). Wraps the
   *          adapter's isComplete with the optional REQUIRE_CONTROL_REF policy fold,
   *          and computes per-device readiness with reasons for generate-gating.
   * PURITY:  pure
   * DEPENDS: App.registry
   * INVARIANTS: a device is ready ⇔ every APPLICABLE item is complete; "applicable"
   *             = item.key ∈ that device's snapshot keys for the dataset.
   * ============================================================================= */
  (function (App) {
    'use strict';

    /**
     * Is an item complete? adapter.isComplete + optional ISM-ref policy (§6.5).
     * @param {DatasetAdapter} adapter
     * @param {RegisterItem} item
     * @returns {boolean}
     */
    function itemComplete(adapter, item) {
      if (!adapter || !adapter.isComplete(item)) return false;
      if (mod.REQUIRE_CONTROL_REF && !(item.controlRefs && item.controlRefs.length)) return false;
      return true;
    }

    /**
     * Per-device readiness with reasons (for generate-button gating & messages).
     * @param {Project} project
     * @param {string} deviceId
     * @returns {{ready:boolean, totalUndecided:number, reasons:{datasetId:string,label:string,undecided:number}[]}}
     */
    function deviceReadiness(project, deviceId) {
      var ids = App.registry.datasetIds(project.platformProfileId);
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      var reasons = [], total = 0;
      if (!dc) return { ready: false, totalUndecided: 0, reasons: [{ datasetId: '', label: 'device', undecided: 0 }] };
      ids.forEach(function (dsId) {
        var adapter = App.registry.getDataset(project.platformProfileId, dsId);
        var snap = dc.snapshots[dsId];
        if (!adapter || !snap) return;
        var keySet = {}; snap.keys.forEach(function (k) { keySet[k] = true; });
        // Evaluate the EFFECTIVE decision (default→group→device, spec §19.2/OVR-3) so a
        // device/group override can satisfy completeness even when the default is undecided.
        var undecided = (project.items[dsId] || []).filter(function (it) {
          if (!keySet[it.key]) return false;
          var eff = App.overrides ? App.overrides.effectiveItem(project, dsId, it, deviceId) : it;
          return !itemComplete(adapter, eff);
        }).length;
        if (undecided > 0) reasons.push({ datasetId: dsId, label: adapter.label, undecided: undecided });
        total += undecided;
      });
      return { ready: total === 0, totalUndecided: total, reasons: reasons };
    }

    /** @returns {boolean} true when every applicable item is complete (§6.5). */
    function deviceReady(project, deviceId) { return deviceReadiness(project, deviceId).ready; }

    var mod = {
      itemComplete: itemComplete, deviceReady: deviceReady, deviceReadiness: deviceReadiness,
      // Config flag (spec §6.5 / §18.3 CTL-8): when true, completeness also requires >=1 control ref.
      // A single switch so the team can tighten traceability without code surgery.
      REQUIRE_CONTROL_REF: false
    };
    App.completeness = mod;
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.overrides
   * PURPOSE: The single choke point (spec §19.2.3, OVR-3) that resolves the
   *          default → group → device decision chain for an (item, device) pair,
   *          classifies value divergence for highlighting, and lists deviations.
   *          Adapters stay override-blind: callers use effectiveItem(...) and pass
   *          the resulting item to adapters unchanged.
   * PURITY:  pure
   * DEPENDS: App.registry, App.util.stable
   * INVARIANTS:
   *   * Precedence device > group > default; classification is by VALUE (stableStringify),
   *     so a redundant override never mis-colours (OVR-8).
   *   * Overrides are value-only — applicability is unchanged (callers filter by snapshot).
   * ============================================================================= */
  (function (App) {
    'use strict';
    var stable = App.util.stable.stableStringify;

    function deviceById(project, deviceId) {
      return (project.deviceConfigs || []).filter(function (c) { return c.id === deviceId; })[0] || null;
    }

    /** The group whose deviceBaseIds includes this device's baseId, or null. */
    function groupForDevice(project, deviceId) {
      var dc = deviceById(project, deviceId);
      if (!dc) return null;
      var groups = project.groups || [];
      for (var i = 0; i < groups.length; i++) {
        if ((groups[i].deviceBaseIds || []).indexOf(dc.baseId) !== -1) return groups[i];
      }
      return null;
    }

    /** Read an override value (or undefined) from an overrides map. */
    function ovOf(map, dsId, key) {
      if (!map || !map[dsId] || !Object.prototype.hasOwnProperty.call(map[dsId], key)) return undefined;
      return map[dsId][key];
    }

    /** The default/group/device layered values for one (item, device). */
    function layers(project, datasetId, item, deviceId) {
      var dc = deviceById(project, deviceId);
      var dV = (item.decision != null) ? item.decision : null;
      var group = groupForDevice(project, deviceId);
      var gV = dV, hasGroup = false;
      if (group) { var go = ovOf(group.overrides, datasetId, item.key); if (go !== undefined) { gV = go; hasGroup = true; } }
      var eV = gV, hasDevice = false;
      if (dc) { var dov = ovOf(dc.overrides, datasetId, item.key); if (dov !== undefined) { eV = dov; hasDevice = true; } }
      return { dV: dV, gV: gV, eV: eV, hasGroup: hasGroup, hasDevice: hasDevice, group: group };
    }

    /**
     * Effective decision + provenance for one (item, device) (spec §19.2).
     * @returns {{decision:Object|null, source:'default'|'group'|'device'}}
     */
    function effectiveDecision(project, datasetId, item, deviceId) {
      var L = layers(project, datasetId, item, deviceId);
      return { decision: L.eV, source: L.hasDevice ? 'device' : (L.hasGroup ? 'group' : 'default') };
    }

    /** The item shallow-cloned with its decision replaced by the effective value. */
    function effectiveItem(project, datasetId, item, deviceId) {
      var eff = effectiveDecision(project, datasetId, item, deviceId);
      var out = {};
      for (var k in item) if (Object.prototype.hasOwnProperty.call(item, k)) out[k] = item[k];
      out.decision = eff.decision;
      return out;
    }

    /** Value-based divergence class for highlighting (OVR-4/OVR-8). */
    function classify(project, datasetId, item, deviceId) {
      var L = layers(project, datasetId, item, deviceId);
      if (stable(L.eV) !== stable(L.gV)) return 'device';
      if (stable(L.gV) !== stable(L.dV)) return 'group';
      return 'default';
    }

    function byDsKey(a, b) {
      if (a.datasetId !== b.datasetId) return a.datasetId < b.datasetId ? -1 : 1;
      return a.key < b.key ? -1 : a.key > b.key ? 1 : 0;
    }

    /** Every applicable item whose effective value diverges from default, for a device (§19.6). */
    function deviceDeviations(project, deviceId) {
      var dc = deviceById(project, deviceId);
      if (!dc) return [];
      var pid = project.platformProfileId, out = [];
      App.registry.datasetIds(pid).forEach(function (dsId) {
        var adapter = App.registry.getDataset(pid, dsId);
        var snap = dc.snapshots[dsId];
        if (!adapter || !snap) return;
        var keySet = {}; snap.keys.forEach(function (k) { keySet[k] = true; });
        var dispKey = adapter.displayKey || function (k) { return k; };
        (project.items[dsId] || []).forEach(function (it) {
          if (!keySet[it.key]) return;
          var cls = classify(project, dsId, it, deviceId);
          if (cls === 'default') return;
          var L = layers(project, dsId, it, deviceId);
          out.push({ datasetId: dsId, key: it.key, displayKey: dispKey(it.key), source: cls, defaultValue: L.dV, groupValue: L.gV, deviceValue: L.eV });
        });
      });
      out.sort(byDsKey);
      return out;
    }

    /** Every group override that diverges from default, for a group (§19.4/§19.6). */
    function groupDeviations(project, groupId) {
      var group = (project.groups || []).filter(function (g) { return g.id === groupId; })[0];
      if (!group) return [];
      var pid = project.platformProfileId, out = [];
      Object.keys(group.overrides || {}).forEach(function (dsId) {
        var adapter = App.registry.getDataset(pid, dsId);
        var dispKey = (adapter && adapter.displayKey) || function (k) { return k; };
        var itemsByKey = {}; (project.items[dsId] || []).forEach(function (it) { itemsByKey[it.key] = it; });
        Object.keys(group.overrides[dsId]).forEach(function (key) {
          var it = itemsByKey[key];
          var dV = (it && it.decision != null) ? it.decision : null;
          var gV = group.overrides[dsId][key];
          if (stable(gV) === stable(dV)) return; // redundant, not a real deviation
          out.push({ datasetId: dsId, key: key, displayKey: dispKey(key), source: 'group', defaultValue: dV, groupValue: gV, deviceValue: gV });
        });
      });
      out.sort(byDsKey);
      return out;
    }

    App.overrides = {
      groupForDevice: groupForDevice,
      effectiveDecision: effectiveDecision,
      effectiveItem: effectiveItem,
      classify: classify,
      deviceDeviations: deviceDeviations,
      groupDeviations: groupDeviations
    };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.report
   * PURPOSE: Platform-agnostic Word-targeted HTML report shell (spec §10.3, DOD-8).
   *          Produces one self-contained styled .html document that opens in
   *          Microsoft Word as a formatted document (headings, real tables, page
   *          breaks) suitable for Save-As .docx.
   * PURITY:  pure (string -> string)
   * DEPENDS: App.util.html (esc)
   * INVARIANTS: ALL dynamic text passes through esc(); CSS uses only Word-honoured
   *             constructs (real <table> borders, heading styles, page-break-before).
   * ============================================================================= */
  (function (App) {
    'use strict';
    var esc = App.util.html.esc;

    // Inline CSS limited to what Word's HTML import honours.
    var REPORT_CSS =
      'body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#000;margin:24pt;}' +
      'h1{font-size:20pt;}h2{font-size:15pt;border-bottom:1px solid #888;padding-bottom:3pt;}' +
      'table{border-collapse:collapse;width:100%;margin:8pt 0;}' +
      'th,td{border:1px solid #888;padding:4pt 6pt;text-align:left;vertical-align:top;font-size:10pt;}' +
      'th{background:#e6e6e6;}' +
      '.meta td{border:1px solid #bbb;}' +
      '.section{page-break-before:always;}' +
      '.muted{color:#555;}';

    /**
     * Wrap a report from a title, a metadata table, and section HTML fragments.
     * @param {string} title
     * @param {{label:string,value:string}[]} meta
     * @param {string[]} sections  Pre-built (already-escaped) HTML fragments.
     * @returns {string} a complete HTML document
     */
    function wrapReport(title, meta, sections) {
      var metaRows = meta.map(function (m) {
        return '<tr><th style="width:200pt">' + esc(m.label) + '</th><td>' + esc(m.value) + '</td></tr>';
      }).join('');
      // First section flows after the meta table; subsequent sections start on a new page.
      var body = sections.map(function (sec, i) {
        return '<div class="' + (i === 0 ? '' : 'section') + '">' + sec + '</div>';
      }).join('');
      return '<!DOCTYPE html>\n<html><head><meta charset="utf-8"><title>' + esc(title) + '</title>' +
        '<style>' + REPORT_CSS + '</style></head><body>' +
        '<h1>' + esc(title) + '</h1>' +
        '<table class="meta"><tbody>' + metaRows + '</tbody></table>' +
        body +
        '</body></html>';
    }

    App.report = { wrapReport: wrapReport };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.generate
   * PURPOSE: Orchestrate the three INDEPENDENT generators (spec §7, §10): gather a
   *          device's applicable+complete items per dataset, call adapter generators
   *          + platform preamble/postamble, assemble a manifest (with per-file
   *          sha256 + the decision snapshot used), and produce ONE store-only ZIP.
   * PURITY:  pure up to the final Blob (download is the UI's job, via util.dom).
   * DEPENDS: App.registry, App.projectIo, App.report, App.util.{hash,zip,stable,clock}
   * INVARIANTS: identical project+device ⇒ identical zip bytes under a fixed clock
   *             (DOD-7). Item/output ordering is stable; timestamps come from clock.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var TOOL_VERSION = '1.0';
    var TOOL_NAME = 'CH Config Tool';
    var sha = App.util.hash.sha256Hex;
    var stable = App.util.stable.stableStringify;

    /**
     * Original RegisterItems that are applicable to a device for a dataset AND complete
     * under their EFFECTIVE decision (default→group→device, spec §19.2/OVR-3), sorted by key.
     */
    function applicableComplete(project, deviceId, dsId) {
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      if (!dc) return [];
      var snap = dc.snapshots[dsId];
      if (!snap) return [];
      var adapter = App.registry.getDataset(project.platformProfileId, dsId);
      var ks = {}; snap.keys.forEach(function (k) { ks[k] = true; });
      return (project.items[dsId] || []).filter(function (it) {
        if (!ks[it.key]) return false;
        var eff = App.overrides ? App.overrides.effectiveItem(project, dsId, it, deviceId) : it;
        return App.completeness.itemComplete(adapter, eff);
      }).slice().sort(function (a, b) { return a.key < b.key ? -1 : a.key > b.key ? 1 : 0; });
    }

    /**
     * Items applicable+complete, each with its decision replaced by the EFFECTIVE value
     * so adapters (generators/report) stay override-blind (spec §19.2, OVR-3).
     */
    function gather(project, deviceId, dsId) {
      return applicableComplete(project, deviceId, dsId).map(function (it) {
        return App.overrides ? App.overrides.effectiveItem(project, dsId, it, deviceId) : it;
      });
    }

    /** Compact a UTC ISO timestamp for a filename, e.g. 20260630T120000Z. */
    function stamp(iso) { return iso.replace(/\.\d+/, '').replace(/[-:]/g, ''); }

    /** Build the manifest.json content (deterministic except generatedUtc). */
    function buildManifest(project, dc, command, generatedUtc, platform, outputFiles) {
      var decisions = {};
      platform.datasets.forEach(function (ds) {
        // Record the EFFECTIVE decision + its source per item (spec §19.6 / OVR-7).
        decisions[ds.id] = applicableComplete(project, dc.id, ds.id).map(function (it) {
          var eff = App.overrides ? App.overrides.effectiveDecision(project, ds.id, it, dc.id) : { decision: it.decision, source: 'default' };
          return { key: it.key, decision: eff.decision, source: eff.source };
        });
      });
      var manifest = {
        tool: TOOL_NAME, toolVersion: TOOL_VERSION, command: command, generatedUtc: generatedUtc,
        projectSha256: sha(App.projectIo.serializeProject(project)),
        device: { id: dc.id, baseId: dc.baseId, version: dc.version, name: dc.name, model: dc.model, firmware: dc.firmware },
        outputs: outputFiles.map(function (f) { return { name: f.name, sha256: sha(f.content) }; })
          .sort(function (a, b) { return a.name < b.name ? -1 : 1; }),
        decisions: decisions
      };
      return stable(manifest);
    }

    function ctxFor(project, dc, generatedUtc) {
      return { device: dc, project: project, toolVersion: TOOL_VERSION, generatedUtc: generatedUtc };
    }
    function endsWith(s, suffix) { return s.lastIndexOf(suffix) === s.length - suffix.length; }

    /** Shared path for implementation/verification (scripts + data + manifest -> zip). */
    function buildScripts(project, deviceId, command, opts) {
      opts = opts || {};
      var platform = App.registry.getPlatform(project.platformProfileId);
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      if (!platform || !dc) return { issues: [{ category: 'generation', severity: 'error', message: 'Unknown device or platform.', location: deviceId }] };
      var generatedUtc = App.util.clock.nowIso();
      var ctx = ctxFor(project, dc, generatedUtc);
      var genName = command === 'implementation' ? 'generateImplementation' : 'generateVerification';
      var ext = platform.scriptExtension;
      var files = [];
      try {
        platform.datasets.forEach(function (ds) {
          var items = gather(project, deviceId, ds.id);
          (ds[genName](items, ctx) || []).forEach(function (f) {
            var isScript = ext && endsWith(f.name, ext);
            // Wrap script files (per platform.scriptExtension) with preamble/postamble;
            // leave data files (e.g. tactical.json) unwrapped (spec §10.1).
            var content = isScript ? platform.scriptPreamble(ctx) + '\n' + f.content + '\n' + platform.scriptPostamble(ctx) : f.content;
            // review-3 #1: optionally rename generated SCRIPT files to .txt (wrapping
            // is decided on the original extension first, so the preamble is kept).
            var name = (isScript && opts.scriptsAsTxt) ? f.name.slice(0, -ext.length) + '.txt' : f.name;
            files.push({ name: name, content: content });
          });
        });
      } catch (e) {
        return { issues: [{ category: 'generation', severity: 'error', message: 'Generation failed: ' + e.message }] };
      }
      files.push({ name: 'manifest.json', content: buildManifest(project, dc, command, generatedUtc, platform, files) });
      return { blob: App.util.zip.zip(files), name: dc.id + '-' + command + '-' + stamp(generatedUtc) + '.zip', issues: [], files: files };
    }

    /** @returns {{blob:Blob,name:string,issues:Issue[],files?:Object[]}} */
    function buildImplementation(project, deviceId, opts) { return buildScripts(project, deviceId, 'implementation', opts); }
    /** @returns {{blob:Blob,name:string,issues:Issue[],files?:Object[]}} */
    function buildVerification(project, deviceId, opts) { return buildScripts(project, deviceId, 'verification', opts); }

    /** Build the Control-coverage section (spec §18.3 CTL-7): items grouped by
     *  control (title + type), sub-grouped by dataset. Unreferenced → "(no control)". */
    function buildControlSection(project, deviceId, platform) {
      var esc = App.util.html.esc;
      var byCtl = {}; var ctlLabel = {};
      var controlsById = {}; (project.controls || []).forEach(function (c) { controlsById[c.id] = c; });
      platform.datasets.forEach(function (ds) {
        var adapter = App.registry.getDataset(project.platformProfileId, ds.id);
        var dispKey = (adapter && adapter.displayKey) || function (k) { return k; };
        gather(project, deviceId, ds.id).forEach(function (it) {
          var refs = (it.controlRefs && it.controlRefs.length) ? it.controlRefs : ['__none__'];
          refs.forEach(function (ref) {
            var c = controlsById[ref];
            ctlLabel[ref] = ref === '__none__' ? '(no control)' : (c ? (c.title + ' (' + c.type + ')') : ref);
            byCtl[ref] = byCtl[ref] || {};
            (byCtl[ref][ds.label] = byCtl[ref][ds.label] || []).push(dispKey(it.key));
          });
        });
      });
      // Sort by displayed label for stable, human-friendly ordering.
      var rows = Object.keys(byCtl).sort(function (a, b) { return ctlLabel[a] < ctlLabel[b] ? -1 : ctlLabel[a] > ctlLabel[b] ? 1 : 0; }).map(function (ref) {
        var parts = Object.keys(byCtl[ref]).sort().map(function (dl) {
          return esc(dl) + ': ' + byCtl[ref][dl].slice().sort().map(esc).join(', ');
        }).join('<br>');
        return '<tr><td>' + esc(ctlLabel[ref]) + '</td><td>' + parts + '</td></tr>';
      }).join('');
      return '<h2>Control coverage</h2><table><thead><tr><th>Control</th><th>Items (by dataset)</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="2" class="muted">No decided items.</td></tr>') + '</tbody></table>';
    }

    /** Build the per-device "Deviations from default" section (spec §19.6 / OVR-7). */
    function buildDeviationsSection(project, deviceId, platform) {
      var esc = App.util.html.esc;
      var devs = App.overrides ? App.overrides.deviceDeviations(project, deviceId) : [];
      var group = App.overrides ? App.overrides.groupForDevice(project, deviceId) : null;
      var dsLabel = {}; platform.datasets.forEach(function (d) { dsLabel[d.id] = d.label; });
      function val(v) { return v == null ? '(undecided)' : (typeof v === 'object' ? stable(v) : String(v)); }
      var header = '<h2>Deviations from default</h2>' + (group ? '<p class="muted">Device group: ' + esc(group.name) + '</p>' : '');
      if (!devs.length) return header + '<p class="muted">No deviations from default.</p>';
      var rows = devs.map(function (d) {
        return '<tr><td>' + esc(d.displayKey) + '</td><td>' + esc(dsLabel[d.datasetId] || d.datasetId) + '</td><td>' + esc(d.source) + '</td>' +
          '<td>' + esc(val(d.defaultValue)) + ' &rarr; ' + esc(val(d.groupValue)) + ' &rarr; ' + esc(val(d.deviceValue)) + '</td></tr>';
      }).join('');
      return header + '<table><thead><tr><th>Key</th><th>Dataset</th><th>Source</th><th>Default &rarr; Group &rarr; Device</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    /** @returns {{blob:Blob,name:string,issues:Issue[],files?:Object[]}} */
    function buildReport(project, deviceId) {
      var platform = App.registry.getPlatform(project.platformProfileId);
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      if (!platform || !dc) return { issues: [{ category: 'generation', severity: 'error', message: 'Unknown device or platform.', location: deviceId }] };
      var generatedUtc = App.util.clock.nowIso();
      var ctx = ctxFor(project, dc, generatedUtc);
      var sections = platform.datasets.map(function (ds) { return ds.renderReportSection(gather(project, deviceId, ds.id), ctx); });
      sections.push(buildControlSection(project, deviceId, platform));
      sections.push(buildDeviationsSection(project, deviceId, platform));
      var meta = [
        { label: 'Project platform', value: project.platformProfileId },
        { label: 'Device', value: dc.name }, { label: 'Model', value: dc.model },
        { label: 'Firmware', value: dc.firmware }, { label: 'Version', value: 'v' + dc.version },
        { label: 'Generated (UTC)', value: generatedUtc },
        { label: 'Project SHA-256', value: sha(App.projectIo.serializeProject(project)) }
      ];
      Object.keys(dc.snapshots).sort().forEach(function (dsId) { meta.push({ label: dsId + ' snapshot SHA-256', value: dc.snapshots[dsId].sha256 }); });
      var html = App.report.wrapReport('CH Configuration Report — ' + dc.name, meta, sections);
      var files = [{ name: 'report.html', content: html }];
      files.push({ name: 'manifest.json', content: buildManifest(project, dc, 'reporting', generatedUtc, platform, files) });
      return { blob: App.util.zip.zip(files), name: dc.id + '-reporting-' + stamp(generatedUtc) + '.zip', issues: [], files: files };
    }

    App.generate = {
      buildImplementation: buildImplementation, buildVerification: buildVerification, buildReport: buildReport,
      _gather: gather
    };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.model
   * PURPOSE: PURE view-model helpers shared by the UI views: latest-version
   *          resolution, applicability map, and search/sort/filter of table rows.
   *          Kept pure so the table logic is unit-testable without the DOM.
   * PURITY:  pure
   * DEPENDS: (reads plain project data + an adapter's columns)
   * INVARIANTS: never mutates inputs; "latest" = config not referenced by any
   *             supersedesId (per the version-integrity invariant).
   * ============================================================================= */
  (function (App) {
    'use strict';

    /** @param {Project} project @returns {DeviceConfig[]} latest version per baseId */
    function getLatestConfigs(project) {
      var referenced = {};
      project.deviceConfigs.forEach(function (c) { if (c.supersedesId) referenced[c.supersedesId] = true; });
      return project.deviceConfigs.filter(function (c) { return !referenced[c.id]; });
    }

    /** @returns {boolean} true if deviceId is a latest (active) config */
    function isLatest(project, deviceId) {
      return getLatestConfigs(project).some(function (c) { return c.id === deviceId; });
    }

    /**
     * Map of item key -> [device names] whose latest snapshot for dsId has the key.
     * @returns {Object<string,string[]>}
     */
    function computeAppliesTo(project, dsId) {
      var map = {};
      getLatestConfigs(project).forEach(function (c) {
        var snap = c.snapshots[dsId];
        if (!snap || !snap.keys) return;
        snap.keys.forEach(function (k) { (map[k] = map[k] || []).push(c.name); });
      });
      return map;
    }

    /** @returns {number} count of not-decided items in a dataset */
    function countIncomplete(project, dsId) {
      return (project.items[dsId] || []).filter(function (it) { return it.status !== 'decided'; }).length;
    }

    function sortValue(r, key) {
      if (key === 'appliesTo') return r.appliesTo.join(',');
      if (key === 'status') return r.status;
      if (Object.prototype.hasOwnProperty.call(r.cells, key)) return String(r.cells[key] == null ? '' : r.cells[key]);
      return String(r.item[key] == null ? '' : r.item[key]);
    }

    /**
     * Build display rows for a dataset, applying search/sort/incomplete filters.
     * @param {Project} project
     * @param {string} dsId
     * @param {DatasetAdapter} adapter
     * @param {{search?:string,sortKey?:string,sortDir?:string,incompleteOnly?:boolean}} ui
     * @returns {Array<{item:RegisterItem, appliesTo:string[], status:string, cells:Object}>}
     */
    function filterSortRows(project, dsId, adapter, ui) {
      ui = ui || {};
      var appliesTo = computeAppliesTo(project, dsId);
      var rows = (project.items[dsId] || []).map(function (it) {
        var cells = {};
        adapter.columns.forEach(function (c) { cells[c.key] = c.get ? c.get(it) : it[c.key]; });
        return { item: it, appliesTo: appliesTo[it.key] || [], status: it.status, cells: cells };
      });
      if (ui.incompleteOnly) rows = rows.filter(function (r) { return r.status !== 'decided'; });
      var q = (ui.search || '').toLowerCase().trim();
      if (q) rows = rows.filter(function (r) {
        return (r.item.key + ' ' + (r.item.description || '')).toLowerCase().indexOf(q) !== -1;
      });
      var sk = ui.sortKey || 'key';
      var dir = ui.sortDir === 'desc' ? -1 : 1;
      rows.sort(function (a, b) {
        var av = sortValue(a, sk), bv = sortValue(b, sk);
        if (av < bv) return -dir; if (av > bv) return dir;
        // stable tiebreak on key
        return a.item.key < b.item.key ? -1 : a.item.key > b.item.key ? 1 : 0;
      });
      return rows;
    }

    App.ui = App.ui || {};
    App.ui.model = {
      getLatestConfigs: getLatestConfigs, isLatest: isLatest,
      computeAppliesTo: computeAppliesTo, countIncomplete: countIncomplete,
      filterSortRows: filterSortRows
    };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.activity
   * PURPOSE: The append-only Activity/Errors drawer log (spec §11.6). Nothing in
   *          the app fails silently — parse/validation/generation results land here.
   * PURITY:  holds a log array + emitter; no DOM (rendering is App.ui.app's job).
   * DEPENDS: App.util.clock
   * INVARIANTS: append-only until explicitly cleared; entries carry a timestamp.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var _entries = [];
    var _handlers = [];
    function emit() { _handlers.forEach(function (h) { try { h(_entries.slice()); } catch (e) {} }); }

    /**
     * Append a log entry.
     * @param {{severity:'error'|'warning'|'info'|'success', message:string, location?:string}} entry
     */
    function log(entry) {
      _entries.push({ ts: App.util.clock.nowIso(), severity: entry.severity || 'info', message: entry.message, location: entry.location });
      emit();
    }
    /** Append many Issues at once (parse/validation results). */
    function logIssues(issues, prefix) {
      (issues || []).forEach(function (i) {
        log({ severity: i.severity, message: (prefix ? prefix + ': ' : '') + i.message + (i.location ? ' [' + i.location + ']' : '') + (i.fix ? ' — ' + i.fix : '') });
      });
    }
    function list() { return _entries.slice(); }
    function clear() { _entries = []; emit(); }
    function onChange(h) { _handlers.push(h); return function () { var i = _handlers.indexOf(h); if (i >= 0) _handlers.splice(i, 1); }; }

    App.ui = App.ui || {};
    App.ui.activity = { log: log, logIssues: logIssues, list: list, clear: clear, onChange: onChange };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.tables
   * PURPOSE: Render a data-driven data-table tab to an HTML string (spec §11.2).
   *          Columns come from adapter.columns plus computed "Applies to"/"Status".
   *          NO hardcoded dataset branching — fully data-driven.
   * PURITY:  render returns a string (pure); escaping via App.util.html.esc.
   * DEPENDS: App.registry, App.ui.model, App.util.html
   * INVARIANTS: every cell value passes through esc(); undecided rows flagged.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var esc = App.util.html.esc;

    /**
     * Render the toolbar (search/incomplete/count) for a dataset tab.
     * Kept separate from the table body so the search input is NOT re-rendered on
     * keystroke (preserves focus); only #table-host updates.
     */
    function renderToolbar(dsId, ui, total, shown) {
      return '' +
        '<div class="toolbar">' +
        '<input class="grow" type="search" placeholder="Search key or description…" data-search="' + esc(dsId) + '" value="' + esc(ui.search || '') + '" aria-label="Search items">' +
        '<label><input type="checkbox" data-incomplete="' + esc(dsId) + '"' + (ui.incompleteOnly ? ' checked' : '') + '> Incomplete only</label>' +
        '<span class="muted">' + esc(shown) + ' of ' + esc(total) + ' shown</span>' +
        '</div>' +
        '<div id="table-host"></div>';
    }

    /** Merge each latest snapshot's captured defaults into one {key:{value,type}} map. */
    function buildCapturedMap(project, dsId, adapter) {
      var map = {};
      if (!adapter.capturedDefaults) return map;
      App.ui.model.getLatestConfigs(project).forEach(function (c) {
        var snap = c.snapshots[dsId];
        if (!snap) return;
        var d = adapter.capturedDefaults(snap);
        Object.keys(d).forEach(function (k) { if (!(k in map)) map[k] = d[k]; });
      });
      return map;
    }

    var MIN_COL_WIDTH = 60; // px (review-2 #4)
    /** Sensible default column widths (px) by column key; resized widths override. */
    function colDefaultWidth(key) {
      switch (key) {
        case 'key': return 240;
        case 'description': return 220;
        case 'decision': return 280;
        case 'controlRefs': return 180;
        case 'appliesTo': return 160;
        case 'status': return 100;
        default: return 160;
      }
    }

    function ctrl(dsId, key, field, kind, extra) {
      return 'data-decision data-ds="' + esc(dsId) + '" data-key="' + esc(key) + '" data-field="' + esc(field) + '" data-kind="' + kind + '"' + (extra || '');
    }
    /** Render the decisionSchema-driven control(s) for one item's decision cell. */
    function renderDecisionControl(adapter, dsId, item, captured) {
      var d = item.decision, cap = captured[item.key];
      return adapter.decisionSchema.map(function (f) {
        if (f.kind === 'enum') {
          var cur = d && d[f.name] != null ? d[f.name] : '';
          return '<select ' + ctrl(dsId, item.key, f.name, 'enum') + ' aria-label="' + esc(f.name) + '">' +
            '<option value=""' + (cur === '' ? ' selected' : '') + '>—</option>' +
            f.options.map(function (o) { return '<option value="' + esc(o) + '"' + (cur === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
            '</select>';
        }
        if (f.kind === 'string') {
          // Full-width, wrapping value box (review-2 #3): long values stay fully visible.
          var cur2 = d && d[f.name] != null ? d[f.name] : (cap ? cap.value : '');
          return '<textarea ' + ctrl(dsId, item.key, f.name, 'string') + ' rows="1" class="val-edit" aria-label="' + esc(f.name) + '">' + esc(cur2) + '</textarea>';
        }
        if (f.kind === 'value-typed') {
          // review-3 #2: no type dropdown. The value is coerced on commit to the
          // CAPTURED leaf's JS type (carried in data-vtype) so JSON-type fidelity is
          // preserved without a user-visible type control.
          var rawVal = d && ('value' in d) ? d.value : (cap ? cap.value : '');
          var shown = (typeof rawVal === 'string') ? rawVal : App.util.stable.stableStringify(rawVal);
          var vtype = (cap && cap.type) ? cap.type : (d && d.type ? d.type : 'string');
          return '<textarea ' + ctrl(dsId, item.key, f.name, 'value-typed', ' data-vtype="' + esc(vtype) + '"') + ' rows="1" class="val-edit" aria-label="value">' + esc(shown) + '</textarea>';
        }
        if (f.kind === 'bool') {
          var on = !!(d && d[f.name]);
          return '<input type="checkbox" ' + ctrl(dsId, item.key, f.name, 'bool') + (on ? ' checked' : '') + ' aria-label="' + esc(f.name) + '">';
        }
        return '';
      }).join(' ');
    }

    /** Render the expanded detail editor row (description/ISM/rationale/rollback + issues). */
    /**
     * Multi-select over the control catalogue (spec §18.3 CTL-5; review-5 #2).
     * A native <select multiple> made it impossible to add more than one ref or to
     * remove one without modifier-clicks, so this is a searchable CHECKBOX list:
     * each control is a checkbox (checked = referenced); ticking/unticking toggles
     * that single ref, so any number can be added and any one removed independently.
     * The search box filters the visible options client-side (no store round-trip).
     */
    function controlSelect(dsId, key, refs, controls) {
      if (!controls.length) return '<span class="muted" style="font-size:12px">No controls yet — add them in Control Manager.</span>';
      var sel = {}; (refs || []).forEach(function (r) { sel[r] = true; });
      var opts = controls.slice().sort(function (a, b) { return a.title < b.title ? -1 : a.title > b.title ? 1 : 0; })
        .map(function (c) {
          // Show the control title only (review-5 follow-up): the "(TYPE)" suffix is
          // unnecessary noise in the selection list.
          return '<label class="ctl-opt" data-ctl-opt>' +
            '<input type="checkbox" data-control-ref-toggle data-ds="' + esc(dsId) + '" data-key="' + esc(key) + '" data-control-id="' + esc(c.id) + '"' + (sel[c.id] ? ' checked' : '') + '> ' +
            '<span>' + esc(c.title) + '</span></label>';
        }).join('');
      var count = (refs || []).length;
      return '<div class="control-multiselect" data-control-multiselect>' +
        '<input type="search" class="ctl-opt-search" data-control-search placeholder="Filter controls…" aria-label="Filter controls">' +
        '<div class="ctl-opts">' + opts + '</div>' +
        '<div class="muted ctl-opt-count" style="font-size:11px">' + count + ' selected</div>' +
        '</div>';
    }

    function renderDetailRow(dsId, item, colspan, issues, controls) {
      var key = item.key;
      var iss = (issues && issues[dsId + '|' + key]) || [];
      var issHtml = iss.length ? '<div class="detail-issues">' + iss.map(function (i) {
        return '<div class="issue ' + esc(i.severity) + '">' + esc(i.severity.toUpperCase()) + ': ' + esc(i.message) + '</div>';
      }).join('') + '</div>' : '';
      var dk = 'data-ds="' + esc(dsId) + '" data-key="' + esc(key) + '"';
      var fld = function (field, label, ta, val) {
        var common = 'data-field-edit="' + field + '" ' + dk;
        return '<label for="">' + esc(label) + '</label>' + (ta
          ? '<textarea ' + common + '>' + esc(val || '') + '</textarea>'
          : '<input type="text" ' + common + ' value="' + esc(val || '') + '">');
      };
      // Rationale gets a quick-fill preset button to the right (review-3 #4).
      var rationaleCell = '<label>Rationale</label><div class="rationale-cell">' +
        '<textarea data-field-edit="rationale" ' + dk + '>' + esc(item.rationale || '') + '</textarea>' +
        '<button type="button" data-action="rationale-preset" ' + dk + ' title="Fill the rationale with the standard not-required note">Set to "Not required for device use-case"</button>' +
        '</div>';
      return '<tr class="detail-row"><td colspan="' + colspan + '"><div class="detail-form">' +
        fld('description', 'Description', true, item.description) +
        '<label>Control Refs</label>' + controlSelect(dsId, key, item.controlRefs, controls || []) +
        rationaleCell +
        fld('rollback', 'Rollback', true, item.rollback) +
        issHtml +
        '</div></td></tr>';
    }

    /**
     * Render the data table (header + body), with inline decision editing and a
     * per-row expander for description/ISM/rationale/rollback (spec §11.2).
     * @param {Project} project
     * @param {string} dsId
     * @param {Object} ui   per-dataset UI state (search/sort/incompleteOnly/expanded)
     * @param {{issues?:Object}} [opts]
     * @returns {string} HTML
     */
    function renderTableHtml(project, dsId, ui, opts) {
      opts = opts || {};
      var expanded = ui.expanded || {};
      var adapter = App.registry.getDataset(project.platformProfileId, dsId);
      if (!adapter) return '<div class="empty-state">No adapter for ' + esc(dsId) + '.</div>';
      var captured = buildCapturedMap(project, dsId, adapter);
      var controls = project.controls || [];
      var controlsById = {}; controls.forEach(function (c) { controlsById[c.id] = c; });
      var cols = adapter.columns.map(function (c) { return { key: c.key, label: c.label }; })
        .concat([{ key: 'appliesTo', label: 'Applies to' }, { key: 'status', label: 'Status' }]);
      var rows = App.ui.model.filterSortRows(project, dsId, adapter, ui);
      var sk = ui.sortKey || 'key', sdir = ui.sortDir || 'asc';
      var colspan = cols.length + 1; // + leading expander column

      var colWidths = ui.colWidths || {};
      var head = '<th class="lead-col" scope="col" aria-label="expand"></th>' + cols.map(function (c) {
        var arrow = (c.key === sk) ? ' <span class="arrow">' + (sdir === 'asc' ? '▲' : '▼') + '</span>' : '';
        var w = colWidths[c.key] || colDefaultWidth(c.key);
        return '<th data-col="' + esc(c.key) + '" scope="col" style="width:' + w + 'px">' + esc(c.label) + arrow +
          '<span class="col-resize" data-col-resize="' + esc(c.key) + '" title="Drag to resize"></span></th>';
      }).join('');

      var body = rows.map(function (r) {
        var isOpen = !!expanded[r.item.key];
        var lead = '<td><button class="expand-btn" data-expand-key="' + esc(r.item.key) + '" aria-expanded="' + isOpen + '" title="Edit details">' + (isOpen ? '▾' : '▸') + '</button></td>';
        var tds = adapter.columns.map(function (c) {
          if (c.key === 'decision') {
            var iss = (opts.issues && opts.issues[dsId + '|' + r.item.key]) || [];
            var invalid = iss.some(function (i) { return i.severity === 'error'; });
            return '<td class="dcell' + (invalid ? ' invalid' : '') + '" data-ds="' + esc(dsId) + '" data-key="' + esc(r.item.key) + '">' + renderDecisionControl(adapter, dsId, r.item, captured) + '</td>';
          }
          if (c.key === 'controlRefs') {
            // Resolve control ids to titles for display (spec §18.3 CTL-5).
            var titles = (r.item.controlRefs || []).map(function (id) { return controlsById[id] ? controlsById[id].title : id; });
            return '<td>' + esc(titles.join(', ')) + '</td>';
          }
          return '<td>' + esc(r.cells[c.key] == null ? '' : r.cells[c.key]) + '</td>';
        }).join('');
        tds += '<td>' + esc(r.appliesTo.join(', ')) + '</td>';
        tds += '<td>' + (r.status === 'decided' ? '<span class="badge decided">decided</span>' : '<span class="badge undecided">undecided</span>') + '</td>';
        var rowHtml = '<tr class="' + (r.status === 'decided' ? '' : 'undecided') + '">' + lead + tds + '</tr>';
        if (isOpen) rowHtml += renderDetailRow(dsId, r.item, colspan, opts.issues, controls);
        return rowHtml;
      }).join('');

      if (!rows.length) body = '<tr><td colspan="' + colspan + '" class="muted">No matching items.</td></tr>';

      return '<table class="data resizable"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
    }

    App.ui = App.ui || {};
    App.ui.tables = { renderToolbar: renderToolbar, renderTableHtml: renderTableHtml, buildCapturedMap: buildCapturedMap };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.views.onboard
   * PURPOSE: The Onboard tab (spec §11.4): three data-driven file slots (one per
   *          active-platform dataset), name/model/firmware fields, a gated Onboard
   *          button, capture help, and a triage summary. Re-onboard aware (§8.7).
   * PURITY:  UI/DOM
   * DEPENDS: App.registry, App.store, App.validation, App.util.*, App.ui.activity
   * INVARIANTS: Onboard is disabled until ALL slots parse without errors AND a
   *             non-empty name is given; identical re-onboard is a no-op.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var dom = App.util.dom, esc = App.util.html.esc;

    // View-local state (not canonical; just the in-progress form).
    var _ob = { fields: { name: '', model: '', firmware: '' }, slots: {} };
    var _ctx = null;

    function activePlatform() { return App.registry.getActivePlatform(); }
    function datasets() { var p = activePlatform(); return p ? p.datasets : []; }

    function slotState(dsId) { return _ob.slots[dsId] || null; }
    function allSlotsOk() {
      return datasets().every(function (ds) {
        var s = slotState(ds.id);
        return s && s.parse && s.parse.errors.length === 0;
      });
    }
    function nameOk() { return !!(_ob.fields.name && _ob.fields.name.trim()); }
    function canOnboard() { return allSlotsOk() && nameOk(); }

    /** Detect whether the current name/model would re-onboard an existing device. */
    function reonboardTarget(project) {
      if (!project || !nameOk()) return null;
      var baseId = App.store.slugify(_ob.fields.name + '-' + _ob.fields.model) || App.store.slugify(_ob.fields.name);
      var latest = App.store.getLatestConfigs(project).filter(function (c) { return c.baseId === baseId; });
      return latest.length ? latest[0] : null;
    }

    function render(project) {
      var ds = datasets();
      var slotsHtml = ds.map(function (d) {
        var s = slotState(d.id);
        var status, cls;
        if (!s) { status = 'No file selected'; cls = 'muted'; }
        else if (s.parse && s.parse.errors.length) { status = '✗ ' + s.parse.errors[0].message; cls = 'error'; }
        else if (s.parse) { status = '✓ ' + s.parse.keys.length + ' items' + (s.parse.warnings.length ? ' (' + s.parse.warnings.length + ' warning' + (s.parse.warnings.length > 1 ? 's' : '') + ')' : ''); cls = 'success'; }
        else { status = 'Reading…'; cls = 'muted'; }
        return '' +
          '<div class="onboard-slot" style="margin-bottom:12px;padding:10px;border:1px solid var(--c-border);border-radius:6px;background:var(--c-surface)">' +
          '<strong>' + esc(d.label) + '</strong> <span class="muted" style="font-size:12px">(' + esc(d.inputKind) + ')</span><br>' +
          '<span class="muted" style="font-size:12px">' + esc(d.captureHint) + '</span><br>' +
          '<input type="file" data-onboard-file="' + esc(d.id) + '" aria-label="' + esc(d.label) + ' capture file" style="margin-top:6px">' +
          '<div class="' + cls + '" data-onboard-status="' + esc(d.id) + '" style="font-family:var(--mono);font-size:12px;margin-top:4px">' + esc(status) + '</div>' +
          '</div>';
      }).join('');

      var ro = reonboardTarget(project);
      var roNote = ro
        ? '<div class="warning" style="margin:8px 0">This will re-onboard <strong>' + esc(ro.name) + '</strong> (creates a new version, or a no-op if snapshots are unchanged).</div>'
        : '';

      var instructions = activePlatform() ? activePlatform().captureInstructions : '';

      return '' +
        '<div style="max-width:760px">' +
        '<h2>Onboard a device</h2>' +
        '<details style="margin-bottom:12px"><summary>Capture instructions</summary><pre class="mono" style="white-space:pre-wrap;background:var(--c-surface-alt);padding:10px;border-radius:6px">' + esc(instructions) + '</pre></details>' +
        '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">' +
          field('name', 'Device name *', _ob.fields.name) +
          field('model', 'Model', _ob.fields.model) +
          field('firmware', 'Firmware', _ob.fields.firmware) +
        '</div>' +
        slotsHtml +
        roNote +
        '<button class="primary" data-onboard-action="onboard"' + (canOnboard() ? '' : ' disabled') + ' style="margin-top:8px">Onboard</button>' +
        '<span class="muted" data-onboard-hint style="margin-left:10px">' + esc(canOnboard() ? 'Ready.' : 'Provide all files (no errors) and a device name.') + '</span>' +
        '</div>';
    }

    function field(name, label, val) {
      return '<label style="display:flex;flex-direction:column;font-size:12px;color:var(--c-text-muted)">' + esc(label) +
        '<input type="text" data-onboard-field="' + esc(name) + '" value="' + esc(val) + '" style="font-size:14px;color:var(--c-text);padding:5px 7px;border:1px solid var(--c-border);border-radius:6px;min-width:200px"></label>';
    }

    /** Update only the Onboard button + hint (no full re-render; preserves focus). */
    function refreshButton() {
      if (!_ctx) return;
      var btn = _ctx.root.querySelector('[data-onboard-action="onboard"]');
      var hint = _ctx.root.querySelector('[data-onboard-hint]');
      if (btn) btn.disabled = !canOnboard();
      if (hint) hint.textContent = canOnboard() ? 'Ready.' : 'Provide all files (no errors) and a device name.';
    }

    function handleFile(dsId, file) {
      if (!file) return;
      var adapter = App.registry.getDataset(activePlatform().id, dsId);
      _ob.slots[dsId] = { filename: file.name, text: null, sha256: null, parse: null };
      _ctx.refreshMain();
      dom.readFileText(file).then(function (text) {
        var pr = adapter.parse(text);
        _ob.slots[dsId] = { filename: file.name, text: text, sha256: App.util.hash.sha256Hex(text), parse: pr };
        App.ui.activity.logIssues(pr.errors, dsId);
        App.ui.activity.logIssues(pr.warnings, dsId);
        if (!pr.errors.length) App.ui.activity.log({ severity: 'info', message: dsId + ': parsed ' + pr.keys.length + ' items from ' + file.name + '.' });
        _ctx.refreshMain();
      }).catch(function (err) {
        _ob.slots[dsId] = { filename: file.name, parse: { items: [], keys: [], warnings: [], errors: [{ category: 'parse', severity: 'error', message: 'Read failed: ' + (err && err.message), location: 'file' }] } };
        _ctx.refreshMain();
      });
    }

    function doOnboard() {
      var project = App.store.getProject();
      var ds = datasets();
      // Defensive: re-check validation just before commit.
      var parsed = {}; ds.forEach(function (d) { parsed[d.id] = slotState(d.id) ? slotState(d.id).parse : null; });
      var vIssues = App.validation.validateOnboarding({ name: _ob.fields.name, parsed: parsed }, ds.map(function (d) { return d.id; }));
      if (vIssues.length) { App.ui.activity.logIssues(vIssues, 'Onboard blocked'); return; }

      // Onboarding from scratch: create an empty project for the active platform.
      if (!project) { App.store.init(App.store.empty(activePlatform().id)); }

      var snapshots = {};
      ds.forEach(function (d) {
        var s = slotState(d.id), pr = s.parse;
        var snap = { capturedUtc: App.util.clock.nowIso(), sourceFilename: s.filename, sha256: s.sha256, keys: pr.keys };
        if (pr.values) snap.values = pr.values;
        if (pr.template !== undefined) snap.template = pr.template;
        snapshots[d.id] = snap;
      });

      var res = App.store.onboardDevice({ name: _ob.fields.name, model: _ob.fields.model, firmware: _ob.fields.firmware, snapshots: snapshots });
      App.ui.activity.logIssues(res.issues);
      if (!res.ok) return;

      if (res.result.noop) { return; } // logged "nothing to do"; stay on Onboard

      // Per-dataset triage breakdown to the drawer.
      ds.forEach(function (d) {
        var pd = res.result.perDataset[d.id];
        App.ui.activity.log({ severity: 'info', message: d.label + ': ' + pd.newCount + ' new, ' + pd.existingCount + ' inherited.' });
      });

      // Reset the form and switch focus to the first dataset (review-4 #2: land with
      // the Incomplete-only filter UNticked so the full list shows by default).
      _ob = { fields: { name: '', model: '', firmware: '' }, slots: {} };
      _ctx.switchTab(ds[0].id);
    }

    function wire(ctx) {
      _ctx = ctx;
      dom.on(ctx.root, 'change', '[data-onboard-file]', function (e, el) { handleFile(el.getAttribute('data-onboard-file'), el.files[0]); });
      dom.on(ctx.root, 'input', '[data-onboard-field]', function (e, el) { _ob.fields[el.getAttribute('data-onboard-field')] = el.value; refreshButton(); });
      dom.on(ctx.root, 'click', '[data-onboard-action="onboard"]', function () { doOnboard(); });
    }

    App.ui = App.ui || {};
    App.ui.views = App.ui.views || {};
    App.ui.views.onboard = { render: render, wire: wire };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.views.generate
   * PURPOSE: The Generate tab (spec §11.5): device selector + three INDEPENDENT
   *          commands (Implementation/Verification/Reporting), each enabled iff the
   *          device is ready, disabled buttons explaining why. Generation itself is
   *          wired to App.generate when present (Phase 7); until then it logs intent.
   * PURITY:  UI/DOM
   * DEPENDS: App.store, App.completeness, App.ui.model, App.util.*, App.ui.activity
   * INVARIANTS: a command is enabled ⇔ App.completeness.deviceReady(project, id).
   * ============================================================================= */
  (function (App) {
    'use strict';
    var esc = App.util.html.esc;
    var _gen = { deviceId: null, scriptsAsTxt: false };
    var _ctx = null;

    var COMMANDS = [
      { id: 'implementation', label: 'Implementation', build: 'buildImplementation' },
      { id: 'verification', label: 'Verification', build: 'buildVerification' },
      { id: 'reporting', label: 'Reporting', build: 'buildReport' }
    ];

    function latest(project) { return App.ui.model.getLatestConfigs(project); }
    function selectedId(project) {
      var l = latest(project);
      if (_gen.deviceId && l.some(function (c) { return c.id === _gen.deviceId; })) return _gen.deviceId;
      return l.length ? l[0].id : null;
    }
    function reasonText(readiness) {
      if (readiness.ready) return '';
      return readiness.reasons.map(function (r) { return r.undecided + ' ' + r.label.toLowerCase() + ' undecided'; }).join(', ');
    }

    function render(project) {
      if (!project) return '<div class="empty-state"><h2>Generate</h2><p>Load a project or onboard a device first.</p></div>';
      var l = latest(project);
      if (!l.length) return '<div class="empty-state"><h2>Generate</h2><p>No device configurations yet — onboard a device.</p></div>';
      var selId = selectedId(project);
      var readiness = App.completeness.deviceReadiness(project, selId);
      var why = reasonText(readiness);
      var dc = l.filter(function (c) { return c.id === selId; })[0];

      var opts = l.map(function (c) {
        return '<option value="' + esc(c.id) + '"' + (c.id === selId ? ' selected' : '') + '>' + esc(c.name) + ' (v' + c.version + ', ' + esc(c.model) + ')</option>';
      }).join('');

      var statusLine = readiness.ready
        ? '<span class="gen-ready">Ready — all applicable items decided.</span>'
        : '<span class="gen-blocked">Blocked: ' + esc(why) + '.</span>';

      var cards = COMMANDS.map(function (cmd) {
        var dis = readiness.ready ? '' : ' disabled';
        return '<div class="gen-card">' +
          '<h3>' + esc(cmd.label) + '</h3>' +
          '<button class="primary" data-generate-action="' + cmd.id + '"' + dis + '>Generate ' + esc(cmd.label) + '</button>' +
          '<div class="why">' + (readiness.ready ? '' : esc(why)) + '</div>' +
          '</div>';
      }).join('');

      return '<div style="max-width:820px"><h2>Generate</h2>' +
        '<label class="platform">Device <select data-generate-device>' + opts + '</select></label>' +
        '<p>' + statusLine + '</p>' +
        '<label style="display:inline-flex;align-items:center;gap:6px;margin:4px 0 8px">' +
