        var keyCol = tac.columns.filter(function (c) { return c.key === 'key'; })[0];
        T.assertEqual(keyCol.get({ key: 'policyList.Disable Bluetooth' }), 'Disable Bluetooth');
      });
      s.test('rebuild routes checked by name via the prefixed key (round-trips + targeted change)', function () {
        var leaves = A.flattenTactical(doc);
        var items = leaves.map(function (l) { return { key: l.key, decision: { value: l.value }, controlRefs: [], status: 'decided' }; });
        T.assertEqual(App.util.stable.stableStringify(A.rebuildTacticalDoc(doc, items)), App.util.stable.stableStringify(doc));
        var changed = A.rebuildTacticalDoc(doc, [{ key: 'policyList.Disable Bluetooth', decision: { value: true }, controlRefs: [], status: 'decided' }]);
        T.assertEqual(changed.policyList.filter(function (p) { return p.name === 'Disable Bluetooth'; })[0].checked, true);
        T.assertEqual(changed.policyList.filter(function (p) { return p.name === 'Enable X'; })[0].checked, true); // untouched
      });
      s.test('a policy name containing dots: stored prefixed, displayed bare, routes correctly', function () {
        var d2 = { policyList: [{ checked: false, name: 'Disable Hotspot 2.0' }] };
        var leaves = A.flattenTactical(d2);

        T.assertEqual(tac.displayKey(leaves[0].key), 'Disable Hotspot 2.0');
        var changed = A.rebuildTacticalDoc(d2, [{ key: 'policyList.Disable Hotspot 2.0', decision: { value: true }, controlRefs: [], status: 'decided' }]);
        T.assertEqual(changed.policyList[0].checked, true);
      });
      s.test('review-4 #1 regression: a sibling key sharing a policy name is NOT misrouted (no collision)', function () {
        // 'enabled' exists BOTH as a real top-level field and as a policy name.
        var d3 = { enabled: true, policyList: [{ checked: false, name: 'enabled' }] };
        var out = A.rebuildTacticalDoc(d3, [
          { key: 'enabled', decision: { value: false }, controlRefs: [], status: 'decided' },                 // the real field
          { key: 'policyList.enabled', decision: { value: true }, controlRefs: [], status: 'decided' }        // the policy
        ]);
        T.assertEqual(out.enabled, false, 'real top-level field must take its own decision');
        T.assertEqual(out.policyList[0].checked, true, 'policy must take its own decision');
      });
    });

    T.suite('review-3 #5a/#5b control types + import', function (s) {
      s.test('addControlType registers a new type; dup is a no-op', function () {

  <!-- ===== PHASE-8 SELF-TEST SUITES (DOD-11 portability + DOD checklist) ===== -->
  <script>
  (function (App) {
    'use strict';
    var T = App.test;

    // ---- Appendix D.4: a trivial MOCK platform with one text dataset 'mock.kv'.
    // Registered lazily (D-007). Its existence + the assertions below PROVE DOD-11:
    // a new platform is hosted by writing only an adapter + profile — ZERO edits to
    // store/registry/diff/validation/completeness/generate/projectIo/report/ui.
    var MOCK_KV = {
      id: 'mock.kv', label: 'KV', inputKind: 'text',
      captureHint: 'one k=value per line',
      parse: function (raw) {
        var keys = [], values = {}, errors = [], seen = {};
        String(raw).split(/\r?\n/).forEach(function (line, i) {
          if (line.trim() === '') return;
          var eq = line.indexOf('=');
          if (eq === -1) { errors.push({ category: 'parse', severity: 'error', message: 'Expected k=value.', location: 'line ' + (i + 1) }); return; }
          var k = line.slice(0, eq), v = line.slice(eq + 1);
          if (seen[k]) { errors.push({ category: 'parse', severity: 'error', message: 'Duplicate key ' + k, location: 'line ' + (i + 1) }); return; }
          seen[k] = true; keys.push(k); values[k] = v;
        });
        keys.sort();
        return { items: keys.map(function (k) { return { key: k, defaultValue: values[k] }; }), keys: keys, values: values, warnings: [], errors: errors };
      },
      decisionSchema: [{ name: 'value', kind: 'string', required: true }],
      validateDecision: function (it) { return (it.decision && typeof it.decision.value !== 'string') ? [{ category: 'validation', severity: 'error', message: 'value must be a string', location: it.key }] : []; },
      isComplete: function (it) { return it.decision !== null && this.validateDecision(it).length === 0; },
      columns: [
        { key: 'key', label: 'Key', get: function (it) { return it.key; } },
        { key: 'description', label: 'Description', get: function (it) { return it.description || ''; } },
        { key: 'decision', label: 'Value', get: function (it) { return it.decision ? it.decision.value : ''; } },
        { key: 'controlRefs', label: 'Control Refs', get: function (it) { return (it.controlRefs || []).join(', '); } }
      ],
      generateImplementation: function (items, ctx) { return [{ name: 'mock.impl.txt', content: items.slice().sort(function (a, b) { return a.key < b.key ? -1 : 1; }).map(function (it) { return it.decision ? (it.key + '=' + it.decision.value) : ''; }).filter(Boolean).join('\n') }]; },
      generateVerification: function (items, ctx) { return [{ name: 'mock.verify.txt', content: 'verify ' + items.length + ' items' }]; },
      renderReportSection: function (items, ctx) { return '<h2>KV</h2><table><tbody>' + items.map(function (it) { return '<tr><td>' + App.util.html.esc(it.key) + '</td></tr>'; }).join('') + '</tbody></table>'; },
      capturedDefaults: function (snap) { var o = {}; if (snap && snap.values) Object.keys(snap.values).forEach(function (k) { o[k] = { value: snap.values[k], type: 'string' }; }); return o; }
    };
    var MOCK_PLATFORM = {
      id: 'mock', label: 'Mock platform', outputLanguage: 'text',
      datasets: [MOCK_KV], captureInstructions: 'k=value lines',
      scriptPreamble: function () { return '# mock'; }, scriptPostamble: function () { return ''; }
      // NOTE: no scriptExtension => the generator wraps nothing for this platform.
    };
    function ensureMock() { if (!App.registry.hasPlatform('mock')) App.registry.registerPlatform(MOCK_PLATFORM); }
    function mockSnap(raw) {
      ensureMock();
      var pr = MOCK_KV.parse(raw);
      return { capturedUtc: '2026-01-01T00:00:00.000Z', sourceFilename: 'kv.txt', sha256: App.util.hash.sha256Hex(raw), keys: pr.keys, values: pr.values };
    }

    T.suite('DOD-11 portability (mock platform, zero core edits)', function (s) {
      s.test('store/diff onboard a mock device & triage with the generic engine', function () {
        ensureMock();
        App.store.init(App.store.empty('mock'));
        var res = App.store.onboardDevice({ name: 'MockDev', model: 'X', firmware: 'F', snapshots: { 'mock.kv': mockSnap('k1=a\nk2=b') } });
        T.assertEqual(res.ok, true);
        T.assertDeepEqual(App.store.getProject().items['mock.kv'].map(function (i) { return i.key; }).sort(), ['k1', 'k2']);
      });
      s.test('generic table renders mock columns + editor', function () {
        ensureMock();
        App.store.init(App.store.empty('mock'));
        App.store.onboardDevice({ name: 'MockDev', model: 'X', snapshots: { 'mock.kv': mockSnap('k1=a\nk2=b') } });
        var html = App.ui.tables.renderTableHtml(App.store.getProject(), 'mock.kv', {}, {});
        T.assert(/k1/.test(html) && /k2/.test(html) && /data-kind="string"/.test(html));
      });
      s.test('completeness + generation work for the mock platform', function () {
        ensureMock();
        App.store.init(App.store.empty('mock'));
        App.store.onboardDevice({ name: 'MockDev', model: 'X', snapshots: { 'mock.kv': mockSnap('k1=a\nk2=b') } });
        App.store.setDecision('mock.kv', 'k1', { value: 'x' });
        App.store.setDecision('mock.kv', 'k2', { value: 'y' });
        var p = App.store.getProject();
        T.assertEqual(App.completeness.deviceReady(p, 'mockdev-x'), true);
        var impl = App.generate.buildImplementation(p, 'mockdev-x');
        T.assert(impl.blob && impl.files.some(function (f) { return f.name === 'mock.impl.txt'; }) && impl.files.some(function (f) { return f.name === 'manifest.json'; }));
        var rep = App.generate.buildReport(p, 'mockdev-x');
        T.assert(/KV/.test(rep.files.filter(function (f) { return f.name === 'report.html'; })[0].content));
      });
      s.test('project round-trips losslessly for the mock platform', function () {
        ensureMock();
        App.store.init(App.store.empty('mock'));
        App.store.onboardDevice({ name: 'MockDev', model: 'X', snapshots: { 'mock.kv': mockSnap('k1=a') } });
        var s1 = App.projectIo.serializeProject(App.store.getProject());
        var r = App.projectIo.parseProject(s1);
        T.assertEqual(r.ok, true);
        T.assertEqual(App.projectIo.serializeProject(r.value), s1);
      });
    });

    T.suite('DOD checklist (programmatic items)', function (s) {
      s.test('DOD-2: load→save→load identity (android sample)', function () {
        if (!App.registry.hasPlatform('android-adb')) App.registry.registerPlatform(App.platforms.androidAdb);
        App.store.init(App.store.empty('android-adb'));
        var s1 = App.projectIo.serializeProject(App.store.getProject());
        T.assertEqual(App.projectIo.serializeProject(App.projectIo.parseProject(s1).value), s1);
      });
      s.test('DOD-10: malformed inputs never throw; return located issues', function () {
        var a = App.registry.getDataset('android-adb', 'android.settings');
        T.assert(a.parse('garbage with no equals').errors.length >= 1);
        T.assert(App.adapters.android.tactical.parse('{bad').errors.length === 1);
        T.assertEqual(App.projectIo.parseProject('{').ok, false);
      });
      s.test('DOD-12: every module file-block present & self-test suite passes (this run)', function () {
        T.assert(!!(App.store && App.registry && App.diff && App.validation && App.completeness && App.generate && App.report && App.projectIo));
      });
    });

  })(App);
  </script>

  <!-- ===== PHASE-9 SELF-TEST SUITES (v1.1: dark mode · set-from-files · controls) ===== -->
  <script>
  (function (App) {
    'use strict';
    var T = App.test;

    T.suite('T9.1 dark mode (UI-only, determinism-safe)', function (s) {
      s.test('nextTheme flips light<->dark', function () {
        T.assertEqual(App.ui.app.nextTheme('light'), 'dark');
        T.assertEqual(App.ui.app.nextTheme('dark'), 'light');
      });
      s.test('theme never leaks into generated output (DM-3)', function () {
        if (!App.registry.hasPlatform('android-adb')) App.registry.registerPlatform(App.platforms.androidAdb);
        function snap(d, r) { var a = App.registry.getDataset('android-adb', d), pr = a.parse(r); var o = { capturedUtc: '2026-01-01T00:00:00.000Z', sourceFilename: d, sha256: App.util.hash.sha256Hex(r), keys: pr.keys }; if (pr.values) o.values = pr.values; if (pr.template !== undefined) o.template = pr.template; return o; }
        App.util.clock.setClock(function () { return new Date('2026-02-02T02:02:02.000Z'); });
        App.store.init(App.store.empty('android-adb'));
        App.store.onboardDevice({ name: 'Dev', model: 'M1', snapshots: { 'android.packages': snap('android.packages', 'com.a'), 'android.settings': snap('android.settings', 'secure:\nx=0'), 'android.tactical': snap('android.tactical', '{"enabled":true}') } });
        App.store.setDecision('android.packages', 'com.a', { action: 'keep' });

        var html = rep.files.filter(function (f) { return f.name === 'report.html'; })[0].content;
        T.assert(html.indexOf('data-theme') === -1, 'theme attribute leaked into report');
        App.util.clock.resetClock();
      });
    });

    // ---- Track B: set decisions from files ----
    function ensureA() { if (!App.registry.hasPlatform('android-adb')) App.registry.registerPlatform(App.platforms.androidAdb); }
    function snapB(d, r) { ensureA(); var a = App.registry.getDataset('android-adb', d), pr = a.parse(r); var o = { capturedUtc: '2026-01-01T00:00:00.000Z', sourceFilename: d, sha256: App.util.hash.sha256Hex(r), keys: pr.keys }; if (pr.values) o.values = pr.values; if (pr.template !== undefined) o.template = pr.template; return o; }

    T.suite('T9.2 adapter parseAssignment', function (s) {
      s.test('packages CSV: header + package: prefix tolerance + quoted description', function () {
        var a = App.registry.getDataset('android-adb', 'android.packages'); ensureA();
        var csv = 'package,action,description\npackage:com.a,disable,"turn off, please"\ncom.b,keep,ok';
        var r = a.parseAssignment(csv);
        T.assertEqual(r.errors.length, 0);
        T.assertEqual(r.assignments.length, 2);
        T.assertDeepEqual(r.assignments[0], { key: 'com.a', decision: { action: 'disable' }, fields: { description: 'turn off, please' } });
      });
      s.test('packages CSV: wrong header / bad action rejected', function () {
        var a = App.registry.getDataset('android-adb', 'android.packages'); ensureA();
        T.assert(a.parseAssignment('pkg,action,description\ncom.a,keep,x').errors.length >= 1);
        T.assert(a.parseAssignment('package,action,description\ncom.a,nuke,x').errors.some(function (e) { return /Invalid action/.test(e.message); }));
      });
      s.test('settings/tactical parseAssignment map to decisions', function () {
        ensureA();
        var st = App.registry.getDataset('android-adb', 'android.settings').parseAssignment('secure:\nx=5');
        T.assertDeepEqual(st.assignments[0], { key: 'secure/x', decision: { value: '5', type: 'string' } });
        var tc = App.registry.getDataset('android-adb', 'android.tactical').parseAssignment('{"enabled":false}');
        T.assertDeepEqual(tc.assignments[0], { key: 'enabled', decision: { value: false } });
      });
      s.test('review-5 #3: settings ALSO accept a "setting,description,value" CSV', function () {
        ensureA();
        var a = App.registry.getDataset('android-adb', 'android.settings');
        var r = a.parseAssignment('setting,description,value\nsecure/location_mode,GPS off,0\nglobal/foo,"desc, with comma",hello world');
        T.assertEqual(r.errors.length, 0);
        T.assertEqual(r.assignments.length, 2);
        T.assertDeepEqual(r.assignments[0], { key: 'secure/location_mode', decision: { value: '0', type: 'string' }, fields: { description: 'GPS off' } });
        T.assertEqual(r.assignments[1].fields.description, 'desc, with comma');

      s.test('review-5 #3: settings CSV rejects a malformed key; the §9 capture format still works', function () {

        T.assertDeepEqual(cap.assignments[0], { key: 'secure/x', decision: { value: '5', type: 'string' } });

    T.suite('T9.3 store.applyDeviceAssignment (exact-set + atomic)', function (s) {

      s.test('missing key -> refused with delta, no mutation', function () {

      s.test('extra key -> refused with delta', function () {

        T.assertEqual(res.ok, false);
        T.assert(res.issues.some(function (i) { return /not applicable/.test(i.message) && /com\.z/.test(i.message); }));
      });

        ensureA();

        App.store.onboardDevice({ name: 'Asg', model: 'M1', snapshots: {
          'android.packages': snapB('android.packages', 'com.a'),
          'android.settings': snapB('android.settings', 'secure:\nx=0\ny=0'),

        T.assertEqual(res.ok, true);
        var items = App.store.getProject().items['android.settings'];
        var x = items.filter(function (i) { return i.key === 'secure/x'; })[0];

    // ---- Track C: Control Manager + controlRefs ----
    T.suite('T9.6 store control CRUD', function (s) {
      s.test('add/update/remove + controlRef cleanup', function () {
        ensureA();
        App.store.init(App.store.empty('android-adb'));
        App.store.onboardDevice({ name: 'Ctl', model: 'M1', snapshots: { 'android.packages': snapB('android.packages', 'com.a'), 'android.settings': snapB('android.settings', 'secure:\nx=0'), 'android.tactical': snapB('android.tactical', '{"enabled":true}') } });

      });
      s.test('#3 add-type + import tools render to the right of the title (header, before the add form/table)', function () {
        var html = App.ui.views.controls.render(projWithControl());
        T.assert(/<div class="ctl-header"><h2>Control Manager<\/h2>/.test(html), 'title not at the start of the header');
        var hdr = html.indexOf('class="ctl-header"'), tools = html.indexOf('class="ctl-tools"');
        var addForm = html.indexOf('class="ctl-add"'), tableHost = html.indexOf('id="ctl-table-host"');
        T.assert(tools !== -1 && tools > hdr, 'tools not inside the header');
        T.assert(tools < addForm && tools < tableHost, 'tools should precede the add form and table (beside the title, not beneath)');
      });
      s.test('#4 Control Manager is a SEARCHABLE TABLE with a per-row dropdown', function () {
        ensureA(); App.store.init(App.store.empty('android-adb'));
        App.store.onboardDevice({ name: 'Ctl', model: 'M1', snapshots: { 'android.packages': snapB('android.packages', 'com.a'), 'android.settings': snapB('android.settings', 'secure:\nx=0'), 'android.tactical': snapB('android.tactical', '{"enabled":true}') } });
        var id = App.store.addControl({ title: 'No Bluetooth', type: 'ISM', description: 'a long description that should wrap onto multiple lines' }).id;
        var project = App.store.getProject();
        var CV = App.ui.views.controls;
        // Collapsed: a table with a search box, a wrapping description column, a per-row
        // expander, and NO inline remove / NO inline description <input>.
        CV._cm.search = ''; CV._cm.expanded = {};
        var collapsed = CV.render(project);
        T.assert(/data-ctl-search/.test(collapsed), 'no search box');
        T.assert(/class="data ctl-table resizable"/.test(collapsed), 'controls not rendered as a resizable table');
        // review-6 #4: columns are drag-resizable (handles + width styles) like the data tables.
        T.assert(/data-cm-col-resize="title"/.test(collapsed) && /data-cm-col-resize="description"/.test(collapsed), 'no column resize handles');
        T.assert(/data-cm-col="title" scope="col" style="width:\d+px"/.test(collapsed), 'no per-column width styles');
        T.assert(/ctl-desc-cell/.test(collapsed) && collapsed.indexOf('a long description that should wrap') !== -1, 'no wrapping description column');
        T.assert(new RegExp('data-ctl-expand="' + id + '"').test(collapsed), 'no per-row expander');
        T.assert(!/<input[^>]*data-ctl-field="description"/.test(collapsed), 'description must never be a one-line input');
        T.assert(!/data-ctl-remove=/.test(collapsed), 'Remove must live in the dropdown, not the row');
        // Expanded: the dropdown holds the wrapping description textarea AND the Remove button.
        CV._cm.expanded = {}; CV._cm.expanded[id] = true;
        var open = CV.render(project);
        T.assert(/<textarea class="ctl-desc" data-ctl-field="description"/.test(open), 'dropdown has no wrapping description textarea');
        T.assert(/class="detail-row"[\s\S]*data-ctl-remove="/.test(open), 'Remove button not inside the dropdown');
        // review-6 #4: a stored column width overrides the default.
        CV._cm.expanded = {}; CV._cm.colWidths = { title: 333 };
        T.assert(/data-cm-col="title" scope="col" style="width:333px"/.test(CV.render(project)), 'stored column width not applied');
        CV._cm.colWidths = {};
      });
      s.test('#4 controls table search filters by title/type/description', function () {
        ensureA(); App.store.init(App.store.empty('android-adb'));
        App.store.onboardDevice({ name: 'Ctl', model: 'M1', snapshots: { 'android.packages': snapB('android.packages', 'com.a'), 'android.settings': snapB('android.settings', 'secure:\nx=0'), 'android.tactical': snapB('android.tactical', '{"enabled":true}') } });
        App.store.addControl({ title: 'No Bluetooth', type: 'ISM' });
        App.store.addControl({ title: 'Disable GPS', type: 'AHG' });
        var project = App.store.getProject();
        var CV = App.ui.views.controls;
        CV._cm.expanded = {};
        CV._cm.search = 'bluetooth';
        var filtered = CV.renderTable(project);
        T.assert(filtered.indexOf('No Bluetooth') !== -1 && filtered.indexOf('Disable GPS') === -1, 'search did not filter to the matching control');
        T.assert(/1 of 2 shown/.test(filtered), 'count line wrong for a filtered view');
        CV._cm.search = '';
      });
    });

  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.bootstrap  — LAST. Registers platforms and mounts the UI.
   * PURPOSE: Wire everything together at startup (spec §14). During Phase 0 it only
   *          renders self-tests on #selftest and a placeholder otherwise.
   * PURITY:  UI/IO
   * DEPENDS: (eventually) App.registry, App.platforms.*, App.ui.app
   * ============================================================================= */
  (function (App) {
    'use strict';

    /** Global error boundary: surface unexpected errors in the drawer, never blank-fail (§12.1). */
    function installErrorBoundary() {
      function report(msg) {
        if (App.ui && App.ui.activity) App.ui.activity.log({ severity: 'error', message: 'Unexpected error: ' + msg });
      }
      window.addEventListener('error', function (e) { report((e && e.message) || 'script error'); });
      window.addEventListener('unhandledrejection', function (e) { report((e && e.reason && (e.reason.message || e.reason)) || 'promise rejection'); });
    }

    function boot() {
      var root = document.getElementById('root');
      var isSelfTest = window.location.hash.replace('#', '') === 'selftest';

      // Register platform profiles (spec §14: register, then mount). Adding a new
      // platform means ONE more registerPlatform call here — zero core edits (DOD-11).
      if (App.platforms && App.platforms.androidAdb && !App.registry.hasPlatform('android-adb')) {
        App.registry.registerPlatform(App.platforms.androidAdb);
      }

      if (isSelfTest) {
        App.test.runAndRender(root);
        return;
      }

      installErrorBoundary();

      // Phase 0 placeholder UI; replaced by App.ui.app.mount in later phases.
      if (App.ui && App.ui.app && typeof App.ui.app.mount === 'function') {
        App.ui.app.mount(root);
      } else {
        root.innerHTML =
          '<div style="padding:24px">' +
          '<h1>CH Config Tool</h1>' +
          '<p>Skeleton loaded. Append <code>#selftest</code> to the URL to run the embedded test suite.</p>' +
          '</div>';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })(App);
  </script>
