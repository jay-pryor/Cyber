      return { ok: true, issues: [{ category: 'state', severity: 'success', message: 'Reverted "' + key + '" to inherited.' }] };
    }
    /** Set a group override (value-only). No-op vs the DEFAULT value clears it. */
    function setGroupOverride(groupId, datasetId, key, decision) {
      if (!_project) return errNoProject();
      var g = (_project.groups || []).filter(function (x) { return x.id === groupId; })[0];
      if (!g) return err('Unknown group "' + groupId + '".');
      var adapter = adapterFor(datasetId);
      if (!adapter) return err('Unknown dataset "' + datasetId + '".');
      if (!groupApplicableKeySet(g, datasetId)[key]) return err('Key "' + key + '" is not applicable to any device in this group.', key);
      var verr = validateOverrideDecision(adapter, key, decision);
      if (verr.length) return { ok: false, issues: verr };
      if (stableStr(decision) === stableStr(itemDefault(datasetId, key))) return clearGroupOverride(groupId, datasetId, key);
      commit(function (p) {
        var gg = p.groups.filter(function (x) { return x.id === groupId; })[0];
        if (!gg.overrides) gg.overrides = {};
        if (!gg.overrides[datasetId]) gg.overrides[datasetId] = {};
        gg.overrides[datasetId][key] = decision;
      });
      return { ok: true, issues: [{ category: 'state', severity: 'success', message: 'Set group override for "' + key + '".' }] };
    }
    function clearGroupOverride(groupId, datasetId, key) {
      if (!_project) return errNoProject();
      var g = (_project.groups || []).filter(function (x) { return x.id === groupId; })[0];
      if (!g) return err('Unknown group "' + groupId + '".');
      if (!(g.overrides && g.overrides[datasetId] && Object.prototype.hasOwnProperty.call(g.overrides[datasetId], key))) return { ok: true, issues: [] };
      commit(function (p) {
        var gg = p.groups.filter(function (x) { return x.id === groupId; })[0];
        delete gg.overrides[datasetId][key];
        if (!Object.keys(gg.overrides[datasetId]).length) delete gg.overrides[datasetId];
      });

    }
    function uniqueGroupId(name) {
      var base = slugify(name) || 'group', id = base, n = 2, used = {};

      while (used[id]) { id = base + '-' + n; n++; }
      return id;
    }
    /** Create a device group; member baseIds are MOVED out of any prior group (single-group rule). */
    function addGroup(input) {
      if (!_project) return errNoProject();
      var name = ((input && input.name) || '').trim();
      if (!name) return err('Group name is required.', 'name');
      var baseIds = ((input && input.deviceBaseIds) || []).slice();
      var id = uniqueGroupId(name);
      commit(function (p) {
        if (!Array.isArray(p.groups)) p.groups = [];
        p.groups.forEach(function (g) { g.deviceBaseIds = (g.deviceBaseIds || []).filter(function (b) { return baseIds.indexOf(b) === -1; }); });
        p.groups.push({ id: id, name: name, deviceBaseIds: baseIds, overrides: {} });
      });
      return { ok: true, issues: [{ category: 'state', severity: 'success', message: 'Added group "' + name + '".' }], id: id };
    }
    function updateGroup(id, patch) {
      if (!_project) return errNoProject();
      if (!(_project.groups || []).some(function (g) { return g.id === id; })) return err('Unknown group "' + id + '".');
      patch = patch || {};
      commit(function (p) {
        var g = p.groups.filter(function (x) { return x.id === id; })[0]; if (!g) return;
        if ('name' in patch && String(patch.name).trim()) g.name = String(patch.name).trim();
        if ('deviceBaseIds' in patch) {
          var ids = (patch.deviceBaseIds || []).slice();
          p.groups.forEach(function (o) { if (o.id !== id) o.deviceBaseIds = (o.deviceBaseIds || []).filter(function (b) { return ids.indexOf(b) === -1; }); });
          g.deviceBaseIds = ids;
        }
      });
      return { ok: true, issues: [] };
    }
    function removeGroup(id) {
      if (!_project) return errNoProject();
      if (!(_project.groups || []).some(function (g) { return g.id === id; })) return err('Unknown group "' + id + '".');
      commit(function (p) { p.groups = (p.groups || []).filter(function (g) { return g.id !== id; }); });
      return { ok: true, issues: [{ category: 'state', severity: 'success', message: 'Removed group; members fall back to default.' }] };
    }

    App.store = {
      empty: empty, init: init, getProject: getProject,
      onChange: onChange, isDirty: isDirty, markSaved: markSaved, markDirty: markDirty,
      recomputeStatus: recomputeStatus,

      setDecision: setDecision, setItemFields: setItemFields, applyDeviceAssignment: applyDeviceAssignment,
      // review-12 #2: explicit item deletion + the one-step undo primitives.
      removeItems: removeItems, datasetSnapshot: datasetSnapshot, restoreDatasetSnapshot: restoreDatasetSnapshot,
      setHeld: setHeld,
      addControl: addControl, updateControl: updateControl, removeControl: removeControl,
      // TAG-1/2/3: control tags + the two Control Manager bulk paths.
      knownControlTags: knownControlTags, addControlTag: addControlTag,
      removeControlTag: removeControlTag, setControlTag: setControlTag,
      setControlsDevice: setControlsDevice,
      // VF-5/VF-6: the reusable value-format catalogue + bulk item assignment.
      addValueFormat: addValueFormat, updateValueFormat: updateValueFormat,
      removeValueFormat: removeValueFormat, setItemFormats: setItemFormats,
      setControlDeviceState: setControlDeviceState, controlDeviceState: controlDeviceState,
      addControlType: addControlType, knownControlTypes: knownControlTypes, importControls: importControls,
      setDeviceOverride: setDeviceOverride, clearDeviceOverride: clearDeviceOverride,
      setGroupOverride: setGroupOverride, clearGroupOverride: clearGroupOverride,
      addGroup: addGroup, updateGroup: updateGroup, removeGroup: removeGroup,

  <!-- ===== PHASE-1 SELF-TEST SUITES (stable, registry, projectIo, store) ===== -->
  <script>
  (function (App) {
    'use strict';
    var T = App.test;

    // A self-contained test platform with three dataset ids, so projectIo's
    // dataset-id cross-checks and the "registered platform" check are exercised
    // without depending on the Android adapters (Phase 2). Distinct id => never
    // clobbers the real 'android-adb' platform.
    // D-007: registered LAZILY (inside tests) — registering at module-load would
    // run on every page load and, being first, make this mock the ACTIVE platform.
    var ST_PLATFORM_ID = 'selftest.platform';
    var DS = ['selftest.a', 'selftest.b', 'selftest.c'];
    function ensureST() {
      if (!App.registry.hasPlatform(ST_PLATFORM_ID)) App.registry.registerPlatform({
        id: ST_PLATFORM_ID, label: 'Self-test', outputLanguage: 'none',
        datasets: DS.map(function (id) { return { id: id, label: id }; }),
        captureInstructions: '', scriptPreamble: function () { return ''; }, scriptPostamble: function () { return ''; }
      });
    }

    var ISO = '2026-01-01T00:00:00.000Z';
    function sha(x) { return App.util.hash.sha256Hex(x); }

    function sampleProject() {
      ensureST();
      return {
        schemaVersion: 3,
        platformProfileId: ST_PLATFORM_ID,
        meta: { createdUtc: ISO, modifiedUtc: '2026-01-02T00:00:00.000Z', appVersion: '1.0' },
        groups: [],
        controls: [{ id: 'ism-1', title: 'ISM-1', type: 'ISM', description: '', assignedDeviceIds: [] }],
        deviceConfigs: [
          {
            id: 'tab-active-5', baseId: 'tab-active-5', version: 1, supersedesId: null,
            name: 'Tab Active 5', model: 'SM-X306B', firmware: 'X306B-1', onboardedUtc: ISO,
            snapshots: {
              'selftest.a': { capturedUtc: ISO, sourceFilename: 'a.txt', sha256: sha('a1'), keys: ['k1', 'k2'] },
              'selftest.b': { capturedUtc: ISO, sourceFilename: 'b.txt', sha256: sha('b1'), keys: ['s1', 's2'], values: { s1: '0', s2: '1' } },
              'selftest.c': { capturedUtc: ISO, sourceFilename: 'c.json', sha256: sha('c1'), keys: ['t1'], template: { t1: true } }
            }
          },
          {
            id: 's23', baseId: 's23', version: 1, supersedesId: null,
            name: 'S23', model: 'SM-S911', firmware: 'S911-1', onboardedUtc: ISO,
            snapshots: {
              'selftest.a': { capturedUtc: ISO, sourceFilename: 'a.txt', sha256: sha('a2'), keys: ['k1', 'k3'] },
              'selftest.b': { capturedUtc: ISO, sourceFilename: 'b.txt', sha256: sha('b2'), keys: ['s1', 's2'], values: { s1: '1', s2: '1' } },
              'selftest.c': { capturedUtc: ISO, sourceFilename: 'c.json', sha256: sha('c2'), keys: ['t1'], template: { t1: true } }
            }
          }
        ],
        items: {
          'selftest.a': [
            { key: 'k1', description: 'pkg one', decision: { action: 'keep' }, controlRefs: ['ism-1'], status: 'decided' },
            { key: 'k2', decision: null, controlRefs: [], status: 'undecided' },
            { key: 'k3', decision: null, controlRefs: [], status: 'undecided' }
          ],
          'selftest.b': [
            { key: 's1', decision: { value: '0', type: 'int' }, controlRefs: [], status: 'decided' },
            { key: 's2', decision: null, controlRefs: [], status: 'undecided' }
          ],
          'selftest.c': [
            { key: 't1', decision: { value: true, type: 'bool' }, controlRefs: [], status: 'decided' }
          ]
        }
      };
    }

    T.suite('util.stable.stableStringify', function (s) {
      s.test('sorts object keys ascending', function () {
        T.assertEqual(App.util.stable.stableStringify({ b: 1, a: 2 }), '{\n  "a": 2,\n  "b": 1\n}');
      });
      s.test('preserves array order (tactical-template safety)', function () {
        T.assertEqual(App.util.stable.stableStringify([3, 1, 2]), '[\n  3,\n  1,\n  2\n]');
      });
      s.test('drops undefined-valued keys (JSON parity)', function () {
        T.assertEqual(App.util.stable.stableStringify({ a: undefined, b: 1 }), '{\n  "b": 1\n}');
      });
      s.test('empty object/array compact', function () {
        T.assertEqual(App.util.stable.stableStringify({ a: {}, b: [] }), '{\n  "a": {},\n  "b": []\n}');
      });
      s.test('escapes strings correctly', function () {
        T.assertEqual(App.util.stable.stableStringify('a"b\n'), '"a\\"b\\n"');
      });
    });

    T.suite('projectIo schema validation', function (s) {
      s.test('valid sample project has no errors', function () {
        var issues = App.projectIo.validateSchema(sampleProject());
        var errs = issues.filter(function (i) { return i.severity === 'error'; });
        T.assertEqual(errs.length, 0, 'unexpected errors: ' + JSON.stringify(errs));
      });
      s.test('malformed JSON -> located parse error', function () {
        var r = App.projectIo.parseProject('{ not json ');
        T.assertEqual(r.ok, false);
        T.assertEqual(r.issues[0].category, 'parse');
      });
      s.test('unknown top-level key rejected', function () {
        var p = sampleProject(); p.extra = 1;
        var r = App.projectIo.parseProject(JSON.stringify(p));
        T.assertEqual(r.ok, false);
        T.assert(r.issues.some(function (i) { return /Unknown top-level/.test(i.message); }));
      });
      s.test('unknown schemaVersion rejected', function () {
        var p = sampleProject(); p.schemaVersion = 99;
        T.assertEqual(App.projectIo.parseProject(JSON.stringify(p)).ok, false);
      });
      s.test('unregistered platform id rejected', function () {
        var p = sampleProject(); p.platformProfileId = 'nope.platform';
        var r = App.projectIo.parseProject(JSON.stringify(p));
        T.assertEqual(r.ok, false);
        T.assert(r.issues.some(function (i) { return /not a registered platform/.test(i.message); }));
      });
      s.test('unknown dataset id in items rejected', function () {
        var p = sampleProject(); p.items['selftest.zzz'] = [];
        var r = App.projectIo.parseProject(JSON.stringify(p));
        T.assertEqual(r.ok, false);
        T.assert(r.issues.some(function (i) { return /not a dataset/.test(i.message); }));
      });
      s.test('bad sha256 rejected', function () {
        var p = sampleProject(); p.deviceConfigs[0].snapshots['selftest.a'].sha256 = 'xyz';
        T.assertEqual(App.projectIo.parseProject(JSON.stringify(p)).ok, false);
      });
      s.test('unsorted snapshot keys rejected', function () {
        var p = sampleProject(); p.deviceConfigs[0].snapshots['selftest.a'].keys = ['k2', 'k1'];
        var r = App.projectIo.parseProject(JSON.stringify(p));
        T.assert(r.issues.some(function (i) { return /sorted ascending/.test(i.message); }));
      });
      s.test('duplicate item key rejected', function () {
        var p = sampleProject(); p.items['selftest.a'].push({ key: 'k1', decision: null, controlRefs: [], status: 'undecided' });
        var r = App.projectIo.parseProject(JSON.stringify(p));
        T.assert(r.issues.some(function (i) { return /Duplicate item key/.test(i.message); }));
      });
      s.test('version integrity: broken supersedes chain rejected', function () {
        var p = sampleProject();
        // Add a v2 for tab-active-5 with a wrong supersedesId.
        p.deviceConfigs.push({
          id: 'tab-active-5-v2', baseId: 'tab-active-5', version: 2, supersedesId: 'wrong-id',
          name: 'Tab Active 5', model: 'SM-X306B', firmware: 'X306B-2', onboardedUtc: ISO,
          snapshots: p.deviceConfigs[0].snapshots
        });
        var r = App.projectIo.parseProject(JSON.stringify(p));
        T.assert(r.issues.some(function (i) { return /supersedesId must reference/.test(i.message); }));
      });
      s.test('version integrity: valid v2 chain accepted', function () {
        var p = sampleProject();
        p.deviceConfigs.push({
          id: 'tab-active-5-v2', baseId: 'tab-active-5', version: 2, supersedesId: 'tab-active-5',
          name: 'Tab Active 5', model: 'SM-X306B', firmware: 'X306B-2', onboardedUtc: ISO,
          snapshots: p.deviceConfigs[0].snapshots
        });
        T.assertEqual(App.projectIo.parseProject(JSON.stringify(p)).ok, true);
      });
    });

    T.suite('projectIo round-trip & determinism (DOD-2/DOD-7)', function (s) {
      s.test('serialize(parse(serialize(P))) === serialize(P)', function () {
        var p = sampleProject();
        var s1 = App.projectIo.serializeProject(p);
        var r = App.projectIo.parseProject(s1);
        T.assertEqual(r.ok, true, 'reparse failed: ' + JSON.stringify(r.issues));
        var s2 = App.projectIo.serializeProject(r.value);
        T.assertEqual(s1, s2);
      });
      s.test('serialization is order-independent (shuffled input -> same bytes)', function () {
        var p = sampleProject();
        var shuffled = sampleProject();
        // Reverse item arrays & device order to prove canonicalization.
        shuffled.items['selftest.a'].reverse();
        shuffled.deviceConfigs.reverse();
        T.assertEqual(App.projectIo.serializeProject(p), App.projectIo.serializeProject(shuffled));
      });
      s.test('migrate v3 is identity', function () {
        var p = sampleProject();
        T.assert(App.projectIo.migrate(p) === p);
      });
      s.test('migrate v1 -> v3 builds controls from legacy ismRefs + adds groups/overrides (lossless)', function () {
        ensureST();
        var v1 = {
          schemaVersion: 1, platformProfileId: ST_PLATFORM_ID,
          meta: { createdUtc: ISO, modifiedUtc: ISO, appVersion: '1.0' }, deviceConfigs: [],
          items: { 'selftest.a': [{ key: 'k1', decision: null, ismRefs: ['ISM-1', 'AHG-2', 'misc'], status: 'undecided' }], 'selftest.b': [], 'selftest.c': [] }
        };
        var v3 = App.projectIo.migrate(v1); // chains v1 -> v2 -> v3
        T.assertEqual(v3.schemaVersion, 3);
        T.assert(Array.isArray(v3.groups), 'groups not added by v2->v3');
        T.assertEqual(v3.controls.length, 3);
        var types = {}; v3.controls.forEach(function (c) { types[c.title] = c.type; });
        T.assertEqual(types['ISM-1'], 'ISM'); T.assertEqual(types['AHG-2'], 'AHG'); T.assertEqual(types['misc'], 'Custom');
        var item = v3.items['selftest.a'][0];
        T.assertEqual(item.ismRefs, undefined, 'legacy ismRefs not removed');
        T.assertEqual(item.controlRefs.length, 3);
        // controlRefs point at real control ids; passes schema validation.
        T.assertEqual(App.projectIo.validateSchema(v3).filter(function (i) { return i.severity === 'error'; }).length, 0);
      });
    });

    T.suite('T10.1 schema v3 (groups, overrides, migrate, prune)', function (s) {
      // A v3 sample carrying a group (with a group override) + a device override.
      function v3Sample() {
        var p = sampleProject();          // schemaVersion 3, selftest platform
        p.groups = [{ id: 'rugged', name: 'Rugged', deviceBaseIds: ['tab-active-5'], overrides: { 'selftest.a': { k1: { action: 'disable' } } } }];
        p.deviceConfigs[0].overrides = { 'selftest.a': { k1: { action: 'remove' } } };  // device beats group
        return p;
      }
      s.test('v2 -> v3 migrate adds groups + per-config overrides and validates', function () {
        var v2 = sampleProject(); v2.schemaVersion = 2; delete v2.groups; delete v2.deviceConfigs[0].overrides;
        var v3 = App.projectIo.migrate(v2);
        T.assertEqual(v3.schemaVersion, 3);
        T.assert(Array.isArray(v3.groups) && v3.groups.length === 0, 'groups not initialised');
        T.assert(v3.deviceConfigs.every(function (dc) { return typeof dc.overrides === 'object'; }), 'overrides not initialised on configs');
        T.assertEqual(App.projectIo.validateSchema(v3).filter(function (i) { return i.severity === 'error'; }).length, 0);
      });
      s.test('round-trip identity with a group + device override', function () {
        var s1 = App.projectIo.serializeProject(v3Sample());
        var r = App.projectIo.parseProject(s1);
        T.assertEqual(r.ok, true, 'reparse failed: ' + JSON.stringify(r.issues));
        var s2 = App.projectIo.serializeProject(r.value);

        T.assertDeepEqual(r.value.deviceConfigs.filter(function (c) { return c.id === 'tab-active-5'; })[0].overrides, { 'selftest.a': { k1: { action: 'remove' } } });
      });
      s.test('empty override maps are dropped from serialized output', function () {
        var p = sampleProject(); p.deviceConfigs[0].overrides = { 'selftest.a': {} };
        T.assert(App.projectIo.serializeProject(p).indexOf('"overrides"') === -1, 'empty overrides should not serialize');
      });
      s.test('a non-applicable device override is pruned on load with a warning', function () {
        var p = sampleProject();
        p.deviceConfigs[0].overrides = { 'selftest.a': { k1: { action: 'x' }, zzz: { action: 'y' } } }; // zzz not in snapshot keys
        var r = App.projectIo.parseProject(JSON.stringify(p));

        T.assert(r.issues.some(function (i) { return i.severity === 'warning' && /zzz.*not applicable/.test(i.message); }), 'no prune warning');
      });

        var p = sampleProject();
        p.groups = [
          { id: 'g1', name: 'G1', deviceBaseIds: ['tab-active-5'], overrides: {} },
          { id: 'g2', name: 'G2', deviceBaseIds: ['tab-active-5', 's23'], overrides: {} }
        ];
        var r = App.projectIo.parseProject(JSON.stringify(p));
        T.assertEqual(r.ok, true);
        var g1 = r.value.groups.filter(function (g) { return g.id === 'g1'; })[0];
        var g2 = r.value.groups.filter(function (g) { return g.id === 'g2'; })[0];
        var inG1 = g1.deviceBaseIds.indexOf('tab-active-5') !== -1;
        var inG2 = g2.deviceBaseIds.indexOf('tab-active-5') !== -1;
        T.assert(inG1 !== inG2, 'tab-active-5 must be in exactly one group after prune');
        T.assert(r.issues.some(function (i) { return i.severity === 'warning' && /already in another group/.test(i.message); }), 'no single-group warning');
      });
      s.test('serialization deterministic across two calls (groups + overrides)', function () {
        var p = v3Sample();
        T.assertEqual(App.projectIo.serializeProject(p), App.projectIo.serializeProject(v3Sample()));
      });
    });

    T.suite('T10.2 App.overrides resolver', function (s) {
      // tab-active-5: selftest.a default k1={action:keep}; group 'rugged' override
      // k1={action:disable}; device override k1={action:remove}. k2 has no overrides.
      function proj(opts) {
        opts = opts || {};
        var p = sampleProject();
        p.groups = [{ id: 'rugged', name: 'Rugged', deviceBaseIds: ['tab-active-5'], overrides: {} }];
        if (opts.group) p.groups[0].overrides = { 'selftest.a': { k1: opts.group } };
        if (opts.device) p.deviceConfigs[0].overrides = { 'selftest.a': { k1: opts.device } };
        return p;
      }
      function k1(p) { return p.items['selftest.a'].filter(function (it) { return it.key === 'k1'; })[0]; }
      // NB: resolve App.overrides INSIDE each test — this suite is registered before
      // the overrides module loads, so capturing it at registration would be undefined.

      s.test('groupForDevice resolves by baseId', function () {
        var O = App.overrides;
        var p = proj();
        T.assertEqual(O.groupForDevice(p, 'tab-active-5').id, 'rugged');
        T.assertEqual(O.groupForDevice(p, 's23'), null);
      });
      s.test('precedence device > group > default', function () {
        var O = App.overrides;
        var p = proj({ group: { action: 'disable' }, device: { action: 'remove' } });
        var e = O.effectiveDecision(p, 'selftest.a', k1(p), 'tab-active-5');
        T.assertDeepEqual(e.decision, { action: 'remove' }); T.assertEqual(e.source, 'device');
        // drop the device override -> group wins
        delete p.deviceConfigs[0].overrides;
        var g = O.effectiveDecision(p, 'selftest.a', k1(p), 'tab-active-5');
        T.assertDeepEqual(g.decision, { action: 'disable' }); T.assertEqual(g.source, 'group');
        // drop the group override -> default wins
        p.groups[0].overrides = {};
        var d = O.effectiveDecision(p, 'selftest.a', k1(p), 'tab-active-5');
        T.assertDeepEqual(d.decision, { action: 'keep' }); T.assertEqual(d.source, 'default');
      });
      s.test('effectiveItem replaces decision; adapters stay override-blind', function () {
        var O = App.overrides;
        var p = proj({ device: { action: 'remove' } });
        var ei = O.effectiveItem(p, 'selftest.a', k1(p), 'tab-active-5');
        T.assertDeepEqual(ei.decision, { action: 'remove' });
        T.assertEqual(ei.key, 'k1', 'other fields preserved');

        T.assertEqual(O.classify(p, 'selftest.a', k1(p), 'tab-active-5'), 'device');

        p.deviceConfigs[0].overrides = { 'selftest.a': { k1: { action: 'disable' } } };
        T.assertEqual(O.classify(p, 'selftest.a', k1(p), 'tab-active-5'), 'group');

        delete p.deviceConfigs[0].overrides;
        T.assertEqual(O.classify(p, 'selftest.a', k1(p), 'tab-active-5'), 'group');

        p.groups[0].overrides = {};
        T.assertEqual(O.classify(p, 'selftest.a', k1(p), 'tab-active-5'), 'default');
      });
      s.test('deviceDeviations lists diverging applicable items with all three layers', function () {
        var O = App.overrides;
        var p = proj({ group: { action: 'disable' }, device: { action: 'remove' } });
        var devs = O.deviceDeviations(p, 'tab-active-5');
        T.assertEqual(devs.length, 1);
        T.assertEqual(devs[0].key, 'k1'); T.assertEqual(devs[0].source, 'device');
        T.assertDeepEqual(devs[0].defaultValue, { action: 'keep' });
        T.assertDeepEqual(devs[0].groupValue, { action: 'disable' });
        T.assertDeepEqual(devs[0].deviceValue, { action: 'remove' });
      });
      s.test('groupDeviations lists group overrides that differ from default', function () {
        var O = App.overrides;
        var p = proj({ group: { action: 'disable' } });
        var gd = O.groupDeviations(p, 'rugged');
        T.assertEqual(gd.length, 1);
        T.assertEqual(gd[0].key, 'k1'); T.assertEqual(gd[0].source, 'group');
        T.assertDeepEqual(gd[0].groupValue, { action: 'disable' });
      });
    });

    T.suite('store basics', function (s) {
      s.test('empty() seeds an item array per dataset', function () {
        ensureST();
        var p = App.store.empty(ST_PLATFORM_ID);
        T.assertDeepEqual(Object.keys(p.items).sort(), DS.slice().sort());
        T.assertEqual(p.deviceConfigs.length, 0);
      });
      s.test('init + getProject returns a deep clone (no external mutation)', function () {
        App.store.init(sampleProject());
        var a = App.store.getProject();
        a.items['selftest.a'][0].key = 'HACKED';
        var b = App.store.getProject();
        T.assertEqual(b.items['selftest.a'][0].key, 'k1', 'external mutation leaked into store');
      });
      s.test('onChange fires on init and unsubscribe works', function () {
        var count = 0;
        var off = App.store.onChange(function () { count++; });
        App.store.init(sampleProject());
        T.assertEqual(count, 1);
        off();
        App.store.init(sampleProject());
        T.assertEqual(count, 1, 'handler fired after unsubscribe');
      });
      s.test('_commit bumps modifiedUtc and marks dirty', function () {
        App.util.clock.setClock(function () { return new Date('2030-05-05T05:05:05.000Z'); });
        App.store.init(sampleProject());
        App.store._commit(function (p) { p.items['selftest.a'][1].description = 'edited'; });
        T.assertEqual(App.store.getProject().meta.modifiedUtc, '2030-05-05T05:05:05.000Z');
        T.assertEqual(App.store.isDirty(), true);
        App.util.clock.resetClock();
      });
    });

  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.adapters.android
   * PURPOSE: The Android (ADB) dataset adapters (spec Appendix B) + the two-layer
   *          shell-escaping helpers + tactical path/flatten/rebuild utilities.
   *          ALL Android/format-specific knowledge lives here; the rest of the app
   *          is platform-blind (spec §5, §5.4). No literal dataset-id branching
   *          exists outside this file.
   * PURITY:  pure (parse/generate are pure functions over plain data; no DOM/IO)
   * DEPENDS: App.util.html (esc, for report fragments), App.util.stable
   * INVARIANTS:
   *   * Keys / package tokens are charset-restricted at parse so ONLY values ever
   *     need shell escaping (spec §9, Appendix B).
   *   * Every data-derived value sent to the device shell is quoted through BOTH
   *     the PowerShell and POSIX layers — total over arbitrary bytes.
   *   * Tactical preserves JSON types; arrays of scalars are whole leaves.
   * ============================================================================= */
  (function (App) {
    'use strict';

    var esc = App.util.html.esc;
    var stableStringify = App.util.stable.stableStringify;

    // ---- review-12 #4: OPTIONAL trailing assignment-CSV columns -----------------
    // The packages decision CSV accepts two further columns after its required ones:
    // "rationale" (free text → the item's Rationale box) and "relevance" (→ the
    // Security Relevance column). Either may be omitted, but they must appear in
    // this order and be named exactly.
    var OPTIONAL_ASSIGN_COLS = ['rationale', 'relevance'];

    /**
     * Validate a decision-CSV header that is `required` followed by 0..2 optional cols.
     * @param {string[]} header  trimmed header cells
     * @param {string[]} required
     * @returns {{ok:boolean, extras:string[], expected:string}}
     */
    function checkAssignHeader(header, required) {
      var out = { ok: false, extras: [], expected: required.join(',') + '[,' + OPTIONAL_ASSIGN_COLS.join('[,') + ']]' };
      if (!header || header.length < required.length || header.length > required.length + OPTIONAL_ASSIGN_COLS.length) return out;
      for (var i = 0; i < required.length; i++) if (header[i] !== required[i]) return out;
      for (var j = required.length; j < header.length; j++) {
        if (header[j] !== OPTIONAL_ASSIGN_COLS[j - required.length]) return out;
        out.extras.push(header[j]);
      }
      out.ok = true;
      return out;
    }

    /**
     * Read the optional trailing cells of a data row into an assignment `fields` patch.
     * A relevance cell is upper-cased and validated against the closed vocabulary;
     * an empty cell explicitly CLEARS the field.
     * @returns {{fields:Object, error:?string}}
     */
    function readOptionalAssignFields(row, firstOptionalIndex, extras) {
      var fields = {}, error = null;
      extras.forEach(function (name, n) {
        var raw = row[firstOptionalIndex + n];
        if (raw === undefined) return;                     // short row: column simply absent
        if (name === 'rationale') { fields.rationale = String(raw); return; }
        var rel = String(raw).trim().toUpperCase();
        if (rel !== '' && App.projectIo.RELEVANCE_OPTIONS.indexOf(rel) === -1) {
          error = 'Invalid relevance "' + String(raw).trim() + '" (expected empty, ' + App.projectIo.RELEVANCE_OPTIONS.join(', ') + ').';
          return;
        }
        fields.relevance = rel;
      });
      return { fields: fields, error: error };
    }

    /** Resolve an item's control ids to control titles via ctx.project.controls (§18.3). */
    function controlTitles(refs, ctx) {
      var by = {}; ((ctx && ctx.project && ctx.project.controls) || []).forEach(function (c) { by[c.id] = c.title; });
      return (refs || []).map(function (r) { return by[r] || r; }).join(', ');
    }

    // ---- Injection-safety: two-layer shell quoting (spec Appendix B, MUST) -----
    /**
     * PowerShell single-quoted literal: wrap in ' … ', double embedded single quotes.
     * @param {*} s @returns {string}
     */
    function psSingleQuote(s) { return "'" + String(s).replace(/'/g, "''") + "'"; }
    /**
     * POSIX-shell single-quoted literal: wrap in ' … ', replace each ' with '\'' .
     * @param {*} s @returns {string}
     */
    function shSingleQuote(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }

    // ---- Tactical path helpers (spec §8.2) -------------------------------------
    /**
     * Parse a dotted/bracketed path into segments.
     * @param {string} path e.g. 'radios[0].mode'
     * @returns {Array<{key?:string,index?:number}>}
     */
    function parsePath(path) {
      var segs = [], re = /([^.\[\]]+)|\[(\d+)\]/g, m;
      while ((m = re.exec(path)) !== null) {
        if (m[2] !== undefined) segs.push({ index: parseInt(m[2], 10) });
        else segs.push({ key: m[1] });
      }
      return segs;
    }
    function segKey(s) { return s.key !== undefined ? s.key : s.index; }

    /** Set a value at a path within obj, creating intermediate containers. */
    function setAtPath(obj, segs, value) {
      var cur = obj;
      for (var i = 0; i < segs.length - 1; i++) {
        var k = segKey(segs[i]);
        if (cur[k] === undefined || cur[k] === null) cur[k] = (segs[i + 1].index !== undefined) ? [] : {};
        cur = cur[k];
      }
      cur[segKey(segs[segs.length - 1])] = value;
    }
    /** Read a value at a path (undefined if any segment is missing). */
    function getAtPath(obj, segs) {
      var cur = obj;
      for (var i = 0; i < segs.length; i++) { if (cur == null) return undefined; cur = cur[segKey(segs[i])]; }
      return cur;
    }
    // A `policyList` (spec/review-3 #3) is an array of {name, checked} objects where
    // `name` is the policy identity and `checked` is its (boolean) setting.
    function isPolicyObj(o) { return o && typeof o === 'object' && !Array.isArray(o) && ('name' in o) && ('checked' in o); }
    function isPolicyArray(arr) { return Array.isArray(arr) && arr.length > 0 && arr.every(isPolicyObj); }

    // ---- imsSettings: a per-SIM-slot toggle that is OPTIONAL in the upload -------
    // (review-17 #4) Knox tactical exports omit `imsSettings` unless it has been
    // touched, but the per-slot IMS toggle is still a real, decidable setting. So:
    //  - the PARSER injects the default block when the uploaded document has no
    //    `imsSettings` at all (so it is optional whether the JSON carries it), and
    //  - the FLATTENER keys it by SLOT, not by array index:
    //      imsSettings.simSlot0.enabled
    //    because `simSlotId` is the slot's identity, not a decision — exactly as
    //    `policyList`'s `name` is (review-3 #3). Rebuild mirrors both rules and
    //    re-creates the block on a template that predates it.
    var IMS_KEY = 'imsSettings';
    /** `[<base>.]imsSettings.simSlot<N>.enabled` -> [ , base, N ] */
    var IMS_KEY_RE = /^(?:(.*)\.)?imsSettings\.simSlot(\d+)\.enabled$/;
    /** The Samsung default: both SIM slots present, IMS disabled. */
    function imsDefaultBlock() { return [{ enabled: false, simSlotId: 0 }, { enabled: false, simSlotId: 1 }]; }
    function isImsObj(o) {
      return o && typeof o === 'object' && !Array.isArray(o) &&
        ('enabled' in o) && typeof o.simSlotId === 'number';
    }
    function isImsArray(arr) { return Array.isArray(arr) && arr.length > 0 && arr.every(isImsObj); }
    /**
     * Add the default `imsSettings` block to a tactical document that omits it.
     * A document that already carries the key is left alone — whatever its shape —
     * so a Knox export is never second-guessed.
     * @param {*} doc mutated in place
     * @returns {boolean} true if the default block was injected
     */
    function ensureImsSettings(doc) {
      if (!doc || typeof doc !== 'object' || Array.isArray(doc)) return false;
      if (Object.prototype.hasOwnProperty.call(doc, IMS_KEY)) return false;
      doc[IMS_KEY] = imsDefaultBlock();
      return true;
    }

    function isScalar(v) { return v === null || typeof v !== 'object'; }
    function jsType(v) {
      if (v === null) return 'null';
      if (typeof v === 'boolean') return 'bool';
      if (typeof v === 'number') return Number.isInteger(v) ? 'int' : 'float';
      return 'string';
    }

    /**
     * Flatten a tactical JSON document into leaf items (spec §8.2).
     * Rules: objects recurse (.key); arrays whose elements are ALL scalars (or
     * empty) are WHOLE leaves; arrays containing objects/arrays recurse ([i]);
     * scalars (incl. null) are leaves. JSON types are preserved.
     * @param {*} doc
     * @returns {Array<{key:string,value:*,type:string}>}
     */
    function flattenTactical(doc) {
      var leaves = [];
      (function walk(node, path) {
        if (isScalar(node)) { leaves.push({ key: path, value: node, type: jsType(node) }); return; }
        if (Array.isArray(node)) {
          if (node.length === 0 || node.every(isScalar)) { leaves.push({ key: path, value: node, type: 'array' }); return; }
          for (var i = 0; i < node.length; i++) walk(node[i], path + '[' + i + ']');
          return;
        }
        // plain object
        var keys = Object.keys(node);
        for (var j = 0; j < keys.length; j++) {
          var k = keys[j], childPath = path ? path + '.' + k : k;
          // policyList special-case (review-3 #3): one leaf per policy, keyed (for
          // STORAGE/ROUTING) by `…policyList.<name>` and valued by `checked` (e.g.
          // {name:'Disable Bluetooth', checked:false} -> key 'policyList.Disable
          // Bluetooth' = false). Rebuild mirrors this. The `policyList.` segment is a
          // stable internal identity; it is stripped for DISPLAY only via
          // `tactical.displayKey` (review-4 #1) so it never collides with sibling
          // keys nor breaks already-saved projects.
          if (k === 'policyList' && isPolicyArray(node[k])) {
            node[k].forEach(function (pol) { leaves.push({ key: childPath + '.' + pol.name, value: pol.checked, type: jsType(pol.checked) }); });
            continue;
          }
          // imsSettings special-case (review-17 #4): one leaf per SIM slot, keyed by
          // simSlotId and valued by `enabled`, so the slot id is never a decision.
          if (k === IMS_KEY && isImsArray(node[k])) {
            node[k].forEach(function (ims) {
              leaves.push({ key: childPath + '.simSlot' + ims.simSlotId + '.enabled', value: ims.enabled, type: jsType(ims.enabled) });
            });
            continue;
          }
          walk(node[k], childPath);
        }
      })(doc, '');
      return leaves;
    }

    /**
     * Strip the `policyList.` segment from a tactical key for DISPLAY only
     * (review-4 #1): `policyList.Disable Bluetooth` -> `Disable Bluetooth`, and a
     * nested `foo.policyList.Bar` -> `foo.Bar`. The STORED/routed key keeps the
     * segment, so this is purely cosmetic and never affects rebuild, storage, or
     * already-saved projects. Idempotent on keys without the segment.
     * @param {string} key
     * @returns {string}
     */
    function stripPolicyPrefix(key) {
      if (typeof key !== 'string') return key;
      if (key.indexOf('policyList.') === 0) return key.slice('policyList.'.length);
      var m = key.indexOf('.policyList.');
      if (m >= 0) return key.slice(0, m) + '.' + key.slice(m + '.policyList.'.length);
      return key;
    }

    /**
     * Rebuild a tactical document by applying decided values onto a deep clone of
     * the template (spec §8.2). Untouched keys/types/nesting/arrays are preserved.
     * @param {*} template
     * @param {RegisterItem[]} items  Only non-null decisions are applied.
     * @returns {*} the rebuilt document object
     */
    function rebuildTacticalDoc(template, items) {
      var doc = JSON.parse(JSON.stringify(template));
      items.forEach(function (it) {
        if (!it.decision || !Object.prototype.hasOwnProperty.call(it.decision, 'value')) return;
        // policyList items (review-3 #3): set the matching policy's `checked` by name.
        var arrPath = null, polName = null;
        if (it.key.indexOf('policyList.') === 0) { arrPath = 'policyList'; polName = it.key.slice('policyList.'.length); }
        else { var mk = it.key.indexOf('.policyList.'); if (mk >= 0) { arrPath = it.key.slice(0, mk) + '.policyList'; polName = it.key.slice(mk + '.policyList.'.length); } }
        if (arrPath !== null) {
          var arr = getAtPath(doc, parsePath(arrPath));
          if (Array.isArray(arr)) { var pol = arr.filter(function (p) { return p && p.name === polName; })[0]; if (pol) { pol.checked = it.decision.value; return; } }
        }
        // imsSettings items (review-17 #4): set the matching slot's `enabled`, creating
        // the block/slot when the template predates it (the key is optional on upload).
        var imsM = IMS_KEY_RE.exec(it.key);
        if (imsM) {
          var imsPath = imsM[1] ? imsM[1] + '.' + IMS_KEY : IMS_KEY;
          var slot = parseInt(imsM[2], 10);
          var imsArr = getAtPath(doc, parsePath(imsPath));
          if (!Array.isArray(imsArr)) { imsArr = []; setAtPath(doc, parsePath(imsPath), imsArr); }
          var ent = imsArr.filter(function (x) { return x && x.simSlotId === slot; })[0];
          if (ent) ent.enabled = it.decision.value;
          else {
            imsArr.push({ enabled: it.decision.value, simSlotId: slot });
            imsArr.sort(function (a, b) { return (a.simSlotId || 0) - (b.simSlotId || 0); });
          }
          return;
        }
        setAtPath(doc, parsePath(it.key), it.decision.value);
      });
      return doc;
    }

    // ===========================================================================
    // android.packages
    // ===========================================================================
    var PKG_TOKEN_RE = /^[A-Za-z0-9._]+$/;

    var packages = {
      id: 'android.packages',
      label: 'Packages',
      inputKind: 'text',
      captureHint: 'adb -s <serial> shell pm list packages  >  pm_list.txt',

      /** @param {string} raw @returns {ParseResult} */
      parse: function (raw) {
        var warnings = [], errors = [], seen = {}, keys = [];
        var lines = String(raw).split(/\r?\n/);
        var anyToken = false;
        lines.forEach(function (line, idx) {
          var loc = 'line ' + (idx + 1);
          var s = line.trim();
          if (s === '' || s.charAt(0) === '#') return;       // blank / comment
          if (s.indexOf('package:') === 0) s = s.slice('package:'.length);
          var eq = s.indexOf('=');
          if (eq !== -1) s = s.slice(0, eq);                  // strip =path/installer
          s = s.trim();
          if (s === '') return;
          if (!PKG_TOKEN_RE.test(s)) {
            errors.push({ category: 'parse', severity: 'error', message: 'Not a valid package token: "' + s + '".', location: loc, fix: 'Package names may contain only letters, digits, "." and "_".' });
            return;
          }
          anyToken = true;
          if (seen[s]) { warnings.push({ category: 'parse', severity: 'warning', message: 'Duplicate package "' + s + '" ignored.', location: loc }); return; }
          seen[s] = true; keys.push(s);
        });
        if (!anyToken && errors.length === 0) {
          errors.push({ category: 'parse', severity: 'error', message: 'No packages found (file empty or all blank/comment).', location: 'file', fix: 'Provide one package per line.' });
        }
        keys.sort();
        return { items: keys.map(function (k) { return { key: k }; }), keys: keys, warnings: warnings, errors: errors };
      },

      decisionSchema: [{ name: 'action', kind: 'enum', options: ['keep', 'disable', 'remove'], required: true }],

      /** @param {RegisterItem} item @returns {Issue[]} */
      validateDecision: function (item) {
        var d = item.decision;
        if (d === null) return [];
        if (['keep', 'disable', 'remove'].indexOf(d.action) === -1) {
          return [{ category: 'validation', severity: 'error', message: 'action must be keep, disable, or remove.', location: item.key }];
        }
        return [];
      },
      /** @param {RegisterItem} item @returns {boolean} */
      isComplete: function (item) {
        return item.decision !== null && this.validateDecision(item).every(function (i) { return i.severity !== 'error'; });
      },

      columns: [
        { key: 'key', label: 'Package', get: function (it) { return it.key; } },
        { key: 'description', label: 'Description', get: function (it) { return it.description || ''; } },
        { key: 'decision', label: 'Action', get: function (it) { return it.decision ? it.decision.action : ''; } },
        { key: 'controlRefs', label: 'Control Refs', get: function (it) { return (it.controlRefs || []).join(', '); } }
      ],

      generateImplementation: function (items, ctx) {
        var lines = ['# Packages — implementation', '# Idempotent: each action guards on current package state.', ''];
        items.slice().sort(byKey).forEach(function (it) {
          var pkg = it.key; // charset-safe (parse-restricted) -> no escaping needed
          if (!it.decision) return;
          if (it.decision.action === 'keep') { lines.push('# keep ' + pkg + ' (no-op)'); return; }
          if (it.decision.action === 'disable') {
            lines.push('if (Test-PackagePresent ' + psSingleQuote(pkg) + ') {');
            lines.push('  adb -s $Serial shell pm disable-user --user 0 ' + psSingleQuote(pkg));
            lines.push('}');
          } else if (it.decision.action === 'remove') {
            lines.push('if (Test-PackagePresent ' + psSingleQuote(pkg) + ') {');
            lines.push('  adb -s $Serial shell pm uninstall --user 0 ' + psSingleQuote(pkg));
            lines.push('}');
          }
        });
        return [{ name: 'packages.impl.ps1', content: lines.join('\n') }];
      },
      generateVerification: function (items, ctx) {
        var lines = ['# Packages — verification (PASS/FAIL/MISSING)', ''];
        items.slice().sort(byKey).forEach(function (it) {
          if (!it.decision) return;
          lines.push('Verify-Package ' + psSingleQuote(it.key) + ' ' + psSingleQuote(it.decision.action));
        });
        return [{ name: 'packages.verify.ps1', content: lines.join('\n') }];
      },
      // Declarative report metadata (spec §20.3): post-key columns (incl. Description,
      // report-gen #1) + a group split by action (GEN-2).
      reportGroups: { field: 'action', options: [{ value: 'remove', label: 'Removed' }, { value: 'disable', label: 'Disabled' }, { value: 'keep', label: 'Kept' }] },
      reportColumns: [
        { id: 'description', label: 'Description', optional: true, w: 3, get: function (it) { return it.description || ''; } },
        { id: 'action', label: 'Action', optional: true, w: 1, get: function (it) { return it.decision ? it.decision.action : ''; } },
        { id: 'control', label: 'Control', optional: true, w: 2, get: function (it, ctx) { return controlTitles(it.controlRefs, ctx); } },
        { id: 'rationale', label: 'Rationale', optional: true, w: 3, get: function (it) { return it.rationale || ''; } }
      ],
      renderReportSection: function (items, ctx, opts) {
        return App.report.buildSection('Packages', { label: 'Package', w: 2, get: function (it) { return it.key; } }, this.reportColumns, items, opts || {}, ctx, this.reportGroups);
      },
      // ---- bulk assignment (spec §18.2): a CSV of package,action,description ----
      assignmentHint: 'CSV with a header row starting exactly "package,action,description", optionally followed by "rationale" and then "relevance". Column 1 = package name (a leading "package:" is allowed), column 2 = keep|disable|remove, column 3 = description (may be quoted / contain commas), column 4 (optional) = rationale, column 5 (optional) = HIGH|MEDIUM|CONTEXT|REPORTING|IRRELEVANT (or blank).',
      /** @param {string} raw @returns {{assignments:Array,warnings:Issue[],errors:Issue[]}} */
      parseAssignment: function (raw) {
        var rows = parseCsv(raw), errors = [], warnings = [], assignments = [], seen = {};
        if (!rows.length) { return { assignments: [], warnings: [], errors: [{ category: 'parse', severity: 'error', message: 'Empty CSV.', location: 'file' }] }; }
        var header = rows[0].map(function (h) { return String(h).trim(); });
        // review-12 #4: 3 required columns + optional "rationale" and "relevance".
        var hdr = checkAssignHeader(header, ['package', 'action', 'description']);
        if (!hdr.ok) {
          return { assignments: [], warnings: [], errors: [{ category: 'parse', severity: 'error', message: 'Header row must be "package,action,description" (optionally followed by "rationale" and "relevance").', location: 'line 1', fix: 'Set the first row to: ' + hdr.expected }] };
        }
        for (var i = 1; i < rows.length; i++) {
          var r = rows[i], loc = 'line ' + (i + 1);
          if (r.length === 1 && String(r[0]).trim() === '') continue; // blank line
          if (r.length < 3) { errors.push({ category: 'parse', severity: 'error', message: 'Expected at least 3 columns.', location: loc }); continue; }
          var pkg = String(r[0]).trim();
          if (pkg.indexOf('package:') === 0) pkg = pkg.slice('package:'.length).trim();
          var action = String(r[1]).trim().toLowerCase(), desc = String(r[2]);
          if (!PKG_TOKEN_RE.test(pkg)) { errors.push({ category: 'parse', severity: 'error', message: 'Invalid package token "' + pkg + '".', location: loc }); continue; }
          if (['keep', 'disable', 'remove'].indexOf(action) === -1) { errors.push({ category: 'parse', severity: 'error', message: 'Invalid action "' + r[1] + '" (keep|disable|remove).', location: loc }); continue; }
          if (seen[pkg]) { errors.push({ category: 'parse', severity: 'error', message: 'Duplicate package "' + pkg + '".', location: loc }); continue; }
          var opt = readOptionalAssignFields(r, 3, hdr.extras);
          if (opt.error) { errors.push({ category: 'parse', severity: 'error', message: opt.error, location: loc }); continue; }
          seen[pkg] = true;
          var fields = { description: desc };
          Object.keys(opt.fields).forEach(function (k) { fields[k] = opt.fields[k]; });
          assignments.push({ key: pkg, decision: { action: action }, fields: fields });
        }
        if (!assignments.length && !errors.length) errors.push({ category: 'parse', severity: 'error', message: 'No package rows found.', location: 'file' });
        return { assignments: assignments, warnings: warnings, errors: errors };
      }
    };

    // ===========================================================================
    // android.tactical
    //
    // Apply model (confirmed with the team, 2026-06): the tactical config is applied
    // by MANUALLY UPLOADING the emitted JSON into Knox tactical — there is NO adb/
    // PowerShell push step. So the implementation output is simply the rebuilt JSON,
    // in the SAME structure/format as the captured input (object shape, nesting,
    // arrays, and JSON types all preserved by rebuildTacticalDoc).
    // ===========================================================================
    var tactical = {
      id: 'android.tactical',
      label: 'Tactical',
      inputKind: 'json',
      captureHint: 'Export the Knox tactical configuration as a JSON document; the tool emits an updated JSON in the same format to re-upload to Knox.',

      /** @param {string} raw @returns {ParseResult} */
      parse: function (raw) {
        var warnings = [], errors = [];
        var doc;
        try { doc = JSON.parse(raw); }
        catch (e) {
          return { items: [], keys: [], warnings: [], errors: [{ category: 'parse', severity: 'error', message: 'Invalid JSON: ' + e.message, location: 'file', fix: 'Provide a valid JSON document.' }] };
        }
        // The tactical document MUST have an object root. A top-level array/scalar
        // would flatten to an un-pathable empty-key leaf and break rebuild (D-002).
        if (doc === null || typeof doc !== 'object' || Array.isArray(doc)) {
          return { items: [], keys: [], warnings: [], errors: [{ category: 'parse', severity: 'error', message: 'Tactical root must be a JSON object.', location: 'file', fix: 'Wrap top-level values in an object, e.g. {"config": ...}.' }] };
        }
        if (doc && typeof doc === 'object' && !Array.isArray(doc) && Object.keys(doc).length === 0) {
          warnings.push({ category: 'parse', severity: 'warning', message: 'Tactical document is an empty object.', location: 'file' });
        }
        // review-17 #4: `imsSettings` is OPTIONAL in the uploaded JSON. When it is
        // absent the Samsung default block is added, so the per-SIM IMS toggle is
        // always available to decide (and always present in the emitted JSON).
        if (ensureImsSettings(doc)) {
          warnings.push({
            category: 'parse', severity: 'warning',
            message: 'imsSettings was not in the uploaded document — the default block (both SIM slots, IMS disabled) was added.',
            location: 'file'
          });
        }
        var leaves = flattenTactical(doc);
        var keys = leaves.map(function (l) { return l.key; }).sort();
        return {
          items: leaves.map(function (l) { return { key: l.key, defaultValue: l.value, valueType: l.type }; }),
          keys: keys, warnings: warnings, errors: errors, template: doc
        };
      },

      decisionSchema: [{ name: 'value', kind: 'value-typed', required: true }],

      validateDecision: function (item) {
        var d = item.decision;
        if (d === null) return [];
        if (!Object.prototype.hasOwnProperty.call(d, 'value')) {
          return [{ category: 'validation', severity: 'error', message: 'value is required.', location: item.key }];
        }
        return [];
      },
      isComplete: function (item) {
        return item.decision !== null && this.validateDecision(item).every(function (i) { return i.severity !== 'error'; });
      },

      // Strip the internal `policyList.` segment for human-facing key display
      // (review-4 #1). Storage/routing keys are unaffected.
      displayKey: stripPolicyPrefix,

      columns: [
        { key: 'key', label: 'Path', get: function (it) { return stripPolicyPrefix(it.key); } },
        { key: 'description', label: 'Description', get: function (it) { return it.description || ''; } },
        { key: 'decision', label: 'Value', get: function (it) { return it.decision ? stableStringify(it.decision.value) : ''; } },
        { key: 'controlRefs', label: 'Control Refs', get: function (it) { return (it.controlRefs || []).join(', '); } }
      ],

      /** Rebuild the tactical.json artifact from a retained template (spec §5.1). */
      rebuildArtifact: function (template, items) {
        var doc = rebuildTacticalDoc(template, items);
        return { name: 'tactical.json', content: stableStringify(doc) };
      },
      generateImplementation: function (items, ctx) {
        // Implementation = the rebuilt JSON ONLY (manually uploaded to Knox tactical).
        // No push script / TODO — applying is a single manual Knox upload step.
        var template = ctx && ctx.device && ctx.device.snapshots && ctx.device.snapshots['android.tactical']
          ? ctx.device.snapshots['android.tactical'].template : {};
        return [this.rebuildArtifact(template || {}, items)];
      },
      generateVerification: function (items, ctx) {
        // Tactical is verified by inspecting Knox after upload — there is no adb
        // read-back. Emit a NON-script evidence note (so it is not adb-wrapped),
        // marking each decided item EVIDENCED (spec §10.2 EVIDENCED semantics).
        var lines = ['Tactical — verification (EVIDENCED)',
          'Applied by manual upload of tactical.json to Knox tactical; confirm in the Knox console.', ''];
        items.slice().sort(byKey).forEach(function (it) {
          if (!it.decision) return;
          // Show the human-facing policy name (review-4 #1), consistent with the report.
          lines.push('EVIDENCED ' + stripPolicyPrefix(it.key) + ' = ' + stableStringify(it.decision.value));
        });
        return [{ name: 'tactical.verify.txt', content: lines.join('\n') }];
      },

      /**
       * Bring a snapshot captured BEFORE `imsSettings` was modelled up to the guarantee
       * the parser now makes (review-17 #4): the block is part of every tactical
       * snapshot. Without this, a device onboarded earlier has no imsSettings keys, so
       * a tactical import on the Devices tab is rejected — the file (which the parser
       * completes) carries two keys the device does not list as applicable.
       * Called by the project loader; safe and idempotent on an already-complete snapshot.
       * @param {Snapshot} snap  mutated in place
       * @returns {string[]} the keys that were added (empty when there was nothing to do)
       */
      completeSnapshot: function (snap) {
        if (!snap || snap.template === undefined || snap.template === null) return [];
        if (!Array.isArray(snap.keys)) return [];
        ensureImsSettings(snap.template);
        var added = [];
        flattenTactical(snap.template).forEach(function (l) {
          if (IMS_KEY_RE.test(l.key) && snap.keys.indexOf(l.key) === -1) { snap.keys.push(l.key); added.push(l.key); }
        });
        if (added.length) snap.keys.sort();
        return added;
      },

      // Single-table dataset; Path key strips the policyList prefix (RV4-1); Description kept.
      reportColumns: [
        { id: 'description', label: 'Description', optional: true, w: 3, get: function (it) { return it.description || ''; } },
        { id: 'value', label: 'Value', optional: true, w: 2, get: function (it) { return it.decision ? stableStringify(it.decision.value) : ''; } },
        { id: 'control', label: 'Control', optional: true, w: 2, get: function (it, ctx) { return controlTitles(it.controlRefs, ctx); } },
        { id: 'rationale', label: 'Rationale', optional: true, w: 2, get: function (it) { return it.rationale || ''; } }
      ],
      renderReportSection: function (items, ctx, opts) {
        return App.report.buildSection('Tactical', { label: 'Path', w: 2, get: function (it) { return stripPolicyPrefix(it.key); } }, this.reportColumns, items, opts || {}, ctx, null);
      },
      /** Captured value/type per leaf path, to prefill the decision editor (UI only). */
      capturedDefaults: function (snap) {
        var out = {};
        if (snap && snap.template !== undefined) flattenTactical(snap.template).forEach(function (l) { out[l.key] = { value: l.value, type: l.type }; });
        return out;
      },
      // ---- bulk assignment (spec §18.2): reuse the JSON parser; value/type per leaf ----
      assignmentHint: 'Tactical/Knox JSON document (same object format as captured). Each leaf value/type is applied.',
      parseAssignment: function (raw) {
        var pr = this.parse(raw);
        if (pr.errors.length) return { assignments: [], warnings: pr.warnings, errors: pr.errors };
        return { assignments: pr.items.map(function (it) { return { key: it.key, decision: { value: it.defaultValue } }; }), warnings: pr.warnings, errors: pr.errors };
      }
    };

    function byKey(a, b) { return a.key < b.key ? -1 : a.key > b.key ? 1 : 0; }

    var parseCsv = App.util.csv.parseCsv; // shared RFC-4180 parser

    App.adapters = App.adapters || {};
    App.adapters.android = {
      packages: packages, tactical: tactical,
      psSingleQuote: psSingleQuote, shSingleQuote: shSingleQuote,
      parsePath: parsePath, setAtPath: setAtPath, flattenTactical: flattenTactical,
      rebuildTacticalDoc: rebuildTacticalDoc, stripPolicyPrefix: stripPolicyPrefix,
      ensureImsSettings: ensureImsSettings, imsDefaultBlock: imsDefaultBlock
    };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.platforms.androidAdb
   * PURPOSE: Assemble the Android (ADB) PlatformProfile from its dataset adapters
   *          plus platform-level output conventions (spec Appendix B). This is the
   *          ONLY place that knows the script language is PowerShell.
   * PURITY:  pure
   * DEPENDS: App.adapters.android
   * INVARIANTS: preamble/postamble are deterministic functions of ctx.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var A = App.adapters.android;

    function scriptPreamble(ctx) {
      var d = ctx.device;
      return [
        '# =============================================================',
        '# CH Config Tool ' + ctx.toolVersion + ' — generated PowerShell',
        '# Project device: ' + d.name + '  Model: ' + d.model + '  Firmware: ' + d.firmware,
        '# Generated (AEST): ' + App.util.clock.toAest(ctx.generatedUtc),  // review-9 #3
        '# =============================================================',
        'Set-StrictMode -Version Latest',
        '$ErrorActionPreference = "Stop"',
        '',
        '# --- ADB on PATH (READ THIS IF YOU GET "adb not found on PATH") ---',
        '# If you PASTE this script into a PowerShell window (instead of running the',
        '# .ps1 file), note that PowerShell does NOT search the current folder for',
        '# adb.exe the way cmd does — so a bare "adb" fails even when you opened',
        '# PowerShell inside the platform-tools folder. To fix, add the folder that',
        '# contains adb.exe to PATH for THIS session: uncomment ONE line below',
        '# (edit the path if adb.exe lives elsewhere), then paste the rest.',
        '#   $env:PATH += ";$PWD"                  # PowerShell was opened IN the platform-tools folder',
        '#   $env:PATH += ";C:\\platform-tools"    # explicit path to the folder holding adb.exe',
        '',
        '# --- ADB presence check ---',
        'if (-not (Get-Command adb -ErrorAction SilentlyContinue)) { throw "adb not found on PATH." }',
        '',
        '# --- Single target-device guard ---',
        '$devices = @((adb devices) | Select-String -Pattern "\\tdevice$")',  // @() forces an array so .Count is valid under StrictMode even for a single match
        'if ($devices.Count -ne 1) { throw "Exactly one ADB device must be attached (found $($devices.Count))." }',
        '$Serial = ($devices[0].ToString() -split "\\t")[0]',
        '',
        '# --- Helpers ---',
        'function Test-PackagePresent($pkg) { return $true }  # presence guard placeholder; refine per fleet policy',
        'function Verify-Package($pkg, $action) { Write-Output "CHECK package $pkg expect $action" }',
        '',
        'Start-Transcript -Path ("ch-" + $Serial + ".log") -Append | Out-Null',
        ''
      ].join('\n');
    }

    function scriptPostamble(ctx) {
      return ['', '# --- End ---', 'Stop-Transcript | Out-Null'].join('\n');
    }

    /**
     * A "how to run" comment block prepended to each generated script (review-9 #4).
     * Includes the exact command for THIS file's emitted name.
     * @param {string} name  the emitted filename (e.g. "packages.impl.ps1")
     */
    function runInstructions(name) {
      var isTxt = /\.txt$/.test(name);
      return [
        '# =============================================================',
        '# HOW TO RUN THIS SCRIPT (Windows + ADB / platform-tools)',
        '#   1. Enable USB debugging on the device and connect it by USB.',
        '#   2. In File Explorer, open the folder that contains adb.exe',
        '#      (the Android platform-tools folder); put this file there.',
        '#   3. Click the File Explorer address bar, type  cmd  and press',
        '#      Enter — a Command Prompt opens in that folder.',
        '#   4. Run this file with:',
        '#        powershell -ExecutionPolicy Bypass -File .\\' + name,
        (isTxt ? '#      (This file has a .txt extension — rename it to .ps1 first.)' : '#'),
        '#',
        '#   ALTERNATIVELY, if you paste the script CONTENTS into a PowerShell',
        '#   window: PowerShell will not find adb.exe in the current folder the way',
        '#   cmd does. Before pasting, add the platform-tools folder to PATH for the',
        '#   session (see the "ADB on PATH" note in the script body), e.g.:',
        '#        $env:PATH += ";$PWD"     # when PowerShell is open in that folder',
        '# =============================================================',
        ''
      ].join('\n');
    }

    var captureInstructions =
      'Capture two files from the target device (the tool never contacts a device):\n' +
      '  1. Packages (packages.txt): adb -s <serial> shell pm list packages\n' +
      '       (one "package:<name>" per line)\n' +
      '  2. Tactical (policy json): export the device tactical/policy configuration as a JSON object';

    App.platforms = App.platforms || {};
    App.platforms.androidAdb = {
      id: 'android-adb',
      label: 'Android (ADB)',
      outputLanguage: 'powershell',
      scriptExtension: '.ps1',   // generator wraps these files with preamble/postamble
      datasets: [A.packages, A.tactical],
      captureInstructions: captureInstructions,
      scriptPreamble: scriptPreamble,
      scriptPostamble: scriptPostamble,
      runInstructions: runInstructions
    };
  })(App);
  </script>

  <!-- ===== PHASE-2 SELF-TEST SUITES (Android adapters) ===== -->
  <script>
  (function (App) {
    'use strict';
    var T = App.test;
    var A = App.adapters.android;

    T.suite('android.packages parse', function (s) {
      s.test('strips package: prefix, =path, dedupes, sorts', function () {
        var r = A.packages.parse('package:com.b\npackage:com.a=/data/app/a\ncom.a\n# comment\n\n');
        T.assertDeepEqual(r.keys, ['com.a', 'com.b']);
        T.assertEqual(r.errors.length, 0);
        T.assertEqual(r.warnings.length, 1); // duplicate com.a
      });
      s.test('empty file errors', function () {
        var r = A.packages.parse('\n\n# only comments\n');
        T.assertEqual(r.errors.length, 1);
      });
      s.test('line with a space errors (malformed token)', function () {
        var r = A.packages.parse('com.foo bar');
        T.assert(r.errors.some(function (e) { return /valid package token/.test(e.message); }));
      });
    });

    T.suite('android.tactical flatten/rebuild', function (s) {
      var doc = {
        radios: [{ mode: 'a' }, { mode: 'b' }],
        enabled: true,
        dns: ['1.1.1.1', '8.8.8.8'],
        count: 3, ratio: 1.5, name: 'x',
        nested: { deep: { flag: false } }
      };
      s.test('flatten produces expected leaves & types', function () {
        var leaves = A.flattenTactical(doc);
        var byKey = {};
        leaves.forEach(function (l) { byKey[l.key] = l; });
        T.assertEqual(byKey['radios[0].mode'].value, 'a');
        T.assertEqual(byKey['enabled'].type, 'bool');
        T.assertEqual(byKey['dns'].type, 'array');
        T.assertDeepEqual(byKey['dns'].value, ['1.1.1.1', '8.8.8.8']);
        T.assertEqual(byKey['count'].type, 'int');
        T.assertEqual(byKey['ratio'].type, 'float');
        T.assertEqual(byKey['nested.deep.flag'].value, false);
      });
      s.test('rebuild from decided values round-trips to original', function () {
        var leaves = A.flattenTactical(doc);
        var items = leaves.map(function (l) { return { key: l.key, decision: { value: l.value, type: l.type }, controlRefs: [], status: 'decided' }; });
        var rebuilt = A.rebuildTacticalDoc(doc, items);
        T.assertEqual(App.util.stable.stableStringify(rebuilt), App.util.stable.stableStringify(doc));
      });
      s.test('rebuild preserves untouched keys (partial decisions)', function () {
        var rebuilt = A.rebuildTacticalDoc(doc, [{ key: 'count', decision: { value: 9, type: 'int' }, controlRefs: [], status: 'decided' }]);
        T.assertEqual(rebuilt.count, 9);
        T.assertEqual(rebuilt.enabled, true); // untouched
        T.assertEqual(rebuilt.nested.deep.flag, false);
      });
      s.test('invalid JSON errors', function () {
        var r = A.tactical.parse('{ bad ');
        T.assertEqual(r.errors.length, 1);
      });
      s.test('non-object root rejected (D-002)', function () {
        T.assert(A.tactical.parse('[1,2,3]').errors.some(function (e) { return /root must be a JSON object/.test(e.message); }));
        T.assert(A.tactical.parse('5').errors.length === 1);
        T.assert(A.tactical.parse('"x"').errors.length === 1);
      });
      s.test('type fidelity: bool/number preserved as JSON types', function () {
        var r = A.tactical.parse('{"a":true,"b":2}');
        var item = { key: 'a', decision: { value: true, type: 'bool' }, controlRefs: [], status: 'decided' };
        var out = A.rebuildTacticalDoc(r.template, [item]);
        T.assertEqual(out.a, true);
        T.assert(JSON.stringify(out).indexOf('"a":true') !== -1, 'bool serialized as string');
      });
    });

    T.suite('decisionSchema / isComplete / validateDecision', function (s) {
      s.test('packages isComplete only when action valid', function () {
        T.assertEqual(A.packages.isComplete({ key: 'x', decision: null, controlRefs: [] }), false);
        T.assertEqual(A.packages.isComplete({ key: 'x', decision: { action: 'disable' }, controlRefs: [] }), true);
        T.assertEqual(A.packages.isComplete({ key: 'x', decision: { action: 'nope' }, controlRefs: [] }), false);
      });
      s.test('tactical isComplete with falsey value', function () {
        T.assertEqual(A.tactical.isComplete({ key: 't', decision: { value: false, type: 'bool' }, controlRefs: [] }), true);
        T.assertEqual(A.tactical.isComplete({ key: 't', decision: null, controlRefs: [] }), false);
      });
    });

    T.suite('two-layer shell escaping (injection-safety, Appendix B)', function (s) {
      function psUnquote(str) { return str.slice(1, -1).replace(/''/g, "'"); }
      function shUnquote(str) {
        var out = '', i = 0;
        while (i < str.length) {
          if (str[i] === "'") { i++; while (i < str.length && str[i] !== "'") { out += str[i]; i++; } i++; }
          else if (str[i] === '\\' && str[i + 1] === "'") { out += "'"; i += 2; }
          else { i++; }
        }
        return out;
      }
      s.test('psSingleQuote/shSingleQuote round-trip the adversarial value', function () {
        var v = "a'b\"c$(whoami)` d;e";
        var prefix = 'cmd package set-x ';
        var deviceCmd = prefix + A.shSingleQuote(v);
        var psArg = A.psSingleQuote(deviceCmd);
        // Unwrap PowerShell layer, then POSIX layer, recover the value.
        var afterPs = psUnquote(psArg);
        T.assertEqual(afterPs, deviceCmd, 'PS layer did not round-trip');
        var quotedVal = afterPs.slice(prefix.length);
        T.assertEqual(shUnquote(quotedVal), v, 'POSIX layer did not round-trip');
      });
      s.test('a generated package line embeds the value as ONE PS-quoted token', function () {
        var line = A.packages.generateImplementation(
          [{ key: "com.evil'pkg", decision: { action: 'disable' }, controlRefs: [], status: 'decided' }], {})[0].content;
        T.assert(/pm disable-user --user 0 '.*'$/m.test(line.split('\n').filter(function (l) { return /disable-user/.test(l); })[0]),
          'package name not a single PS-quoted arg');
      });
    });

    T.suite('platform registration (android-adb)', function (s) {
      s.test('profile exposes its two datasets (Settings retired in v2.0)', function () {
        var p = App.platforms.androidAdb;
        T.assertEqual(p.id, 'android-adb');
        T.assertDeepEqual(p.datasets.map(function (d) { return d.id; }), ['android.packages', 'android.tactical']);
      });
      s.test('tactical generateImplementation emits ONLY the rebuilt JSON (Knox upload; no script)', function () {
        var tac = App.platforms.androidAdb.datasets[1];
        var files = tac.generateImplementation(
          [{ key: 'enabled', decision: { value: false, type: 'bool' }, controlRefs: [], status: 'decided' }],
          { device: { snapshots: { 'android.tactical': { template: { enabled: true, mode: 'x' } } } } });
        T.assertEqual(files.length, 1, 'tactical impl should emit exactly one file');
        T.assertEqual(files[0].name, 'tactical.json');
        T.assert(!/\.ps1$/.test(files[0].name), 'tactical impl must not emit a script');
        // Rebuilt JSON is valid and in the same shape as the input, with the decision applied.
        T.assertDeepEqual(JSON.parse(files[0].content), { enabled: false, mode: 'x' });
      });
    });

  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.diff
   * PURPOSE: Triage a snapshot's keys against the register (spec §8.1): split into
   *          new (append as undecided) and existing (inherited). Keys present in the
   *          register but not the snapshot are simply not-applicable — no action.
   * PURITY:  pure
   * DEPENDS: (none)
   * INVARIANTS: input order of parsedKeys is preserved; duplicates collapsed.
   * ============================================================================= */
  (function (App) {
    'use strict';
    /**
     * @param {string[]|Set<string>} parsedKeys
     * @param {string[]|Set<string>} registerKeys
     * @returns {{newKeys:string[], existingKeys:string[]}}
     * @example App.diff.triage(['a','b'], ['a']) // {newKeys:['b'], existingKeys:['a']}
     */
    function triage(parsedKeys, registerKeys) {
      var reg = {}; (registerKeys.forEach ? registerKeys : Array.from(registerKeys)).forEach(function (k) { reg[k] = true; });
      var seen = {}, newKeys = [], existingKeys = [];
      (parsedKeys.forEach ? parsedKeys : Array.from(parsedKeys)).forEach(function (k) {
        if (seen[k]) return; seen[k] = true;
        if (reg[k]) existingKeys.push(k); else newKeys.push(k);
      });
      return { newKeys: newKeys, existingKeys: existingKeys };
    }
    App.diff = { triage: triage };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.validation
   * PURPOSE: Cross-cutting structural checks beyond projectIo's schema validation
   *          (spec §7, §12): onboarding input validation and a whole-project pass.
   * PURITY:  pure
   * DEPENDS: App.registry (adapter validateDecision)
   * INVARIANTS: returns located Issues; never throws for expected conditions.
   * ============================================================================= */
  (function (App) {
    'use strict';

    /**
     * Validate onboarding inputs before committing (spec §11.4, §12).
     * @param {{name:string, parsed:Object<string,ParseResult>}} input
     * @param {string[]} datasetIds
     * @returns {Issue[]}
     */
    function validateOnboarding(input, datasetIds) {
      var issues = [];
      if (!input.name || !input.name.trim()) {
        issues.push({ category: 'state', severity: 'error', message: 'Device name is required.', location: 'name', fix: 'Enter a device name.' });
      }
      datasetIds.forEach(function (dsId) {
        var pr = input.parsed && input.parsed[dsId];
        if (!pr) { issues.push({ category: 'parse', severity: 'error', message: 'Missing input for ' + dsId + '.', location: dsId, fix: 'Provide the capture file.' }); return; }
        (pr.errors || []).forEach(function (e) { issues.push({ category: 'parse', severity: 'error', message: e.message, location: dsId + (e.location ? ' / ' + e.location : ''), fix: e.fix }); });
      });
      return issues;
    }

    /**
     * Whole-project cross-cutting validation: per-item adapter decision validity.
     * @param {Project} project
     * @returns {Issue[]}
     */
    function validateProject(project) {
      var issues = [];
      var ids = App.registry.datasetIds(project.platformProfileId);
      ids.forEach(function (dsId) {
        var adapter = App.registry.getDataset(project.platformProfileId, dsId);
        if (!adapter) return;
        (project.items[dsId] || []).forEach(function (it) {
          (adapter.validateDecision(it) || []).forEach(function (i) {
            issues.push({ category: 'validation', severity: i.severity, message: i.message, location: dsId + ' / ' + it.key, fix: i.fix });
          });
        });
      });
      return issues;
    }

    App.validation = { validateOnboarding: validateOnboarding, validateProject: validateProject };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.completeness
   * PURPOSE: Item completeness & device readiness (spec §6.5, §8.3). Wraps the
   *          adapter's isComplete with the optional REQUIRE_CONTROL_REF policy fold,
   *          and computes per-device readiness with reasons for generate-gating.
   * PURITY:  pure
   * DEPENDS: App.registry
   * INVARIANTS: a device is ready ⇔ every APPLICABLE item is complete; "applicable"
   *             = item.key ∈ that device's snapshot keys for the dataset.
   * ============================================================================= */
  (function (App) {
    'use strict';

    /**
     * Is an item complete? adapter.isComplete + optional ISM-ref policy (§6.5) + the
     * item's declared value format (VF-7).
     *
     * `project`/`captured` are OPTIONAL and only needed for the format fold: without
     * them the function behaves exactly as it did before formats existed, so every
     * pre-existing caller (and the pure engine paths that have no project to hand)
     * keeps working. This is why the format check lives here rather than inside the
     * adapter: the format catalogue is project state, and adapters are project-blind.
     * @param {DatasetAdapter} adapter
     * @param {RegisterItem} item
     * @param {Project} [project]
     * @param {Object<string,{value:*,type:string}>} [captured]  adapter.capturedDefaults output
     * @returns {boolean}
     */
    function itemComplete(adapter, item, project, captured) {
      // HELD-2: "decided, but I want to look at this again". The value is intact; it just
      // does not count as done, so the item reads as undecided and the device stays
      // un-ready until someone releases it. Checked first — nothing else matters.
      if (item && item.held) return false;
      if (!adapter || !adapter.isComplete(item)) return false;
      if (mod.REQUIRE_CONTROL_REF && !(item.controlRefs && item.controlRefs.length)) return false;
      if (project && App.valueFormats) {
        if (formatIssues(adapter, item, project, captured).length) return false;
      }
      return true;
    }

    /**
     * The format violations for one item, or [] (VF-7). Exposed so the table can show
     * WHY a cell is invalid rather than just tinting it.
     * @returns {Issue[]}
     */
    function formatIssues(adapter, item, project, captured) {
      if (!project || !App.valueFormats || !item || item.decision == null) return [];
      var schema = (adapter && adapter.decisionSchema) || [];
      var primary = schema[0];
      // Formats describe a VALUE. A dataset whose primary decision field is an enum
      // (packages: keep/disable/remove) already has a closed vocabulary, so it is
      // deliberately out of scope — the adapter validates it.
      if (!primary || (primary.kind !== 'value-typed' && primary.kind !== 'string')) return [];
      var cap = captured && captured[item.key];
      var fmt = App.valueFormats.resolve(project, item, cap ? cap.type : undefined, cap ? cap.value : undefined);
      return App.valueFormats.validate(fmt, item.decision[primary.name], item.key);
    }

    /**
     * Per-device readiness with reasons (for generate-button gating & messages).
     * @param {Project} project
     * @param {string} deviceId
     * @returns {{ready:boolean, totalUndecided:number, reasons:{datasetId:string,label:string,undecided:number}[]}}
     */
    function deviceReadiness(project, deviceId) {
      var ids = App.registry.datasetIds(project.platformProfileId);
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      var reasons = [], total = 0;
      if (!dc) return { ready: false, totalUndecided: 0, reasons: [{ datasetId: '', label: 'device', undecided: 0 }] };
      ids.forEach(function (dsId) {
        var adapter = App.registry.getDataset(project.platformProfileId, dsId);
        var snap = dc.snapshots[dsId];
        if (!adapter || !snap) return;
        var keySet = {}; snap.keys.forEach(function (k) { keySet[k] = true; });
        // VF-7: readiness now also honours declared value formats, so this needs the
        // captured types (which supply the INFERRED format for items that declare none).
        var captured = (typeof adapter.capturedDefaults === 'function') ? adapter.capturedDefaults(snap) : {};
        // Evaluate the EFFECTIVE decision (default→group→device, spec §19.2/OVR-3) so a
        // device/group override can satisfy completeness even when the default is undecided.
        var undecided = (project.items[dsId] || []).filter(function (it) {
          if (!keySet[it.key]) return false;
          var eff = App.overrides ? App.overrides.effectiveItem(project, dsId, it, deviceId) : it;
          return !itemComplete(adapter, eff, project, captured);
        }).length;
        if (undecided > 0) reasons.push({ datasetId: dsId, label: adapter.label, undecided: undecided });
        total += undecided;
      });
      return { ready: total === 0, totalUndecided: total, reasons: reasons };
    }
