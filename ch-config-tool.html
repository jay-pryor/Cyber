    function saveProject(name) {
      var project = App.store.getProject();
      if (!project) return;
      var text = App.projectIo.serializeProject(project);
      var blob = new Blob([text], { type: 'application/json' });
      var fname = (name && String(name).trim()) ? String(name).trim() : 'ch-project';
      if (!/\.json$/i.test(fname)) fname += '.json';
      dom.download(blob, fname);
      App.store.markSaved();
      clearDraft(); // the downloaded file is now canonical; drop the crash-insurance draft
      App.ui.activity.log({ severity: 'success', message: 'Saved project as ' + fname + ' (' + text.length + ' bytes).' });
    }

    // ---- localStorage DRAFT autosave (spec §6.6, C-4): non-canonical crash
    // insurance only. localStorage is unreliable under file:// so ALL access is
    // wrapped — failures degrade silently and never affect canonical state. ----
    function saveDraft() {
      var project = App.store.getProject(); if (!project) return;
      try {
        window.localStorage.setItem(DRAFT_KEY, JSON.stringify({ savedUtc: App.util.clock.nowIso(), project: App.projectIo.serializeProject(project) }));
      } catch (e) { /* storage unavailable/full — ignore */ }
    }
    function loadDraft() {
      try {
        var raw = window.localStorage.getItem(DRAFT_KEY);
        if (!raw) return null;
        var d = JSON.parse(raw);
        return (d && d.project && d.savedUtc) ? d : null;
      } catch (e) { return null; }
    }
    function clearDraft() { try { window.localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
    function scheduleDraftSave() {
      if (_draftTimer) clearTimeout(_draftTimer);
      _draftTimer = setTimeout(saveDraft, 1000); // debounce
    }
    function restoreDraft() {
      var d = loadDraft(); if (!d) return;

      if (!res.ok) { App.ui.activity.logIssues(res.issues, 'Draft restore failed'); _state.draftDismissed = true; render(); return; }
      if (App.registry.hasPlatform(res.value.platformProfileId)) App.registry.setActivePlatform(res.value.platformProfileId);
      App.store.init(res.value);
      resetUndo();                     // snapshots belong to the pre-restore project
      App.store.markDirty();           // restored draft is NOT a saved file → unsaved
      _state.draftDismissed = true; _state.activeTab = defaultTab();
      App.ui.activity.log({ severity: 'success', message: 'Restored draft autosave from ' + toAest(d.savedUtc) + ' — Save to make it canonical.' });

    function exportCsv() {
      var project = App.store.getProject(); if (!project) return;
      var dsId = _state.activeTab;
      var adapter = App.registry.getDataset(project.platformProfileId, dsId);
      if (!adapter) { App.ui.activity.log({ severity: 'warning', message: 'Switch to a data tab to export its CSV.' }); return; }
      var rows = App.ui.model.filterSortRows(project, dsId, adapter, uiFor(dsId));
      var cols = adapter.columns.map(function (c) { return { key: c.key, label: c.label }; })
        .concat([{ key: 'relevance', label: 'Security Relevance' }, { key: 'appliesTo', label: 'Applies to' }, { key: 'status', label: 'Status' }]);
      var flat = rows.map(function (r) {
        var o = {}; adapter.columns.forEach(function (c) { o[c.key] = r.cells[c.key]; });
        o.relevance = r.item.relevance || ''; // review-12 #3
        o.appliesTo = r.appliesTo.join('; '); o.status = r.status; return o;
      });
      var csv = App.util.csv.toCsv(flat, cols);
      dom.download(new Blob([csv], { type: 'text/csv' }), dsId + '.csv');
      App.ui.activity.log({ severity: 'success', message: 'Exported ' + flat.length + ' rows from ' + dsId + '.' });
    }

    function logErr(err) {
      App.ui.activity.log({ severity: 'error', message: 'Unexpected error: ' + (err && err.message ? err.message : String(err)) });
      renderDrawer();
    }

    /**
     * Mount the app into a root element.
     * @param {Element} root
     */
    /** Build the controller context handed to view modules (spec §11). */
    function buildCtx() {
      return {
        root: _root,
        refresh: render,
        refreshMain: renderMain,
        switchTab: function (t) { _state.activeTab = t; render(); },
        uiFor: uiFor
      };
    }

    function mount(root) {
      _root = root;
      applyTheme(initialTheme()); // honour stored/OS preference before first paint (§18.1)
      _state.activeTab = App.store.getProject() ? defaultTab() : 'onboard';
      render();
      wire();
      // Wire view modules ONCE (their handlers are delegated on _root, so they
      // survive re-renders). Adding a view = drop a module with render()/wire().
      var ctx = buildCtx();
      if (App.ui.views) Object.keys(App.ui.views).forEach(function (k) {
        if (App.ui.views[k].wire) App.ui.views[k].wire(ctx);
      });
      App.store.onChange(function () { if (!_suppressRender) render(); if (App.store.isDirty()) scheduleDraftSave(); });
      App.ui.activity.onChange(function () { renderDrawer(); });

      // Dirty guard (spec §6.6): warn before leaving with unsaved changes.
      window.addEventListener('beforeunload', function (e) {
        if (App.store.isDirty()) { e.preventDefault(); e.returnValue = ''; return ''; }
      });

      App.ui.activity.log({ severity: 'info', message: 'CH Config Tool ' + TOOL_VERSION + ' ready.' });
      if (loadDraft()) App.ui.activity.log({ severity: 'info', message: 'A local draft autosave was found — see the banner to restore or discard it.' });
    }

    App.ui = App.ui || {};
    App.ui.app = {
      mount: mount, TOOL_VERSION: TOOL_VERSION, _state: _state, nextTheme: nextTheme, toAest: toAest,
      applyToTogglePlan: applyToTogglePlan,
      // review-16 #1: exposed so the "empty box = blank value, not undecided" rule can
      // be tested without synthesising a table cell.
      _decisionFromRaw: decisionFromRaw,
      // review-17 #1/#3: the tab strip and the Status-badge flip, exposed so the tab
      // ORDER and the flip rules are testable without driving a live browser.
      _renderShell: renderShell,
      _toggleStatus: toggleStatus,
      // review-13 #2/#3: the undo/redo history, exposed so the grouping rules are
      // testable without synthesising DOM clicks.
      _history: {
        pushUndo: pushUndo, noteApplyTick: noteApplyTick, closeRun: closeRun, reset: resetUndo,
        info: undoInfo, undo: function (dsId) { return stepHistory(dsId, _undo, _redo, 'Undid'); },
        redo: function (dsId) { return stepHistory(dsId, _redo, _undo, 'Redid'); }
      }
    };
  })(App);
  </script>

  <!-- ===== PHASE-4 SELF-TEST SUITES (diff · validation · store onboarding) ===== -->
  <script>
  (function (App) {
    'use strict';
    var T = App.test;
    function ensureAndroid() { if (!App.registry.hasPlatform('android-adb')) App.registry.registerPlatform(App.platforms.androidAdb); }
    var ISO = '2026-01-01T00:00:00.000Z';

    function snap(dsId, raw) {
      ensureAndroid();
      var a = App.registry.getDataset('android-adb', dsId);
      var pr = a.parse(raw);
      var s = { capturedUtc: ISO, sourceFilename: dsId + '.txt', sha256: App.util.hash.sha256Hex(raw), keys: pr.keys };
      if (pr.values) s.values = pr.values;
      if (pr.template !== undefined) s.template = pr.template;
      return s;
    }
    function snaps(pkgRaw, tacRaw) {
      return { 'android.packages': snap('android.packages', pkgRaw), 'android.tactical': snap('android.tactical', tacRaw) };
    }
    function freshProject() { App.store.init(App.store.empty('android-adb')); }

    T.suite('diff.triage', function (s) {
      s.test('splits new vs existing, preserves order, dedupes', function () {
        T.assertDeepEqual(App.diff.triage(['b', 'a', 'a', 'c'], ['a']), { newKeys: ['b', 'c'], existingKeys: ['a'] });
      });
      s.test('register-only keys are ignored (not-applicable)', function () {
        T.assertDeepEqual(App.diff.triage(['a'], ['a', 'z']), { newKeys: [], existingKeys: ['a'] });
      });
    });

    T.suite('validation.validateOnboarding', function (s) {
      s.test('missing name -> error', function () {
        var iss = App.validation.validateOnboarding({ name: '', parsed: {} }, []);
        T.assert(iss.some(function (i) { return /name is required/i.test(i.message); }));
      });
      s.test('parse errors in a slot surface as located issues', function () {
        var parsed = { 'android.packages': { errors: [{ message: 'bad', location: 'line 1' }], warnings: [], keys: [] } };
        var iss = App.validation.validateOnboarding({ name: 'X', parsed: parsed }, ['android.packages']);
        T.assert(iss.some(function (i) { return /bad/.test(i.message) && /android\.packages/.test(i.location); }));
      });
    });

    T.suite('store.onboardDevice (fresh + inheritance)', function (s) {
      s.test('no project -> located error', function () {
        App.store.init(null); // simulate no project
        var res = App.store.onboardDevice({ name: 'X', snapshots: {} });
        T.assertEqual(res.ok, false);
      });
      s.test('fresh onboard creates v1 and appends all keys undecided', function () {
        freshProject();
        var res = App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: snaps('com.a\ncom.b', '{"enabled":true}') });
        T.assertEqual(res.ok, true);
        T.assertEqual(res.result.noop, false);
        T.assertEqual(res.result.version, 1);
        T.assertEqual(res.result.deviceId, 'tab-a-m1');
        var p = App.store.getProject();
        T.assertEqual(p.deviceConfigs.length, 1);
        T.assertDeepEqual(p.items['android.packages'].map(function (i) { return i.key; }).sort(), ['com.a', 'com.b']);
        T.assert(p.items['android.packages'].every(function (i) { return i.status === 'undecided'; }));
      });
      s.test('onboard device #2 inherits common keys, flags only new', function () {
        freshProject();
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: snaps('com.a\ncom.b', '{"enabled":true}') });
        var res = App.store.onboardDevice({ name: 'S23', model: 'M2', firmware: 'F2', snapshots: snaps('com.a\ncom.c', '{"enabled":true}') });
        T.assertEqual(res.result.perDataset['android.packages'].newCount, 1);    // com.c
        T.assertEqual(res.result.perDataset['android.packages'].existingCount, 1); // com.a
        var p = App.store.getProject();
        T.assertDeepEqual(p.items['android.packages'].map(function (i) { return i.key; }).sort(), ['com.a', 'com.b', 'com.c']);
      });
      s.test('captured-default drift surfaces an info issue (§8.4)', function () {
        // §8.4 is adapter-driven: it fires for ANY dataset whose snapshot records
        // per-key capture values. No shipped adapter emits `values` today (Settings,
        // which did, was retired in v2.0), so the snapshots are built by hand here to
        // keep the mechanism itself covered for the next dataset that needs it.
        freshProject();
        function valued(v) {
          var raw = 'k=' + v;
          return { capturedUtc: ISO, sourceFilename: 'x.txt', sha256: App.util.hash.sha256Hex(raw), keys: ['com.a'], values: { 'com.a': v } };
        }
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: { 'android.packages': valued('0') } });
        var res = App.store.onboardDevice({ name: 'S23', model: 'M2', firmware: 'F2', snapshots: { 'android.packages': valued('1') } });
        T.assert(res.result.drift.length >= 1, 'expected drift info');
        T.assert(/com\.a default differs/.test(res.result.drift[0].message), 'got: ' + res.result.drift[0].message);
      });
    });

    T.suite('store re-onboard versioning (§8.7)', function (s) {
      s.test('identical snapshots -> NO-OP (no new config, no mutation)', function () {
        freshProject();
        var sn = snaps('com.a\ncom.b', '{"enabled":true}');
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: sn });
        var before = App.projectIo.serializeProject(App.store.getProject());
        var res = App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: snaps('com.a\ncom.b', '{"enabled":true}') });
        T.assertEqual(res.result.noop, true);
        T.assertEqual(App.store.getProject().deviceConfigs.length, 1);
        T.assertEqual(App.projectIo.serializeProject(App.store.getProject()), before, 'no-op mutated state');
      });
      s.test('differing snapshots -> new v2 supersedes v1; decisions untouched; append-only', function () {
        freshProject();
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: snaps('com.a\ncom.b', '{"enabled":true}') });
        // Record a decision on com.a (simulate Phase-5 editing via the transactional commit).
        App.store._commit(function (p) { p.items['android.packages'].filter(function (i) { return i.key === 'com.a'; })[0].decision = { action: 'disable' }; });
        var res = App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: snaps('com.a\ncom.c', '{"enabled":true}') });
        T.assertEqual(res.result.noop, false);
        T.assertEqual(res.result.version, 2);
        T.assertEqual(res.result.deviceId, 'tab-a-m1-v2');
        T.assertEqual(res.result.supersedesId, 'tab-a-m1');
        var p = App.store.getProject();
        T.assertEqual(p.deviceConfigs.length, 2);             // v1 retained
        var latest = App.store.getLatestConfigs(p).map(function (c) { return c.id; });
        T.assertDeepEqual(latest, ['tab-a-m1-v2']);
        // Decision preserved (register is shared/unified, append-only).
        T.assertDeepEqual(p.items['android.packages'].filter(function (i) { return i.key === 'com.a'; })[0].decision, { action: 'disable' });
        // New key com.c appended; com.b retained (append-only).
        T.assertDeepEqual(p.items['android.packages'].map(function (i) { return i.key; }).sort(), ['com.a', 'com.b', 'com.c']);
      });
      s.test('reonboardDevice shares the same code path', function () {
        freshProject();
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', snapshots: snaps('com.a', '{"enabled":true}') });
        var res = App.store.reonboardDevice({ name: 'Tab A', model: 'M1', snapshots: snaps('com.a\ncom.b', '{"enabled":true}') });
        T.assertEqual(res.result.version, 2);
      });
    });

    T.suite('store.applicableItems / undecidedCount', function (s) {
      s.test('applicableItems returns only the device\'s keys', function () {
        freshProject();
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', snapshots: snaps('com.a\ncom.b', '{"enabled":true}') });
        App.store.onboardDevice({ name: 'S23', model: 'M2', snapshots: snaps('com.a\ncom.c', '{"enabled":true}') });
        var ap = App.store.applicableItems('s23-m2', 'android.packages').map(function (i) { return i.key; }).sort();
        T.assertDeepEqual(ap, ['com.a', 'com.c']);
      });
      s.test('undecidedCount per device counts only applicable undecided', function () {
        freshProject();
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', snapshots: snaps('com.a\ncom.b', '{"enabled":true}') });
        // 2 packages + 3 tactical (the captured leaf plus the two injected imsSettings
        // slots, review-17 #4) applicable, all undecided = 5
        T.assertEqual(App.store.undecidedCount('tab-a-m1'), 5);
      });
    });

  })(App);
  </script>

  <!-- ===== PHASE-5 SELF-TEST SUITES (completeness · store decisions · editors · gating) ===== -->
  <script>
  (function (App) {
    'use strict';
    var T = App.test;
    function ensureAndroid() { if (!App.registry.hasPlatform('android-adb')) App.registry.registerPlatform(App.platforms.androidAdb); }

    function snap(dsId, raw) {
      ensureAndroid();
      var a = App.registry.getDataset('android-adb', dsId), pr = a.parse(raw);
      var s = { capturedUtc: '2026-01-01T00:00:00.000Z', sourceFilename: dsId, sha256: App.util.hash.sha256Hex(raw), keys: pr.keys };
      if (pr.values) s.values = pr.values; if (pr.template !== undefined) s.template = pr.template; return s;
    }
    function deviceProject() {
      ensureAndroid();
      App.store.init(App.store.empty('android-adb'));
      App.store.onboardDevice({ name: 'Dev', model: 'M1', firmware: 'F', snapshots: {
        'android.packages': snap('android.packages', 'com.a\ncom.b'),
        'android.tactical': snap('android.tactical', '{"enabled":true}')
      } });
      return 'dev-m1';
    }
    function decideAll() {
      App.store.setDecision('android.packages', 'com.a', { action: 'keep' });
      App.store.setDecision('android.packages', 'com.b', { action: 'disable' });
      App.store.setDecision('android.tactical', 'enabled', { value: true, type: 'bool' });
      // review-17 #4: every tactical onboard also carries the two imsSettings slots.
      App.store.setDecision('android.tactical', 'imsSettings.simSlot0.enabled', { value: false, type: 'bool' });
      App.store.setDecision('android.tactical', 'imsSettings.simSlot1.enabled', { value: false, type: 'bool' });
    }

    T.suite('completeness', function (s) {
      s.test('itemComplete reflects adapter.isComplete', function () {
        var a = App.registry.getDataset('android-adb', 'android.packages');
        T.assertEqual(App.completeness.itemComplete(a, { key: 'x', decision: { action: 'keep' }, controlRefs: [] }), true);
        T.assertEqual(App.completeness.itemComplete(a, { key: 'x', decision: null, controlRefs: [] }), false);
      });
      s.test('REQUIRE_CONTROL_REF folds into completeness', function () {
        var a = App.registry.getDataset('android-adb', 'android.packages');
        App.completeness.REQUIRE_CONTROL_REF = true;
        T.assertEqual(App.completeness.itemComplete(a, { key: 'x', decision: { action: 'keep' }, controlRefs: [] }), false);
        T.assertEqual(App.completeness.itemComplete(a, { key: 'x', decision: { action: 'keep' }, controlRefs: ['ISM-1'] }), true);
        App.completeness.REQUIRE_CONTROL_REF = false; // restore
      });
      s.test('deviceReadiness: undecided -> not ready with reasons; decided -> ready', function () {
        var id = deviceProject();
        var r0 = App.completeness.deviceReadiness(App.store.getProject(), id);
        T.assertEqual(r0.ready, false);
        T.assert(r0.totalUndecided === 5, 'expected 5 undecided, got ' + r0.totalUndecided);
        T.assert(r0.reasons.length === 2, 'expected 2 dataset reasons');
        decideAll();
        var r1 = App.completeness.deviceReadiness(App.store.getProject(), id);
        T.assertEqual(r1.ready, true);
        T.assertEqual(App.completeness.deviceReady(App.store.getProject(), id), true);
      });
    });

    T.suite('store.setDecision / setItemFields', function (s) {
      s.test('valid decision commits and flips status to decided', function () {
        deviceProject();
        var res = App.store.setDecision('android.packages', 'com.a', { action: 'disable' });
        T.assertEqual(res.ok, true);
        var it = App.store.getProject().items['android.packages'].filter(function (i) { return i.key === 'com.a'; })[0];
        T.assertDeepEqual(it.decision, { action: 'disable' });
        T.assertEqual(it.status, 'decided');
      });
      s.test('invalid decision is stored but stays incomplete + returns issues', function () {
        deviceProject();
        // packages action is still a constrained enum, so an invalid action exercises this path.
        var res = App.store.setDecision('android.packages', 'com.a', { action: 'bogus' });
        T.assertEqual(res.ok, false);
        T.assert(res.issues.length >= 1);
        var it = App.store.getProject().items['android.packages'].filter(function (i) { return i.key === 'com.a'; })[0];
        T.assertDeepEqual(it.decision, { action: 'bogus' }, 'value should still be stored (no silent drop)');
        T.assertEqual(it.status, 'undecided');
      });
      s.test('clearing a decision (null) returns to undecided', function () {
        deviceProject();
        App.store.setDecision('android.packages', 'com.a', { action: 'keep' });
        App.store.setDecision('android.packages', 'com.a', null);
        var it = App.store.getProject().items['android.packages'].filter(function (i) { return i.key === 'com.a'; })[0];
        T.assertEqual(it.decision, null);
        T.assertEqual(it.status, 'undecided');
      });
      s.test('unknown item -> located error', function () {
        deviceProject();
        T.assertEqual(App.store.setDecision('android.packages', 'no.such', { action: 'keep' }).ok, false);
      });
      s.test('setItemFields updates description/controlRefs/rationale/rollback', function () {
        deviceProject();
        App.store.setItemFields('android.packages', 'com.a', { description: 'desc', controlRefs: ['ISM-9'], rationale: 'why', rollback: 'undo' });
        var it = App.store.getProject().items['android.packages'].filter(function (i) { return i.key === 'com.a'; })[0];
        T.assertEqual(it.description, 'desc');
        T.assertDeepEqual(it.controlRefs, ['ISM-9']);
        T.assertEqual(it.rationale, 'why');
        T.assertEqual(it.rollback, 'undo');
      });

        T.assert(/^dev-m1-implementation-\d{8}T\d{6}Z\.zip$/.test(r.name), 'bad zip name: ' + r.name);
        var names = r.files.map(function (f) { return f.name; });
        ['packages.impl.ps1', 'tactical.json', 'manifest.json'].forEach(function (n) {
          T.assert(names.indexOf(n) !== -1, 'missing ' + n);
        });

      });
      s.test('script files are wrapped with the platform preamble; data files are not', function () {
        var r = App.generate.buildImplementation(readyProject(), 'dev-m1');
        T.assert(/Set-StrictMode/.test(fileNamed(r.files, 'packages.impl.ps1').content), 'preamble missing');

        // emitted even when nobody has decided it, at its default (both slots disabled).
        T.assertDeepEqual(JSON.parse(tj), {
          enabled: true, count: 5,

        var r = App.generate.buildImplementation(readyProject(), 'dev-m1');

        T.assert(/^[0-9a-f]{64}$/.test(man.projectSha256));

        T.assert(man.outputs.some(function (o) { return o.name === 'tactical.json'; }));
        T.assertEqual(man.decisions['android.packages'].length, 2);
        T.assertEqual(man.device.id, 'dev-m1');

  <script>
  (function (App) {
    'use strict';
    var T = App.test;

    // ---- Appendix D.4: a trivial MOCK platform with one text dataset 'mock.kv'.
    // Registered lazily (D-007). Its existence + the assertions below PROVE DOD-11:
    // a new platform is hosted by writing only an adapter + profile — ZERO edits to
    // store/registry/diff/validation/completeness/generate/projectIo/report/ui.
    var MOCK_KV = {
      id: 'mock.kv', label: 'KV', inputKind: 'text',
      captureHint: 'one k=value per line',
      parse: function (raw) {
        var keys = [], values = {}, errors = [], seen = {};
        String(raw).split(/\r?\n/).forEach(function (line, i) {
          if (line.trim() === '') return;
          var eq = line.indexOf('=');
          if (eq === -1) { errors.push({ category: 'parse', severity: 'error', message: 'Expected k=value.', location: 'line ' + (i + 1) }); return; }
          var k = line.slice(0, eq), v = line.slice(eq + 1);
          if (seen[k]) { errors.push({ category: 'parse', severity: 'error', message: 'Duplicate key ' + k, location: 'line ' + (i + 1) }); return; }
          seen[k] = true; keys.push(k); values[k] = v;
        });
        keys.sort();
        return { items: keys.map(function (k) { return { key: k, defaultValue: values[k] }; }), keys: keys, values: values, warnings: [], errors: errors };
      },
      decisionSchema: [{ name: 'value', kind: 'string', required: true }],
      validateDecision: function (it) { return (it.decision && typeof it.decision.value !== 'string') ? [{ category: 'validation', severity: 'error', message: 'value must be a string', location: it.key }] : []; },
      isComplete: function (it) { return it.decision !== null && this.validateDecision(it).length === 0; },
      columns: [
        { key: 'key', label: 'Key', get: function (it) { return it.key; } },
        { key: 'description', label: 'Description', get: function (it) { return it.description || ''; } },
        { key: 'decision', label: 'Value', get: function (it) { return it.decision ? it.decision.value : ''; } },
        { key: 'controlRefs', label: 'Control Refs', get: function (it) { return (it.controlRefs || []).join(', '); } }
      ],
      generateImplementation: function (items, ctx) { return [{ name: 'mock.impl.txt', content: items.slice().sort(function (a, b) { return a.key < b.key ? -1 : 1; }).map(function (it) { return it.decision ? (it.key + '=' + it.decision.value) : ''; }).filter(Boolean).join('\n') }]; },
      generateVerification: function (items, ctx) { return [{ name: 'mock.verify.txt', content: 'verify ' + items.length + ' items' }]; },
      renderReportSection: function (items, ctx) { return '<h2>KV</h2><table><tbody>' + items.map(function (it) { return '<tr><td>' + App.util.html.esc(it.key) + '</td></tr>'; }).join('') + '</tbody></table>'; },
      capturedDefaults: function (snap) { var o = {}; if (snap && snap.values) Object.keys(snap.values).forEach(function (k) { o[k] = { value: snap.values[k], type: 'string' }; }); return o; }
    };
    var MOCK_PLATFORM = {
      id: 'mock', label: 'Mock platform', outputLanguage: 'text',
      datasets: [MOCK_KV], captureInstructions: 'k=value lines',
      scriptPreamble: function () { return '# mock'; }, scriptPostamble: function () { return ''; }
      // NOTE: no scriptExtension => the generator wraps nothing for this platform.
    };
    function ensureMock() { if (!App.registry.hasPlatform('mock')) App.registry.registerPlatform(MOCK_PLATFORM); }
    function mockSnap(raw) {
      ensureMock();
      var pr = MOCK_KV.parse(raw);
      return { capturedUtc: '2026-01-01T00:00:00.000Z', sourceFilename: 'kv.txt', sha256: App.util.hash.sha256Hex(raw), keys: pr.keys, values: pr.values };
    }

    T.suite('DOD-11 portability (mock platform, zero core edits)', function (s) {
      s.test('store/diff onboard a mock device & triage with the generic engine', function () {
        ensureMock();
        App.store.init(App.store.empty('mock'));
        var res = App.store.onboardDevice({ name: 'MockDev', model: 'X', firmware: 'F', snapshots: { 'mock.kv': mockSnap('k1=a\nk2=b') } });
        T.assertEqual(res.ok, true);
        T.assertDeepEqual(App.store.getProject().items['mock.kv'].map(function (i) { return i.key; }).sort(), ['k1', 'k2']);
      });
      s.test('generic table renders mock columns + editor', function () {
        ensureMock();
        App.store.init(App.store.empty('mock'));
        App.store.onboardDevice({ name: 'MockDev', model: 'X', snapshots: { 'mock.kv': mockSnap('k1=a\nk2=b') } });
        var html = App.ui.tables.renderTableHtml(App.store.getProject(), 'mock.kv', {}, {});
        T.assert(/k1/.test(html) && /k2/.test(html) && /data-kind="string"/.test(html));
      });
      s.test('completeness + generation work for the mock platform', function () {
        ensureMock();
        App.store.init(App.store.empty('mock'));
        App.store.onboardDevice({ name: 'MockDev', model: 'X', snapshots: { 'mock.kv': mockSnap('k1=a\nk2=b') } });
        App.store.setDecision('mock.kv', 'k1', { value: 'x' });
        App.store.setDecision('mock.kv', 'k2', { value: 'y' });
        var p = App.store.getProject();
        T.assertEqual(App.completeness.deviceReady(p, 'mockdev-x'), true);
        var impl = App.generate.buildImplementation(p, 'mockdev-x');
        T.assert(impl.blob && impl.files.some(function (f) { return f.name === 'mock.impl.txt'; }) && impl.files.some(function (f) { return f.name === 'manifest.json'; }));
        var rep = App.generate.buildReport(p, 'mockdev-x');
        T.assert(/KV/.test(rep.files.filter(function (f) { return f.name === 'report.html'; })[0].content));
      });
      s.test('project round-trips losslessly for the mock platform', function () {
        ensureMock();
        App.store.init(App.store.empty('mock'));
        App.store.onboardDevice({ name: 'MockDev', model: 'X', snapshots: { 'mock.kv': mockSnap('k1=a') } });
        var s1 = App.projectIo.serializeProject(App.store.getProject());
        var r = App.projectIo.parseProject(s1);
        T.assertEqual(r.ok, true);
        T.assertEqual(App.projectIo.serializeProject(r.value), s1);

      s.test('DOD-2: load→save→load identity (android sample)', function () {

      });
      s.test('DOD-10: malformed inputs never throw; return located issues', function () {
        var a = App.registry.getDataset('android-adb', 'android.packages');
        T.assert(a.parse('not a valid package token!').errors.length >= 1);
        T.assert(App.adapters.android.tactical.parse('{bad').errors.length === 1);
        T.assertEqual(App.projectIo.parseProject('{').ok, false);
      });
      s.test('DOD-12: every module file-block present & self-test suite passes (this run)', function () {
        T.assert(!!(App.store && App.registry && App.diff && App.validation && App.completeness && App.generate && App.report && App.projectIo));
      });
    });

  })(App);

    // review-13: delete tint over the row stripe · an apply RUN is one undo step ·
    // redo · per-device checkbox columns in Control Manager.
    // =========================================================================
    var H = App.ui.app._history;

    /** Apply a control to several keys the way Apply Control Mode does (tick by tick). */
    function applyRun(dsId, controlId, keys) {
      keys.forEach(function (k) {
        H.noteApplyTick(dsId, controlId, controlId);
        var it = App.store.getProject().items[dsId].filter(function (i) { return i.key === k; })[0];
        App.store.setItemFields(dsId, k, { controlRefs: (it.controlRefs || []).concat([controlId]) });
      });
    }
    function refCounts(dsId) {
      return App.store.getProject().items[dsId].map(function (i) { return (i.controlRefs || []).length; }).join(',');
    }

    T.suite('review-13 #1 delete selection tint', function (s) {

      });
    });

      });
      s.test('closeRun (leaving the mode) and a different control each start a new entry', function () {
        r12Project(); H.reset();

        applyRun('android.packages', a, ['com.a']);
        H.closeRun();                                   // e.g. exited/re-entered the mode

      });
      s.test('redo re-applies a whole undone run and is offered only after an undo', function () {
        r12Project(); H.reset();

       * A stand-in for the badge element and the row around it, so the flip rules are
       * testable without a live table: badge -> <tr> -> the row's td.dcell -> controls.
       * @param {{field:string,kind:string,value:*,vtype?:string}[]} [controls]
       */
      function fakeBadge(dsId, key, controls) {
        function control(c) {
          return {
            type: c.kind === 'bool' ? 'checkbox' : 'textarea',
            value: c.value, checked: !!c.value,
            getAttribute: function (n) {
              return n === 'data-field' ? c.field
                : n === 'data-kind' ? c.kind
                : n === 'data-vtype' ? (c.vtype || null) : null;
            }
          };
        }
        var cell = { tagName: 'TD', querySelectorAll: function () { return (controls || []).map(control); } };
        var row = { tagName: 'TR', parentNode: null, querySelector: function (sel) { return sel === 'td.dcell' ? cell : null; } };
        return { tagName: 'SPAN', parentNode: row, getAttribute: function (n) { return n === 'data-ds' ? dsId : n === 'data-key' ? key : null; } };
      }
      function tacItem(key) {
        return App.store.getProject().items['android.tactical'].filter(function (i) { return i.key === key; })[0];

        App.ui.app._toggleStatus(fakeBadge('android.tactical', 'enabled'));
        var it = tacItem('enabled');
        T.assertEqual(it.status, 'undecided', 'it must read as undecided');
        T.assertDeepEqual(it.decision, { value: true }, 'the recorded value must NOT be wiped');
        T.assertEqual(it.held, true, 'it is held for review');
      });
      s.test('an undecided item adopts the value its editor shows', function () {

        // from the document. Fall back to the live CSSOM when the raw text is absent.
        var el = document.querySelector('style');
        return (el && (el.textContent || el.innerHTML)) || '';
      }
      function rule(sheet, selector) {
        var i = sheet.indexOf(selector + ' {');
        if (i === -1) i = sheet.indexOf(selector + '{');
        if (i === -1) return '';
        var open = sheet.indexOf('{', i), close = sheet.indexOf('}', open);
        return close === -1 ? '' : sheet.slice(open + 1, close);
      }

      s.test('#app-root has a FIXED height, so .main can be the scroll region', function () {
        var r = rule(css(), '#app-root');
        if (!r) return; // no inline stylesheet in this environment — nothing to assert
        T.assert(/height:\s*100vh/.test(r), '#app-root must set height:100vh');
        T.assert(!/min-height:\s*100vh/.test(r),
          'min-height lets #app-root grow with its content, so .main never scrolls and ' +
          'position:sticky inside it silently stops working');
      });

      s.test('.main is a scrollport that can shrink', function () {
        var r = rule(css(), '.main');
        if (!r) return;
        T.assert(/overflow:\s*auto/.test(r), '.main must scroll');
        T.assert(/min-height:\s*0/.test(r),
          'without min-height:0 a flex child will not shrink below its content, so .main ' +
          'overflows the shell and nothing scrolls');
      });

      s.test('.side-rail is sticky and self-aligned to the start', function () {
        var r = rule(css(), '.side-rail');
        if (!r) return;
        T.assert(/position:\s*sticky/.test(r), '.side-rail must be position:sticky');
        T.assert(/align-self:\s*flex-start/.test(r),
          'a stretched flex item fills the row and has no room to stick — align-self:flex-start is required');
        T.assert(/top:\s*0/.test(r), 'sticky needs an inset to pin against');
      });

      s.test('nothing between the rail and .main introduces another scrollport', function () {
        var r = rule(css(), '.table-wrap');
        if (!r) return;
        T.assert(!/overflow/.test(r),
          '.table-wrap must not scroll — an overflow ancestor would become the sticky ' +
          'scrollport instead of .main');
        T.assert(/align-items:\s*flex-start/.test(r), '.table-wrap must not stretch its children');
      });
    });

    T.suite('SP sticky tools rail', function (s) {
      function railProject() {
        ensureA(); App.store.init(App.store.empty('android-adb'));
        App.store.onboardDevice({ name: 'SP', model: 'M1', snapshots: {
          'android.packages': snapB('android.packages', 'com.a\ncom.b'),
          'android.tactical': snapB('android.tactical', '{"enabled":true}') } });
        var id = App.store.addControl({ title: 'No Bluetooth', type: 'ISM', description: 'Bluetooth radio must be off in the field.' }).id;
        App.store.addControl({ title: 'Debloat', type: 'AHG', description: 'Remove vendor apps with no operational need.' });
        return { id: id, project: App.store.getProject() };
      }
      function toolbar(ui) {
        var w = railProject();
        return { html: App.ui.tables.renderToolbar('android.packages', ui || {}, 2, 2, w.project.controls), w: w };
      }

      s.test('SP-1 the mode + history controls live in the rail, not the filter toolbar', function () {
        var r = toolbar({});
        var html = r.html;
        var railAt = html.indexOf('<aside class="side-rail"');
        T.assert(railAt !== -1, 'no side rail');
        // Every mode control must sit AFTER the rail opens, i.e. inside it.
        ['data-apply-toggle', 'data-delete-toggle', 'data-undo', 'data-redo'].forEach(function (attr) {
          var at = html.indexOf(attr);
          T.assert(at > railAt, attr + ' should be inside the rail, not the toolbar');
        });
        // ...and the filters must stay in the toolbar, before it.
        ['data-search', 'data-incomplete', 'data-only-rel'].forEach(function (attr) {
          T.assert(html.indexOf(attr) < railAt, attr + ' should stay in the filter toolbar');
        });
      });

      s.test('SP-2 the rail is sticky and collapsible', function () {
        var r = toolbar({});
        T.assert(/class="table-wrap"/.test(r.html), 'the table and rail must share a flex wrapper');
        T.assert(/data-rail-toggle="android.packages"/.test(r.html), 'no collapse control');
        var collapsed = App.ui.tables.renderToolbar('android.packages', { railCollapsed: true }, 2, 2, r.w.project.controls);
        T.assert(/class="side-rail collapsed"/.test(collapsed), 'collapsed state not rendered');
        T.assert(collapsed.indexOf('data-apply-toggle') === -1, 'a collapsed rail shows only its toggle');
      });

      s.test('SP-3 the control picker shows title, type AND description', function () {
        var w = railProject();
        var on = App.ui.tables.renderToolbar('android.packages', { applyMode: true, applyControlId: w.id }, 2, 2, w.project.controls);
        T.assert(/class="ctl-card-title">No Bluetooth</.test(on), 'title missing');
        T.assert(/class="ctl-card-type">ISM</.test(on), 'type missing');
        T.assert(on.indexOf('Bluetooth radio must be off in the field.') !== -1, 'DESCRIPTION missing — the whole point of SP-3');
        T.assert(new RegExp('class="ctl-card active" data-rail-control="' + w.id + '"').test(on), 'selection not marked');
        T.assert(on.indexOf('apply-control-list') === -1, 'the old datalist must be gone');
      });

      s.test('SP-3 a control with no description says so rather than rendering blank', function () {
        ensureA(); App.store.init(App.store.empty('android-adb'));
        App.store.onboardDevice({ name: 'SP2', model: 'M1', snapshots: {
          'android.packages': snapB('android.packages', 'com.a'),
          'android.tactical': snapB('android.tactical', '{"enabled":true}') } });
        var id = App.store.addControl({ title: 'Bare', type: 'Custom' }).id;
        var on = App.ui.tables.renderToolbar('android.packages', { applyMode: true, applyControlId: id }, 1, 1, App.store.getProject().controls);
        T.assert(/No description — add one in Control Manager\./.test(on), 'an empty description should prompt for one');
      });

      s.test('SP-3 the rail filter narrows the control list by title, type or description', function () {
        var w = railProject();
        function cards(html) { return (html.match(/data-rail-control="/g) || []).length; }
        var all = App.ui.tables.renderToolbar('android.packages', { applyMode: true }, 2, 2, w.project.controls);
        T.assertEqual(cards(all), 2, 'both controls should show unfiltered');
        var byTitle = App.ui.tables.renderToolbar('android.packages', { applyMode: true, railSearch: 'debloat' }, 2, 2, w.project.controls);
        T.assertEqual(cards(byTitle), 1);
        var byDesc = App.ui.tables.renderToolbar('android.packages', { applyMode: true, railSearch: 'vendor apps' }, 2, 2, w.project.controls);
        T.assertEqual(cards(byDesc), 1, 'the filter must search descriptions too');
        var none = App.ui.tables.renderToolbar('android.packages', { applyMode: true, railSearch: 'zzz' }, 2, 2, w.project.controls);
        T.assert(/No control matches that filter/.test(none), 'an empty result must say so');
      });

      s.test('SP-3/BULK-1 the apply-to-all-shown button lives in the rail, for EVERY dataset', function () {
        var w = railProject();
        var pkg = App.ui.tables.renderToolbar('android.packages', { applyMode: true, applyControlId: w.id }, 2, 2, w.project.controls);
        T.assert(/data-apply-all="android.packages"/.test(pkg), 'packages should offer apply-to-all');
        T.assert(pkg.indexOf('data-apply-all') > pkg.indexOf('side-rail'), 'it belongs in the rail');
        // Unlike the old enum-keyed dropdown this is dataset-agnostic, so tactical gets it too.
        var tac = App.ui.tables.renderToolbar('android.tactical', { applyMode: true, applyControlId: w.id }, 2, 2, w.project.controls);
        T.assert(/data-apply-all="android.tactical"/.test(tac), 'tactical should offer it as well now');
      });
    });

    T.suite('v2.0 Settings retirement (legacy projects still load)', function (s) {
      var RETIRED = 'android.settings';

      /** A v1.x-shaped project text: valid apart from carrying the retired dataset. */
      function legacyText(extra) {
        ensureA(); App.store.init(App.store.empty('android-adb'));
        App.store.onboardDevice({ name: 'Legacy', model: 'M1', firmware: 'F', snapshots: {
          'android.packages': snapB('android.packages', 'com.a'),
          'android.tactical': snapB('android.tactical', '{"enabled":true}') } });
        App.store.setDecision('android.packages', 'com.a', { action: 'disable' });
        var p = JSON.parse(App.projectIo.serializeProject(App.store.getProject()));
        // Splice the retired dataset back in, exactly as v1.x would have written it.
        p.items[RETIRED] = [
          { key: 'secure/x', decision: { value: '0' }, controlRefs: [], status: 'decided' },
          { key: 'secure/y', decision: null, controlRefs: [], status: 'undecided' }
        ];
        p.deviceConfigs[0].snapshots[RETIRED] = {
          capturedUtc: '2026-01-01T00:00:00.000Z', sourceFilename: 'settings.txt',
          sha256: App.util.hash.sha256Hex('secure:\nx=0'), keys: ['secure/x', 'secure/y'],
          values: { 'secure/x': '0', 'secure/y': '1' }
        };
        p.deviceConfigs[0].overrides = p.deviceConfigs[0].overrides || {};
        p.deviceConfigs[0].overrides[RETIRED] = { 'secure/x': { value: '9' } };
        if (extra) extra(p);
        return JSON.stringify(p);
      }

      s.test('the dataset is gone from the registry and from the active platform', function () {
        ensureA();
        T.assertEqual(App.registry.getDataset('android-adb', RETIRED), null, 'the adapter must be unregistered');
        T.assert(App.registry.datasetIds('android-adb').indexOf(RETIRED) === -1, 'still listed as a platform dataset');
        T.assert(!App.adapters.android.settings, 'the adapter object must not be exported');
      });

      s.test('a legacy project still LOADS, and says loudly what it dropped', function () {
        var res = App.projectIo.parseProject(legacyText());
        T.assertEqual(res.ok, true, 'a v1.x project must still open: ' + JSON.stringify(res.issues));
        T.assert(!(RETIRED in res.value.items), 'retired items must be gone');
        T.assert(!(RETIRED in res.value.deviceConfigs[0].snapshots), 'retired snapshot must be gone');
        T.assert(!res.value.deviceConfigs[0].overrides || !(RETIRED in res.value.deviceConfigs[0].overrides), 'retired override must be gone');
        var w = res.issues.filter(function (i) { return i.location === RETIRED && i.severity === 'warning'; });
        T.assertEqual(w.length, 1, 'exactly one warning expected, got ' + JSON.stringify(res.issues));
        T.assert(/retired/i.test(w[0].message) && /2 register item/.test(w[0].message) && /1 captured/.test(w[0].message),
          'the warning must say what was dropped, got: ' + w[0].message);
      });

      s.test('everything else in the legacy project survives untouched', function () {
        var res = App.projectIo.parseProject(legacyText());
        T.assertEqual(res.value.deviceConfigs.length, 1);
        T.assertDeepEqual(res.value.items['android.packages'][0].decision, { action: 'disable' });
        T.assert(res.value.items['android.tactical'].length >= 1, 'tactical register lost');
        T.assertEqual(res.value.deviceConfigs[0].snapshots['android.packages'].keys.length, 1);
      });

      s.test('a group override on the retired dataset is dropped too', function () {
        var text = legacyText(function (p) {
          p.groups = [{ id: 'g1', name: 'G1', deviceBaseIds: ['legacy-m1'], overrides: { 'android.settings': { 'secure/x': { value: '3' } } } }];
        });
        var res = App.projectIo.parseProject(text);
        T.assertEqual(res.ok, true, JSON.stringify(res.issues));
        T.assert(!res.value.groups[0].overrides || !(RETIRED in res.value.groups[0].overrides), 'group override must be dropped');
      });

      s.test('a project with no retired data is a byte-for-byte no-op (no spurious warning)', function () {
        ensureA(); App.store.init(App.store.empty('android-adb'));
        App.store.onboardDevice({ name: 'Clean', model: 'M1', firmware: 'F', snapshots: {
          'android.packages': snapB('android.packages', 'com.a'),
          'android.tactical': snapB('android.tactical', '{"enabled":true}') } });
        var text = App.projectIo.serializeProject(App.store.getProject());
        var res = App.projectIo.parseProject(text);
        T.assertEqual(res.ok, true);
        T.assertEqual(res.issues.filter(function (i) { return i.location === RETIRED; }).length, 0, 'no warning without retired data');
        T.assertEqual(App.projectIo.serializeProject(res.value), text, 'a clean project must round-trip unchanged');
      });

      s.test('re-saving after the load makes the removal permanent', function () {
        var res = App.projectIo.parseProject(legacyText());
        var text2 = App.projectIo.serializeProject(res.value);
        T.assert(text2.indexOf(RETIRED) === -1, 'the retired id must not survive a re-save');
        var again = App.projectIo.parseProject(text2);
        T.assertEqual(again.ok, true);
        T.assertEqual(again.issues.filter(function (i) { return i.location === RETIRED; }).length, 0, 'the second load must be silent');
      });

      s.test('an UNKNOWN (not merely retired) dataset id is still a hard error', function () {
        var text = legacyText(function (p) {
          p.items['android.bogus'] = [{ key: 'k', decision: null, controlRefs: [], status: 'undecided' }];
        });
        var res = App.projectIo.parseProject(text);
        T.assertEqual(res.ok, false, 'a typo/unknown dataset must not be silently dropped');
        T.assert(res.issues.some(function (i) { return /android\.bogus/.test(i.message) && i.severity === 'error'; }));
      });

      s.test('generation and capture guidance no longer mention Settings', function () {
        var pf = App.registry.getPlatform('android-adb');
        T.assert(!/settings/i.test(pf.captureInstructions), 'capture instructions still mention settings');
        T.assert(!/Verify-Setting/.test(pf.scriptPreamble({ device: { name: 'd', model: 'm', firmware: 'f' }, toolVersion: 'v', generatedUtc: '2026-01-01T00:00:00.000Z' })),
          'the preamble still declares the settings verify helper');
        // Every Help section, not just the default one.
        var H = App.ui.views.help;
        H.SECTIONS.forEach(function (sec) {
          H._help.section = sec.id;
          var html = H.render(null).replace(/imsSettings/g, '');
          T.assert(!/\bSettings\b/.test(html), 'the Help manual still mentions Settings in section "' + sec.id + '"');
        });
        H._help.section = H.SECTIONS[0].id;
      });
    });

  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.bootstrap  — LAST. Registers platforms and mounts the UI.
   * PURPOSE: Wire everything together at startup (spec §14). During Phase 0 it only
   *          renders self-tests on #selftest and a placeholder otherwise.
   * PURITY:  UI/IO
   * DEPENDS: (eventually) App.registry, App.platforms.*, App.ui.app
   * ============================================================================= */
  (function (App) {
    'use strict';

    /** Global error boundary: surface unexpected errors in the drawer, never blank-fail (§12.1). */
    function installErrorBoundary() {
      function report(msg) {
        if (App.ui && App.ui.activity) App.ui.activity.log({ severity: 'error', message: 'Unexpected error: ' + msg });
      }
      window.addEventListener('error', function (e) { report((e && e.message) || 'script error'); });
      window.addEventListener('unhandledrejection', function (e) { report((e && e.reason && (e.reason.message || e.reason)) || 'promise rejection'); });
    }

    function boot() {
      var root = document.getElementById('root');
      var isSelfTest = window.location.hash.replace('#', '') === 'selftest';

      // Register platform profiles (spec §14: register, then mount). Adding a new
      // platform means ONE more registerPlatform call here — zero core edits (DOD-11).
      if (App.platforms && App.platforms.androidAdb && !App.registry.hasPlatform('android-adb')) {
        App.registry.registerPlatform(App.platforms.androidAdb);
      }

      if (isSelfTest) {
        App.test.runAndRender(root);
        return;
      }

      installErrorBoundary();

      // Phase 0 placeholder UI; replaced by App.ui.app.mount in later phases.
      if (App.ui && App.ui.app && typeof App.ui.app.mount === 'function') {
        App.ui.app.mount(root);
      } else {
        root.innerHTML =
          '<div style="padding:24px">' +
          '<h1>CH Config Tool</h1>' +
          '<p>Skeleton loaded. Append <code>#selftest</code> to the URL to run the embedded test suite.</p>' +
          '</div>';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })(App);
  </script>
