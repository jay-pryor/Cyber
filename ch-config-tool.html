      var sel = {}; (refs || []).forEach(function (r) { sel[r] = true; });
      var opts = controls.slice().sort(function (a, b) { return a.title < b.title ? -1 : a.title > b.title ? 1 : 0; })
        .map(function (c) {
          // Show the control title only (review-5 follow-up): the "(TYPE)" suffix is
          // unnecessary noise in the selection list.
          return '<label class="ctl-opt" data-ctl-opt>' +
            '<input type="checkbox" data-control-ref-toggle data-ds="' + esc(dsId) + '" data-key="' + esc(key) + '" data-control-id="' + esc(c.id) + '"' + (sel[c.id] ? ' checked' : '') + '> ' +
            '<span>' + esc(c.title) + '</span></label>';
        }).join('');
      var count = (refs || []).length;
      return '<div class="control-multiselect" data-control-multiselect>' +
        '<input type="search" class="ctl-opt-search" data-control-search placeholder="Filter controls…" aria-label="Filter controls">' +
        '<div class="ctl-opts">' + opts + '</div>' +
        '<div class="muted ctl-opt-count" style="font-size:11px">' + count + ' selected</div>' +
        '</div>';
    }

    /**
     * The Security Relevance cell (review-12 #3): a <select> wearing the badge skin, so
     * an unset value reads as a plain "—" and a set one reads as a coloured badge
     * (HIGH red / MEDIUM orange / CONTEXT blue) that is still editable in place.
     */
    function relevanceCell(dsId, item) {
      var cur = item.relevance || '';
      var opts = [''].concat(App.projectIo.RELEVANCE_OPTIONS).map(function (o) {
        return '<option value="' + esc(o) + '"' + (cur === o ? ' selected' : '') + '>' + (o ? esc(o) : '—') + '</option>';
      }).join('');
      return '<td class="rel-cell"><select class="rel-select ' + relevanceClass(cur) + '" data-relevance data-ds="' + esc(dsId) + '" data-key="' + esc(item.key) + '"' +
        ' aria-label="Security Relevance for ' + esc(item.key) + '" title="Security Relevance (optional)">' + opts + '</select></td>';
    }
    /** @returns {string} the badge modifier class for a relevance value ('' ⇒ none). */
    function relevanceClass(v) {
      return v ? 'rel-' + String(v).toLowerCase() : '';
    }
    /** A read-only Security Relevance badge (used outside the editable table). */
    function relevanceBadge(v) {
      return v ? '<span class="badge ' + relevanceClass(v) + '">' + esc(v) + '</span>' : '';
    }

    /**
     * VF-4: the per-item "Value format" row in the expander — a picker over the
     * built-ins plus the project's named formats, a live hint describing the current
     * one, and a button into the format manager. Only rendered for datasets whose
     * primary decision is a VALUE (a packages action is already a closed enum).
     */
    function formatPicker(dsId, item, project, adapter, captured) {
      var VF = App.valueFormats;
      var schema = (adapter && adapter.decisionSchema) || [];
      var primary = schema[0];
      if (!VF || !primary || (primary.kind !== 'value-typed' && primary.kind !== 'string')) return '';
      var cap = captured && captured[item.key];
      var capType = cap ? cap.type : undefined;
      var cur = VF.resolve(project, item, capType, cap ? cap.value : undefined);
      var inferredId = VF.inferId(capType, cap ? cap.value : undefined);
      var all = VF.list(project);
      var builtins = all.filter(function (f) { return f.builtin; });
      var customs = all.filter(function (f) { return !f.builtin; });
      function opt(f) {
        var label = f.name + (f.id === inferredId && !item.format ? ' (inferred from capture)' : '');
        return '<option value="' + esc(f.id) + '"' + (item.format === f.id ? ' selected' : '') + '>' + esc(label) + '</option>';
      }
      var html = '<select data-format-pick ' + 'data-ds="' + esc(dsId) + '" data-key="' + esc(item.key) + '" aria-label="Value format">' +
        '<option value=""' + (item.format ? '' : ' selected') + '>Automatic — ' + esc((BUILTIN_NAME[inferredId] || inferredId)) + ' (from the capture)</option>' +
        '<optgroup label="Standard formats">' + builtins.map(opt).join('') + '</optgroup>' +
        (customs.length ? '<optgroup label="Project formats">' + customs.map(opt).join('') + '</optgroup>' : '') +
        '</select>';
      var hint = cur.danglingRef
        ? '<span class="fmt-warn">Format &ldquo;' + esc(cur.danglingRef) + '&rdquo; no longer exists — using ' + esc(cur.name) + '.</span>'
        : '<span class="muted">' + esc(cur.hint || cur.description || describeFormat(cur)) + '</span>';
      return '<label>Value format</label><div class="fmt-cell">' + html +
        ' <button type="button" data-format-manage title="Create and edit the project\'s named value formats">Manage…</button>' +
        '<div class="fmt-hint">' + hint + '</div></div>';
    }
    var BUILTIN_NAME = { bool: 'Boolean', number: 'Number', string: 'Text', stringArray: 'String list', json: 'JSON value' };
    /** One line describing what a custom format allows (shown under the picker). */
    function describeFormat(f) {
      if (f.kind === 'options') {
        var vals = (f.options || []).map(function (o) { return o.value; });
        return vals.length ? 'Allowed: ' + vals.join(', ') : 'No options defined yet — any text is accepted until you add some.';
      }
      if (f.kind === 'number') return 'A number' + (typeof f.min === 'number' || typeof f.max === 'number' ? ' between ' + (f.min != null ? f.min : '−∞') + ' and ' + (f.max != null ? f.max : '∞') : '') + '.';
      if (f.kind === 'stringArray') return 'A list of strings, one per line.';
      return 'Free text.';
    }

    function renderDetailRow(dsId, item, colspan, issues, controls, project, adapter, captured) {
      var key = item.key;
      var iss = (issues && issues[dsId + '|' + key]) || [];
      var issHtml = iss.length ? '<div class="detail-issues">' + iss.map(function (i) {
        return '<div class="issue ' + esc(i.severity) + '">' + esc(i.severity.toUpperCase()) + ': ' + esc(i.message) + '</div>';
      }).join('') + '</div>' : '';
      var dk = 'data-ds="' + esc(dsId) + '" data-key="' + esc(key) + '"';
      var fld = function (field, label, ta, val) {
        var common = 'data-field-edit="' + field + '" ' + dk;
        return '<label for="">' + esc(label) + '</label>' + (ta
          ? '<textarea ' + common + '>' + esc(val || '') + '</textarea>'
          : '<input type="text" ' + common + ' value="' + esc(val || '') + '">');
      };
      // Rationale gets a quick-fill preset button to the right (review-3 #4).
      var rationaleCell = '<label>Rationale</label><div class="rationale-cell">' +
        '<textarea data-field-edit="rationale" ' + dk + '>' + esc(item.rationale || '') + '</textarea>' +
        '<button type="button" data-action="rationale-preset" ' + dk + ' title="Fill the rationale with the standard not-required note">Set to "Not required for device use-case"</button>' +
        '</div>';
      return '<tr class="detail-row"><td colspan="' + colspan + '"><div class="detail-form">' +
        fld('description', 'Description', true, item.description) +
        '<label>Control Refs</label>' + controlSelect(dsId, key, item.controlRefs, controls || []) +
        rationaleCell +
        fld('rollback', 'Rollback', true, item.rollback) +
        formatPicker(dsId, item, project, adapter, captured) +
        issHtml +
        '</div></td></tr>';
    }

    /**
     * Render the data table (header + body), with inline decision editing and a
     * per-row expander for description/ISM/rationale/rollback (spec §11.2).
     * @param {Project} project
     * @param {string} dsId
     * @param {Object} ui   per-dataset UI state (search/sort/incompleteOnly/expanded)
     * @param {{issues?:Object}} [opts]
     * @returns {string} HTML
     */
    function renderTableHtml(project, dsId, ui, opts) {
      opts = opts || {};
      var expanded = ui.expanded || {};
      var adapter = App.registry.getDataset(project.platformProfileId, dsId);
      if (!adapter) return '<div class="empty-state">No adapter for ' + esc(dsId) + '.</div>';
      var captured = buildCapturedMap(project, dsId, adapter);
      var controls = project.controls || [];
      var controlsById = {}; controls.forEach(function (c) { controlsById[c.id] = c; });
      // review-12 #3: "Security Relevance" is a core (dataset-independent) column, so it
      // is appended here for every dataset rather than duplicated in each adapter.
      var cols = adapter.columns.map(function (c) { return { key: c.key, label: c.label }; })
        .concat([{ key: 'relevance', label: 'Security Relevance' }, { key: 'appliesTo', label: 'Applies to' }, { key: 'status', label: 'Status' }]);
      var rows = App.ui.model.filterSortRows(project, dsId, adapter, ui);
      var sk = ui.sortKey || 'key', sdir = ui.sortDir || 'asc';
      // review-7 #2: an extra checkbox column when Apply Control Mode is on.
      var applyMode = !!ui.applyMode, applyControlId = ui.applyControlId;
      // review-12 #2: likewise for Delete Mode (the two modes are mutually exclusive).
      var deleteMode = !!ui.deleteMode, deleteSel = ui.deleteSel || {};
      var colspan = cols.length + 1 + (applyMode ? 1 : 0) + (deleteMode ? 1 : 0); // + leading expander (+ mode col)

      var colWidths = ui.colWidths || {};
      var head = '<th class="lead-col" scope="col" aria-label="expand"></th>' + cols.map(function (c) {
        var arrow = (c.key === sk) ? ' <span class="arrow">' + (sdir === 'asc' ? '▲' : '▼') + '</span>' : '';
        var w = colWidths[c.key] || colDefaultWidth(c.key, dsId);
        return '<th data-col="' + esc(c.key) + '" scope="col" style="width:' + w + 'px">' + esc(c.label) + arrow +
          '<span class="col-resize" data-col-resize="' + esc(c.key) + '" title="Drag to resize"></span></th>';
      }).join('') + (applyMode ? '<th class="apply-col" scope="col" title="Tick to add the selected control ref">✓ Apply</th>' : '') +
        (deleteMode ? '<th class="del-col" scope="col" title="Tick the items to delete, then click Delete selected">🗑 Delete</th>' : '');

      var body = rows.map(function (r) {
        var isOpen = !!expanded[r.item.key];
        var lead = '<td><button class="expand-btn" data-expand-key="' + esc(r.item.key) + '" aria-expanded="' + isOpen + '" title="Edit details">' + (isOpen ? '▾' : '▸') + '</button></td>';
        var tds = adapter.columns.map(function (c) {
          if (c.key === 'decision') {
            var iss = (opts.issues && opts.issues[dsId + '|' + r.item.key]) || [];
            // VF-7: a value that violates its declared format is invalid even when the
            // adapter is happy with it, and the reason is shown in the cell's title so
            // the operator is not left guessing why a row is tinted.
            var fIss = (App.completeness && App.completeness.formatIssues)
              ? App.completeness.formatIssues(adapter, r.item, project, captured) : [];
            var allIss = iss.concat(fIss);
            var invalid = allIss.some(function (i) { return i.severity === 'error'; });
            var why = invalid ? ' title="' + esc(allIss.map(function (i) { return i.message; }).join(' ')) + '"' : '';
            return '<td class="dcell' + (invalid ? ' invalid' : '') + '" data-ds="' + esc(dsId) + '" data-key="' + esc(r.item.key) + '"' + why + '>' +
              renderDecisionControl(adapter, dsId, r.item, captured, project) + '</td>';
          }
          if (c.key === 'controlRefs') {
            // Resolve control ids to titles for display (spec §18.3 CTL-5).
            var titles = (r.item.controlRefs || []).map(function (id) { return controlsById[id] ? controlsById[id].title : id; });
            // STAB-1: clamped — this is the cell that grows the instant you tick Apply.
            return '<td>' + clampCell(titles.join(', ')) + '</td>';
          }
          return '<td>' + esc(r.cells[c.key] == null ? '' : r.cells[c.key]) + '</td>';
        }).join('');
        tds += relevanceCell(dsId, r.item);
        tds += '<td>' + clampCell(r.appliesTo.join(', ')) + '</td>';   // STAB-1
        // review-17 #3: the status badge is a toggle — clicking it flips the item
        // between decided (adopting what the value editor shows) and undecided.
        var statusAttrs = ' role="button" tabindex="0" data-status-toggle data-ds="' + esc(dsId) + '" data-key="' + esc(r.item.key) + '"';
        // HELD-1: three states, not two. A HELD item is undecided *and* still holds its
        // value, so it gets its own badge — otherwise you could not tell, at a glance,
        // which undecided rows are "never answered" and which are "answered, re-check me".
        tds += '<td>' + (r.item.held
          ? '<span class="badge held flip"' + statusAttrs + ' title="Flagged for review — the recorded value is kept. Click to accept it and mark this item decided.">review</span>'
          : r.item.status === 'decided'
            ? '<span class="badge decided flip"' + statusAttrs + ' title="Click to flag for review — the value is kept, the item just stops counting as decided">decided</span>'
            : '<span class="badge undecided flip"' + statusAttrs + ' title="Click to accept the value shown and mark this item decided">undecided</span>') + '</td>';
        if (applyMode) {
          // Checked iff the SELECTED control is already in this item's controlRefs
          // (so the box always reflects current membership).
          var checked = applyControlId && (r.item.controlRefs || []).indexOf(applyControlId) !== -1;
          // BULK-2: the whole cell is the hit target, not just the ~13px box. A <label>
          // filling the cell means a click anywhere in the column toggles it — and it
          // stays a real checkbox for keyboard and screen readers, which a click handler
          // bolted onto the <td> would not be.
          tds += '<td class="apply-cell"><label class="cell-check"><input type="checkbox" data-apply-check data-key="' + esc(r.item.key) + '"' + (checked ? ' checked' : '') + (applyControlId ? '' : ' disabled') + ' aria-label="apply the selected control to ' + esc(r.item.key) + '"></label></td>';
        }
        var marked = deleteMode && !!deleteSel[r.item.key];
        if (deleteMode) {
          // BULK-2: same click-anywhere target as the apply column.
          tds += '<td class="del-cell"><label class="cell-check"><input type="checkbox" data-delete-check data-key="' + esc(r.item.key) + '"' + (marked ? ' checked' : '') + ' aria-label="delete ' + esc(r.item.key) + '"></label></td>';
        }
        var rowHtml = '<tr class="' + (r.status === 'decided' ? '' : 'undecided') + (marked ? ' del-marked' : '') + '">' + lead + tds + '</tr>';
        if (isOpen) rowHtml += renderDetailRow(dsId, r.item, colspan, opts.issues, controls, project, adapter, captured);
        return rowHtml;
      }).join('');

      if (!rows.length) body = '<tr><td colspan="' + colspan + '" class="muted">No matching items.</td></tr>';

      return '<table class="data resizable"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
    }

    App.ui = App.ui || {};
    App.ui.tables = {
      renderToolbar: renderToolbar, renderTableHtml: renderTableHtml, buildCapturedMap: buildCapturedMap,
      // VF-8: shared so the device/group OVERRIDE editors get the same format-driven
      // controls as the data table — a boolean must not be a textarea in one place and
      // a true/false picker in the other.
      renderValueEditor: renderValueEditor,
      relevanceBadge: relevanceBadge, relevanceClass: relevanceClass,
      undoTitle: undoTitle, redoTitle: redoTitle, UNDO_OFF_TITLE: UNDO_OFF_TITLE, REDO_OFF_TITLE: REDO_OFF_TITLE
    };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.views.onboard
   * PURPOSE: The Onboard tab (spec §11.4): one data-driven file slot per
   *          active-platform dataset), name/model/firmware fields, a gated Onboard
   *          button, capture help, and a triage summary. Re-onboard aware (§8.7).
   * PURITY:  UI/DOM
   * DEPENDS: App.registry, App.store, App.validation, App.util.*, App.ui.activity
   * INVARIANTS: Onboard is disabled until ALL slots parse without errors AND a
   *             non-empty name is given; identical re-onboard is a no-op.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var dom = App.util.dom, esc = App.util.html.esc;

    // View-local state (not canonical; just the in-progress form).
    var _ob = { fields: { name: '', model: '', firmware: '' }, slots: {} };
    var _ctx = null;

    function activePlatform() { return App.registry.getActivePlatform(); }
    function datasets() { var p = activePlatform(); return p ? p.datasets : []; }

    function slotState(dsId) { return _ob.slots[dsId] || null; }
    function allSlotsOk() {
      return datasets().every(function (ds) {
        var s = slotState(ds.id);
        return s && s.parse && s.parse.errors.length === 0;
      });
    }
    function nameOk() { return !!(_ob.fields.name && _ob.fields.name.trim()); }
    function canOnboard() { return allSlotsOk() && nameOk(); }

    /** Detect whether the current name/model would re-onboard an existing device. */
    function reonboardTarget(project) {
      if (!project || !nameOk()) return null;
      var baseId = App.store.slugify(_ob.fields.name + '-' + _ob.fields.model) || App.store.slugify(_ob.fields.name);
      var latest = App.store.getLatestConfigs(project).filter(function (c) { return c.baseId === baseId; });
      return latest.length ? latest[0] : null;
    }

    function render(project) {
      var ds = datasets();
      var slotsHtml = ds.map(function (d) {
        var s = slotState(d.id);
        var status, cls;
        if (!s) { status = 'No file selected'; cls = 'muted'; }
        else if (s.parse && s.parse.errors.length) { status = '✗ ' + s.parse.errors[0].message; cls = 'error'; }
        else if (s.parse) { status = '✓ ' + s.parse.keys.length + ' items' + (s.parse.warnings.length ? ' (' + s.parse.warnings.length + ' warning' + (s.parse.warnings.length > 1 ? 's' : '') + ')' : ''); cls = 'success'; }
        else { status = 'Reading…'; cls = 'muted'; }
        return '' +
          '<div class="onboard-slot" style="margin-bottom:12px;padding:10px;border:1px solid var(--c-border);border-radius:6px;background:var(--c-surface)">' +
          '<strong>' + esc(d.label) + '</strong> <span class="muted" style="font-size:12px">(' + esc(d.inputKind) + ')</span><br>' +
          '<span class="muted" style="font-size:12px">' + esc(d.captureHint) + '</span><br>' +
          '<input type="file" data-onboard-file="' + esc(d.id) + '" aria-label="' + esc(d.label) + ' capture file" style="margin-top:6px">' +
          '<div class="' + cls + '" data-onboard-status="' + esc(d.id) + '" style="font-family:var(--mono);font-size:12px;margin-top:4px">' + esc(status) + '</div>' +
          '</div>';
      }).join('');

      var ro = reonboardTarget(project);
      var roNote = ro
        ? '<div class="warning" style="margin:8px 0">This will re-onboard <strong>' + esc(ro.name) + '</strong> (creates a new version, or a no-op if snapshots are unchanged).</div>'
        : '';

      var instructions = activePlatform() ? activePlatform().captureInstructions : '';

      return '' +
        '<div style="max-width:760px">' +
        '<h2>Onboard a device</h2>' +
        '<details style="margin-bottom:12px"><summary>Capture instructions</summary><pre class="mono" style="white-space:pre-wrap;background:var(--c-surface-alt);padding:10px;border-radius:6px">' + esc(instructions) + '</pre></details>' +
        '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">' +
          field('name', 'Device name *', _ob.fields.name) +
          field('model', 'Model', _ob.fields.model) +
          field('firmware', 'Firmware', _ob.fields.firmware) +
        '</div>' +
        slotsHtml +
        roNote +
        '<button class="primary" data-onboard-action="onboard"' + (canOnboard() ? '' : ' disabled') + ' style="margin-top:8px">Onboard</button>' +
        '<span class="muted" data-onboard-hint style="margin-left:10px">' + esc(canOnboard() ? 'Ready.' : 'Provide all files (no errors) and a device name.') + '</span>' +
        '</div>';
    }

    function field(name, label, val) {
      return '<label style="display:flex;flex-direction:column;font-size:12px;color:var(--c-text-muted)">' + esc(label) +
        '<input type="text" data-onboard-field="' + esc(name) + '" value="' + esc(val) + '" style="font-size:14px;color:var(--c-text);padding:5px 7px;border:1px solid var(--c-border);border-radius:6px;min-width:200px"></label>';
    }

    /** Update only the Onboard button + hint (no full re-render; preserves focus). */
    function refreshButton() {
      if (!_ctx) return;
      var btn = _ctx.root.querySelector('[data-onboard-action="onboard"]');
      var hint = _ctx.root.querySelector('[data-onboard-hint]');
      if (btn) btn.disabled = !canOnboard();
      if (hint) hint.textContent = canOnboard() ? 'Ready.' : 'Provide all files (no errors) and a device name.';
    }

    function handleFile(dsId, file) {
      if (!file) return;
      var adapter = App.registry.getDataset(activePlatform().id, dsId);
      _ob.slots[dsId] = { filename: file.name, text: null, sha256: null, parse: null };
      _ctx.refreshMain();
      dom.readFileText(file).then(function (text) {
        var pr = adapter.parse(text);
        _ob.slots[dsId] = { filename: file.name, text: text, sha256: App.util.hash.sha256Hex(text), parse: pr };
        App.ui.activity.logIssues(pr.errors, dsId);
        App.ui.activity.logIssues(pr.warnings, dsId);
        if (!pr.errors.length) App.ui.activity.log({ severity: 'info', message: dsId + ': parsed ' + pr.keys.length + ' items from ' + file.name + '.' });
        _ctx.refreshMain();
      }).catch(function (err) {
        _ob.slots[dsId] = { filename: file.name, parse: { items: [], keys: [], warnings: [], errors: [{ category: 'parse', severity: 'error', message: 'Read failed: ' + (err && err.message), location: 'file' }] } };
        _ctx.refreshMain();
      });
    }

    function doOnboard() {
      var project = App.store.getProject();
      var ds = datasets();
      // Defensive: re-check validation just before commit.
      var parsed = {}; ds.forEach(function (d) { parsed[d.id] = slotState(d.id) ? slotState(d.id).parse : null; });
      var vIssues = App.validation.validateOnboarding({ name: _ob.fields.name, parsed: parsed }, ds.map(function (d) { return d.id; }));
      if (vIssues.length) { App.ui.activity.logIssues(vIssues, 'Onboard blocked'); return; }

      // Onboarding from scratch: create an empty project for the active platform.
      if (!project) { App.store.init(App.store.empty(activePlatform().id)); }

      var snapshots = {}, descriptions = {};
      ds.forEach(function (d) {
        var s = slotState(d.id), pr = s.parse;
        var snap = { capturedUtc: App.util.clock.nowIso(), sourceFilename: s.filename, sha256: s.sha256, keys: pr.keys };
        if (pr.values) snap.values = pr.values;
        if (pr.template !== undefined) snap.template = pr.template;
        snapshots[d.id] = snap;
        // review-10 #3: carry any descriptions the capture parser imported.
        if (pr.descriptions && Object.keys(pr.descriptions).length) descriptions[d.id] = pr.descriptions;
      });

      var res = App.store.onboardDevice({ name: _ob.fields.name, model: _ob.fields.model, firmware: _ob.fields.firmware, snapshots: snapshots, descriptions: descriptions });
      App.ui.activity.logIssues(res.issues);
      if (!res.ok) return;

      if (res.result.noop) { return; } // logged "nothing to do"; stay on Onboard

      // Per-dataset triage breakdown to the drawer.
      ds.forEach(function (d) {
        var pd = res.result.perDataset[d.id];
        App.ui.activity.log({ severity: 'info', message: d.label + ': ' + pd.newCount + ' new, ' + pd.existingCount + ' inherited.' });
      });

      // Reset the form and switch focus to the first dataset (review-4 #2: land with
      // the Incomplete-only filter UNticked so the full list shows by default).
      _ob = { fields: { name: '', model: '', firmware: '' }, slots: {} };
      _ctx.switchTab(ds[0].id);
    }

    function wire(ctx) {
      _ctx = ctx;
      dom.on(ctx.root, 'change', '[data-onboard-file]', function (e, el) { handleFile(el.getAttribute('data-onboard-file'), el.files[0]); });
      dom.on(ctx.root, 'input', '[data-onboard-field]', function (e, el) { _ob.fields[el.getAttribute('data-onboard-field')] = el.value; refreshButton(); });
      dom.on(ctx.root, 'click', '[data-onboard-action="onboard"]', function () { doOnboard(); });
    }

    App.ui = App.ui || {};
    App.ui.views = App.ui.views || {};
    App.ui.views.onboard = { render: render, wire: wire };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.views.generate
   * PURPOSE: The Generate tab (spec §11.5): device selector + three INDEPENDENT
   *          commands (Implementation/Verification/Reporting), each enabled iff the
   *          device is ready, disabled buttons explaining why. Generation itself is
   *          wired to App.generate when present (Phase 7); until then it logs intent.
   * PURITY:  UI/DOM
   * DEPENDS: App.store, App.completeness, App.ui.model, App.util.*, App.ui.activity
   * INVARIANTS: a command is enabled ⇔ App.completeness.deviceReady(project, id).

  (function (App) {
    'use strict';
    var esc = App.util.html.esc;

    // ---- option checkbox helpers (missing-key ⇒ included for include-maps) ----
    function incMapOn(block, map, ds, key) {
      var m = (_gen[block][map]) || {};

    }
    function cb(attrs, label, on) {
      return '<label class="gen-opt"><input type="checkbox" ' + attrs + (on ? ' checked' : '') + '> ' + esc(label) + '</label>';
    }

    /** Per-command options panel (spec §20.8), fully data-driven from the platform. */

      var dss = platform.datasets, parts = [];
      function adapterFor(dsId) { return App.registry.getDataset(project.platformProfileId, dsId); }

          } else {
            parts.push(cb('data-gen-block="report" data-gen-map="datasetSections" data-gen-ds="' + esc(ds.id) + '" data-gen-key="_all"', ds.label, incMapOn('report', 'datasetSections', ds.id, '_all')));
          }
        });
        parts.push(cb('data-gen-block="report" data-gen-flag="sections.control"', 'Control coverage', _gen.report.sections.control !== false));
        parts.push(cb('data-gen-block="report" data-gen-flag="sections.deviations"', 'Deviations from default', _gen.report.sections.deviations !== false));
        parts.push('</div>');
        var colGrp = ['<div class="gen-opt-grp"><strong>Columns</strong>'];
        dss.forEach(function (ds) {
          var a = adapterFor(ds.id); var optCols = ((a && a.reportColumns) || []).filter(function (c) { return c.optional; });
          if (!optCols.length) return;
          colGrp.push('<div class="gen-opt-sub"><em>' + esc(ds.label) + '</em>' +
            optCols.map(function (c) { return cb('data-gen-block="report" data-gen-map="columns" data-gen-ds="' + esc(ds.id) + '" data-gen-key="' + esc(c.id) + '"', c.label, incMapOn('report', 'columns', ds.id, c.id)); }).join('') + '</div>');
        });
        colGrp.push('</div>'); parts.push(colGrp.join(''));

      } else if (cmd.id === 'control') {

        parts.push(cb('data-gen-block="control" data-gen-flag="includeUncontrolled"', 'Include items with no control', _gen.control.includeUncontrolled === true));
      } else if (cmd.id === 'implementation') {
        parts.push('<div class="gen-opt-grp"><strong>Datasets</strong>');
        dss.forEach(function (ds) {
          parts.push(cb('data-gen-block="implementation" data-gen-map="datasets" data-gen-ds="' + esc(ds.id) + '"', ds.label, incMapOn('implementation', 'datasets', ds.id, null)));
          var a = adapterFor(ds.id); var enumF = ((a && a.decisionSchema) || []).filter(function (f) { return f.kind === 'enum'; })[0];

              enumF.options.map(function (o) { return cb('data-gen-block="implementation" data-gen-map="actions" data-gen-ds="' + esc(ds.id) + '" data-gen-key="' + esc(o) + '"', o, incMapOn('implementation', 'actions', ds.id, o)); }).join('') + '</div>');
          }

      } else if (cmd.id === 'verification') {
        parts.push('<div class="gen-opt-grp"><strong>Datasets</strong>');
        dss.forEach(function (ds) { parts.push(cb('data-gen-block="verification" data-gen-map="datasets" data-gen-ds="' + esc(ds.id) + '"', ds.label, incMapOn('verification', 'datasets', ds.id, null))); });

      }
      return parts.join('');
    }

    function latest(project) { return App.ui.model.getLatestConfigs(project); }
    function selectedId(project) {
      var l = latest(project);
      if (_gen.deviceId && l.some(function (c) { return c.id === _gen.deviceId; })) return _gen.deviceId;
      return l.length ? l[0].id : null;
    }
    function reasonText(readiness) {
      if (readiness.ready) return '';
      return readiness.reasons.map(function (r) { return r.undecided + ' ' + r.label.toLowerCase() + ' undecided'; }).join(', ');
    }

    function render(project) {
      if (!project) return '<div class="empty-state"><h2>Generate</h2><p>Load a project or onboard a device first.</p></div>';
      var l = latest(project);
      if (!l.length) return '<div class="empty-state"><h2>Generate</h2><p>No device configurations yet — onboard a device.</p></div>';
      var selId = selectedId(project);
      var readiness = App.completeness.deviceReadiness(project, selId);
      var why = reasonText(readiness);
      var dc = l.filter(function (c) { return c.id === selId; })[0];

      var opts = l.map(function (c) {
        return '<option value="' + esc(c.id) + '"' + (c.id === selId ? ' selected' : '') + '>' + esc(c.name) + ' (v' + c.version + ', ' + esc(c.model) + ')</option>';
      }).join('');

      var statusLine = readiness.ready
        ? '<span class="gen-ready">Ready — all applicable items decided.</span>'
        : '<span class="gen-blocked">Blocked: ' + esc(why) + '.</span>';

      var platform = App.registry.getPlatform(project.platformProfileId);
      var cards = COMMANDS.map(function (cmd) {
        var dis = readiness.ready ? '' : ' disabled';
        var open = !!_gen.openOptions[cmd.id];
        var optsPanel = open ? '<div class="gen-options">' + renderOptions(cmd, project, platform) + '</div>' : '';
        return '<div class="gen-card">' +
          '<h3>' + esc(cmd.label) + '</h3>' +
          '<button class="primary" data-generate-action="' + cmd.id + '"' + dis + '>Generate ' + esc(cmd.label) + '</button>' +
          ' <button class="gen-options-toggle" data-gen-options-toggle="' + cmd.id + '" aria-expanded="' + open + '">' + (open ? 'Hide options' : 'Options ▾') + '</button>' +
          '<div class="why">' + (readiness.ready ? '' : esc(why)) + '</div>' +

          '</div>';
      }).join('');

      return '<div style="max-width:820px"><h2>Generate</h2>' +
        '<label class="platform">Device <select data-generate-device>' + opts + '</select></label>' +
        '<p>' + statusLine + '</p>' +
        '<label style="display:inline-flex;align-items:center;gap:6px;margin:4px 0 4px">' +
          '<input type="checkbox" data-generate-txt' + (_gen.scriptsAsTxt ? ' checked' : '') + '> Output scripts as <code>.txt</code> instead of <code>.ps1</code></label>' +
        // review-10 #1: HighCom-network warning about .ps1 handling (theme-aware box).
        '<div class="warning" style="margin:0 0 10px;padding:8px 10px;border:1px solid var(--c-undecided-border);border-left-width:4px;border-radius:6px;background:var(--c-warn-bg);color:var(--c-text);font-size:13px">' +
          '<strong style="color:var(--c-warn)">⚠ HighCom network note:</strong> HighCom computers block opening a folder that contains <code>.ps1</code> files. ' +
          'Generate the scripts as <code>.txt</code> (tick the box above), transfer them to a non-HighCom machine, then rename them back to <code>.ps1</code> before running.' +
        '</div>' +
        '<div class="gen-grid">' + cards + '</div>' +
        '<p class="muted">Each command produces a single <code>.zip</code> download. Outputs are deterministic for identical inputs.</p>' +
        '</div>';

    function doGenerate(cmdId) {
      var project = App.store.getProject(); if (!project) return;
      var selId = selectedId(project);
      if (!App.completeness.deviceReady(project, selId)) {
        App.ui.activity.log({ severity: 'warning', message: 'Cannot generate: device not ready.' });
        return;
      }

      dom.on(ctx.root, 'click', '[data-gen-options-toggle]', function (e, el) {

        _gen.openOptions[id] = !_gen.openOptions[id]; ctx.refreshMain();
      });

        var block = el.getAttribute('data-gen-block'), field = el.getAttribute('data-gen-flag');
        var obj = _gen[block], parts = field.split('.');
        for (var i = 0; i < parts.length - 1; i++) { obj[parts[i]] = obj[parts[i]] || {}; obj = obj[parts[i]]; }
        obj[parts[parts.length - 1]] = el.checked; ctx.refreshMain();
      });

        var m = _gen[block]; m[map] = m[map] || {};

    App.ui.views = App.ui.views || {};

  })(App);

  <script>
  /* =============================================================================
   * MODULE: App.ui.views.devices
   * PURPOSE: The Devices tab (spec §11.3, DOD-9). Lists device configs grouped by
   *          baseId (latest = active; older = superseded read-only history), and a
   *          read-only device-configuration view with one panel per dataset
   *          listing exactly the device's applicable DECIDED items (key/decision/ISM).
   * PURITY:  UI/DOM (render returns strings; no engine mutation)
   * DEPENDS: App.registry, App.store, App.ui.model, App.completeness, App.util.html
   * INVARIANTS: panels show exactly applicable ∩ decided; generation/readiness use
   *             the latest version only.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var esc = App.util.html.esc;
    var _dev = { selectedId: null, assignResults: {}, detailSearch: '', collapsed: {}, openControlId: null, deviationsFirst: false, openGroupId: null, groupAdd: { dsId: null, key: '' }, newGroupName: '', panelColWidths: {} };
    var _devSearchTimer = null;
    var _ctx = null;

    /** Register items applicable to a device for a dataset (pure, from the snapshot). */
    function applicable(project, deviceId, dsId) {
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      if (!dc) return [];
      var snap = dc.snapshots[dsId];
      if (!snap) return [];
      var ks = {}; snap.keys.forEach(function (k) { ks[k] = true; });
      return (project.items[dsId] || []).filter(function (it) { return ks[it.key]; });
    }

    // Derive datasets from the PROJECT's platform (not the globally-active one),
    // so the view is correct even if active≠project platform (D-008).
    function datasets(project) { var p = App.registry.getPlatform(project.platformProfileId); return p ? p.datasets : []; }
    function decisionGet(adapter) {
      var col = adapter.columns.filter(function (c) { return c.key === 'decision'; })[0];
      return col && col.get ? col.get : function (it) { return it.decision ? JSON.stringify(it.decision) : ''; };
    }

    /** The grouped device list (spec §11.3). */
    function renderList(project) {
      if (!project || !project.deviceConfigs.length) {
        return '<div class="empty-state"><h2>Devices</h2><p>No device configurations yet — go to <strong>Onboard</strong>.</p></div>';
      }
      var latestIds = {}; App.ui.model.getLatestConfigs(project).forEach(function (c) { latestIds[c.id] = true; });
      // Group by baseId.
      var groups = {}, order = [];
      project.deviceConfigs.forEach(function (c) { if (!groups[c.baseId]) { groups[c.baseId] = []; order.push(c.baseId); } groups[c.baseId].push(c); });
      order.sort();

      var ds = datasets(project);
      function rowHtml(c, superseded) {
        var counts = ds.map(function (d) {
          var ap = applicable(project, c.id, d.id);
          var dec = ap.filter(function (it) { return it.status === 'decided'; }).length;
          return esc(d.label) + ' ' + dec + '/' + ap.length;
        }).join(' · ');
        var badge;
        if (superseded) badge = '<span class="badge superseded">superseded</span>';
        else {
          var r = App.completeness.deviceReadiness(project, c.id);
          badge = r.ready ? '<span class="badge decided">ready</span>' : '<span class="badge undecided">' + r.totalUndecided + ' undecided</span>';
        }
        // review-12 #1: flag devices that still have controls left unsatisfied. Shown on
        // the active version only (the state is per baseId, not per version).
        var unsatBadge = '';
        if (!superseded) {
          var un = unsatisfiedControls(project, c.baseId);
          if (un.length) {
            unsatBadge = ' <span class="badge unsatisfied dev-unsat" title="' + esc(un.map(function (x) { return x.title; }).join(', ')) + '">⚠ ' + un.length + ' control' + (un.length === 1 ? '' : 's') + ' unsatisfied</span>';
          }
        }
        return '<div class="dev-row' + (superseded ? ' superseded' : '') + '">' +
          '<span class="dev-name">' + esc(c.name) + '</span>' +
          '<span class="dev-meta">' + esc(c.model) + ' · ' + esc(c.firmware) + ' · v' + c.version + '</span>' +
          '<span class="spacer"></span>' +
          '<span class="counts">' + counts + '</span>' +
          badge + unsatBadge +
          ' <button data-device-view="' + esc(c.id) + '">View</button>' +
          '</div>';
      }

      // A version-stack (all versions of one baseId), latest first.
      function stackHtml(baseId) {
        var members = groups[baseId].slice().sort(function (a, b) { return b.version - a.version; });
        return '<div class="dev-group">' + members.map(function (c) { return rowHtml(c, !latestIds[c.id]); }).join('') + '</div>';
      }

      // --- Device-group sections (spec §19.4) ---------------------------------
      // Map each present baseId to its group (if any).
      var groupOf = {}; (project.groups || []).forEach(function (g) { (g.deviceBaseIds || []).forEach(function (b) { groupOf[b] = g; }); });
      // All distinct baseIds present, name-ordered via their latest config name.
      var nameOf = {}; App.ui.model.getLatestConfigs(project).forEach(function (c) { if (nameOf[c.baseId] === undefined) nameOf[c.baseId] = c.name; });
      var allBases = order.slice().sort(function (a, b) { return (nameOf[a] || a) < (nameOf[b] || b) ? -1 : 1; });

      // review-6 #1: a toggle-able dropdown to add/remove a member device (pick a
      // device to add it; pick a current member to remove it). Members are also shown
      // as text so the current membership is clear at a glance.
      function memberSelect(g) {
        var inG = {}; (g.deviceBaseIds || []).forEach(function (b) { inG[b] = true; });
        return '<select class="grp-member-select" data-group-member-select data-group-id="' + esc(g.id) + '" aria-label="add or remove a device">' +
          '<option value="">+ / − device…</option>' +
          allBases.map(function (b) {
            return '<option value="' + esc(b) + '">' + (inG[b] ? '✓ ' : '') + esc(nameOf[b] || b) + (inG[b] ? ' — remove' : ' — add') + '</option>';
          }).join('') + '</select>';
      }
      function groupSection(g) {
        var members = allBases.filter(function (b) { return groupOf[b] && groupOf[b].id === g.id; });
        var stacks = members.length ? members.map(stackHtml).join('') : '<p class="muted" style="padding:6px 10px">No devices in this group yet.</p>';
        var nDev = App.overrides.groupDeviations(project, g.id).length;
        var memberNames = members.map(function (b) { return nameOf[b] || b; }).join(', ') || '(none)';
        var head = '<div class="dev-group-head">' +
          '<input class="grp-name" data-group-name data-group-id="' + esc(g.id) + '" value="' + esc(g.name) + '" aria-label="group name">' +
          '<span class="muted" style="font-size:12px">' + members.length + ' device' + (members.length === 1 ? '' : 's') + '</span>' +
          '<button data-group-deviations="' + esc(g.id) + '">Deviations (' + nDev + ')</button>' +
          '<button class="danger" data-group-remove="' + esc(g.id) + '">Delete group</button>' +
          '<div class="grp-members"><span class="muted" style="font-size:12px">Members: </span><span class="grp-member-names">' + esc(memberNames) + '</span>' +
            (allBases.length ? memberSelect(g) : '<span class="muted">no devices onboarded</span>') + '</div>' +
          '</div>';
        return '<section class="dev-group-section"><h3 class="grp-title">' + esc(g.name) + '</h3>' + head + stacks + '</section>';
      }

      var groupSections = (project.groups || []).slice().sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; }).map(groupSection).join('');
      var ungrouped = allBases.filter(function (b) { return !groupOf[b]; });
      var ungroupedHtml = ungrouped.length
        ? '<section class="dev-group-section"><h3 class="grp-title">Ungrouped</h3>' + ungrouped.map(stackHtml).join('') + '</section>'
        : '';
      var addGroup = '<div class="add-group"><input data-group-newname placeholder="New group name" value="' + esc(_dev.newGroupName || '') + '" aria-label="new group name"><button class="primary" data-action="add-group">Add group</button></div>';

      return '<div><h2>Devices</h2>' +
        '<p class="muted">Latest version is active for generation; older versions are read-only history. Group overrides apply to every device in the group (default → group → device).</p>' +
        addGroup + groupSections + ungroupedHtml +
        (_dev.openGroupId ? renderGroupModal(project, _dev.openGroupId) : '') +
        '</div>';
    }

    /** Applicable-key union across a group's member latest configs for a dataset. */
    function groupUnionKeys(project, g, dsId) {
      var set = {}, latest = App.ui.model.getLatestConfigs(project);
      (g.deviceBaseIds || []).forEach(function (b) {
        var c = latest.filter(function (x) { return x.baseId === b; })[0];
        var sn = c && c.snapshots[dsId];
        if (sn && Array.isArray(sn.keys)) sn.keys.forEach(function (k) { set[k] = true; });
      });
      return Object.keys(set);
    }

    /** A schema-driven group-override editor, seeded with a decision (data-gov-* attrs).
     *  `dsId`/`key` are optional and only used to resolve the item's declared value
     *  format (VF-8) — the add-override form has no key chosen yet. */
    function govControl(adapter, decision, fieldPrefix, dsId, key) {
      var d = decision;
      return adapter.decisionSchema.map(function (f) {
        var common = fieldPrefix + ' data-gov-field="' + esc(f.name) + '" data-gov-kind="' + f.kind + '"';
        if (f.kind === 'enum') {
          var cur = d && d[f.name] != null ? d[f.name] : '';
          return '<select ' + common + ' aria-label="' + esc(f.name) + '"><option value="">—</option>' +
            f.options.map(function (o) { return '<option value="' + esc(o) + '"' + (cur === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
        }
        if (f.kind === 'string' || f.kind === 'value-typed') {
          // VF-8: same format-driven editor as the data table and the device panels.
          var rawVal = d && (f.name in d) ? d[f.name] : '';
          var vtype = (d && d.type) ? d.type : (typeof rawVal === 'boolean' ? 'bool' : (typeof rawVal === 'number' ? (rawVal % 1 === 0 ? 'int' : 'float') : 'string'));
          var it = itemFor(dsId, key) || { key: key };
          var fmt = App.valueFormats ? ovFormat(dsId, it, rawVal, vtype) : null;
          return App.ui.tables.renderValueEditor(fmt, common + ' data-vtype="' + esc(vtype) + '"', rawVal);
        }
        if (f.kind === 'bool') {
          var on = !!(d && d[f.name]);
          return '<input type="checkbox" ' + common + (on ? ' checked' : '') + ' aria-label="' + esc(f.name) + '">';
        }
        return '';
      }).join(' ');
    }

    /** Group "Deviations" modal (spec §19.4 / OVR-6): view + edit/remove + add group overrides. */
    function renderGroupModal(project, groupId) {
      var g = (project.groups || []).filter(function (x) { return x.id === groupId; })[0];
      if (!g) return '';
      var sections = datasets(project).map(function (d) {
        var adapter = App.registry.getDataset(project.platformProfileId, d.id);
        var dispKey = adapter.displayKey || function (k) { return k; };
        var get = decisionGet(adapter);
        var ovMap = (g.overrides && g.overrides[d.id]) || {};
        var keys = Object.keys(ovMap).sort();
        var rows = keys.map(function (key) {
          var dV = (project.items[d.id] || []).filter(function (it) { return it.key === key; })[0];
          // review-6 #2: show the DEFAULT value alone (e.g. 0), not the raw decision JSON.
          var defText = dV && dV.decision != null ? String(get({ decision: dV.decision })) : '(undecided)';
          return '<tr><td>' + esc(dispKey(key)) + '</td><td>' + esc(defText) + '</td>' +
            '<td>' + govControl(adapter, ovMap[key], 'data-gov data-gov-ds="' + esc(d.id) + '" data-gov-key="' + esc(key) + '"', d.id, key) + '</td>' +
            '<td><button class="ov-revert" data-gov-remove data-ds="' + esc(d.id) + '" data-key="' + esc(key) + '">Remove</button></td></tr>';
        }).join('');
        var table = keys.length
          ? '<table><thead><tr><th>Key</th><th>Default</th><th>Deviation setting</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div class="empty">No group overrides for ' + esc(d.label) + '.</div>';
        return '<div class="panel"><h3>' + esc(d.label) + ' (' + keys.length + ')</h3>' + table + '</div>';
      }).join('');

      // Add-override form: dataset select + a SEARCHABLE key input (review-6 #3) + editor + Set.
      var addDs = _dev.groupAdd.dsId || (datasets(project)[0] && datasets(project)[0].id);
      var addAdapter = App.registry.getDataset(project.platformProfileId, addDs);
      var dsSel = datasets(project).map(function (d) { return '<option value="' + esc(d.id) + '"' + (d.id === addDs ? ' selected' : '') + '>' + esc(d.label) + '</option>'; }).join('');
      var ovKeys = (g.overrides && g.overrides[addDs]) || {};
      var addDispKey = (addAdapter && addAdapter.displayKey) || function (k) { return k; };
      // A <datalist> makes the (long) key list type-to-filter searchable natively.
      var keyOpts = groupUnionKeys(project, g, addDs).filter(function (k) { return !(k in ovKeys); }).sort()
        .map(function (k) { return '<option value="' + esc(k) + '">' + esc(addDispKey(k)) + '</option>'; }).join('');
      var addForm = '<div class="gov-add"><strong>Add override:</strong> ' +
        '<select data-gov-add-ds aria-label="dataset">' + dsSel + '</select> ' +
        '<input class="gov-add-key" data-gov-add-key list="gov-add-keylist" placeholder="type to search a key…" value="' + esc(_dev.groupAdd.key || '') + '" aria-label="key">' +
        '<datalist id="gov-add-keylist">' + keyOpts + '</datalist> ' +
        (addAdapter ? govControl(addAdapter, null, 'data-gov-add-field-ctl', addDs, _dev.groupAdd.key) : '') +
        ' <button class="primary" data-gov-add-set data-ds="' + esc(addDs) + '">Set</button></div>';

      return '<div class="modal-overlay" data-group-modal>' +
        '<div class="modal modal-wide" role="dialog" aria-modal="true" aria-label="Group deviations for ' + esc(g.name) + '">' +
          '<div class="modal-head"><div><h3>' + esc(g.name) + ' — deviations from default</h3>' +
            '<div class="modal-sub">Group overrides apply to every member device (default → group → device).</div></div>' +
            '<button type="button" class="modal-close" data-group-modal-close aria-label="Close">×</button></div>' +
          '<div class="modal-body"><div class="panels">' + sections + '</div>' + addForm + '</div>' +
        '</div></div>';
    }

    /** Build a decision object from a NodeList of data-gov* controls; null if no value set. */
    function govDecision(controls) {
      var decision = {}, hasValue = false;
      Array.prototype.forEach.call(controls, function (c) {
        var field = c.getAttribute('data-gov-field'), kind = c.getAttribute('data-gov-kind');
        var fmtKind = c.getAttribute('data-fmt-kind');   // VF-8
        if (kind === 'bool') { decision[field] = c.checked; hasValue = true; }
        else if (fmtKind && App.valueFormats) {
          var r = App.valueFormats.parseInput({ kind: fmtKind }, c.value);
          if (!r.undecided) { decision[field] = r.ok ? r.value : c.value; hasValue = true; }
        }
        else if (kind === 'value-typed') { if (String(c.value) !== '') { decision[field] = coerceOv(c.value, c.getAttribute('data-vtype')); hasValue = true; } }
        else if (kind === 'enum') { if (c.value !== '') { decision[field] = c.value; hasValue = true; } }
        else { decision[field] = c.value; hasValue = true; } // string: '' is a valid value
      });
      return hasValue ? decision : null;
    }

    /** Coerce an override editor string to a typed JS value (mirrors the data-table coerce). */
    function coerceOv(str, type) {
      if (type === 'bool') { var l = String(str).trim().toLowerCase(); if (l === 'true' || l === '1') return true; if (l === 'false' || l === '0') return false; return str; }
      if (type === 'int') { var n = parseInt(str, 10); return isNaN(n) ? str : n; }
      if (type === 'float') { var f = parseFloat(str); return isNaN(f) ? str : f; }
      return str;
    }

    /** Look up a register item by dataset + key (for format resolution); null if absent. */
    function itemFor(dsId, key) {
      if (!dsId || !key) return null;
      var p = App.store.getProject();
      if (!p || !p.items || !p.items[dsId]) return null;
      return p.items[dsId].filter(function (i) { return i.key === key; })[0] || null;
    }

    /** A schema-driven override editor for one item, seeded with the effective decision (spec §19.5). */
    function renderOverrideControl(adapter, dsId, item, effDecision) {
      var d = effDecision;
      return adapter.decisionSchema.map(function (f) {
        var common = 'data-ov data-ov-ds="' + esc(dsId) + '" data-ov-key="' + esc(item.key) + '" data-ov-field="' + esc(f.name) + '" data-ov-kind="' + f.kind + '"';
        if (f.kind === 'enum') {
          var cur = d && d[f.name] != null ? d[f.name] : '';
          return '<select ' + common + ' aria-label="override ' + esc(f.name) + '"><option value="">—</option>' +
            f.options.map(function (o) { return '<option value="' + esc(o) + '"' + (cur === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
        }
        if (f.kind === 'string' || f.kind === 'value-typed') {
          // VF-8: the override editor uses the SAME format-driven control as the data
          // table, so a boolean overrides via true/false and a list one-per-line.
          var rawVal = d && (f.name in d) ? d[f.name] : '';
          var vtype = (d && d.type) ? d.type : (typeof rawVal === 'boolean' ? 'bool' : (typeof rawVal === 'number' ? (rawVal % 1 === 0 ? 'int' : 'float') : 'string'));
          var fmt = ovFormat(dsId, item, rawVal, vtype);
          return App.ui.tables.renderValueEditor(fmt, common + ' data-vtype="' + esc(vtype) + '"', rawVal);
        }
        if (f.kind === 'bool') {
          var on = !!(d && d[f.name]);
          return '<input type="checkbox" ' + common + (on ? ' checked' : '') + ' aria-label="override ' + esc(f.name) + '">';
        }
        return '';
      }).join(' ');
    }

    /**
     * The value format in force for an override editor (VF-8). Resolved from the item's
     * declared format, falling back to the format inferred from the CAPTURED leaf —
     * not from the override value, which is normally empty (nothing is overridden yet)
     * and would otherwise infer "text" for every item.
     */
    function ovFormat(dsId, item, rawVal, vtype) {
      if (!App.valueFormats) return null;
      var project = App.store.getProject();
      var cap = capturedFor(project, dsId)[item.key];
      if (cap) return App.valueFormats.resolve(project, item, cap.type, cap.value);
      return App.valueFormats.resolve(project, item, vtype, rawVal);
    }

    /**
     * Captured defaults for one dataset, merged across the latest device configs and
     * memoised per render pass (the panels ask for the same map once per row).
     */
    var _capCache = { key: null, map: null };
    function capturedFor(project, dsId) {
      if (!project || !dsId) return {};
      var stamp = project.meta && project.meta.modifiedUtc;
      var ck = dsId + '|' + stamp + '|' + (project.deviceConfigs || []).length;
      if (_capCache.key === ck) return _capCache.map;
      var adapter = App.registry.getDataset(project.platformProfileId, dsId);
      var map = (adapter && App.ui.tables.buildCapturedMap) ? App.ui.tables.buildCapturedMap(project, dsId, adapter) : {};
      _capCache = { key: ck, map: map };
      return map;
    }

    /**
     * The device-configuration panels (spec §11.3 / §19.5, DOD-9 amended). Each panel
     * is collapsible (review-5 #1) and filtered by the search term (review-3 #6).
     *  - LATEST version: lists every APPLICABLE item showing its EFFECTIVE decision
     *    (default→group→device), a divergence class/marker (OVR-4), an inline override
     *    editor (writes via store.setDeviceOverride, OVR-8) and a Revert affordance.
     *  - SUPERSEDED version: read-only (effective decision only).
     */
    function renderPanels(project, deviceId, search) {
      var q = (search || '').toLowerCase().trim();
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      var isLatest = !!dc && App.ui.model.getLatestConfigs(project).some(function (c) { return c.id === deviceId; });
      var clsOrder = { device: 0, group: 1, 'default': 2 };
      return datasets(project).map(function (d) {
        var adapter = App.registry.getDataset(project.platformProfileId, d.id);
        var get = decisionGet(adapter);
        var dispKey = adapter.displayKey || function (k) { return k; };
        var appItems = applicable(project, deviceId, d.id);
        var rows = appItems.map(function (it) {
          var eff = App.overrides.effectiveItem(project, d.id, it, deviceId);
          var cls = App.overrides.classify(project, d.id, it, deviceId);
          var hasOv = !!(dc && dc.overrides && dc.overrides[d.id] && Object.prototype.hasOwnProperty.call(dc.overrides[d.id], it.key));
          return { it: it, eff: eff, disp: dispKey(it.key), dec: eff.decision != null ? String(get(eff)) : '', cls: cls, hasOv: hasOv };
        }).filter(function (r) {
          if (!q) return true;
          return (r.disp + ' ' + r.dec + ' ' + (r.it.description || '')).toLowerCase().indexOf(q) !== -1;
        });
        rows.sort(function (a, b) {
          if (_dev.deviationsFirst && clsOrder[a.cls] !== clsOrder[b.cls]) return clsOrder[a.cls] - clsOrder[b.cls];
          return a.it.key < b.it.key ? -1 : a.it.key > b.it.key ? 1 : 0;
        });
        var bodyRows = rows.map(function (r) {
          var rowCls = r.cls === 'group' ? 'dev-diverge-group' : r.cls === 'device' ? 'dev-diverge-device' : '';
          var marker = r.cls === 'group' ? '<span class="diverge-tag group" title="Differs from default via a group override">group</span>'
            : r.cls === 'device' ? '<span class="diverge-tag device" title="Differs from the inherited value via this device&#39;s override">device</span>' : '';
          var decCell = '<td>' + (r.dec ? esc(r.dec) : '<span class="muted">—</span>') + ' ' + marker + '</td>';
          if (!isLatest) return '<tr class="' + rowCls + '"><td>' + esc(r.disp) + '</td>' + decCell + '</tr>';
          var editor = '<div class="ov-edit">' + renderOverrideControl(adapter, d.id, r.it, r.eff.decision) +
            (r.hasOv ? ' <button type="button" class="ov-revert" data-ov-revert data-ds="' + esc(d.id) + '" data-key="' + esc(r.it.key) + '" title="Revert to the inherited value">Revert</button>' : '') + '</div>';
          return '<tr class="' + rowCls + '"><td>' + esc(r.disp) + '</td>' + decCell + '<td>' + editor + '</td></tr>';
        }).join('');
        // review-8 #3: fixed-layout, drag-resizable columns keyed PER dataset (so a long
        // value no longer squishes the Override column, and each panel can be sized
        // independently).
        var panelCols = isLatest
          ? [{ key: 'key', label: 'Key', w: 220 }, { key: 'effective', label: 'Effective', w: 170 }, { key: 'override', label: 'Override', w: 220 }]
          : [{ key: 'key', label: 'Key', w: 260 }, { key: 'effective', label: 'Effective', w: 220 }];
        var pcw = (_dev.panelColWidths && _dev.panelColWidths[d.id]) || {};
        var headCols = panelCols.map(function (c) {
          var w = pcw[c.key] || c.w;
          return '<th data-dev-col scope="col" style="width:' + w + 'px">' + esc(c.label) +
            '<span class="col-resize" data-dev-col-resize="' + esc(d.id) + '|' + c.key + '" title="Drag to resize"></span></th>';
        }).join('');
        var body = rows.length
          ? '<table class="dev-panel-table"><thead><tr>' + headCols + '</tr></thead><tbody>' + bodyRows + '</tbody></table>'
          : '<div class="empty">' + (q ? 'No matching applicable items.' : 'No applicable items.') + '</div>';
        var note = '<div class="panel-note">' + rows.length + (q ? ' matching' : '') + ' of ' + appItems.length + ' applicable</div>';
        var collapsed = !!_dev.collapsed[d.id];
        var caret = collapsed ? '▸' : '▾';
        return '<div class="panel' + (collapsed ? ' collapsed' : '') + '">' +
          '<h3><button type="button" class="panel-toggle" data-panel-toggle="' + esc(d.id) + '" aria-expanded="' + (!collapsed) + '"><span class="caret">' + caret + '</span> ' + esc(d.label) + '</button></h3>' +
          note + body + '</div>';
      }).join('');
    }

    /**
     * Controls assigned to this device, each a button that opens a modal listing the
     * exact items (per dataset) applicable to BOTH this device and that control —
     * i.e. what is done to satisfy that control here (review-5 #1).
     */
    function renderDeviceControls(project, deviceId) {
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      if (!dc) return '';
      var controls = (project.controls || []).filter(function (c) {
        return (c.assignedDeviceIds || []).indexOf(dc.baseId) !== -1;
      }).sort(function (a, b) { return a.title < b.title ? -1 : a.title > b.title ? 1 : 0; });
      var inner;
      if (!controls.length) {
        inner = '<p class="muted">No controls are assigned to this device. Assign controls to devices in the <strong>Control Manager</strong> tab.</p>';
      } else {
        inner = '<div class="ctl-applies-list">' + controls.map(function (c) {
          var n = countControlItems(project, deviceId, c.id);
          // review-12 #1: the state is per DEVICE (keyed by baseId) — a control added to
          // a device starts 'unsatisfied' and is flipped manually here. The toggle sits
          // OUTSIDE the control button (buttons cannot nest).
          var state = App.store.controlDeviceState(c, dc.baseId);
          var sat = state === 'satisfied';
          return '<div class="ctl-applies-row">' +
            '<button type="button" class="ctl-applies-item" data-control-open="' + esc(c.id) + '">' +
              '<span class="ctl-applies-title">' + esc(c.title) + '</span>' +
              '<span class="muted">' + esc(c.type) + '</span>' +
              '<span class="ctl-applies-count">' + n + ' item' + (n === 1 ? '' : 's') + '</span></button>' +
            '<span class="badge ' + (sat ? 'satisfied' : 'unsatisfied') + '" data-control-state="' + esc(c.id) + '">' + (sat ? 'Satisfied' : 'Unsatisfied') + '</span>' +
            '<button type="button" class="ctl-state-toggle" data-control-state-toggle="' + esc(c.id) + '" data-state="' + (sat ? 'unsatisfied' : 'satisfied') + '"' +
              ' title="Mark this control ' + (sat ? 'unsatisfied' : 'satisfied') + ' on this device">' + (sat ? 'Mark unsatisfied' : 'Mark satisfied') + '</button>' +
            '</div>';
        }).join('') + '</div>';
      }
      var unsat = unsatisfiedControls(project, dc.baseId).length;
      var summary = controls.length
        ? '<p class="muted" style="font-size:12px">' + (unsat
            ? '<span class="badge unsatisfied">' + unsat + ' unsatisfied</span> of ' + controls.length + ' assigned control(s) on this device.'
            : 'All ' + controls.length + ' assigned control(s) are marked satisfied on this device.') + '</p>'
        : '';
      return '<div class="dev-controls"><h3>Controls applying to this device</h3>' +
        '<p class="muted" style="font-size:12px">Click a control to see exactly which packages and tactical items satisfy it on this device. Each control carries its own <strong>Satisfied / Unsatisfied</strong> state per device — newly added controls start unsatisfied.</p>' +
        summary + inner + '</div>';
    }

    /**
     * Controls assigned to a device (by baseId) that are NOT marked satisfied there
     * (review-12 #1). Drives the Devices-list indicator and the detail-view summary.
     * @returns {Control[]}
     */
    function unsatisfiedControls(project, baseId) {
      return (project.controls || []).filter(function (c) {
        return (c.assignedDeviceIds || []).indexOf(baseId) !== -1 && App.store.controlDeviceState(c, baseId) !== 'satisfied';
      });
    }

    /** Count items applicable to a device that reference a given control (all datasets). */
    function countControlItems(project, deviceId, controlId) {
      return datasets(project).reduce(function (sum, d) {
        return sum + applicable(project, deviceId, d.id).filter(function (it) {
          return (it.controlRefs || []).indexOf(controlId) !== -1;
        }).length;
      }, 0);
    }

    /**
     * Modal: for one control + device, a read-only list per dataset of the items applicable
     * to the device that reference the control (review-5 #1). Closed via the × button
     * or a backdrop click.
     */
    function renderControlModal(project, deviceId, controlId) {
      var control = (project.controls || []).filter(function (c) { return c.id === controlId; })[0];
      if (!control) return '';
      var lists = datasets(project).map(function (d) {
        var adapter = App.registry.getDataset(project.platformProfileId, d.id);
        var get = decisionGet(adapter);
        var dispKey = adapter.displayKey || function (k) { return k; };
        var items = applicable(project, deviceId, d.id).filter(function (it) {
          return (it.controlRefs || []).indexOf(controlId) !== -1;
        }).sort(function (a, b) { return a.key < b.key ? -1 : 1; });
        var rows = items.map(function (it) {
          var statusBadge = it.held
            ? '<span class="badge held" title="Flagged for review — the value is kept but not yet accepted">review</span>'
            : it.status === 'decided'
              ? '<span class="badge decided">decided</span>'

  <script>

  (function (App) {

    var _cm = { search: '', expanded: {}, colWidths: {}, deviceCols: null,

    /**
     * The controls the table is CURRENTLY SHOWING, in display order. Shared by the table,
