    }

    /**
     * The "Device columns" picker: tick a device to give it a checkbox column in the
     * table below, so a control can be applied to / removed from that device in one
     * click instead of opening the row's dropdown.
     */
    function renderDeviceBar(project) {
      var devices = allDevices(project);
      if (!devices.length) return '';
      var boxes = devices.map(function (d) {
        return '<label class="cm-devcol-opt"><input type="checkbox" data-cm-devcol="' + esc(d.baseId) + '"' + (deviceColShown(d.baseId) ? ' checked' : '') + '> ' + esc(d.name) + '</label>';
      }).join('');
      var shown = deviceColumns(project).length;
      return '<div class="cm-devbar"><span class="cm-devbar-label">Device columns:</span>' + boxes +
        '<button data-cm-devcol-all>All</button><button data-cm-devcol-none>None</button>' +
        '<span class="muted" style="font-size:12px">' + shown + ' of ' + devices.length + ' shown — tick a cell to apply that control to that device.</span>' +
        '</div>';
    }

    /**
     * TAG-2: the Control Manager's sticky tools rail — the same affordance as the data
     * tabs' Apply Control Mode, for tags. Pick a tag, tick rows (or hit "Tag all N
     * shown"), and because the rail is `position:sticky` the picker is still there when
     * you are 60 controls down the list.
     */
    function renderTagRail(project) {
      if (!(project.controls || []).length) return '';
      if (_cm.railCollapsed) {
        return '<aside class="side-rail collapsed" data-side-rail>' +
          '<button type="button" class="rail-toggle" data-cm-rail-toggle title="Show the tools panel" aria-expanded="false">‹ Tools</button>' +
          '</aside>';
      }
      var tags = App.store.knownControlTags();
      var filter = String(_cm.tagSearch || '').toLowerCase();
      var shownTags = filter ? tags.filter(function (t) { return t.toLowerCase().indexOf(filter) !== -1; }) : tags;
      var counts = {};
      (project.controls || []).forEach(function (c) { (c.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });

      var modeBtn = '<button type="button" data-cm-tag-toggle' + (_cm.tagMode ? ' class="active"' : '') +
        ' title="' + (_cm.tagMode ? 'Leave tag mode' : 'Pick a tag, then tick controls to apply it') + '">' +
        (_cm.tagMode ? 'Exit tag mode' : 'Apply Tag Mode') + '</button>';

      var body = '';
      if (_cm.tagMode) {
        var shownCount = shownControls(project).length;
        var cards = shownTags.map(function (t) {
          var on = _cm.tagName === t;
          return '<button type="button" class="ctl-card' + (on ? ' active' : '') + '" data-cm-tag-pick="' + esc(t) + '" aria-pressed="' + on + '">' +
            '<span class="ctl-card-head"><span class="ctl-card-title">' + esc(t) + '</span>' +
            '<span class="ctl-card-type">' + (counts[t] || 0) + '</span></span>' +
            '<span class="ctl-card-desc">' + (counts[t] ? 'On ' + counts[t] + ' control' + (counts[t] === 1 ? '' : 's') + '.' : '<em>Not used yet.</em>') + '</span>' +
            '</button>';
        }).join('');
        var removing = _cm.tagName && allShownHaveTag(project, _cm.tagName);
        var bulk = '<button type="button" class="apply-all' + (removing ? ' danger' : '') + '" data-cm-tag-all' +
          (_cm.tagName && shownCount ? '' : ' disabled') +
          ' title="' + esc(!_cm.tagName ? 'Pick a tag first'
            : !shownCount ? 'No controls are shown'
            : removing ? 'Every control shown already has this tag — click to remove it from all ' + shownCount
            : 'Add this tag to all ' + shownCount + ' control(s) currently shown') + '">' +
          esc(removing ? 'Untag all ' + shownCount + ' shown' : 'Tag all ' + shownCount + ' shown') + '</button>';
        // "New tag" sits ABOVE the picker: with a long tag list the rail scrolls, and the
        // one control you cannot reach by scrolling is the one that creates the first tag.
        body =
          '<div class="rail-section">' +
            '<div class="rail-label">New tag</div>' +
            '<div class="cm-newtag"><input type="text" data-cm-tag-new placeholder="e.g. administrative" value="' + esc(_cm.newTag || '') + '" aria-label="New tag name">' +
            '<button type="button" data-cm-tag-add>Add</button></div>' +
          '</div>' +
          '<div class="rail-section">' +
            '<div class="rail-label">Tag to apply</div>' +
            '<input type="search" class="rail-search" data-cm-tag-search placeholder="Filter tags…" value="' + esc(_cm.tagSearch || '') + '" aria-label="Filter tags">' +
            '<div class="ctl-cards cm-tag-cards">' + (cards || '<p class="muted rail-empty">' + (tags.length ? 'No tag matches that filter.' : 'No tags yet — create one above.') + '</p>') + '</div>' +
            bulk +
            '<div class="muted apply-all-note">Acts on exactly what the table shows — narrow it with the search box first.</div>' +
            (_cm.tagName ? '<button type="button" class="danger" data-cm-tag-delete="' + esc(_cm.tagName) + '" title="Delete this tag everywhere it is used">Delete tag &ldquo;' + esc(_cm.tagName) + '&rdquo;</button>' : '') +
          '</div>';
      }
      return '<aside class="side-rail" data-side-rail>' +
        '<div class="rail-head"><span class="rail-title">Tools</span>' +
          '<button type="button" class="rail-toggle" data-cm-rail-toggle title="Hide the tools panel" aria-expanded="true">Hide ›</button></div>' +
        '<div class="rail-section rail-modes">' + modeBtn + '</div>' +
        body +
        '</aside>';
    }

    /** Comma-joined device names for a control's assigned baseIds (display only). */
    function deviceNames(project, assigned) {
      var byBase = {};
      App.ui.model.getLatestConfigs(project).forEach(function (c) { if (!byBase[c.baseId]) byBase[c.baseId] = c.name; });
      var names = (assigned || []).map(function (b) { return byBase[b] || b; });
      return names.length ? names.join(', ') : '';
    }

    /**
     * The controls table (review-4 #4): one row per control with Title/Type editable
     * inline, an Applies-to and a wrapping Description column, and a per-row expander
     * (dropdown) holding the editable description, the device-assignment multi-select,
     * and the Remove button. Filtered by the toolbar search term.
     */
    function renderTable(project) {
      var controls = (project.controls || []).slice();
      if (!controls.length) return '<p class="muted">No controls yet — add one above, or they are created automatically when migrating a v1 project.</p>';
      var filtered = shownControls(project);
      // review-6 #4: data-driven headers with drag-to-resize handles + stored widths.
      // review-13 #4: plus one checkbox column per device selected in the picker.
      var colWidths = _cm.colWidths || {};
      var devCols = deviceColumns(project);
      function th(key, label, w, extraClass) {
        return '<th data-cm-col="' + key + '" scope="col"' + (extraClass ? ' class="' + extraClass + '"' : '') + ' style="width:' + (colWidths[key] || w) + 'px">' + esc(label) +
          '<span class="col-resize" data-cm-col-resize="' + key + '" title="Drag to resize"></span></th>';
      }
      // TAG-3: the device NAME in the header is a button that toggles the whole column
      // across the shown controls — onboard a device, search for the controls it needs,
      // and assign them all in one click. It reads "remove" when they all already have it.
      function devTh(d) {
        var all = allShownHaveDevice(project, d.baseId);
        var w = colWidths['dev:' + d.baseId] || 110;
        return '<th data-cm-col="dev:' + esc(d.baseId) + '" scope="col" class="cm-dev-col" style="width:' + w + 'px">' +
          '<button type="button" class="cm-dev-head' + (all ? ' all-on' : '') + '" data-cm-dev-toggle="' + esc(d.baseId) + '"' +
          ' title="' + esc(all ? 'Every control shown is assigned to ' + d.name + ' — click to remove it from all of them'
                              : 'Assign ' + d.name + ' to every control currently shown') + '">' + esc(d.name) + '</button>' +
          '<span class="col-resize" data-cm-col-resize="dev:' + esc(d.baseId) + '" title="Drag to resize"></span></th>';
      }
      var tagCol = _cm.tagMode ? '<th class="cm-tag-col" scope="col" title="Tick to apply the selected tag">✓ Tag</th>' : '';
      var head = '<tr><th class="lead-col" aria-label="expand"></th>' +
        CM_COLS.map(function (c) { return th(c.key, c.label, c.w); }).join('') +
        devCols.map(devTh).join('') + tagCol + '</tr>';
      var colspan = 1 + CM_COLS.length + devCols.length + (_cm.tagMode ? 1 : 0);
      var body = filtered.map(function (c) {
        var open = !!_cm.expanded[c.id];
        var lead = '<td><button class="expand-btn" data-ctl-expand="' + esc(c.id) + '" aria-expanded="' + open + '" title="Edit / remove">' + (open ? '▾' : '▸') + '</button></td>';
        var applies = deviceNames(project, c.assignedDeviceIds);
        var tagList = (c.tags || []).join(', ');
        var row = '<tr>' + lead +
          '<td><input type="text" data-ctl-field="title" data-ctl-id="' + esc(c.id) + '" value="' + esc(c.title) + '" aria-label="title"></td>' +
          '<td><select data-ctl-field="type" data-ctl-id="' + esc(c.id) + '" aria-label="type">' + typeOptions(c.type) + '</select></td>' +
          // TAG-1: the tags a control carries, as badges. Clamped like Applies-to so
          // tagging never changes a row's height (STAB-1).
          '<td class="ctl-tags-cell"><span class="cell-clamp' + (tagList ? '' : ' muted') + '"' + (tagList ? ' title="' + esc(tagList) + '"' : '') + '>' +
            ((c.tags || []).length ? (c.tags || []).map(function (t) { return '<span class="badge tag">' + esc(t) + '</span>'; }).join(' ') : '—') + '</span></td>' +
          // STAB-1: clamped — this is the cell that grows as you tick device columns.
          '<td class="ctl-applies-cell"><span class="cell-clamp' + (applies ? '' : ' muted') + '"' + (applies ? ' title="' + esc(applies) + '"' : '') + '>' +
            (applies ? esc(applies) : '—') + '</span></td>' +
          '<td class="ctl-desc-cell">' + esc(c.description || '') + '</td>' +
          // review-13 #4: one checkbox per shown device — ticking assigns this control
          // to it (and seeds its per-device Unsatisfied state), unticking un-assigns.
          devCols.map(function (d) {
            var on = (c.assignedDeviceIds || []).indexOf(d.baseId) !== -1;
            // BULK-2: same full-cell hit target as the data tables' Apply/Delete columns —
            // the cell-filling <label> is what a click lands on, so ticking a control onto a
            // device no longer means hitting a 13px box in a wide column.
            return '<td class="cm-dev-cell"><label class="cell-check"><input type="checkbox" data-ctl-device="' + esc(c.id) + '" data-baseid="' + esc(d.baseId) + '"' + (on ? ' checked' : '') +
              ' aria-label="Apply ' + esc(c.title) + ' to ' + esc(d.name) + '"></label></td>';
          }).join('') +
          // TAG-2: the per-row tick column, shown only while Apply Tag Mode is on.
          (_cm.tagMode
            ? '<td class="cm-tag-cell"><label class="cell-check"><input type="checkbox" data-ctl-tag-check data-ctl-id="' + esc(c.id) + '"' +
              (_cm.tagName && (c.tags || []).indexOf(_cm.tagName) !== -1 ? ' checked' : '') + (_cm.tagName ? '' : ' disabled') +
              ' aria-label="Apply the selected tag to ' + esc(c.title) + '"></label></td>'
            : '') +
          '</tr>';
        if (open) {
          // review-4 #4: the dropdown holds the wide wrapping description editor, the
          // device assignment, and the Remove button. The leading "\n" is sacrificial
          // (HTML drops one leading newline in <textarea>), preserving a leading newline.
          row += '<tr class="detail-row"><td colspan="' + colspan + '"><div class="detail-form">' +
            '<label>Description</label>' +
            '<textarea class="ctl-desc" data-ctl-field="description" data-ctl-id="' + esc(c.id) + '" placeholder="Description" aria-label="description">\n' + esc(c.description || '') + '</textarea>' +
            '<label>Applies to</label>' +
            '<div class="ctl-devices">' + deviceCheckboxes(project, c.id, c.assignedDeviceIds) + '</div>' +
            '<label>Manage</label>' +
            '<div class="ctl-detail-actions"><button class="danger" data-ctl-remove="' + esc(c.id) + '">Remove control</button></div>' +
            '</div></td></tr>';
        }
        return row;
      }).join('');
      if (!filtered.length) body = '<tr><td colspan="' + colspan + '" class="muted">No matching controls.</td></tr>';
      var count = '<div class="muted" style="font-size:12px;margin-bottom:4px">' + filtered.length + ' of ' + controls.length + ' shown</div>';
      return count + '<table class="data ctl-table resizable"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
    }

    function render(project) {
      if (!project) return '<div class="empty-state"><h2>Control Manager</h2><p>Load a project or onboard a device first.</p></div>';

      var addForm = '<div class="ctl-add">' +
        '<h3>Add control</h3>' +
        '<input type="text" data-ctl-add="title" placeholder="Title" value="' + esc(_add.title) + '" style="min-width:220px">' +
        '<select data-ctl-add="type">' + typeOptions(_add.type) + '</select>' +
        '<input type="text" data-ctl-add="description" placeholder="Description" value="' + esc(_add.description) + '" style="min-width:260px">' +
        '<button class="primary" data-action="ctl-add">Add</button>' +
        '</div>';

      // Add-type + import-CSV tools (review-3 #5a/#5b).
      var tools = '<div class="ctl-tools">' +
        '<div class="ctl-add-type">' +
          '<input type="text" data-ctl-newtype placeholder="New type name" value="' + esc(_newType) + '" style="min-width:160px">' +
          '<button data-action="ctl-add-type">Add type</button>' +
          '<span class="muted" style="font-size:12px">Known: ' + esc(App.store.knownControlTypes().join(', ')) + '</span>' +
        '</div>' +
        '<div class="ctl-import">' +
          '<button data-action="ctl-import">Import controls (CSV)…</button>' +
          '<span class="muted" style="font-size:12px">Columns must be exactly: <code>title,type,description</code></span>' +
          '<input type="file" data-ctl-import-file accept=".csv,text/csv" class="visually-hidden" aria-hidden="true">' +
        '</div></div>';

      // review-4 #3: the add-type + import tools sit to the RIGHT of the title, not beneath it.
      // review-4 #4: a searchable table (search box outside #ctl-table-host so it keeps focus).
      var toolbar = '<div class="ctl-toolbar"><input type="search" class="ctl-search" data-ctl-search placeholder="Search controls (title / type / tag / description)…" value="' + esc(_cm.search) + '" aria-label="Search controls"></div>';
      // review-10 #2: no max-width cap so the table can span the full screen width
      // when columns are widened (the .main content area is already full-width).
      return '<div>' +
        '<div class="ctl-header"><h2>Control Manager</h2>' + tools + '</div>' +
        '<p class="muted">Controls are the requirements an item satisfies. Assign controls to items from the data tabs (Control Refs); assign them to <strong>devices</strong> with the per-device columns below (or by clicking a device&rsquo;s column heading to do every control shown at once).</p>' +
        addForm +
        toolbar +
        renderDeviceBar(project) +
        '<div class="table-wrap' + (_cm.railCollapsed ? ' rail-collapsed' : '') + '">' +
          '<div id="ctl-table-host">' + renderTable(project) + '</div>' +
          renderTagRail(project) +
        '</div>' +
        '</div>';
    }

    function wire(ctx) {
      _ctx = ctx;
      var dom = App.util.dom;
      // review-6 #4: drag-to-resize the Control Manager columns (persist to _cm.colWidths).
      dom.on(ctx.root, 'mousedown', '[data-cm-col-resize]', function (e, el) {
        e.preventDefault(); e.stopPropagation();
        var col = el.getAttribute('data-cm-col-resize');
        var th = el; while (th && th.tagName !== 'TH') th = th.parentNode;
        if (!th) return;
        var startX = e.clientX, startW = th.offsetWidth;
        function onMove(ev) { th.style.width = Math.max(60, startW + (ev.clientX - startX)) + 'px'; }
        function onUp(ev) {
          document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
          _cm.colWidths = _cm.colWidths || {};
          _cm.colWidths[col] = Math.max(60, startW + (ev.clientX - startX));
        }
        document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
      });
      dom.on(ctx.root, 'input', '[data-ctl-add]', function (e, el) { _add[el.getAttribute('data-ctl-add')] = el.value; });
      dom.on(ctx.root, 'change', 'select[data-ctl-add="type"]', function (e, el) { _add.type = el.value; });
      dom.on(ctx.root, 'click', '[data-action="ctl-add"]', function () {
        var res = App.store.addControl({ title: _add.title, type: _add.type, description: _add.description });
        if (res.ok) { _add = { title: '', type: 'ISM', description: '' }; } else { App.ui.activity.logIssues(res.issues, 'Add control'); }
        ctx.refreshMain();
      });
      // Search the controls table — re-render ONLY the table host so the box keeps focus.
      dom.on(ctx.root, 'input', '[data-ctl-search]', function (e, el) {
        var val = el.value;
        if (_cmSearchTimer) clearTimeout(_cmSearchTimer);
        _cmSearchTimer = setTimeout(function () {
          _cm.search = val;
          var project = App.store.getProject();
          var host = document.getElementById('ctl-table-host');
          if (host) host.innerHTML = renderTable(project);
          // TAG-2: the rail's bulk button names the SHOWN count and flips between
          // tag/untag, both of which the search changes — so it has to be re-rendered
          // with the table or it will promise a number it is not going to act on.
          // (Re-rendered in place, not via refreshMain, so the search box keeps focus.)
          var rail = document.querySelector('.table-wrap [data-side-rail]');
          if (rail) {
            var wrap = document.createElement('div');
            wrap.innerHTML = renderTagRail(project);
            if (wrap.firstChild) rail.parentNode.replaceChild(wrap.firstChild, rail);
          }
        }, 150);
      });
      // Per-row dropdown (expander) — re-render only the table host.
      dom.on(ctx.root, 'click', '[data-ctl-expand]', function (e, el) {
        var id = el.getAttribute('data-ctl-expand');
        if (_cm.expanded[id]) delete _cm.expanded[id]; else _cm.expanded[id] = true;
        var host = document.getElementById('ctl-table-host');
        if (host) host.innerHTML = renderTable(App.store.getProject());
      });
      dom.on(ctx.root, 'change', '[data-ctl-field]', function (e, el) {
        var patch = {}; patch[el.getAttribute('data-ctl-field')] = el.value;
        App.store.updateControl(el.getAttribute('data-ctl-id'), patch);
      });
      // review-13 #4: which devices get their own checkbox column. Only the table host
      // is re-rendered so the picker itself (and its focus) is untouched.
      dom.on(ctx.root, 'change', '[data-cm-devcol]', function (e, el) {
        var project = App.store.getProject();
        if (_cm.deviceCols === null) { // materialise the implicit "all" before editing it
          _cm.deviceCols = {};
          allDevices(project).forEach(function (d) { _cm.deviceCols[d.baseId] = true; });
        }
        var baseId = el.getAttribute('data-cm-devcol');
        if (el.checked) _cm.deviceCols[baseId] = true; else delete _cm.deviceCols[baseId];
        var host = document.getElementById('ctl-table-host');
        if (host) host.innerHTML = renderTable(project);
      });
      dom.on(ctx.root, 'click', '[data-cm-devcol-all]', function () { _cm.deviceCols = null; ctx.refreshMain(); });
      dom.on(ctx.root, 'click', '[data-cm-devcol-none]', function () { _cm.deviceCols = {}; ctx.refreshMain(); });
      // Assignment checkbox — shared by the row dropdown and the per-device columns.
      dom.on(ctx.root, 'change', '[data-ctl-device]', function (e, el) {
        var id = el.getAttribute('data-ctl-device'), baseId = el.getAttribute('data-baseid');
        var project = App.store.getProject();
        var c = (project.controls || []).filter(function (x) { return x.id === id; })[0]; if (!c) return;
        var set = (c.assignedDeviceIds || []).filter(function (b) { return b !== baseId; });
        if (el.checked) set.push(baseId);
        App.store.updateControl(id, { assignedDeviceIds: set });
      });
      // ---- TAG-3: the device column header toggles the whole column, over the SHOWN set
      dom.on(ctx.root, 'click', '[data-cm-dev-toggle]', function (e, el) {
        var baseId = el.getAttribute('data-cm-dev-toggle');
        var project = App.store.getProject();
        var list = shownControls(project);
        if (!list.length) return;
        var removing = allShownHaveDevice(project, baseId);
        var res = App.store.setControlsDevice(list.map(function (c) { return c.id; }), baseId, !removing);
        var dev = allDevices(project).filter(function (d) { return d.baseId === baseId; })[0];
        App.ui.activity.log({ severity: 'info',
          message: (removing ? 'Removed' : 'Assigned') + ' device "' + ((dev && dev.name) || baseId) + '" ' +
            (removing ? 'from' : 'to') + ' ' + res.changed + ' of the ' + list.length + ' control(s) shown' +
            (_cm.search ? ' (search: "' + _cm.search + '")' : '') + '.' });
      });

      // ---- TAG-2: the tools rail -------------------------------------------------
      dom.on(ctx.root, 'click', '[data-cm-rail-toggle]', function () { _cm.railCollapsed = !_cm.railCollapsed; ctx.refreshMain(); });
      dom.on(ctx.root, 'click', '[data-cm-tag-toggle]', function () {
        _cm.tagMode = !_cm.tagMode;
        if (!_cm.tagMode) _cm.tagName = '';   // leaving clears the selection; the tags stay
        ctx.refreshMain();
      });
      dom.on(ctx.root, 'click', '[data-cm-tag-pick]', function (e, el) {
        var t = el.getAttribute('data-cm-tag-pick');
        _cm.tagName = (_cm.tagName === t) ? '' : t;   // click the active one to deselect
        ctx.refreshMain();
      });
      dom.on(ctx.root, 'input', '[data-cm-tag-search]', function (e, el) {
        var pos = el.selectionStart;
        _cm.tagSearch = el.value;
        ctx.refreshMain();
        var again = document.querySelector('[data-cm-tag-search]');
        if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) {} }
      });
      dom.on(ctx.root, 'input', '[data-cm-tag-new]', function (e, el) { _cm.newTag = el.value; });
      dom.on(ctx.root, 'click', '[data-cm-tag-add]', function () {
        var name = String(_cm.newTag || '').trim();
        var res = App.store.addControlTag(name);
        App.ui.activity.logIssues(res.issues, 'Tag');
        if (res.ok) { _cm.newTag = ''; _cm.tagName = name; }
        ctx.refreshMain();
      });
      dom.on(ctx.root, 'change', '[data-ctl-tag-check]', function (e, el) {
        if (!_cm.tagName) return;
        var res = App.store.setControlTag([el.getAttribute('data-ctl-id')], _cm.tagName, el.checked);
        App.ui.activity.logIssues(res.issues, 'Tag');
      });
      dom.on(ctx.root, 'click', '[data-cm-tag-all]', function () {
        if (!_cm.tagName) return;
        var project = App.store.getProject();
        var list = shownControls(project);
        if (!list.length) return;
        var removing = allShownHaveTag(project, _cm.tagName);
        var res = App.store.setControlTag(list.map(function (c) { return c.id; }), _cm.tagName, !removing);
        App.ui.activity.log({ severity: 'info',
          message: (removing ? 'Removed' : 'Applied') + ' tag "' + _cm.tagName + '" ' + (removing ? 'from' : 'to') + ' ' +
            res.changed + ' of the ' + list.length + ' control(s) shown' +
            (_cm.search ? ' (search: "' + _cm.search + '")' : '') + '.' });
      });
      dom.on(ctx.root, 'click', '[data-cm-tag-delete]', function (e, el) {
        var t = el.getAttribute('data-cm-tag-delete');
        if (!window.confirm('Delete the tag "' + t + '"? It is removed from every control that carries it. Nothing else about those controls changes.')) return;
        App.ui.activity.logIssues(App.store.removeControlTag(t).issues, 'Tag');
        _cm.tagName = '';
        ctx.refreshMain();
      });

      dom.on(ctx.root, 'click', '[data-ctl-remove]', function (e, el) {
        var res = App.store.removeControl(el.getAttribute('data-ctl-remove'));
        App.ui.activity.logIssues(res.issues);
        ctx.refreshMain();
      });
      // Add a control type manually (review-3 #5a).
      dom.on(ctx.root, 'input', '[data-ctl-newtype]', function (e, el) { _newType = el.value; });
      dom.on(ctx.root, 'click', '[data-action="ctl-add-type"]', function () {
        var res = App.store.addControlType(_newType);
        App.ui.activity.logIssues(res.issues);
        if (res.ok) _newType = '';
        ctx.refreshMain();
      });
      // Import controls from CSV (review-3 #5b).
      dom.on(ctx.root, 'click', '[data-action="ctl-import"]', function () {
        var inp = ctx.root.querySelector('[data-ctl-import-file]'); if (inp) inp.click();
      });
      dom.on(ctx.root, 'change', '[data-ctl-import-file]', function (e, el) {
        var file = el.files[0]; if (!file) return;
        App.util.dom.readFileText(file).then(function (text) {
          var rows = App.util.csv.parseCsv(text);
          if (!rows.length) { App.ui.activity.log({ severity: 'error', message: 'Control CSV import: empty file.' }); return; }
          var header = rows[0].map(function (h) { return String(h).trim(); });
          if (header.length !== 3 || header[0] !== 'title' || header[1] !== 'type' || header[2] !== 'description') {
            App.ui.activity.log({ severity: 'error', message: 'Control CSV import refused: the header row must be exactly "title,type,description".', location: 'line 1' });
            ctx.refreshMain(); return;
          }
          var list = [];
          for (var i = 1; i < rows.length; i++) {
            var r = rows[i]; if (r.length === 1 && String(r[0]).trim() === '') continue;
            if (r.length < 3 || !String(r[0]).trim()) { App.ui.activity.log({ severity: 'warning', message: 'Control CSV: skipped malformed row ' + (i + 1) + '.' }); continue; }
            list.push({ title: String(r[0]).trim(), type: String(r[1]).trim(), description: String(r[2]) });
          }
          var res = App.store.importControls(list);
          App.ui.activity.logIssues(res.issues);
          ctx.refreshMain();
        }).catch(function (err) { App.ui.activity.log({ severity: 'error', message: 'Control CSV read failed: ' + (err && err.message) }); });
      });
    }

    App.ui = App.ui || {}; App.ui.views = App.ui.views || {};
    App.ui.views.controls = { render: render, wire: wire, renderTable: renderTable, _cm: _cm,
      shownControls: shownControls, allShownHaveDevice: allShownHaveDevice, allShownHaveTag: allShownHaveTag };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.views.formats  — VF-5 "Value formats" manager
   * PURPOSE: Create and edit the project's NAMED, REUSABLE value formats: a left
   *          list of formats, a right editor for the selected one, and — for the
   *          `options` kind — a table of allowed values each with a description of
   *          what it does. This is the surface behind "put in each string as a
   *          possible option and then also a description of what that option does".
   * PURITY:  render returns a string; wiring is registered by App.ui.app.
   * DEPENDS: App.store, App.valueFormats, App.util.html
   * INVARIANTS: renders only when open; every write goes through a store mutator so
   *             it participates in dirty-tracking and validation like any other edit.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var esc = App.util.html.esc;

    // UI-only state: which format the editor is showing. Never persisted.
    var _fm = { open: false, selected: null, draftName: '' };

    /** Open the manager, optionally selecting a format (or 'new'). */
    function open(selectId) { _fm.open = true; _fm.selected = selectId || null; }
    function close() { _fm.open = false; _fm.selected = null; _fm.draftName = ''; }
    function isOpen() { return !!_fm.open; }

    /** The format the editor should show: the selected one, else the first. */
    function current(project) {
      var list = (project && project.valueFormats) || [];
      if (_fm.selected === 'new') return null;
      var sel = list.filter(function (f) { return f.id === _fm.selected; })[0];
      return sel || list[0] || null;
    }

    function kindSelect(cur) {
      return '<select data-fmt-kind-pick aria-label="Format kind">' +
        App.valueFormats.CUSTOM_KINDS.map(function (k) {
          return '<option value="' + esc(k.id) + '"' + (cur === k.id ? ' selected' : '') + ' title="' + esc(k.hint) + '">' + esc(k.label) + '</option>';
        }).join('') + '</select>';
    }

    /** The allowed-values table: one row per option, value + "what it does". */
    function optionsTable(fmt) {
      var opts = (fmt.options || []);
      var rows = opts.map(function (o, i) {
        return '<tr>' +
          '<td><input type="text" data-fmt-opt-value data-idx="' + i + '" value="' + esc(o.value) + '" aria-label="Allowed value ' + (i + 1) + '"></td>' +
          '<td><input type="text" data-fmt-opt-desc data-idx="' + i + '" value="' + esc(o.description || '') + '" placeholder="what this option does" aria-label="Description of ' + esc(o.value) + '"></td>' +
          '<td><button type="button" class="danger" data-fmt-opt-remove data-idx="' + i + '" title="Remove this option">Remove</button></td>' +
          '</tr>';
      }).join('');
      return '<table class="fmt-opts"><thead><tr><th>Allowed value</th><th>What it does</th><th></th></tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="3" class="muted">No options yet — add the first allowed value below.</td></tr>') + '</tbody></table>' +
        '<div class="fmt-add-row">' +
          '<input type="text" data-fmt-new-value placeholder="value, e.g. enable_both" aria-label="New allowed value">' +
          '<input type="text" data-fmt-new-desc placeholder="what it does, e.g. Both SIM slots active" aria-label="New option description">' +
          '<button type="button" data-fmt-opt-add>Add option</button>' +
        '</div>';
    }

    function editor(project, fmt) {
      if (!fmt) {
        return '<div class="fmt-editor"><h4>New value format</h4>' +
          '<p class="muted">Give the format a name, then choose what shape its values take. ' +
          'Once saved you can assign it to any item from that item&rsquo;s <strong>Value format</strong> picker.</p>' +
          '<div class="fmt-grid">' +
            '<label>Name</label><input type="text" data-fmt-new-name placeholder="e.g. 5G radio mode" value="' + esc(_fm.draftName || '') + '" aria-label="New format name">' +
            '<label>Kind</label>' + kindSelect('options') +
          '</div>' +
          '<div class="fmt-actions"><button type="button" class="primary" data-fmt-create>Create format</button></div>' +
          '</div>';
      }
      var used = App.valueFormats.usageCount(project, fmt.id);
      var body = '';
      if ((fmt.kind || 'options') === 'options') {
        body = '<h5>Allowed values</h5>' +
          '<p class="muted">Each value is offered in the item&rsquo;s dropdown, with its description beside it, and anything outside this list is rejected.</p>' +
          optionsTable(fmt);
      } else if (fmt.kind === 'number') {
        body = '<div class="fmt-grid">' +
          '<label>Minimum</label><input type="text" inputmode="decimal" data-fmt-min value="' + esc(fmt.min == null ? '' : fmt.min) + '" placeholder="(no minimum)" aria-label="Minimum">' +
          '<label>Maximum</label><input type="text" inputmode="decimal" data-fmt-max value="' + esc(fmt.max == null ? '' : fmt.max) + '" placeholder="(no maximum)" aria-label="Maximum">' +
          '</div>';
      } else if (fmt.kind === 'string') {
        body = '<div class="fmt-grid">' +
          '<label>Pattern</label><input type="text" data-fmt-pattern value="' + esc(fmt.pattern || '') + '" placeholder="optional regular expression" aria-label="Pattern">' +
          '</div>';
      } else {
        body = '<p class="muted">A list of strings, entered one per line on the item.</p>';
      }
      return '<div class="fmt-editor">' +
        '<div class="fmt-grid">' +
          '<label>Name</label><input type="text" data-fmt-name value="' + esc(fmt.name || '') + '" aria-label="Format name">' +
          '<label>Kind</label>' + kindSelect(fmt.kind || 'options') +
          '<label>Description</label><textarea data-fmt-desc placeholder="what this format is for" aria-label="Format description">' + esc(fmt.description || '') + '</textarea>' +
        '</div>' +
        '<div class="muted fmt-usage">Used by <strong>' + used + '</strong> item' + (used === 1 ? '' : 's') + '.</div>' +
        body +
        '<div class="fmt-actions">' +
          '<button type="button" class="danger" data-fmt-remove data-id="' + esc(fmt.id) + '" title="Delete this format; items using it fall back to the format inferred from their capture">Delete format</button>' +
        '</div>' +
        '</div>';
    }

    /** @returns {string} HTML for the modal, or '' when closed. */
    function render() {
      if (!_fm.open) return '';
      var project = App.store.getProject();
      if (!project) return '';
      var list = (project.valueFormats || []).slice().sort(function (a, b) {
        var an = a.name || a.id, bn = b.name || b.id;
        return an < bn ? -1 : an > bn ? 1 : 0;
      });
      var fmt = current(project);
      var items = list.map(function (f) {
        var on = fmt && f.id === fmt.id && _fm.selected !== 'new';
        var n = App.valueFormats.usageCount(project, f.id);
        return '<button type="button" class="fmt-pick' + (on ? ' active' : '') + '" data-fmt-select="' + esc(f.id) + '">' +
          '<span class="fmt-pick-name">' + esc(f.name || f.id) + '</span>' +
          '<span class="fmt-pick-meta">' + esc(f.kind || 'options') + ' · ' + n + ' item' + (n === 1 ? '' : 's') + '</span>' +
          '</button>';
      }).join('');
      return '<div class="modal-overlay" data-fmt-modal>' +
        '<div class="modal modal-wide" role="dialog" aria-modal="true" aria-label="Value formats">' +
          '<div class="modal-head"><h3>Value formats</h3>' +
            '<span class="modal-sub">Reusable shapes for decision values — assign one to any item from its Value format picker.</span>' +
            '<button type="button" class="modal-close" data-fmt-close aria-label="Close">×</button></div>' +
          '<div class="modal-body fmt-body">' +
            '<div class="fmt-list">' + items +
              '<button type="button" class="fmt-pick fmt-new' + (_fm.selected === 'new' ? ' active' : '') + '" data-fmt-select="new">+ New format</button>' +
            '</div>' +
            (_fm.selected === 'new' ? editor(project, null) : (fmt ? editor(project, fmt) : editor(project, null))) +
          '</div>' +
        '</div></div>';
    }

    App.ui = App.ui || {}; App.ui.views = App.ui.views || {};
    App.ui.views.formats = { render: render, open: open, close: close, isOpen: isOpen, _fm: _fm, current: current };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.views.help
   * PURPOSE: In-app manual (spec §11, Phase 8; rewritten review-15). One section per
   *          area of the app, reached from a section strip so no single page is a
   *          wall of text. Content is generated from the LIVE registry/vocabularies
   *          where possible (dataset labels, capture instructions, relevance options)
   *          so the manual cannot drift from the app it documents.
   * PURITY:  UI/DOM (render returns a string; wire only switches the visible section)
   * DEPENDS: App.registry, App.projectIo, App.util.html
   * ============================================================================= */
  (function (App) {
    'use strict';
    var esc = App.util.html.esc;

    // Section state is UI-only and survives re-renders (never written to a project).
    var _help = { section: 'overview' };
    var _ctx = null;

    var SECTIONS = [
      { id: 'overview', label: 'Overview' },
      { id: 'start', label: 'Getting started' },
      { id: 'onboard', label: 'Onboarding' },
      { id: 'tables', label: 'Data tables' },
      { id: 'devices', label: 'Devices & groups' },
      { id: 'controls', label: 'Controls' },
      { id: 'generate', label: 'Generating output' },
      { id: 'saving', label: 'Saving & recovery' },
      { id: 'reference', label: 'Reference' }
    ];

    // ---- small builders (keep the prose readable in source) -------------------
    function h(level, text) { return '<h' + level + '>' + text + '</h' + level + '>'; }
    function p(text) { return '<p>' + text + '</p>'; }
    function ul(items) { return '<ul>' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'; }
    function ol(items) { return '<ol>' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ol>'; }
    function note(text) { return '<div class="help-note">' + text + '</div>'; }
    function pre(text) { return '<pre class="help-pre mono">' + esc(text) + '</pre>'; }
    /** A two-column definition table — the clearest shape for "term ⇒ meaning". */
    function deftable(headers, rows) {
      return '<table class="help-table"><thead><tr>' +
        headers.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr></thead><tbody>' +
        rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table>';
    }

    // ---- live facts pulled from the app itself --------------------------------
    function platform() { return App.registry.getActivePlatform(); }
    function datasets() { var pf = platform(); return pf ? pf.datasets : []; }
    function datasetNames() {
      var names = datasets().map(function (d) { return '<strong>' + esc(d.label) + '</strong>'; });
      return names.length ? names.join(', ') : 'the data tabs';
    }
    function relevanceList() { return App.projectIo.RELEVANCE_OPTIONS.join(', '); }

    // =========================================================================
    // Sections
    // =========================================================================
    function secOverview() {
      return h(2, 'What this tool is') +
        p('The CH Config Tool turns <strong>captured device configuration</strong> into <strong>hardening decisions</strong>, ' +
          'and turns those decisions into the <strong>scripts, config files and reports</strong> that implement, verify and document them.') +
        p('It is a single HTML file. It runs from a local copy (double-click it), it never contacts a device or the network, ' +
          'and it never runs anything on a device itself — you capture files from the device elsewhere, feed them in here, and run the output elsewhere.') +
        h(3, 'The five ideas behind everything else') +
        deftable(['Idea', 'What it means for you'], [
          ['<strong>The project file is the truth</strong>',
           'All your work lives in one downloaded <code>.json</code>. The app only holds a copy in memory. Save it, keep it somewhere shared, and load it next time.'],
          ['<strong>Capture, then decide</strong>',
           'Onboarding records what a device <em>currently</em> has (a snapshot). Deciding records what it <em>should</em> have. The two are kept separate, so you always know which is which.'],
          ['<strong>Decide once, reuse everywhere</strong>',
           'A decision belongs to a configuration item (a package, a setting, a tactical path) — not to a device. Every device that has that item inherits the decision. Where a device or a group genuinely differs, you record an <em>override</em>.'],
          ['<strong>Nothing is silent</strong>',
           'Bad input is never dropped. Parse and validation problems appear in the Activity / Errors drawer at the bottom, with a location, and the app keeps working.'],
          ['<strong>Same input, same output</strong>',
           'Generating twice from the same project produces byte-identical files, so outputs can be diffed and audited.']
        ]) +
        h(3, 'The tabs, in the order you normally use them') +
        deftable(['Tab', 'What it is for'], [
          ['<strong>Onboard</strong>', 'Add a device by supplying its captured files. Also used to re-capture an existing device later.'],
          ['<strong>' + (datasets().length ? datasets().map(function (d) { return esc(d.label); }).join(' / ') : 'The data tabs') + '</strong>',
           'One tab per dataset. This is where you record decisions, descriptions, rationale and control links.'],
          ['<strong>Devices</strong>', 'Every onboarded device and its versions; device groups; what each device will actually get; per-device overrides; bulk decision import.'],
          ['<strong>Control Manager</strong>', 'The catalogue of controls (the requirements your decisions satisfy) and which devices they apply to.'],
          ['<strong>Generate</strong>', 'Produce the Implementation, Verification, Reporting and Control-report bundles for one device.'],
          ['<strong>Help</strong>', 'This manual.']
        ]) +
        note('The number on a data tab is how many items in that dataset are still <strong>undecided</strong>.');
    }

    function secStart() {
      return h(2, 'Getting started') +
        h(3, 'If someone has already made a project') +
        ol([
          'Click <strong>Load project</strong> in the top bar and choose the <code>.json</code>.',
          'Work in the tabs as needed.',
          'Click <strong>Save project</strong>, confirm the file name, and put the downloaded file back where it came from.'
        ]) +
        h(3, 'If you are starting from nothing') +
        ol([
          'Go to <strong>Onboard</strong>.',
          'Give the device a <strong>name</strong> (required), plus model and firmware.',
          'Attach one captured file per dataset (' + datasetNames() + '). The <strong>Onboard</strong> button stays disabled until every file parses and a name is present.',
          'Click <strong>Onboard</strong>. The app creates the project, records a hashed snapshot per dataset, and adds every new item as <em>undecided</em>.',
          'Open each data tab and record decisions. The tab badge counts down as you go.',
          'Go to <strong>Generate</strong>, pick the device, and produce the bundles you need.',
          '<strong>Save project</strong> before you close the tab.'
        ]) +
        note('You do not have to finish in one sitting. Save the project file and pick it up later — the app also keeps a local draft as crash insurance (see <em>Saving &amp; recovery</em>).');
    }

    function secOnboard() {
      var pf = platform();
      var capture = pf ? pf.captureInstructions : '';
      return h(2, 'Onboarding a device') +
        p('Onboarding is how a device enters the project. You supply one captured file per dataset; the app parses each one, ' +
          'stores a <strong>snapshot</strong> (the exact list of keys it saw, plus a SHA-256 of the file), and adds any key it has not seen before as a new undecided item.') +
        h(3, 'What the app records') +
        deftable(['Recorded', 'Why it matters'], [
          ['The device <strong>name</strong>, model and firmware', 'The name plus model form the device identity, so keep them consistent between captures of the same device.'],
          ['A <strong>snapshot</strong> per dataset', 'Defines which items are <em>applicable</em> to that device. Everything else — readiness, generation, the device panels — is driven by this.'],
          ['A <strong>SHA-256</strong> of each captured file', 'Lets the app tell whether a later capture is genuinely different.'],
          ['New items, as <strong>undecided</strong>', 'Existing items keep the decisions you already made; nothing is silently overwritten.']
        ]) +
        h(3, 'Capture formats for ' + esc(pf ? pf.label : 'the active platform')) +
        p('Capture these outside the tool, then attach the files:') +
        pre(capture) +
        h(3, 'Re-capturing a device later') +
        p('Onboard the same device again with the same name and model. The app compares the new captures with the current ones:') +
        ul([
          'If every file is identical, nothing happens — a re-onboard is a no-op.',
          'If anything changed, a <strong>new version</strong> of that device configuration is created. The new version is the active one; the previous version is kept as read-only history.',
          'Keys that disappeared from the capture are <strong>not</strong> deleted from the register — they simply stop being applicable to the new version.'
        ]) +
        h(3, 'Triage') +
        p('After each onboard the Activity drawer reports, per dataset, how many keys were new and how many already existed. ' +
          'That tells you at a glance how much new decision work a capture created.') +
        note('<strong>Knox tactical — <code>imsSettings</code>.</strong> A Knox export only carries <code>imsSettings</code> once it has been touched, ' +
          'so the block is <em>optional</em> in the JSON you upload. If it is missing, the tool adds the default ' +
          '(<code>imsSettings.simSlot0.enabled</code> and <code>imsSettings.simSlot1.enabled</code>, both <code>false</code>) and notes it in the Activity drawer, ' +
          'so the per-SIM IMS toggle is always there to decide and is always present in the emitted <code>tactical.json</code>. ' +
          'If the upload does carry the block, its values are used as captured. The same applies to the tactical import on the Devices tab. ' +
          'A project made <em>before</em> the tool modelled this setting is completed when you <strong>load</strong> it: the two slots are added to each device\'s ' +
          'applicable keys and appear in the Tactical tab as undecided, and the Activity drawer lists exactly what was added.');
    }

    function secTables() {
      return h(2, 'The data tabs') +
        p('Each data tab lists every item in that dataset with the decision you have recorded. ' +
          'The columns come from the dataset itself, so they differ slightly per tab, but the shape is always the same.') +
        h(3, 'Columns') +
        deftable(['Column', 'Meaning'], [
          ['<strong>Key</strong> (Package / Key / Path)', 'The item\'s identity. This is what the generated output acts on.'],
          ['<strong>Description</strong>', 'Your plain-language note about what the item is. Shown in the report.'],
          ['<strong>Action / Value</strong>', 'The decision itself, edited in place. On Packages, choosing <strong>—</strong> clears the decision. On Tactical the editor matches the item&rsquo;s <strong>value format</strong> (see below): true/false for a boolean, a numeric box for a number, one-per-line for a list, a dropdown for a defined set of options, and a text box otherwise. Where the editor is free text, an <em>empty</em> box is a real decision — "set this key to blank" — and the <strong>clear</strong> button beside it is what returns the item to undecided.'],
          ['<strong>Control Refs</strong>', 'Which controls this item helps satisfy. Edited in the row expander or with Apply Control Mode.'],
          ['<strong>Security Relevance</strong>', 'Optional tag: ' + esc(relevanceList()) + '. May be left blank.'],
          ['<strong>Applies to</strong>', 'Which devices currently have this item in their snapshot.'],
          ['<strong>Status</strong>', '<span class="badge decided">decided</span> once the decision is complete and valid, <span class="badge undecided">undecided</span> if it has never been answered, or <span class="badge held">review</span> if it holds a value you have flagged to come back to. ' +
            'The badge is also a <strong>switch</strong> — click it to flip the item (see below).']
        ]) +
        h(3, 'Editing an item') +
        ul([
          'Edit the decision directly in its cell. Changes save into the in-memory project immediately (the unsaved dot appears in the top bar).',
          'To blank a value — for example to empty a comma-separated list like <code>bluetooth,wifi</code> — clear the box and click away. The item stays <span class="badge decided">decided</span> and the generated command sets the key to an empty string. Use <strong>clear</strong> instead if you meant "I have not decided this yet".',
          '<strong>Click the Status badge to flip the item.</strong> Clicking <span class="badge undecided">undecided</span> accepts whatever the value box is already showing — on Tactical that is the <em>captured</em> value, so one click means "the value on the device is my decision". ' +
            'On Packages, where nothing is selected yet, it records <code>keep</code>, the no-change action.',
          '<strong>Flagging something for review keeps your answer.</strong> Clicking <span class="badge decided">decided</span> does <em>not</em> wipe the value — it moves the item to <span class="badge held">review</span>: your choice is recorded exactly as you left it, but the item stops counting as decided, so it shows as outstanding and the device cannot be generated until you come back to it. Click the badge again to accept the same value and return it to <span class="badge decided">decided</span>. ' +
            'Editing the value also clears the flag, because editing <em>is</em> reviewing. ' +
            'If you actually want to throw the answer away, use <strong>clear</strong> beside the value box — that is the difference between the two.',
          'Click the <strong>▸</strong> at the start of a row to expand it. The expander holds the <strong>Description</strong>, the <strong>Control Refs</strong> checklist, the <strong>Rationale</strong> (with a one-click "not required for device use-case" preset), the <strong>Rollback</strong> note and the <strong>Value format</strong> picker.',
          'If a decision is invalid, the cell is tinted and the reason is listed in the expander (and in the cell&rsquo;s tooltip). The value is still stored — invalid simply means "not complete yet".'
        ]) +
        h(3, 'Value formats') +
        p('A value format declares what shape an item&rsquo;s value is allowed to take. It does two things: it gives you the <em>right editor</em> instead of a free-text box, and it makes a wrong value <em>impossible to miss</em> — a value outside its format is an error, so the item is not complete and the device cannot reach ready until it is fixed.') +
        p('<strong>You do not have to configure anything.</strong> Every item starts on the format inferred from what the device actually reported, so a boolean leaf already shows true/false and a number already shows a numeric box. The picker only matters when you want to be stricter than the capture.') +
        deftable(['Format', 'What it accepts'], [
          ['<strong>Boolean</strong>', 'Exactly <code>true</code> or <code>false</code>, chosen from a dropdown.'],
          ['<strong>Number</strong>', 'A numeric value. A custom number format may also set a minimum and maximum.'],
          ['<strong>Text</strong>', 'Any text. An empty box is a real value (a blank string). A custom text format may also require a pattern.'],
          ['<strong>String list</strong>', 'A list of strings, entered <strong>one per line</strong>. An empty box means an empty list — which is what most of the Knox whitelists are.'],
          ['<strong>JSON value</strong>', 'The raw JSON, used automatically for anything the simpler kinds cannot represent without changing its type (for example a list of numbers). Editing it as text would silently turn <code>[1,2]</code> into <code>["1","2"]</code>, which would change what gets uploaded — so the tool keeps it as JSON instead.'],
          ['<strong>Your own formats</strong>', 'A named set of allowed values, each with a description of what it does. The item then offers a dropdown reading <code>value — what it does</code>.']
        ]) +
        h(3, 'Defining your own format') +

    var RENDERERS = {
      overview: secOverview, start: secStart, onboard: secOnboard, tables: secTables,

    function render(project) {
      var cur = RENDERERS[_help.section] ? _help.section : 'overview';
      var nav = SECTIONS.map(function (s) {
        return '<button type="button" class="help-nav-btn' + (s.id === cur ? ' active' : '') + '" data-help-sec="' + esc(s.id) + '"' +

        '<h2 class="help-title">Help</h2>' +

    function wire(ctx) {
      _ctx = ctx;
      App.util.dom.on(ctx.root, 'click', '[data-help-sec]', function (e, el) {
        _help.section = el.getAttribute('data-help-sec');

    App.ui = App.ui || {}; App.ui.views = App.ui.views || {};

  <!-- === UI VIEWS fully populated (onboard · generate · devices · help). === -->

  <script>
  /* =============================================================================
   * MODULE: App.ui.app
   * PURPOSE: The UI shell + controller (spec §11.1). Builds the top bar, the
   *          data-driven tab nav (one tab per active-platform dataset + Devices/
   *          Onboard/Generate), the main view, and the Activity drawer. Manages UI
   *          state, wires events, and re-renders on store/activity changes.
   * PURITY:  UI/DOM (the only place, with util.dom, that touches the DOM).
   * DEPENDS: App.registry, App.store, App.projectIo, App.util.*, App.ui.*
   * INVARIANTS: search input is never re-rendered on keystroke; only #table-host is.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var dom = App.util.dom, esc = App.util.html.esc;

    var TOOL_VERSION = '1.0';
    var _root = null;
    var _state = { activeTab: null, ui: {}, drawerCollapsed: false, draftDismissed: false, saveModal: false, saveName: 'ch-project' };
    var DRAFT_KEY = 'ch-config-draft-v1';
    var THEME_KEY = 'ch-config-theme';
    var _draftTimer = null;

    // ---- Dark-mode theme (spec §18.1). UI-only: sets a data-theme attribute on
    // <html>; the palette swap is pure CSS. Never read by engine/generators. ----
    /** @param {string} cur @returns {'light'|'dark'} the opposite theme */
    function nextTheme(cur) { return cur === 'dark' ? 'light' : 'dark'; }
    function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
    function applyTheme(t) { document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); }
    function loadThemePref() { try { return window.localStorage.getItem(THEME_KEY); } catch (e) { return null; } }
    function saveThemePref(t) { try { window.localStorage.setItem(THEME_KEY, t); } catch (e) {} }
    function initialTheme() {
      var stored = loadThemePref();
      if (stored === 'dark' || stored === 'light') return stored;
      try { if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark'; } catch (e) {}
      return 'light';
    }
    function toggleTheme() { var t = nextTheme(currentTheme()); applyTheme(t); saveThemePref(t); updateThemeButton(); }
    function updateThemeButton() {
      var btn = _root && _root.querySelector('[data-action="toggle-theme"]');
      if (!btn) return;
      var dark = currentTheme() === 'dark';
      btn.setAttribute('aria-pressed', String(dark));
      btn.textContent = dark ? '☀ Light' : '🌙 Dark';
    }
    var _searchTimer = null;
    var _editIssues = {}; // transient decision-validation issues, keyed "dsId|key"
    var _suppressRender = false; // review-7 #2: skip the full re-render during bulk control-apply clicks
    var _colResizing = false;     // true mid-drag, to suppress the trailing sort click
    var MIN_COL_WIDTH_PX = 60;    // minimum column width (review-2 #4)

    function activeDatasets() {
      var p = App.registry.getActivePlatform();
      return p ? p.datasets : [];
    }
    function uiFor(dsId) {
      if (!_state.ui[dsId]) _state.ui[dsId] = { search: '', sortKey: 'key', sortDir: 'asc', incompleteOnly: false, deleteMode: false, deleteSel: {}, onlyRelevance: [] };
      return _state.ui[dsId];
    }

    // ---- review-12 #2 / review-13 #2,#3: undo + redo for the two bulk modes ----
    // Delete Mode and Apply Control Mode are the only edits that change many items at
    // once, so each takes a pre-change dataset snapshot here. Stacks are per dataset
    // (the buttons live in that dataset's toolbar) and session-only: nothing is written
    // to the project file, so both buttons start greyed out on every launch.
    //
    // review-13 #2: an Apply-Control-Mode RUN is ONE undoable action. Ticking three rows
    // is one user action in three clicks, so consecutive ticks fold into a single OPEN
    // entry (its snapshot is still the state before the first tick). The run is closed
    // by anything that ends it: leaving the mode, changing the selected control, an
    // apply-to-action command, a deletion, an undo/redo, a tab switch, or a load.
    var _undo = {};      // dsId -> [{label, snap, count}]  (most recent last)
    var _redo = {};      // dsId -> [{label, snap}]         (cleared by any new action)
    var _openRun = null; // {dsId, controlId, entry} — the apply run currently being folded
    var UNDO_LIMIT = 20; // bound the memory held by snapshots of large item arrays

    /** Snapshot dsId BEFORE a change. @param {string} label human description */
    function pushUndo(dsId, label) {
      var snap = App.store.datasetSnapshot(dsId);
      if (!snap) return null;
      var stack = (_undo[dsId] = _undo[dsId] || []);
      var entry = { label: label, snap: snap, count: 1 };
      stack.push(entry);
      if (stack.length > UNDO_LIMIT) stack.shift();
      _redo[dsId] = []; // a new action invalidates the redo branch (standard undo model)
      return entry;
    }
    /** Drop the most recent entry (used when the change it guarded did not happen). */
    function dropUndo(dsId) { if (_undo[dsId]) _undo[dsId].pop(); }
    /** Discard every snapshot — MUST be called whenever the loaded project is replaced. */
    function resetUndo() { _undo = {}; _redo = {}; _openRun = null; }
    /** End the current apply-run so the next tick starts a new undo entry. */
    function closeRun() { _openRun = null; }

    /**
     * Fold one Apply-Control-Mode tick into the current run (review-13 #2), starting a
     * new run when there is none for this dataset+control.
     * @returns {void}
     */
    function noteApplyTick(dsId, controlId, controlTitle) {
      if (_openRun && _openRun.dsId === dsId && _openRun.controlId === controlId) {
        _openRun.entry.count++;
        _openRun.entry.label = 'application of control "' + controlTitle + '" to ' + _openRun.entry.count + ' items';
        return;
      }
      var entry = pushUndo(dsId, 'application of control "' + controlTitle + '" to 1 item');
      _openRun = entry ? { dsId: dsId, controlId: controlId, entry: entry } : null;
    }

    /** @returns {{canUndo:boolean, label:string, canRedo:boolean, redoLabel:string}} */
    function undoInfo(dsId) {
      var u = _undo[dsId] || [], r = _redo[dsId] || [];
      return {
        canUndo: u.length > 0, label: u.length ? u[u.length - 1].label : '',
        canRedo: r.length > 0, redoLabel: r.length ? r[r.length - 1].label : ''
      };
    }
    // Tooltip text is owned by App.ui.tables (which renders the buttons).
    function undoTitle(label) { return App.ui.tables.undoTitle(label); }

    function refreshUndoButton(dsId) {

      function sync(sel, on, title, offTitle) {
        var btn = _root && _root.querySelector(sel);

        if (on) { btn.removeAttribute('disabled'); btn.setAttribute('title', title); }
        else { btn.setAttribute('disabled', 'disabled'); btn.setAttribute('title', offTitle); }
      }
      sync('[data-undo="' + dsId + '"]', info.canUndo, undoTitle(info.label), App.ui.tables.UNDO_OFF_TITLE);
      sync('[data-redo="' + dsId + '"]', info.canRedo, redoTitle(info.redoLabel), App.ui.tables.REDO_OFF_TITLE);
    }

    /**
     * Move the top entry from one stack to the other, swapping in the current state so
     * the move is reversible (undo ⇄ redo). @returns {boolean} whether it happened
     */
    function stepHistory(dsId, from, to, verb) {
      var stack = from[dsId] || [];
      if (!stack.length) return false;
      var entry = stack[stack.length - 1];
      var current = App.store.datasetSnapshot(dsId);
      var res = App.store.restoreDatasetSnapshot(entry.snap);
      if (!res.ok) { App.ui.activity.logIssues(res.issues, verb); return false; }
      stack.pop();
      (to[dsId] = to[dsId] || []).push({ label: entry.label, snap: current, count: entry.count });
      closeRun(); // history moved: the next tick must start its own entry
      App.ui.activity.log({ severity: 'success', message: verb + ' the ' + entry.label + '.' });
      return true;
    }
    function defaultTab() {
      var ds = activeDatasets();

    // ---- scroll preservation (SP-4) --------------------------------------------
    // Now that `.main` is the scroll region rather than the page, replacing its
    // innerHTML resets scrollTop to 0. Several everyday actions re-render (picking a
    // control in the rail, ticking an Apply checkbox, editing a decision), and a jump
    // to row 1 on each of those would be exactly the problem the rail exists to solve.
    // So snapshot the scroll offsets of the containers that survive a render — the main
    // area and the rail's own control list — and restore them afterwards.
    var SCROLL_KEEP = ['.ctl-cards', '.fmt-list', '.ctl-opts'];

    /**
     * STAB-2: a re-queryable selector for the element the user is interacting with, built
     * from its own data-* attributes. Used as a SCROLL ANCHOR: restoring `scrollTop`
     * alone is not enough, because a render can legitimately change the height of content
     * ABOVE the viewport (ticking a box adds a name to a neighbouring cell, that cell
     * wraps, its row grows). The scroll offset is then still "correct" while everything
     * on screen has slid — which reads as the page jumping under you.
     * @param {Element} el @returns {string|null}
     */
    function anchorSelector(el) {
      if (!el || el.nodeType !== 1 || !el.attributes) return null;
      var parts = [], tag = el.tagName ? el.tagName.toLowerCase() : '';
      for (var i = 0; i < el.attributes.length; i++) {
        var a = el.attributes[i];
        if (a.name.indexOf('data-') !== 0) continue;
        // Skip volatile attributes; keep the identifying ones (ds/key/id/baseid/field…).
        if (a.value === '') { parts.push('[' + a.name + ']'); continue; }
        parts.push('[' + a.name + '="' + String(a.value).replace(/"/g, '\\"') + '"]');
      }
      return parts.length ? tag + parts.join('') : null;
    }

    function captureScroll() {
      var snap = { main: 0, inner: [], anchor: null, anchorTop: 0 };
      var main = document.getElementById('main');
      if (main) snap.main = main.scrollTop;
      if (_root) SCROLL_KEEP.forEach(function (sel) {
        var el = _root.querySelector(sel);
        if (el && el.scrollTop) snap.inner.push([sel, el.scrollTop]);
      });
      // Anchor on whatever currently has focus inside the scroll region — for a click on
      // a checkbox (or its label) that is the checkbox itself.
      try {
        var act = document.activeElement;
        if (main && act && act !== document.body && main.contains(act)) {
          var sel2 = anchorSelector(act);
          if (sel2 && main.querySelectorAll(sel2).length === 1) {
            snap.anchor = sel2;
            snap.anchorTop = act.getBoundingClientRect().top;
          }
        }
      } catch (e) { /* anchoring is best-effort; never let it break a render */ }
      return snap;
    }

    function restoreScroll(snap) {
      if (!snap) return;
      var main = document.getElementById('main');
      if (main && snap.main) main.scrollTop = snap.main;
      if (_root) snap.inner.forEach(function (pair) {
        var el = _root.querySelector(pair[0]);
        if (el) el.scrollTop = pair[1];
      });
      // STAB-2: if the anchor moved, the content around it grew or shrank — shift the
      // scroll by the same amount so the thing under the cursor stays under the cursor.
      if (main && snap.anchor) {
        try {
          var again = main.querySelector(snap.anchor);
          if (again) {
            var delta = again.getBoundingClientRect().top - snap.anchorTop;
            if (delta) main.scrollTop = main.scrollTop + delta;
          }
        } catch (e) { /* best-effort */ }
      }
    }

    // ---- top-level render ----
    function render() {

      renderMain(scroll);
      renderDrawer();
      updateThemeButton(); // reflect current theme on the freshly-rendered toggle
      if (_state.saveModal) { var n = _root.querySelector('[data-save-name]'); if (n) { n.focus(); n.select(); } }
    }

    /** Offer to restore a local draft autosave if one exists and hasn't been dismissed. */
    /** Format a UTC ISO timestamp as AEST for display (review-2 #1) — delegates to the

    function toAest(iso) { return App.util.clock.toAest(iso); }

    /**
     * Decide the Apply-to-action toggle (review-9 #1): the items whose decision has the
     * chosen action, and whether we should REMOVE the control (all of them already have

     * @returns {{matching:RegisterItem[], removing:boolean}}
     */
    function applyToTogglePlan(items, field, action, controlId) {
      var matching = items.filter(function (it) { return it.decision && it.decision[field] === action; });
      var have = matching.filter(function (it) { return (it.controlRefs || []).indexOf(controlId) !== -1; }).length;
      return { matching: matching, removing: matching.length > 0 && have === matching.length };
    }

    function renderRestoreBanner() {

    function renderDrawerShell() {

    var _lastRenderedTab = null;
    /** @param {Object} [scroll] a captureScroll() snapshot to restore after rendering. */
    function renderMain(scroll) {

      // snapshot unless the caller already has one.

      if (ds) {

        var shown = App.ui.model.filterSortRows(project, tab, ds, ui).length;

    function renderTableHost() {

      if (!host) return;

    }

    function renderDrawer() {

      if (!logEl) return;

      logEl.innerHTML = entries.map(function (e) {
        // Show the time portion in AEST (review-2 #1, extended to the drawer).
        return '<div class="entry ' + esc(e.severity) + '">' + esc(toAest(e.ts).slice(11, 19)) + '  ' + esc(e.message) + '</div>';
      }).join('') || '<div class="muted">No activity yet.</div>';

    // ---- events ----
    function wire() {
      dom.on(_root, 'click', '[data-tab]', function (e, el) { closeRun(); _state.activeTab = el.getAttribute('data-tab'); render(); });
      dom.on(_root, 'click', 'th[data-col]', function (e, el) {
        // Ignore clicks on the resize handle (review-2 #4) so resizing doesn't sort.
        if (e.target && e.target.matches && e.target.matches('[data-col-resize]')) return;
        if (_colResizing) return;
        var ui = uiFor(_state.activeTab), col = el.getAttribute('data-col');
        if (ui.sortKey === col) ui.sortDir = (ui.sortDir === 'asc') ? 'desc' : 'asc';
        else { ui.sortKey = col; ui.sortDir = 'asc'; }

      });
      // Manual column resizing (review-2 #4): drag the handle on a header.
      dom.on(_root, 'mousedown', '[data-col-resize]', function (e, el) {
        e.preventDefault(); e.stopPropagation();

        function onUp(ev) {

          var ui = uiFor(_state.activeTab); ui.colWidths = ui.colWidths || {};
          ui.colWidths[col] = Math.max(MIN_COL_WIDTH_PX, startW + (ev.clientX - startX));
          setTimeout(function () { _colResizing = false; }, 0); // swallow the trailing click
        }
        document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
      });
      dom.on(_root, 'input', '[data-search]', function (e, el) {
        var dsId = el.getAttribute('data-search'), val = el.value;
        if (_searchTimer) clearTimeout(_searchTimer);

      });
      dom.on(_root, 'change', '[data-incomplete]', function (e, el) {

      });
      // review-14: show ONLY the ticked parked categories (both ticked ⇒ either); with
      // none ticked they are hidden again. renderMain so the toggle chips + note follow.
      dom.on(_root, 'change', '[data-only-rel]', function (e, el) {

        var only = (ui.onlyRelevance || []).filter(function (v) { return v !== value; });

        ui.onlyRelevance = only;

      });
      // ---- Apply Control Mode (review-7 #2) ----
      dom.on(_root, 'click', '[data-apply-toggle]', function (e, el) {

        ui.applyMode = !ui.applyMode;
        if (!ui.applyMode) ui.applyControlId = null; // exiting clears the selection; changes persist
        if (ui.applyMode) { ui.deleteMode = false; ui.deleteSel = {}; } // the two modes are exclusive

      });

        ui.deleteMode = false; ui.deleteSel = {};

        App.ui.activity.logIssues(res.issues, res.ok ? null : 'Delete items');
        renderMain();
      });
      dom.on(_root, 'click', '[data-delete-cancel]', function (e, el) {
        var ui = uiFor(el.getAttribute('data-delete-cancel'));

    /** Coerce an editor string to a typed JS value (for value-typed decisions). */
    function coerce(str, type) {
      if (type === 'bool') { var l = String(str).trim().toLowerCase(); if (l === 'true' || l === '1') return true; if (l === 'false' || l === '0') return false; return str; }
      if (type === 'int') { var n = parseInt(str, 10); return isNaN(n) ? str : n; }
      if (type === 'float') { var f = parseFloat(str); return isNaN(f) ? str : f; }
      if (type === 'json' || type === 'array') { try { return JSON.parse(str); } catch (e) { return str; } }
      if (type === 'null') { return String(str).trim() === 'null' ? null : String(str); }
      return String(str); // 'string'
    }

    /**
     * Assemble a decision object from a cell's raw control readings, or null for
     * "undecided". Split out of commitDecisionFromCell so the empty-value rule below
     * is directly testable (App.ui.app._decisionFromRaw).
     * @param {Object} adapter
     * @param {Object<string,{v:*,kind:string,vtype?:string}>} raw  Keyed by field name.
     * @returns {Object|null}
     */
    function decisionFromRaw(adapter, raw) {
      // An empty ENUM primary => undecided (that is what its "—" option means).
      // review-16 #1: a TEXT primary (e.g. a tactical leaf) no longer does this.
      // Emptying the box is a real decision — "set this key to blank", e.g. clearing a
      // comma-separated list — and used to bounce straight back to the captured value
      // because the commit was read as "undecided". The cell's "clear" button is now the
      // only way to return a text-valued item to undecided.
      var primary = adapter.decisionSchema[0].name, pr = raw[primary];
      if (pr && pr.kind === 'enum' && pr.v === '') return null;
      // VF-8: when the editor carries a format kind, the value is read back through
      // App.valueFormats.parseInput — the exact inverse of what rendered it. That is
      // also where "what does an empty box mean?" is answered per kind: '' for text
      // (review-16 #1), [] for a string list, and UNDECIDED for bool/number/options,
      // which have nothing sensible for empty to mean.
      if (pr && pr.fmtKind && App.valueFormats) {
        var pfmt = { kind: pr.fmtKind };
        var parsed = App.valueFormats.parseInput(pfmt, pr.v);
        if (parsed.undecided) return null;
      }
      var decision = {};
      Object.keys(raw).forEach(function (f) {
        var c = raw[f];
        if (c.kind === 'enum') { if (c.v !== '') decision[f] = c.v; }
        else if (c.kind === 'bool') decision[f] = !!c.v;
        else if (c.fmtKind && App.valueFormats) {
          // Format-driven read-back. An unparseable value (e.g. "abc" in a number box)
          // is still stored verbatim so the operator sees what they typed and gets a
          // located reason, rather than having their keystrokes silently discarded.
          var r = App.valueFormats.parseInput({ kind: c.fmtKind }, c.v);
          decision[f] = r.ok ? r.value : c.v;
        }
        else if (c.kind === 'string') decision[f] = c.v;
        // value-typed with no format hint: coerce by the captured leaf type — review-3 #2.
        else if (c.kind === 'value-typed') decision[f] = coerce(c.v, c.vtype || 'string');
      });
      return decision;
    }

    /**
     * Read every decision control in a cell, assemble the decision object and commit it.
     */
    function commitDecisionFromCell(cell) {
      var project = App.store.getProject(); if (!project) return;
      var dsId = cell.getAttribute('data-ds'), key = cell.getAttribute('data-key');
      var adapter = App.registry.getDataset(project.platformProfileId, dsId);
      var controls = cell.querySelectorAll('[data-decision]');
      var raw = {};
      Array.prototype.forEach.call(controls, function (c) {
        raw[c.getAttribute('data-field')] = {
          v: (c.type === 'checkbox' ? c.checked : c.value),
          kind: c.getAttribute('data-kind'),
          vtype: c.getAttribute('data-vtype'),
          fmtKind: c.getAttribute('data-fmt-kind')   // VF-8
        };
      });
      var decision = decisionFromRaw(adapter, raw);
      if (decision === null) { App.store.setDecision(dsId, key, null); _editIssues[dsId + '|' + key] = []; renderTableHost(); return; }
      var res = App.store.setDecision(dsId, key, decision);
      _editIssues[dsId + '|' + key] = res.issues || [];
      renderTableHost(); // reflect inline validation issues (store.onChange already re-rendered the shell)
    }

    /**
     * review-17 #3, amended by HELD-1: flip one item's decided/undecided state from its
     * Status badge — WITHOUT destroying the value.
     *  - decided -> undecided: **hold** the item. The recorded value stays exactly where
     *    it is; the item simply stops counting as complete, so it reads as undecided and
     *    keeps the device un-ready until it is reviewed. This is the whole point: you can
     *    record an answer and still be forced back to it. (Previously this cleared the
     *    decision, which threw the answer away — use the cell's "clear" button for that.)
     *  - held -> decided: release the hold. The value was never touched, so it is simply
     *    in force again.
     *  - never-decided -> decided: adopt what the row's value editor already shows. For
     *    a text primary (Tactical) that is the CAPTURED value (the box is prefilled with
     *    it), so one click means "the captured value is my decision". For an enum primary
     *    with no selection (Packages) there is nothing to adopt, so the FIRST schema
     *    option is used — for packages that is `keep`, the no-change action.
     * @param {Element} el the badge that was activated
     */
    function toggleStatus(el) {
      var project = App.store.getProject(); if (!project) return;
      var dsId = el.getAttribute('data-ds'), key = el.getAttribute('data-key');
      var item = (project.items[dsId] || []).filter(function (it) { return it.key === key; })[0];
      if (!item) return;
      if (item.held) {                       // held -> decided: just release it
        App.store.setHeld(dsId, key, false);
        renderTableHost();
        return;
      }
      if (item.status === 'decided') {       // decided -> held (value retained)
        var res0 = App.store.setHeld(dsId, key, true);
        if (!res0.ok) App.ui.activity.logIssues(res0.issues, 'Review flag');
        renderTableHost();
        return;
      }
      var row = el; while (row && row.tagName !== 'TR') row = row.parentNode;
      var cell = row ? row.querySelector('td.dcell') : null;
      if (!cell) return;
      var adapter = App.registry.getDataset(project.platformProfileId, dsId);
      var raw = {};
      Array.prototype.forEach.call(cell.querySelectorAll('[data-decision]'), function (c) {
        var field = c.getAttribute('data-field'), kind = c.getAttribute('data-kind');
        var fmtKind = c.getAttribute('data-fmt-kind');
        var v = (c.type === 'checkbox' ? c.checked : c.value);
        if (kind === 'enum' && v === '') {
          var f = adapter.decisionSchema.filter(function (x) { return x.name === field; })[0];
          if (f && f.options && f.options.length) v = f.options[0];
        }
        raw[field] = { v: v, kind: kind, vtype: c.getAttribute('data-vtype'), fmtKind: fmtKind };
      });
      var decision = decisionFromRaw(adapter, raw);
      if (decision === null) return; // nothing to adopt — leave it undecided
      var res = App.store.setDecision(dsId, key, decision);
      _editIssues[dsId + '|' + key] = res.issues || [];
      renderTableHost();
    }

    // ---- project I/O wiring ----

        resetUndo(); // snapshots belong to the PREVIOUS project — never replay them here
        App.ui.activity.logIssues(res.issues);
        App.ui.activity.log({ severity: 'success', message: 'Loaded project: ' + res.value.deviceConfigs.length + ' device(s).' });
