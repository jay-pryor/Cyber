          '<input type="checkbox" data-generate-txt' + (_gen.scriptsAsTxt ? ' checked' : '') + '> Output scripts as <code>.txt</code> instead of <code>.ps1</code></label>' +
        '<div class="gen-grid">' + cards + '</div>' +
        '<p class="muted">Each command produces a single <code>.zip</code> download. Outputs are deterministic for identical inputs.</p>' +
        '</div>';
    }

    function doGenerate(cmdId) {
      var project = App.store.getProject(); if (!project) return;
      var selId = selectedId(project);
      if (!App.completeness.deviceReady(project, selId)) {
        App.ui.activity.log({ severity: 'warning', message: 'Cannot generate: device not ready.' });
        return;
      }
      var cmd = COMMANDS.filter(function (c) { return c.id === cmdId; })[0];
      if (App.generate && typeof App.generate[cmd.build] === 'function') {
        try {
          var out = App.generate[cmd.build](project, selId, { scriptsAsTxt: _gen.scriptsAsTxt });
          if (out && out.blob) { App.util.dom.download(out.blob, out.name); App.ui.activity.log({ severity: 'success', message: 'Generated ' + cmd.label + ': ' + out.name }); }
          (out && out.issues || []).forEach(function (i) { App.ui.activity.log(i); });
        } catch (err) { App.ui.activity.log({ severity: 'error', message: 'Generation failed: ' + (err && err.message) }); }
      } else {
        App.ui.activity.log({ severity: 'info', message: cmd.label + ' generation will be available in Phase 7.' });
      }
    }

    function wire(ctx) {
      _ctx = ctx;
      App.util.dom.on(ctx.root, 'change', '[data-generate-device]', function (e, el) { _gen.deviceId = el.value; ctx.refreshMain(); });
      App.util.dom.on(ctx.root, 'change', '[data-generate-txt]', function (e, el) { _gen.scriptsAsTxt = el.checked; });
      App.util.dom.on(ctx.root, 'click', '[data-generate-action]', function (e, el) { doGenerate(el.getAttribute('data-generate-action')); });
    }

    App.ui = App.ui || {};
    App.ui.views = App.ui.views || {};
    App.ui.views.generate = { render: render, wire: wire };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.views.devices
   * PURPOSE: The Devices tab (spec §11.3, DOD-9). Lists device configs grouped by
   *          baseId (latest = active; older = superseded read-only history), and a
   *          read-only device-configuration view with THREE panels (one per dataset)
   *          listing exactly the device's applicable DECIDED items (key/decision/ISM).
   * PURITY:  UI/DOM (render returns strings; no engine mutation)
   * DEPENDS: App.registry, App.store, App.ui.model, App.completeness, App.util.html
   * INVARIANTS: panels show exactly applicable ∩ decided; generation/readiness use
   *             the latest version only.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var esc = App.util.html.esc;
    var _dev = { selectedId: null, assignResults: {}, detailSearch: '', collapsed: {}, openControlId: null, deviationsFirst: false, openGroupId: null, groupAdd: { dsId: null, key: '' }, newGroupName: '' };
    var _devSearchTimer = null;
    var _ctx = null;

    /** Register items applicable to a device for a dataset (pure, from the snapshot). */
    function applicable(project, deviceId, dsId) {
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      if (!dc) return [];
      var snap = dc.snapshots[dsId];
      if (!snap) return [];
      var ks = {}; snap.keys.forEach(function (k) { ks[k] = true; });
      return (project.items[dsId] || []).filter(function (it) { return ks[it.key]; });
    }

    // Derive datasets from the PROJECT's platform (not the globally-active one),
    // so the view is correct even if active≠project platform (D-008).
    function datasets(project) { var p = App.registry.getPlatform(project.platformProfileId); return p ? p.datasets : []; }
    function decisionGet(adapter) {
      var col = adapter.columns.filter(function (c) { return c.key === 'decision'; })[0];
      return col && col.get ? col.get : function (it) { return it.decision ? JSON.stringify(it.decision) : ''; };
    }

    /** The grouped device list (spec §11.3). */
    function renderList(project) {
      if (!project || !project.deviceConfigs.length) {
        return '<div class="empty-state"><h2>Devices</h2><p>No device configurations yet — go to <strong>Onboard</strong>.</p></div>';
      }
      var latestIds = {}; App.ui.model.getLatestConfigs(project).forEach(function (c) { latestIds[c.id] = true; });
      // Group by baseId.
      var groups = {}, order = [];
      project.deviceConfigs.forEach(function (c) { if (!groups[c.baseId]) { groups[c.baseId] = []; order.push(c.baseId); } groups[c.baseId].push(c); });
      order.sort();

      var ds = datasets(project);
      function rowHtml(c, superseded) {
        var counts = ds.map(function (d) {
          var ap = applicable(project, c.id, d.id);
          var dec = ap.filter(function (it) { return it.status === 'decided'; }).length;
          return esc(d.label) + ' ' + dec + '/' + ap.length;
        }).join(' · ');
        var badge;
        if (superseded) badge = '<span class="badge superseded">superseded</span>';
        else {
          var r = App.completeness.deviceReadiness(project, c.id);
          badge = r.ready ? '<span class="badge decided">ready</span>' : '<span class="badge undecided">' + r.totalUndecided + ' undecided</span>';
        }
        return '<div class="dev-row' + (superseded ? ' superseded' : '') + '">' +
          '<span class="dev-name">' + esc(c.name) + '</span>' +
          '<span class="dev-meta">' + esc(c.model) + ' · ' + esc(c.firmware) + ' · v' + c.version + '</span>' +
          '<span class="spacer"></span>' +
          '<span class="counts">' + counts + '</span>' +
          badge +
          ' <button data-device-view="' + esc(c.id) + '">View</button>' +
          '</div>';
      }

      // A version-stack (all versions of one baseId), latest first.
      function stackHtml(baseId) {
        var members = groups[baseId].slice().sort(function (a, b) { return b.version - a.version; });
        return '<div class="dev-group">' + members.map(function (c) { return rowHtml(c, !latestIds[c.id]); }).join('') + '</div>';
      }

      // --- Device-group sections (spec §19.4) ---------------------------------
      // Map each present baseId to its group (if any).
      var groupOf = {}; (project.groups || []).forEach(function (g) { (g.deviceBaseIds || []).forEach(function (b) { groupOf[b] = g; }); });
      // All distinct baseIds present, name-ordered via their latest config name.
      var nameOf = {}; App.ui.model.getLatestConfigs(project).forEach(function (c) { if (nameOf[c.baseId] === undefined) nameOf[c.baseId] = c.name; });
      var allBases = order.slice().sort(function (a, b) { return (nameOf[a] || a) < (nameOf[b] || b) ? -1 : 1; });

      // review-6 #1: a toggle-able dropdown to add/remove a member device (pick a
      // device to add it; pick a current member to remove it). Members are also shown
      // as text so the current membership is clear at a glance.
      function memberSelect(g) {
        var inG = {}; (g.deviceBaseIds || []).forEach(function (b) { inG[b] = true; });
        return '<select class="grp-member-select" data-group-member-select data-group-id="' + esc(g.id) + '" aria-label="add or remove a device">' +
          '<option value="">+ / − device…</option>' +
          allBases.map(function (b) {
            return '<option value="' + esc(b) + '">' + (inG[b] ? '✓ ' : '') + esc(nameOf[b] || b) + (inG[b] ? ' — remove' : ' — add') + '</option>';
          }).join('') + '</select>';
      }
      function groupSection(g) {
        var members = allBases.filter(function (b) { return groupOf[b] && groupOf[b].id === g.id; });
        var stacks = members.length ? members.map(stackHtml).join('') : '<p class="muted" style="padding:6px 10px">No devices in this group yet.</p>';
        var nDev = App.overrides.groupDeviations(project, g.id).length;
        var memberNames = members.map(function (b) { return nameOf[b] || b; }).join(', ') || '(none)';
        var head = '<div class="dev-group-head">' +
          '<input class="grp-name" data-group-name data-group-id="' + esc(g.id) + '" value="' + esc(g.name) + '" aria-label="group name">' +
          '<span class="muted" style="font-size:12px">' + members.length + ' device' + (members.length === 1 ? '' : 's') + '</span>' +
          '<button data-group-deviations="' + esc(g.id) + '">Deviations (' + nDev + ')</button>' +
          '<button class="danger" data-group-remove="' + esc(g.id) + '">Delete group</button>' +
          '<div class="grp-members"><span class="muted" style="font-size:12px">Members: </span><span class="grp-member-names">' + esc(memberNames) + '</span>' +
            (allBases.length ? memberSelect(g) : '<span class="muted">no devices onboarded</span>') + '</div>' +
          '</div>';
        return '<section class="dev-group-section"><h3 class="grp-title">' + esc(g.name) + '</h3>' + head + stacks + '</section>';
      }

      var groupSections = (project.groups || []).slice().sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; }).map(groupSection).join('');
      var ungrouped = allBases.filter(function (b) { return !groupOf[b]; });
      var ungroupedHtml = ungrouped.length
        ? '<section class="dev-group-section"><h3 class="grp-title">Ungrouped</h3>' + ungrouped.map(stackHtml).join('') + '</section>'
        : '';
      var addGroup = '<div class="add-group"><input data-group-newname placeholder="New group name" value="' + esc(_dev.newGroupName || '') + '" aria-label="new group name"><button class="primary" data-action="add-group">Add group</button></div>';

      return '<div><h2>Devices</h2>' +
        '<p class="muted">Latest version is active for generation; older versions are read-only history. Group overrides apply to every device in the group (default → group → device).</p>' +
        addGroup + groupSections + ungroupedHtml +
        (_dev.openGroupId ? renderGroupModal(project, _dev.openGroupId) : '') +
        '</div>';
    }

    /** Applicable-key union across a group's member latest configs for a dataset. */
    function groupUnionKeys(project, g, dsId) {
      var set = {}, latest = App.ui.model.getLatestConfigs(project);
      (g.deviceBaseIds || []).forEach(function (b) {
        var c = latest.filter(function (x) { return x.baseId === b; })[0];
        var sn = c && c.snapshots[dsId];
        if (sn && Array.isArray(sn.keys)) sn.keys.forEach(function (k) { set[k] = true; });
      });
      return Object.keys(set);
    }

    /** A schema-driven group-override editor, seeded with a decision (data-gov-* attrs). */
    function govControl(adapter, decision, fieldPrefix) {
      var d = decision;
      return adapter.decisionSchema.map(function (f) {
        var common = fieldPrefix + ' data-gov-field="' + esc(f.name) + '" data-gov-kind="' + f.kind + '"';
        if (f.kind === 'enum') {
          var cur = d && d[f.name] != null ? d[f.name] : '';
          return '<select ' + common + ' aria-label="' + esc(f.name) + '"><option value="">—</option>' +
            f.options.map(function (o) { return '<option value="' + esc(o) + '"' + (cur === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
        }
        if (f.kind === 'string') {
          var cur2 = d && d[f.name] != null ? d[f.name] : '';
          return '<textarea ' + common + ' rows="1" class="val-edit" aria-label="' + esc(f.name) + '">' + esc(cur2) + '</textarea>';
        }
        if (f.kind === 'value-typed') {
          var rawVal = d && ('value' in d) ? d.value : '';
          var shown = (typeof rawVal === 'string') ? rawVal : App.util.stable.stableStringify(rawVal);
          var vtype = (d && d.type) ? d.type : (typeof rawVal === 'boolean' ? 'bool' : (typeof rawVal === 'number' ? (rawVal % 1 === 0 ? 'int' : 'float') : 'string'));
          return '<textarea ' + common + ' data-vtype="' + esc(vtype) + '" rows="1" class="val-edit" aria-label="value">' + esc(shown) + '</textarea>';
        }
        if (f.kind === 'bool') {
          var on = !!(d && d[f.name]);
          return '<input type="checkbox" ' + common + (on ? ' checked' : '') + ' aria-label="' + esc(f.name) + '">';
        }
        return '';
      }).join(' ');
    }

    /** Group "Deviations" modal (spec §19.4 / OVR-6): view + edit/remove + add group overrides. */
    function renderGroupModal(project, groupId) {
      var g = (project.groups || []).filter(function (x) { return x.id === groupId; })[0];
      if (!g) return '';
      var sections = datasets(project).map(function (d) {
        var adapter = App.registry.getDataset(project.platformProfileId, d.id);
        var dispKey = adapter.displayKey || function (k) { return k; };
        var get = decisionGet(adapter);
        var ovMap = (g.overrides && g.overrides[d.id]) || {};
        var keys = Object.keys(ovMap).sort();
        var rows = keys.map(function (key) {
          var dV = (project.items[d.id] || []).filter(function (it) { return it.key === key; })[0];
          // review-6 #2: show the DEFAULT value alone (e.g. 0), not the raw decision JSON.
          var defText = dV && dV.decision != null ? String(get({ decision: dV.decision })) : '(undecided)';
          return '<tr><td>' + esc(dispKey(key)) + '</td><td>' + esc(defText) + '</td>' +
            '<td>' + govControl(adapter, ovMap[key], 'data-gov data-gov-ds="' + esc(d.id) + '" data-gov-key="' + esc(key) + '"') + '</td>' +
            '<td><button class="ov-revert" data-gov-remove data-ds="' + esc(d.id) + '" data-key="' + esc(key) + '">Remove</button></td></tr>';
        }).join('');
        var table = keys.length
          ? '<table><thead><tr><th>Key</th><th>Default</th><th>Deviation setting</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div class="empty">No group overrides for ' + esc(d.label) + '.</div>';
        return '<div class="panel"><h3>' + esc(d.label) + ' (' + keys.length + ')</h3>' + table + '</div>';
      }).join('');

      // Add-override form: dataset select + a SEARCHABLE key input (review-6 #3) + editor + Set.
      var addDs = _dev.groupAdd.dsId || (datasets(project)[0] && datasets(project)[0].id);
      var addAdapter = App.registry.getDataset(project.platformProfileId, addDs);
      var dsSel = datasets(project).map(function (d) { return '<option value="' + esc(d.id) + '"' + (d.id === addDs ? ' selected' : '') + '>' + esc(d.label) + '</option>'; }).join('');
      var ovKeys = (g.overrides && g.overrides[addDs]) || {};
      var addDispKey = (addAdapter && addAdapter.displayKey) || function (k) { return k; };
      // A <datalist> makes the (long) key list type-to-filter searchable natively.
      var keyOpts = groupUnionKeys(project, g, addDs).filter(function (k) { return !(k in ovKeys); }).sort()
        .map(function (k) { return '<option value="' + esc(k) + '">' + esc(addDispKey(k)) + '</option>'; }).join('');
      var addForm = '<div class="gov-add"><strong>Add override:</strong> ' +
        '<select data-gov-add-ds aria-label="dataset">' + dsSel + '</select> ' +
        '<input class="gov-add-key" data-gov-add-key list="gov-add-keylist" placeholder="type to search a key…" value="' + esc(_dev.groupAdd.key || '') + '" aria-label="key">' +
        '<datalist id="gov-add-keylist">' + keyOpts + '</datalist> ' +
        (addAdapter ? govControl(addAdapter, null, 'data-gov-add-field-ctl') : '') +
        ' <button class="primary" data-gov-add-set data-ds="' + esc(addDs) + '">Set</button></div>';

      return '<div class="modal-overlay" data-group-modal>' +
        '<div class="modal modal-wide" role="dialog" aria-modal="true" aria-label="Group deviations for ' + esc(g.name) + '">' +
          '<div class="modal-head"><div><h3>' + esc(g.name) + ' — deviations from default</h3>' +
            '<div class="modal-sub">Group overrides apply to every member device (default → group → device).</div></div>' +
            '<button type="button" class="modal-close" data-group-modal-close aria-label="Close">×</button></div>' +
          '<div class="modal-body"><div class="panels">' + sections + '</div>' + addForm + '</div>' +
        '</div></div>';
    }

    /** Build a decision object from a NodeList of data-gov* controls; null if no value set. */
    function govDecision(controls) {
      var decision = {}, hasValue = false;
      Array.prototype.forEach.call(controls, function (c) {
        var field = c.getAttribute('data-gov-field'), kind = c.getAttribute('data-gov-kind');
        if (kind === 'bool') { decision[field] = c.checked; hasValue = true; }
        else if (kind === 'value-typed') { if (String(c.value) !== '') { decision[field] = coerceOv(c.value, c.getAttribute('data-vtype')); hasValue = true; } }
        else if (kind === 'enum') { if (c.value !== '') { decision[field] = c.value; hasValue = true; } }
        else { decision[field] = c.value; hasValue = true; } // string: '' is a valid value
      });
      return hasValue ? decision : null;
    }

    /** Coerce an override editor string to a typed JS value (mirrors the data-table coerce). */
    function coerceOv(str, type) {
      if (type === 'bool') { var l = String(str).trim().toLowerCase(); if (l === 'true' || l === '1') return true; if (l === 'false' || l === '0') return false; return str; }
      if (type === 'int') { var n = parseInt(str, 10); return isNaN(n) ? str : n; }
      if (type === 'float') { var f = parseFloat(str); return isNaN(f) ? str : f; }
      return str;
    }

    /** A schema-driven override editor for one item, seeded with the effective decision (spec §19.5). */
    function renderOverrideControl(adapter, dsId, item, effDecision) {
      var d = effDecision;
      return adapter.decisionSchema.map(function (f) {
        var common = 'data-ov data-ov-ds="' + esc(dsId) + '" data-ov-key="' + esc(item.key) + '" data-ov-field="' + esc(f.name) + '" data-ov-kind="' + f.kind + '"';
        if (f.kind === 'enum') {
          var cur = d && d[f.name] != null ? d[f.name] : '';
          return '<select ' + common + ' aria-label="override ' + esc(f.name) + '"><option value="">—</option>' +
            f.options.map(function (o) { return '<option value="' + esc(o) + '"' + (cur === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
        }
        if (f.kind === 'string') {
          var cur2 = d && d[f.name] != null ? d[f.name] : '';
          return '<textarea ' + common + ' rows="1" class="val-edit" aria-label="override ' + esc(f.name) + '">' + esc(cur2) + '</textarea>';
        }
        if (f.kind === 'value-typed') {
          var rawVal = d && ('value' in d) ? d.value : '';
          var shown = (typeof rawVal === 'string') ? rawVal : App.util.stable.stableStringify(rawVal);
          var vtype = (d && d.type) ? d.type : (typeof rawVal === 'boolean' ? 'bool' : (typeof rawVal === 'number' ? (rawVal % 1 === 0 ? 'int' : 'float') : 'string'));
          return '<textarea ' + common + ' data-vtype="' + esc(vtype) + '" rows="1" class="val-edit" aria-label="override value">' + esc(shown) + '</textarea>';
        }
        if (f.kind === 'bool') {
          var on = !!(d && d[f.name]);
          return '<input type="checkbox" ' + common + (on ? ' checked' : '') + ' aria-label="override ' + esc(f.name) + '">';
        }
        return '';
      }).join(' ');
    }

    /**
     * The device-configuration panels (spec §11.3 / §19.5, DOD-9 amended). Each panel
     * is collapsible (review-5 #1) and filtered by the search term (review-3 #6).
     *  - LATEST version: lists every APPLICABLE item showing its EFFECTIVE decision
     *    (default→group→device), a divergence class/marker (OVR-4), an inline override
     *    editor (writes via store.setDeviceOverride, OVR-8) and a Revert affordance.
     *  - SUPERSEDED version: read-only (effective decision only).
     */
    function renderPanels(project, deviceId, search) {
      var q = (search || '').toLowerCase().trim();
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      var isLatest = !!dc && App.ui.model.getLatestConfigs(project).some(function (c) { return c.id === deviceId; });
      var clsOrder = { device: 0, group: 1, 'default': 2 };
      return datasets(project).map(function (d) {
        var adapter = App.registry.getDataset(project.platformProfileId, d.id);
        var get = decisionGet(adapter);
        var dispKey = adapter.displayKey || function (k) { return k; };
        var appItems = applicable(project, deviceId, d.id);
        var rows = appItems.map(function (it) {
          var eff = App.overrides.effectiveItem(project, d.id, it, deviceId);
          var cls = App.overrides.classify(project, d.id, it, deviceId);
          var hasOv = !!(dc && dc.overrides && dc.overrides[d.id] && Object.prototype.hasOwnProperty.call(dc.overrides[d.id], it.key));
          return { it: it, eff: eff, disp: dispKey(it.key), dec: eff.decision != null ? String(get(eff)) : '', cls: cls, hasOv: hasOv };
        }).filter(function (r) {
          if (!q) return true;
          return (r.disp + ' ' + r.dec + ' ' + (r.it.description || '')).toLowerCase().indexOf(q) !== -1;
        });
        rows.sort(function (a, b) {
          if (_dev.deviationsFirst && clsOrder[a.cls] !== clsOrder[b.cls]) return clsOrder[a.cls] - clsOrder[b.cls];
          return a.it.key < b.it.key ? -1 : a.it.key > b.it.key ? 1 : 0;
        });
        var bodyRows = rows.map(function (r) {
          var rowCls = r.cls === 'group' ? 'dev-diverge-group' : r.cls === 'device' ? 'dev-diverge-device' : '';
          var marker = r.cls === 'group' ? '<span class="diverge-tag group" title="Differs from default via a group override">group</span>'
            : r.cls === 'device' ? '<span class="diverge-tag device" title="Differs from the inherited value via this device&#39;s override">device</span>' : '';
          var decCell = '<td>' + (r.dec ? esc(r.dec) : '<span class="muted">—</span>') + ' ' + marker + '</td>';
          if (!isLatest) return '<tr class="' + rowCls + '"><td>' + esc(r.disp) + '</td>' + decCell + '</tr>';
          var editor = '<div class="ov-edit">' + renderOverrideControl(adapter, d.id, r.it, r.eff.decision) +
            (r.hasOv ? ' <button type="button" class="ov-revert" data-ov-revert data-ds="' + esc(d.id) + '" data-key="' + esc(r.it.key) + '" title="Revert to the inherited value">Revert</button>' : '') + '</div>';
          return '<tr class="' + rowCls + '"><td>' + esc(r.disp) + '</td>' + decCell + '<td>' + editor + '</td></tr>';
        }).join('');
        var headCols = isLatest ? '<th>Key</th><th>Effective</th><th>Override</th>' : '<th>Key</th><th>Effective</th>';
        var colspan = isLatest ? 3 : 2;
        var body = rows.length
          ? '<table><thead><tr>' + headCols + '</tr></thead><tbody>' + bodyRows + '</tbody></table>'
          : '<div class="empty">' + (q ? 'No matching applicable items.' : 'No applicable items.') + '</div>';
        var note = '<div class="panel-note">' + rows.length + (q ? ' matching' : '') + ' of ' + appItems.length + ' applicable</div>';
        var collapsed = !!_dev.collapsed[d.id];
        var caret = collapsed ? '▸' : '▾';
        return '<div class="panel' + (collapsed ? ' collapsed' : '') + '">' +
          '<h3><button type="button" class="panel-toggle" data-panel-toggle="' + esc(d.id) + '" aria-expanded="' + (!collapsed) + '"><span class="caret">' + caret + '</span> ' + esc(d.label) + '</button></h3>' +
          note + body + '</div>';
      }).join('');
    }

    /**
     * Controls assigned to this device, each a button that opens a modal listing the
     * exact items (per dataset) applicable to BOTH this device and that control —
     * i.e. what is done to satisfy that control here (review-5 #1).
     */
    function renderDeviceControls(project, deviceId) {
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      if (!dc) return '';
      var controls = (project.controls || []).filter(function (c) {
        return (c.assignedDeviceIds || []).indexOf(dc.baseId) !== -1;
      }).sort(function (a, b) { return a.title < b.title ? -1 : a.title > b.title ? 1 : 0; });
      var inner;
      if (!controls.length) {
        inner = '<p class="muted">No controls are assigned to this device. Assign controls to devices in the <strong>Control Manager</strong> tab.</p>';
      } else {
        inner = '<div class="ctl-applies-list">' + controls.map(function (c) {
          var n = countControlItems(project, deviceId, c.id);
          return '<button type="button" class="ctl-applies-item" data-control-open="' + esc(c.id) + '">' +
            '<span class="ctl-applies-title">' + esc(c.title) + '</span>' +
            '<span class="muted">' + esc(c.type) + '</span>' +
            '<span class="ctl-applies-count">' + n + ' item' + (n === 1 ? '' : 's') + '</span></button>';
        }).join('') + '</div>';
      }
      return '<div class="dev-controls"><h3>Controls applying to this device</h3>' +
        '<p class="muted" style="font-size:12px">Click a control to see exactly which packages, settings and tactical items satisfy it on this device.</p>' +
        inner + '</div>';
    }

    /** Count items applicable to a device that reference a given control (all datasets). */
    function countControlItems(project, deviceId, controlId) {
      return datasets(project).reduce(function (sum, d) {
        return sum + applicable(project, deviceId, d.id).filter(function (it) {
          return (it.controlRefs || []).indexOf(controlId) !== -1;
        }).length;
      }, 0);
    }

    /**
     * Modal: for one control + device, three read-only lists of the items applicable
     * to the device that reference the control (review-5 #1). Closed via the × button
     * or a backdrop click.
     */
    function renderControlModal(project, deviceId, controlId) {
      var control = (project.controls || []).filter(function (c) { return c.id === controlId; })[0];
      if (!control) return '';
      var lists = datasets(project).map(function (d) {
        var adapter = App.registry.getDataset(project.platformProfileId, d.id);
        var get = decisionGet(adapter);
        var dispKey = adapter.displayKey || function (k) { return k; };
        var items = applicable(project, deviceId, d.id).filter(function (it) {
          return (it.controlRefs || []).indexOf(controlId) !== -1;
        }).sort(function (a, b) { return a.key < b.key ? -1 : 1; });
        var rows = items.map(function (it) {
          var statusBadge = it.status === 'decided'
            ? '<span class="badge decided">decided</span>'
            : '<span class="badge undecided">undecided</span>';
          return '<tr><td>' + esc(dispKey(it.key)) + '</td><td>' + esc(it.decision ? String(get(it)) : '') + '</td><td>' + statusBadge + '</td></tr>';
        }).join('');
        var body = items.length
          ? '<table><thead><tr><th>Key</th><th>Decision</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div class="empty">No items reference this control on this device.</div>';
        return '<div class="panel"><h3>' + esc(d.label) + ' (' + items.length + ')</h3>' + body + '</div>';
      }).join('');
      return '<div class="modal-overlay" data-control-modal>' +
        '<div class="modal" role="dialog" aria-modal="true" aria-label="Actions satisfying control ' + esc(control.title) + '">' +
          '<div class="modal-head">' +
            '<div><h3>' + esc(control.title) + '</h3>' +
            '<div class="modal-sub">' + esc(control.type) + (control.description ? ' · ' + esc(control.description) : '') + '</div></div>' +
            '<button type="button" class="modal-close" data-control-modal-close aria-label="Close">×</button>' +
          '</div>' +
          '<div class="modal-body"><div class="panels">' + lists + '</div></div>' +
        '</div>' +
      '</div>';
    }

    function renderDetail(project, deviceId) {
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      if (!dc) return '<div class="empty-state">Device not found. <button data-device-back>Back</button></div>';
      var isLatest = App.ui.model.getLatestConfigs(project).some(function (c) { return c.id === deviceId; });
      var banner = isLatest ? '' : '<div class="superseded-banner">Superseded version — read-only history. Generation and readiness use the latest version.</div>';

      // Legend (OVR-4): yellow = group override, orange = device override.
      var legend = '<div class="diverge-legend"><span class="swatch group"></span> Group override <span class="swatch device"></span> Device override</div>';
      // "Deviations first" pin toggle (OVR-5), UI-state only.
      var pin = '<label class="dev-pin"><input type="checkbox" data-dev-deviations-first' + (_dev.deviationsFirst ? ' checked' : '') + '> Deviations first</label>';

      return '<div>' +
        '<button data-device-back>← Devices</button>' +

  <script>
  /* =============================================================================
   * MODULE: App.ui.views.controls
   * PURPOSE: The Control Manager tab (spec §18.3 CTL-1/CTL-4): view/add/edit/remove
   *          controls (title, type, description, assigned device configs). Decision
   *          assignment stays in the data tabs (CTL-5); this is the catalogue.
   * PURITY:  UI/DOM
   * DEPENDS: App.store, App.ui.model, App.util.{html,dom}
   * INVARIANTS: edits go through store CRUD; assignments reference device baseIds.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var esc = App.util.html.esc;
    var _add = { title: '', type: 'ISM', description: '' };
    var _newType = '';
    var _ctx = null;
    // review-4 #4: Control Manager is a searchable table with a per-row expander.
    // review-6 #4: per-column widths (drag-resizable), persisted in UI state.
    var _cm = { search: '', expanded: {}, colWidths: {} };
    var _cmSearchTimer = null;
    var CM_COLS = [
      { key: 'title', label: 'Title', w: 200 },
      { key: 'type', label: 'Type', w: 120 },
      { key: 'applies', label: 'Applies to', w: 200 },
      { key: 'description', label: 'Description', w: 340 }
    ];

    function typeOptions(cur) {
      var opts = App.store.knownControlTypes(); // seed + user-added + types in use
      if (cur && opts.indexOf(cur) === -1) opts.push(cur);
      return opts.map(function (t) { return '<option value="' + esc(t) + '"' + (t === cur ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
    }

    function deviceCheckboxes(project, ctlId, assigned) {
      var set = {}; (assigned || []).forEach(function (b) { set[b] = true; });
      // One checkbox per distinct device baseId (latest config name shown).
      var latest = App.ui.model.getLatestConfigs(project), seen = {};
      return latest.map(function (c) {
        if (seen[c.baseId]) return ''; seen[c.baseId] = true;
        return '<label style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:12px">' +
          '<input type="checkbox" data-ctl-device="' + esc(ctlId) + '" data-baseid="' + esc(c.baseId) + '"' + (set[c.baseId] ? ' checked' : '') + '> ' + esc(c.name) + '</label>';
      }).join('') || '<span class="muted">No devices onboarded.</span>';
    }

    /** Comma-joined device names for a control's assigned baseIds (display only). */
    function deviceNames(project, assigned) {
      var byBase = {};
      App.ui.model.getLatestConfigs(project).forEach(function (c) { if (!byBase[c.baseId]) byBase[c.baseId] = c.name; });
      var names = (assigned || []).map(function (b) { return byBase[b] || b; });
      return names.length ? names.join(', ') : '';
    }

    /**
     * The controls table (review-4 #4): one row per control with Title/Type editable
     * inline, an Applies-to and a wrapping Description column, and a per-row expander
     * (dropdown) holding the editable description, the device-assignment multi-select,
     * and the Remove button. Filtered by the toolbar search term.
     */
    function renderTable(project) {
      var controls = (project.controls || []).slice().sort(function (a, b) { return a.title < b.title ? -1 : a.title > b.title ? 1 : 0; });
      if (!controls.length) return '<p class="muted">No controls yet — add one above, or they are created automatically when migrating a v1 project.</p>';
      var q = (_cm.search || '').toLowerCase().trim();
      var filtered = controls.filter(function (c) {
        if (!q) return true;
        return ((c.title || '') + ' ' + (c.type || '') + ' ' + (c.description || '')).toLowerCase().indexOf(q) !== -1;
      });
      // review-6 #4: data-driven headers with drag-to-resize handles + stored widths.
      var colWidths = _cm.colWidths || {};

        var w = colWidths[c.key] || c.w;
        return '<th data-cm-col="' + c.key + '" scope="col" style="width:' + w + 'px">' + esc(c.label) +
          '<span class="col-resize" data-cm-col-resize="' + c.key + '" title="Drag to resize"></span></th>';
      }).join('') + '</tr>';
      var body = filtered.map(function (c) {
        var open = !!_cm.expanded[c.id];
        var lead = '<td><button class="expand-btn" data-ctl-expand="' + esc(c.id) + '" aria-expanded="' + open + '" title="Edit / remove">' + (open ? '▾' : '▸') + '</button></td>';
        var row = '<tr>' + lead +
          '<td><input type="text" data-ctl-field="title" data-ctl-id="' + esc(c.id) + '" value="' + esc(c.title) + '" aria-label="title"></td>' +
          '<td><select data-ctl-field="type" data-ctl-id="' + esc(c.id) + '" aria-label="type">' + typeOptions(c.type) + '</select></td>' +
          '<td class="ctl-applies-cell">' + (esc(deviceNames(project, c.assignedDeviceIds)) || '<span class="muted">—</span>') + '</td>' +
          '<td class="ctl-desc-cell">' + esc(c.description || '') + '</td>' +
          '</tr>';
        if (open) {
          // review-4 #4: the dropdown holds the wide wrapping description editor, the
          // device assignment, and the Remove button. The leading "\n" is sacrificial

          row += '<tr class="detail-row"><td colspan="5"><div class="detail-form">' +
            '<label>Description</label>' +
            '<textarea class="ctl-desc" data-ctl-field="description" data-ctl-id="' + esc(c.id) + '" placeholder="Description" aria-label="description">\n' + esc(c.description || '') + '</textarea>' +

            '</div></td></tr>';

    }

    function render(project) {
      if (!project) return '<div class="empty-state"><h2>Control Manager</h2><p>Load a project or onboard a device first.</p></div>';

      var addForm = '<div class="ctl-add">' +
        '<h3>Add control</h3>' +
        '<input type="text" data-ctl-add="title" placeholder="Title" value="' + esc(_add.title) + '" style="min-width:220px">' +
        '<select data-ctl-add="type">' + typeOptions(_add.type) + '</select>' +
        '<input type="text" data-ctl-add="description" placeholder="Description" value="' + esc(_add.description) + '" style="min-width:260px">' +
        '<button class="primary" data-action="ctl-add">Add</button>' +
        '</div>';

        '<div class="ctl-add-type">' +
          '<input type="text" data-ctl-newtype placeholder="New type name" value="' + esc(_newType) + '" style="min-width:160px">' +
          '<button data-action="ctl-add-type">Add type</button>' +
          '<span class="muted" style="font-size:12px">Known: ' + esc(App.store.knownControlTypes().join(', ')) + '</span>' +
        '</div>' +
        '<div class="ctl-import">' +
          '<button data-action="ctl-import">Import controls (CSV)…</button>' +
          '<span class="muted" style="font-size:12px">Columns must be exactly: <code>title,type,description</code></span>' +
          '<input type="file" data-ctl-import-file accept=".csv,text/csv" class="visually-hidden" aria-hidden="true">' +
        '</div></div>';

      // review-4 #3: the add-type + import tools sit to the RIGHT of the title, not beneath it.
      // review-4 #4: a searchable table (search box outside #ctl-table-host so it keeps focus).
      var toolbar = '<div class="ctl-toolbar"><input type="search" class="ctl-search" data-ctl-search placeholder="Search controls (title / type / description)…" value="' + esc(_cm.search) + '" aria-label="Search controls"></div>';
      return '<div style="max-width:1100px">' +
        '<div class="ctl-header"><h2>Control Manager</h2>' + tools + '</div>' +
        '<p class="muted">Controls are the requirements an item satisfies. Assign controls to items from the data tabs (Control Refs).</p>' +
        addForm +
        toolbar +
        '<div id="ctl-table-host">' + renderTable(project) + '</div>' +
        '</div>';
    }

    function wire(ctx) {
      _ctx = ctx;
      var dom = App.util.dom;

      dom.on(ctx.root, 'mousedown', '[data-cm-col-resize]', function (e, el) {

      dom.on(ctx.root, 'input', '[data-ctl-search]', function (e, el) {
        var val = el.value;
        if (_cmSearchTimer) clearTimeout(_cmSearchTimer);
        _cmSearchTimer = setTimeout(function () {
          _cm.search = val;
          var host = document.getElementById('ctl-table-host');
          if (host) host.innerHTML = renderTable(App.store.getProject());
        }, 150);
      });
      // Per-row dropdown (expander) — re-render only the table host.
      dom.on(ctx.root, 'click', '[data-ctl-expand]', function (e, el) {
        var id = el.getAttribute('data-ctl-expand');
        if (_cm.expanded[id]) delete _cm.expanded[id]; else _cm.expanded[id] = true;
        var host = document.getElementById('ctl-table-host');
        if (host) host.innerHTML = renderTable(App.store.getProject());
      });
      dom.on(ctx.root, 'change', '[data-ctl-field]', function (e, el) {
        var patch = {}; patch[el.getAttribute('data-ctl-field')] = el.value;
        App.store.updateControl(el.getAttribute('data-ctl-id'), patch);
      });
      dom.on(ctx.root, 'change', '[data-ctl-device]', function (e, el) {
        var id = el.getAttribute('data-ctl-device'), baseId = el.getAttribute('data-baseid');
        var project = App.store.getProject();
        var c = (project.controls || []).filter(function (x) { return x.id === id; })[0]; if (!c) return;
        var set = (c.assignedDeviceIds || []).filter(function (b) { return b !== baseId; });
        if (el.checked) set.push(baseId);
        App.store.updateControl(id, { assignedDeviceIds: set });
      });
      dom.on(ctx.root, 'click', '[data-ctl-remove]', function (e, el) {
        var res = App.store.removeControl(el.getAttribute('data-ctl-remove'));
        App.ui.activity.logIssues(res.issues);
        ctx.refreshMain();
      });
      // Add a control type manually (review-3 #5a).
      dom.on(ctx.root, 'input', '[data-ctl-newtype]', function (e, el) { _newType = el.value; });
      dom.on(ctx.root, 'click', '[data-action="ctl-add-type"]', function () {
        var res = App.store.addControlType(_newType);
        App.ui.activity.logIssues(res.issues);
        if (res.ok) _newType = '';
        ctx.refreshMain();
      });
      // Import controls from CSV (review-3 #5b).
      dom.on(ctx.root, 'click', '[data-action="ctl-import"]', function () {
        var inp = ctx.root.querySelector('[data-ctl-import-file]'); if (inp) inp.click();
      });
      dom.on(ctx.root, 'change', '[data-ctl-import-file]', function (e, el) {
        var file = el.files[0]; if (!file) return;
        App.util.dom.readFileText(file).then(function (text) {
          var rows = App.util.csv.parseCsv(text);
          if (!rows.length) { App.ui.activity.log({ severity: 'error', message: 'Control CSV import: empty file.' }); return; }
          var header = rows[0].map(function (h) { return String(h).trim(); });
          if (header.length !== 3 || header[0] !== 'title' || header[1] !== 'type' || header[2] !== 'description') {
            App.ui.activity.log({ severity: 'error', message: 'Control CSV import refused: the header row must be exactly "title,type,description".', location: 'line 1' });
            ctx.refreshMain(); return;
          }
          var list = [];
          for (var i = 1; i < rows.length; i++) {
            var r = rows[i]; if (r.length === 1 && String(r[0]).trim() === '') continue;
            if (r.length < 3 || !String(r[0]).trim()) { App.ui.activity.log({ severity: 'warning', message: 'Control CSV: skipped malformed row ' + (i + 1) + '.' }); continue; }
            list.push({ title: String(r[0]).trim(), type: String(r[1]).trim(), description: String(r[2]) });
          }
          var res = App.store.importControls(list);
          App.ui.activity.logIssues(res.issues);
          ctx.refreshMain();
        }).catch(function (err) { App.ui.activity.log({ severity: 'error', message: 'Control CSV read failed: ' + (err && err.message) }); });
      });
    }

    App.ui = App.ui || {}; App.ui.views = App.ui.views || {};
    App.ui.views.controls = { render: render, wire: wire, renderTable: renderTable, _cm: _cm };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.views.help
   * PURPOSE: In-app help (spec §11, Phase 8): explains how state/saving works, the
   *          capture formats for the active platform, and output/determinism notes.
   * PURITY:  UI/DOM (pure render; no wiring needed)
   * DEPENDS: App.registry, App.util.html
   * ============================================================================= */
  (function (App) {
    'use strict';
    var esc = App.util.html.esc;
    function render(project) {
      var pf = App.registry.getActivePlatform();
      var capture = pf ? pf.captureInstructions : '';
      return '<div style="max-width:820px"><h2>Help</h2>' +
        '<h3>How state &amp; saving works</h3>' +
        '<ul>' +
        '<li><strong>The downloaded project file is the single source of truth</strong> — keep it in SharePoint. The app holds an in-memory copy only.</li>' +
        '<li><strong>Save often.</strong> The app warns before you leave the page with unsaved changes (the dot next to the title shows unsaved state).</li>' +
        '<li>A <strong>local draft autosave</strong> may be kept in your browser as crash insurance only. It is <em>not</em> canonical and can be discarded; if a draft is found on load you will be offered to restore it.</li>' +
        '<li>This tool never contacts a device or the network. All input is via file pickers; all output is downloaded.</li>' +
        '</ul>' +
        '<h3>Onboarding &amp; capture formats</h3>' +
        '<pre class="mono" style="white-space:pre-wrap;background:var(--c-surface-alt);padding:10px;border-radius:6px">' + esc(capture) + '</pre>' +
        '<h3>Generating outputs</h3>' +
        '<ul>' +
        '<li>Each command (<strong>Implementation</strong>, <strong>Verification</strong>, <strong>Reporting</strong>) is independent and produces one <code>.zip</code>; outputs are byte-deterministic for identical inputs.</li>' +
        '<li>Packages &amp; settings emit PowerShell scripts that drive <code>adb</code> on a Windows host (run them there — the tool only generates them).</li>' +
        '<li>Tactical emits a <code>tactical.json</code> in the captured format — upload it directly to Knox tactical.</li>' +
        '<li>The report is a styled <code>.html</code> that opens in Microsoft Word as a formatted document (Save-As <code>.docx</code>).</li>' +
        '</ul>' +
        '<h3>Developer</h3>' +
        '<p>Append <code>#selftest</code> to the URL to run the embedded test suite.</p>' +

    }
    App.ui = App.ui || {}; App.ui.views = App.ui.views || {};
    App.ui.views.help = { render: render };
  })(App);
  </script>

  <!-- === UI VIEWS fully populated (onboard · generate · devices · help). === -->

  <script>
  /* =============================================================================
   * MODULE: App.ui.app
   * PURPOSE: The UI shell + controller (spec §11.1). Builds the top bar, the
   *          data-driven tab nav (one tab per active-platform dataset + Devices/
   *          Onboard/Generate), the main view, and the Activity drawer. Manages UI
   *          state, wires events, and re-renders on store/activity changes.
   * PURITY:  UI/DOM (the only place, with util.dom, that touches the DOM).
   * DEPENDS: App.registry, App.store, App.projectIo, App.util.*, App.ui.*
   * INVARIANTS: search input is never re-rendered on keystroke; only #table-host is.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var dom = App.util.dom, esc = App.util.html.esc;

    var TOOL_VERSION = '1.0';
    var _root = null;
    var _state = { activeTab: null, ui: {}, drawerCollapsed: false, draftDismissed: false };
    var DRAFT_KEY = 'ch-config-draft-v1';
    var THEME_KEY = 'ch-config-theme';
    var _draftTimer = null;

    // ---- Dark-mode theme (spec §18.1). UI-only: sets a data-theme attribute on
    // <html>; the palette swap is pure CSS. Never read by engine/generators. ----
    /** @param {string} cur @returns {'light'|'dark'} the opposite theme */
    function nextTheme(cur) { return cur === 'dark' ? 'light' : 'dark'; }
    function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
    function applyTheme(t) { document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); }
    function loadThemePref() { try { return window.localStorage.getItem(THEME_KEY); } catch (e) { return null; } }
    function saveThemePref(t) { try { window.localStorage.setItem(THEME_KEY, t); } catch (e) {} }
    function initialTheme() {
      var stored = loadThemePref();
      if (stored === 'dark' || stored === 'light') return stored;
      try { if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark'; } catch (e) {}
      return 'light';
    }
    function toggleTheme() { var t = nextTheme(currentTheme()); applyTheme(t); saveThemePref(t); updateThemeButton(); }
    function updateThemeButton() {
      var btn = _root && _root.querySelector('[data-action="toggle-theme"]');
      if (!btn) return;
      var dark = currentTheme() === 'dark';
      btn.setAttribute('aria-pressed', String(dark));
      btn.textContent = dark ? '☀ Light' : '🌙 Dark';
    }
    var _searchTimer = null;
    var _editIssues = {}; // transient decision-validation issues, keyed "dsId|key"
    var _colResizing = false;     // true mid-drag, to suppress the trailing sort click
    var MIN_COL_WIDTH_PX = 60;    // minimum column width (review-2 #4)

    function activeDatasets() {
      var p = App.registry.getActivePlatform();
      return p ? p.datasets : [];
    }
    function uiFor(dsId) {
      if (!_state.ui[dsId]) _state.ui[dsId] = { search: '', sortKey: 'key', sortDir: 'asc', incompleteOnly: false };
      return _state.ui[dsId];
    }
    function defaultTab() {
      var ds = activeDatasets();
      return ds.length ? ds[0].id : 'devices';
    }

    // ---- top-level render ----
    function render() {
      if (!_root) return;
      _root.innerHTML = renderShell();
      renderMain();
      renderDrawer();
      updateThemeButton(); // reflect current theme on the freshly-rendered toggle
    }

    function renderShell() {
      var project = App.store.getProject();
      var platforms = App.registry.listPlatforms();
      var dirty = App.store.isDirty();
      var projName = project ? (project.platformProfileId + ' project') : 'No project';

      var platformOpts = platforms.map(function (pl) {
        return '<option value="' + esc(pl.id) + '"' + (App.registry.getActivePlatform() && App.registry.getActivePlatform().id === pl.id ? ' selected' : '') + '>' + esc(pl.label) + '</option>';
      }).join('');

      function tabBtn(id, label, badge) {
        var active = _state.activeTab === id;
        return '<button role="tab" aria-selected="' + active + '" data-tab="' + esc(id) + '"' + (active ? ' class="active"' : '') + '>' +
          esc(label) + (badge ? '<span class="count-badge">' + badge + '</span>' : '') + '</button>';
      }
      var tabs = '';
      if (project) {
        activeDatasets().forEach(function (ds) { tabs += tabBtn(ds.id, ds.label, App.ui.model.countIncomplete(project, ds.id)); });
        ['devices', 'onboard', 'generate'].forEach(function (t) { tabs += tabBtn(t, t.charAt(0).toUpperCase() + t.slice(1)); });
        tabs += tabBtn('controls', 'Control Manager');
      } else {
        tabs += tabBtn('onboard', 'Onboard');
      }
      tabs += tabBtn('help', 'Help');

      return '' +
        '<div id="app-root" class="' + (dirty ? 'dirty' : '') + '">' +
        '<header class="topbar">' +
          '<span class="brand-logo" role="img" aria-label="HighCom logo"></span>' +
          '<span class="title">CH Config Tool</span>' +
          '<span class="dirty-dot" title="Unsaved changes" aria-hidden="true"></span>' +
          '<span class="muted">' + esc(projName) + (dirty ? ' — unsaved' : '') + '</span>' +
          '<span class="spacer"></span>' +
          '<button data-action="load">Load project</button>' +
          '<button data-action="save"' + (project ? '' : ' disabled') + '>Save project</button>' +
          '<button data-action="export-csv"' + (project ? '' : ' disabled') + '>Export CSV</button>' +
          '<label class="platform">Platform <select data-action="platform" aria-label="Active platform">' + platformOpts + '</select></label>' +
          '<button data-action="toggle-theme" aria-pressed="false" title="Toggle dark mode">🌙 Dark</button>' +
          '<a href="#selftest" target="_blank" rel="noopener">Self-tests</a>' +
          '<input type="file" id="file-load" class="visually-hidden" aria-hidden="true">' +
        '</header>' +
        '<nav class="tabnav" role="tablist" aria-label="Primary">' + tabs + '</nav>' +
        renderRestoreBanner() +
        '<main class="main" id="main" role="main" tabindex="-1"></main>' +
        renderDrawerShell() +
        '</div>';
    }

    /** Offer to restore a local draft autosave if one exists and hasn't been dismissed. */
    /** Format a UTC ISO timestamp as AEST (UTC+10, no DST) for display only (review-2 #1).
     *  Canonical timestamps in state/artifacts stay UTC; this is a presentation helper. */
    function toAest(iso) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      var t = new Date(d.getTime() + 10 * 3600 * 1000); // UTC+10 = AEST
      var p = function (n) { return ('0' + n).slice(-2); };
      return t.getUTCFullYear() + '-' + p(t.getUTCMonth() + 1) + '-' + p(t.getUTCDate()) + ' ' +
        p(t.getUTCHours()) + ':' + p(t.getUTCMinutes()) + ':' + p(t.getUTCSeconds()) + ' AEST';
    }

    function renderRestoreBanner() {
      if (_state.draftDismissed) return '';
      var d = loadDraft();
      if (!d) return '';
      return '<div class="restore-banner" role="region" aria-label="Draft autosave">' +
        '<span>A local <strong>draft autosave</strong> from ' + esc(toAest(d.savedUtc)) + ' was found (non-canonical crash insurance).</span>' +
        '<span class="spacer"></span>' +
        '<button data-action="restore-draft">Restore draft</button>' +
        '<button data-action="discard-draft">Discard</button>' +
        '</div>';
    }

    function renderDrawerShell() {
      return '' +
        '<div class="drawer ' + (_state.drawerCollapsed ? 'collapsed' : '') + '" id="drawer">' +
        '<div class="drawer-head">' +
          '<span class="title">Activity / Errors</span>' +
          '<button data-action="toggle-drawer">' + (_state.drawerCollapsed ? 'Show' : 'Hide') + '</button>' +
          '<button data-action="clear-drawer">Clear</button>' +
        '</div>' +
        '<div class="log" id="drawer-log"></div>' +
        '</div>';
    }

    function renderMain() {
      var main = document.getElementById('main');
      if (!main) return;
      var project = App.store.getProject();
      if (!_state.activeTab) _state.activeTab = project ? defaultTab() : 'onboard';
      var tab = _state.activeTab;

      // View tabs (onboard/devices/generate) render with OR without a project.
      if (App.ui.views && App.ui.views[tab]) {
        main.innerHTML = App.ui.views[tab].render(project);
        if (App.ui.views[tab].afterRender) App.ui.views[tab].afterRender(project);
        return;
      }
      if (!project) {
        main.innerHTML = '<div class="empty-state"><h2>No project loaded</h2>' +
          '<p>Load a project file, or go to <strong>Onboard</strong> to create a device configuration.</p></div>';
        return;
      }
      var ds = activeDatasets().filter(function (d) { return d.id === tab; })[0];
      if (ds) {
        var ui = uiFor(tab);
        var total = (project.items[tab] || []).length;
        var shown = App.ui.model.filterSortRows(project, tab, ds, ui).length;
        main.innerHTML = App.ui.tables.renderToolbar(tab, ui, total, shown);
        renderTableHost();
      } else {
        main.innerHTML = '<div class="empty-state">The <strong>' + esc(tab) + '</strong> view is not available yet.</div>';
      }
    }

    function renderTableHost() {
      var host = document.getElementById('table-host');
      if (!host) return;
      var project = App.store.getProject();
      host.innerHTML = App.ui.tables.renderTableHtml(project, _state.activeTab, uiFor(_state.activeTab), { issues: _editIssues });
    }

    function renderDrawer() {
      var logEl = document.getElementById('drawer-log');
      if (!logEl) return;
      var entries = App.ui.activity.list();
      logEl.innerHTML = entries.map(function (e) {
        // Show the time portion in AEST (review-2 #1, extended to the drawer).
        return '<div class="entry ' + esc(e.severity) + '">' + esc(toAest(e.ts).slice(11, 19)) + '  ' + esc(e.message) + '</div>';
      }).join('') || '<div class="muted">No activity yet.</div>';
      logEl.scrollTop = logEl.scrollHeight;
    }

    // ---- events ----
    function wire() {
      dom.on(_root, 'click', '[data-tab]', function (e, el) { _state.activeTab = el.getAttribute('data-tab'); render(); });
      dom.on(_root, 'click', 'th[data-col]', function (e, el) {
        // Ignore clicks on the resize handle (review-2 #4) so resizing doesn't sort.
        if (e.target && e.target.matches && e.target.matches('[data-col-resize]')) return;
        if (_colResizing) return;
        var ui = uiFor(_state.activeTab), col = el.getAttribute('data-col');
        if (ui.sortKey === col) ui.sortDir = (ui.sortDir === 'asc') ? 'desc' : 'asc';
        else { ui.sortKey = col; ui.sortDir = 'asc'; }
        renderTableHost();
      });
      // Manual column resizing (review-2 #4): drag the handle on a header.
      dom.on(_root, 'mousedown', '[data-col-resize]', function (e, el) {
        e.preventDefault(); e.stopPropagation();
        var col = el.getAttribute('data-col-resize');
        var th = el; while (th && th.tagName !== 'TH') th = th.parentNode;
        if (!th) return;
        var startX = e.clientX, startW = th.offsetWidth;
        _colResizing = true;
        function onMove(ev) { th.style.width = Math.max(MIN_COL_WIDTH_PX, startW + (ev.clientX - startX)) + 'px'; }
        function onUp(ev) {
          document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
          var ui = uiFor(_state.activeTab); ui.colWidths = ui.colWidths || {};
          ui.colWidths[col] = Math.max(MIN_COL_WIDTH_PX, startW + (ev.clientX - startX));
          setTimeout(function () { _colResizing = false; }, 0); // swallow the trailing click
        }
        document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
      });
      dom.on(_root, 'input', '[data-search]', function (e, el) {
        var dsId = el.getAttribute('data-search'), val = el.value;
        if (_searchTimer) clearTimeout(_searchTimer);
        _searchTimer = setTimeout(function () { uiFor(dsId).search = val; renderTableHost(); updateShownCount(); }, 150);
      });
      dom.on(_root, 'change', '[data-incomplete]', function (e, el) {
        uiFor(el.getAttribute('data-incomplete')).incompleteOnly = el.checked; renderTableHost(); updateShownCount();
      });
      // ---- inline decision editing & per-row expander (spec §11.2) ----
      dom.on(_root, 'click', '[data-expand-key]', function (e, el) {
        var ui = uiFor(_state.activeTab); ui.expanded = ui.expanded || {};
        var key = el.getAttribute('data-expand-key');
        if (ui.expanded[key]) delete ui.expanded[key]; else ui.expanded[key] = true;
        renderTableHost();
      });
      dom.on(_root, 'change', '[data-decision]', function (e, el) {
        var cell = el; while (cell && !(cell.classList && cell.classList.contains('dcell'))) cell = cell.parentNode;
        if (cell) commitDecisionFromCell(cell);
      });
      dom.on(_root, 'click', '[data-action="rationale-preset"]', function (e, el) {
        App.store.setItemFields(el.getAttribute('data-ds'), el.getAttribute('data-key'), { rationale: 'Not required for device use-case.' });
        // store.onChange re-renders; the expander (persisted in ui.expanded) shows the filled value.
      });
      dom.on(_root, 'change', '[data-field-edit]', function (e, el) {
        var field = el.getAttribute('data-field-edit'), dsId = el.getAttribute('data-ds'), key = el.getAttribute('data-key');
        var fields = {};
        fields[field] = el.value;
        App.store.setItemFields(dsId, key, fields);
      });
      // Control-refs checkbox toggle (review-5 #2): tick/untick adds/removes one ref
      // from the item's controlRefs, so multiple can be selected and any one removed.
      dom.on(_root, 'change', '[data-control-ref-toggle]', function (e, el) {
        var dsId = el.getAttribute('data-ds'), key = el.getAttribute('data-key'), id = el.getAttribute('data-control-id');
        var project = App.store.getProject(); if (!project) return;
        var item = (project.items[dsId] || []).filter(function (it) { return it.key === key; })[0];
        if (!item) return;
        var refs = (item.controlRefs || []).filter(function (r) { return r !== id; });
        if (el.checked) refs.push(id);
        App.store.setItemFields(dsId, key, { controlRefs: refs });
      });
      // Filter the control checkbox list in place (no store round-trip / re-render).
      dom.on(_root, 'input', '[data-control-search]', function (e, el) {
        var q = el.value.toLowerCase().trim();
        var box = el.closest('[data-control-multiselect]');
        if (!box) return;
        Array.prototype.forEach.call(box.querySelectorAll('[data-ctl-opt]'), function (lab) {
          lab.style.display = (!q || lab.textContent.toLowerCase().indexOf(q) !== -1) ? '' : 'none';
        });
      });
      dom.on(_root, 'click', '[data-action="toggle-drawer"]', function () { _state.drawerCollapsed = !_state.drawerCollapsed; render(); });
      dom.on(_root, 'click', '[data-action="clear-drawer"]', function () { App.ui.activity.clear(); });
      dom.on(_root, 'click', '[data-action="load"]', function () { var i = document.getElementById('file-load'); if (i) i.click(); });
      dom.on(_root, 'click', '[data-action="save"]', function () { saveProject(); });
      dom.on(_root, 'click', '[data-action="export-csv"]', function () { exportCsv(); });
      dom.on(_root, 'change', '[data-action="platform"]', function (e, el) {
        try { App.registry.setActivePlatform(el.value); _state.activeTab = defaultTab(); render(); } catch (err) { logErr(err); }
      });
      dom.on(_root, 'click', '[data-action="toggle-theme"]', function () { toggleTheme(); });
      dom.on(_root, 'click', '[data-action="restore-draft"]', function () { restoreDraft(); });
      dom.on(_root, 'click', '[data-action="discard-draft"]', function () { clearDraft(); _state.draftDismissed = true; render(); App.ui.activity.log({ severity: 'info', message: 'Discarded local draft autosave.' }); });
      // file input change (not delegated — direct)
      _root.addEventListener('change', function (e) {
        if (e.target && e.target.id === 'file-load') loadProjectFile(e.target.files[0]);
      });
    }

    function updateShownCount() {
      var project = App.store.getProject(); if (!project) return;
      var ds = activeDatasets().filter(function (d) { return d.id === _state.activeTab; })[0];
      if (!ds) return;
      var shownEl = _root.querySelector('.toolbar .muted');
      if (shownEl) {
        var total = (project.items[_state.activeTab] || []).length;
        var shown = App.ui.model.filterSortRows(project, _state.activeTab, ds, uiFor(_state.activeTab)).length;
        shownEl.textContent = shown + ' of ' + total + ' shown';
      }
    }

    /** Coerce an editor string to a typed JS value (for value-typed decisions). */
    function coerce(str, type) {
      if (type === 'bool') { var l = String(str).trim().toLowerCase(); if (l === 'true' || l === '1') return true; if (l === 'false' || l === '0') return false; return str; }
      if (type === 'int') { var n = parseInt(str, 10); return isNaN(n) ? str : n; }
      if (type === 'float') { var f = parseFloat(str); return isNaN(f) ? str : f; }
      if (type === 'json' || type === 'array') { try { return JSON.parse(str); } catch (e) { return str; } }
      if (type === 'null') { return String(str).trim() === 'null' ? null : String(str); }
      return String(str); // 'string'
    }

    /**
     * Read every decision control in a cell, assemble the decision object (coercing
     * value-typed fields by their companion type select), and commit it. An empty
     * primary field clears the decision (undecided).
     */
    function commitDecisionFromCell(cell) {
      var project = App.store.getProject(); if (!project) return;
      var dsId = cell.getAttribute('data-ds'), key = cell.getAttribute('data-key');
      var adapter = App.registry.getDataset(project.platformProfileId, dsId);
      var controls = cell.querySelectorAll('[data-decision]');
      var raw = {};
      Array.prototype.forEach.call(controls, function (c) {
        raw[c.getAttribute('data-field')] = { v: (c.type === 'checkbox' ? c.checked : c.value), kind: c.getAttribute('data-kind'), vtype: c.getAttribute('data-vtype') };
      });
      // Empty primary field => clear to undecided.
      var primary = adapter.decisionSchema[0].name, pr = raw[primary];
      var primaryEmpty = pr && (pr.kind === 'enum' || pr.kind === 'string' || pr.kind === 'value-typed') && pr.v === '';
      if (primaryEmpty) { var rc = App.store.setDecision(dsId, key, null); _editIssues[dsId + '|' + key] = []; renderTableHost(); return; }

      var decision = {};
      Object.keys(raw).forEach(function (f) {
        var c = raw[f];
        if (c.kind === 'enum') { if (c.v !== '') decision[f] = c.v; }
        else if (c.kind === 'string') decision[f] = c.v;
        else if (c.kind === 'bool') decision[f] = !!c.v;
        // value-typed: coerce by the captured leaf type (data-vtype) — review-3 #2.
        else if (c.kind === 'value-typed') decision[f] = coerce(c.v, c.vtype || 'string');
      });
      var res = App.store.setDecision(dsId, key, decision);
      _editIssues[dsId + '|' + key] = res.issues || [];
      renderTableHost(); // reflect inline validation issues (store.onChange already re-rendered the shell)
    }

    // ---- project I/O wiring ----
    function loadProjectFile(file) {
      if (!file) return;
      dom.readFileText(file).then(function (text) {
        var res = App.projectIo.parseProject(text);
        if (!res.ok) {
          App.ui.activity.logIssues(res.issues, 'Load failed');
          App.ui.activity.log({ severity: 'error', message: 'Project not loaded (' + res.issues.length + ' issue(s)).' });
          renderDrawer();
          return;
        }
        // Align the active platform with the loaded project so tabs/views match (D-008).
        if (App.registry.hasPlatform(res.value.platformProfileId)) App.registry.setActivePlatform(res.value.platformProfileId);
        App.store.init(res.value);
        App.ui.activity.logIssues(res.issues);
        App.ui.activity.log({ severity: 'success', message: 'Loaded project: ' + res.value.deviceConfigs.length + ' device(s).' });
        _state.activeTab = defaultTab();
        render();
      }).catch(function (err) { logErr(err); });
    }

    function saveProject() {
      var project = App.store.getProject();
      if (!project) return;
      var text = App.projectIo.serializeProject(project);
      var blob = new Blob([text], { type: 'application/json' });
      dom.download(blob, 'ch-project.json');
      App.store.markSaved();
      clearDraft(); // the downloaded file is now canonical; drop the crash-insurance draft
      App.ui.activity.log({ severity: 'success', message: 'Saved project (' + text.length + ' bytes).' });
    }

    // ---- localStorage DRAFT autosave (spec §6.6, C-4): non-canonical crash
    // insurance only. localStorage is unreliable under file:// so ALL access is
    // wrapped — failures degrade silently and never affect canonical state. ----
    function saveDraft() {
      var project = App.store.getProject(); if (!project) return;
      try {
        window.localStorage.setItem(DRAFT_KEY, JSON.stringify({ savedUtc: App.util.clock.nowIso(), project: App.projectIo.serializeProject(project) }));
      } catch (e) { /* storage unavailable/full — ignore */ }
    }
    function loadDraft() {
      try {
        var raw = window.localStorage.getItem(DRAFT_KEY);
        if (!raw) return null;
        var d = JSON.parse(raw);
        return (d && d.project && d.savedUtc) ? d : null;
      } catch (e) { return null; }
    }
    function clearDraft() { try { window.localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
    function scheduleDraftSave() {
      if (_draftTimer) clearTimeout(_draftTimer);
      _draftTimer = setTimeout(saveDraft, 1000); // debounce
    }
    function restoreDraft() {
      var d = loadDraft(); if (!d) return;
      var res = App.projectIo.parseProject(d.project);
      if (!res.ok) { App.ui.activity.logIssues(res.issues, 'Draft restore failed'); _state.draftDismissed = true; render(); return; }
      if (App.registry.hasPlatform(res.value.platformProfileId)) App.registry.setActivePlatform(res.value.platformProfileId);
      App.store.init(res.value);
      App.store.markDirty();           // restored draft is NOT a saved file → unsaved
      _state.draftDismissed = true; _state.activeTab = defaultTab();
      App.ui.activity.log({ severity: 'success', message: 'Restored draft autosave from ' + toAest(d.savedUtc) + ' — Save to make it canonical.' });
      render();
    }

    function exportCsv() {
      var project = App.store.getProject(); if (!project) return;
      var dsId = _state.activeTab;
      var adapter = App.registry.getDataset(project.platformProfileId, dsId);
      if (!adapter) { App.ui.activity.log({ severity: 'warning', message: 'Switch to a data tab to export its CSV.' }); return; }
      var rows = App.ui.model.filterSortRows(project, dsId, adapter, uiFor(dsId));
      var cols = adapter.columns.map(function (c) { return { key: c.key, label: c.label }; })
        .concat([{ key: 'appliesTo', label: 'Applies to' }, { key: 'status', label: 'Status' }]);
      var flat = rows.map(function (r) {
        var o = {}; adapter.columns.forEach(function (c) { o[c.key] = r.cells[c.key]; });
        o.appliesTo = r.appliesTo.join('; '); o.status = r.status; return o;
      });
      var csv = App.util.csv.toCsv(flat, cols);
      dom.download(new Blob([csv], { type: 'text/csv' }), dsId + '.csv');
      App.ui.activity.log({ severity: 'success', message: 'Exported ' + flat.length + ' rows from ' + dsId + '.' });
    }

    function logErr(err) {
      App.ui.activity.log({ severity: 'error', message: 'Unexpected error: ' + (err && err.message ? err.message : String(err)) });
      renderDrawer();
    }

    /**
     * Mount the app into a root element.
     * @param {Element} root
     */
    /** Build the controller context handed to view modules (spec §11). */
    function buildCtx() {
      return {
        root: _root,
        refresh: render,
        refreshMain: renderMain,
        switchTab: function (t) { _state.activeTab = t; render(); },
        uiFor: uiFor
      };
    }

    function mount(root) {
      _root = root;
      applyTheme(initialTheme()); // honour stored/OS preference before first paint (§18.1)
      _state.activeTab = App.store.getProject() ? defaultTab() : 'onboard';
      render();
      wire();
      // Wire view modules ONCE (their handlers are delegated on _root, so they
      // survive re-renders). Adding a view = drop a module with render()/wire().
      var ctx = buildCtx();
      if (App.ui.views) Object.keys(App.ui.views).forEach(function (k) {
        if (App.ui.views[k].wire) App.ui.views[k].wire(ctx);
      });
      App.store.onChange(function () { render(); if (App.store.isDirty()) scheduleDraftSave(); });
      App.ui.activity.onChange(function () { renderDrawer(); });

      // Dirty guard (spec §6.6): warn before leaving with unsaved changes.
      window.addEventListener('beforeunload', function (e) {
        if (App.store.isDirty()) { e.preventDefault(); e.returnValue = ''; return ''; }
      });

      App.ui.activity.log({ severity: 'info', message: 'CH Config Tool ' + TOOL_VERSION + ' ready.' });
      if (loadDraft()) App.ui.activity.log({ severity: 'info', message: 'A local draft autosave was found — see the banner to restore or discard it.' });
    }

    App.ui = App.ui || {};
    App.ui.app = { mount: mount, TOOL_VERSION: TOOL_VERSION, _state: _state, nextTheme: nextTheme, toAest: toAest };
  })(App);
  </script>

      s.test('filterSortRows: search filters by key/description', function () {

    T.suite('ui.tables render', function (s) {
      s.test('renders one row per item with applies-to and status', function () {
        var p = androidSample();

        T.assert(/com\.a/.test(html) && /com\.b/.test(html) && /com\.c/.test(html));
        T.assert(/badge undecided/.test(html), 'no undecided badge');

      });
      s.test('undecided row gets the flag class', function () {

      s.test('cells are HTML-escaped', function () {

        T.assert(html.indexOf('&lt;script&gt;') !== -1, 'expected escaped form');

        p.items['android.packages'] = big;

  <!-- ===== PHASE-4 SELF-TEST SUITES (diff · validation · store onboarding) ===== -->
  <script>
  (function (App) {
    'use strict';
    var T = App.test;
    function ensureAndroid() { if (!App.registry.hasPlatform('android-adb')) App.registry.registerPlatform(App.platforms.androidAdb); }
    var ISO = '2026-01-01T00:00:00.000Z';

    function snap(dsId, raw) {
      ensureAndroid();
      var a = App.registry.getDataset('android-adb', dsId);
      var pr = a.parse(raw);
      var s = { capturedUtc: ISO, sourceFilename: dsId + '.txt', sha256: App.util.hash.sha256Hex(raw), keys: pr.keys };
      if (pr.values) s.values = pr.values;
      if (pr.template !== undefined) s.template = pr.template;
      return s;
    }
    function snaps(pkgRaw, setRaw, tacRaw) {
      return { 'android.packages': snap('android.packages', pkgRaw), 'android.settings': snap('android.settings', setRaw), 'android.tactical': snap('android.tactical', tacRaw) };
    }
    function freshProject() { App.store.init(App.store.empty('android-adb')); }

    T.suite('diff.triage', function (s) {
      s.test('splits new vs existing, preserves order, dedupes', function () {
        T.assertDeepEqual(App.diff.triage(['b', 'a', 'a', 'c'], ['a']), { newKeys: ['b', 'c'], existingKeys: ['a'] });
      });
      s.test('register-only keys are ignored (not-applicable)', function () {
        T.assertDeepEqual(App.diff.triage(['a'], ['a', 'z']), { newKeys: [], existingKeys: ['a'] });
      });
    });

    T.suite('validation.validateOnboarding', function (s) {
      s.test('missing name -> error', function () {
        var iss = App.validation.validateOnboarding({ name: '', parsed: {} }, []);
        T.assert(iss.some(function (i) { return /name is required/i.test(i.message); }));
      });
      s.test('parse errors in a slot surface as located issues', function () {
        var parsed = { 'android.packages': { errors: [{ message: 'bad', location: 'line 1' }], warnings: [], keys: [] } };
        var iss = App.validation.validateOnboarding({ name: 'X', parsed: parsed }, ['android.packages']);
        T.assert(iss.some(function (i) { return /bad/.test(i.message) && /android\.packages/.test(i.location); }));
      });
    });

    T.suite('store.onboardDevice (fresh + inheritance)', function (s) {
      s.test('no project -> located error', function () {
        App.store.init(null); // simulate no project
        var res = App.store.onboardDevice({ name: 'X', snapshots: {} });
        T.assertEqual(res.ok, false);
      });
      s.test('fresh onboard creates v1 and appends all keys undecided', function () {
        freshProject();
        var res = App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: snaps('com.a\ncom.b', 'secure:\nx=0', '{"enabled":true}') });
        T.assertEqual(res.ok, true);
        T.assertEqual(res.result.noop, false);
        T.assertEqual(res.result.version, 1);
        T.assertEqual(res.result.deviceId, 'tab-a-m1');
        var p = App.store.getProject();
        T.assertEqual(p.deviceConfigs.length, 1);
        T.assertDeepEqual(p.items['android.packages'].map(function (i) { return i.key; }).sort(), ['com.a', 'com.b']);
        T.assert(p.items['android.packages'].every(function (i) { return i.status === 'undecided'; }));
      });
      s.test('onboard device #2 inherits common keys, flags only new', function () {
        freshProject();
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: snaps('com.a\ncom.b', 'secure:\nx=0', '{"enabled":true}') });
        var res = App.store.onboardDevice({ name: 'S23', model: 'M2', firmware: 'F2', snapshots: snaps('com.a\ncom.c', 'secure:\nx=1', '{"enabled":true}') });
        T.assertEqual(res.result.perDataset['android.packages'].newCount, 1);    // com.c
        T.assertEqual(res.result.perDataset['android.packages'].existingCount, 1); // com.a
        var p = App.store.getProject();
        T.assertDeepEqual(p.items['android.packages'].map(function (i) { return i.key; }).sort(), ['com.a', 'com.b', 'com.c']);
      });
      s.test('settings default-drift surfaces an info issue (§8.4)', function () {
        freshProject();
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: snaps('com.a', 'secure:\nx=0', '{"enabled":true}') });
        var res = App.store.onboardDevice({ name: 'S23', model: 'M2', firmware: 'F2', snapshots: snaps('com.a', 'secure:\nx=1', '{"enabled":true}') });
        T.assert(res.result.drift.length >= 1, 'expected drift info');
        T.assert(/secure\/x default differs/.test(res.result.drift[0].message));
      });
    });

    T.suite('store re-onboard versioning (§8.7)', function (s) {
      s.test('identical snapshots -> NO-OP (no new config, no mutation)', function () {
        freshProject();
        var sn = snaps('com.a\ncom.b', 'secure:\nx=0', '{"enabled":true}');
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: sn });
        var before = App.projectIo.serializeProject(App.store.getProject());
        var res = App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: snaps('com.a\ncom.b', 'secure:\nx=0', '{"enabled":true}') });
        T.assertEqual(res.result.noop, true);
        T.assertEqual(App.store.getProject().deviceConfigs.length, 1);
        T.assertEqual(App.projectIo.serializeProject(App.store.getProject()), before, 'no-op mutated state');
      });
      s.test('differing snapshots -> new v2 supersedes v1; decisions untouched; append-only', function () {
        freshProject();
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: snaps('com.a\ncom.b', 'secure:\nx=0', '{"enabled":true}') });
        // Record a decision on com.a (simulate Phase-5 editing via the transactional commit).
        App.store._commit(function (p) { p.items['android.packages'].filter(function (i) { return i.key === 'com.a'; })[0].decision = { action: 'disable' }; });
        var res = App.store.onboardDevice({ name: 'Tab A', model: 'M1', firmware: 'F1', snapshots: snaps('com.a\ncom.c', 'secure:\nx=0', '{"enabled":true}') });
        T.assertEqual(res.result.noop, false);
        T.assertEqual(res.result.version, 2);
        T.assertEqual(res.result.deviceId, 'tab-a-m1-v2');
        T.assertEqual(res.result.supersedesId, 'tab-a-m1');
        var p = App.store.getProject();
        T.assertEqual(p.deviceConfigs.length, 2);             // v1 retained
        var latest = App.store.getLatestConfigs(p).map(function (c) { return c.id; });
        T.assertDeepEqual(latest, ['tab-a-m1-v2']);
        // Decision preserved (register is shared/unified, append-only).
        T.assertDeepEqual(p.items['android.packages'].filter(function (i) { return i.key === 'com.a'; })[0].decision, { action: 'disable' });
        // New key com.c appended; com.b retained (append-only).
        T.assertDeepEqual(p.items['android.packages'].map(function (i) { return i.key; }).sort(), ['com.a', 'com.b', 'com.c']);
      });
      s.test('reonboardDevice shares the same code path', function () {
        freshProject();
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', snapshots: snaps('com.a', 'secure:\nx=0', '{"enabled":true}') });
        var res = App.store.reonboardDevice({ name: 'Tab A', model: 'M1', snapshots: snaps('com.a\ncom.b', 'secure:\nx=0', '{"enabled":true}') });
        T.assertEqual(res.result.version, 2);
      });
    });

    T.suite('store.applicableItems / undecidedCount', function (s) {
      s.test('applicableItems returns only the device\'s keys', function () {
        freshProject();
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', snapshots: snaps('com.a\ncom.b', 'secure:\nx=0', '{"enabled":true}') });
        App.store.onboardDevice({ name: 'S23', model: 'M2', snapshots: snaps('com.a\ncom.c', 'secure:\nx=0', '{"enabled":true}') });
        var ap = App.store.applicableItems('s23-m2', 'android.packages').map(function (i) { return i.key; }).sort();
        T.assertDeepEqual(ap, ['com.a', 'com.c']);
      });
      s.test('undecidedCount per device counts only applicable undecided', function () {
        freshProject();
        App.store.onboardDevice({ name: 'Tab A', model: 'M1', snapshots: snaps('com.a\ncom.b', 'secure:\nx=0', '{"enabled":true}') });
        // 2 packages + 1 setting + 1 tactical applicable, all undecided = 4
        T.assertEqual(App.store.undecidedCount('tab-a-m1'), 4);
      });
    });

  })(App);
  </script>

      s.test('flatten keys policies by `policyList.<name>` (stable internal identity), valued by checked', function () {
        var leaves = A.flattenTactical(doc), by = {};
