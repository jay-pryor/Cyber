    /** @returns {boolean} true when every applicable item is complete (§6.5). */
    function deviceReady(project, deviceId) { return deviceReadiness(project, deviceId).ready; }

    var mod = {
      itemComplete: itemComplete, formatIssues: formatIssues,
      deviceReady: deviceReady, deviceReadiness: deviceReadiness,
      // Config flag (spec §6.5 / §18.3 CTL-8): when true, completeness also requires >=1 control ref.
      // A single switch so the team can tighten traceability without code surgery.
      REQUIRE_CONTROL_REF: false
    };
    App.completeness = mod;
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.valueFormats  — v2.1 (VF-1…VF-8)
   * PURPOSE: Declare and enforce the SHAPE a decision value must take, so a free-text
   *          box stops being the answer to every question. Four built-in kinds
   *          (bool / number / text / string list) need no configuration; a project may
   *          also define NAMED, REUSABLE custom formats — most importantly `options`,
   *          a closed set of allowed strings each carrying a description of what it
   *          does (e.g. `enable_both` → "Both SIM slots active"). Formats are a
   *          catalogue + a per-item reference, exactly like controls/controlRefs, so
   *          two keys that share a vocabulary (nr5gModeStateSimSlot0/1) share one
   *          definition instead of re-entering it.
   * PURITY:  pure — no DOM, no IO, no store access. Callers pass the project in.
   * DEPENDS: App.util.stable
   * INVARIANTS:
   *   * A format is ADVISORY about the editor and BINDING about validity: a value that
   *     does not satisfy its format fails validation, so the item is not complete and
   *     the device cannot reach ready (the answer to "what does 'required' mean").
   *   * Never blocks LOADING. An unresolvable formatRef degrades to the inferred
   *     built-in, so a project whose format was deleted still opens and still works.
   *   * `parseInput`/`display` are exact inverses for every kind, so an editor round
   *     trip cannot silently change a value.
   * ============================================================================= */
  (function (App) {
    'use strict';

    var stable = App.util.stable.stableStringify;

    /**
     * The built-in kinds. `id` doubles as the value stored in `item.format`, so a
     * built-in never needs a catalogue entry. Order is the order shown in the picker.
     */
    var BUILTINS = [
      { id: 'bool',        name: 'Boolean (true/false)', kind: 'bool',        builtin: true, hint: 'Exactly true or false.' },
      { id: 'number',      name: 'Number',               kind: 'number',      builtin: true, hint: 'A numeric value, e.g. 1500.' },
      { id: 'string',      name: 'Text',                 kind: 'string',      builtin: true, hint: 'Any text. An empty box is a real value (a blank string).' },
      { id: 'stringArray', name: 'String list',          kind: 'stringArray', builtin: true, hint: 'A list of strings, one per line. An empty box is an empty list.' },
      // The escape hatch, and the pre-format behaviour: edit the raw JSON. Used
      // automatically for any leaf the four friendly kinds cannot represent without
      // changing its JSON type (e.g. an array of numbers), so type fidelity — which the
      // whole tactical rebuild depends on — is never silently traded for a nicer editor.
      { id: 'json',        name: 'JSON value (as captured)', kind: 'json',    builtin: true, hint: 'The raw JSON value. Used when a leaf cannot be edited as one of the simpler kinds without changing its type.' }
    ];
    var BUILTIN_BY_ID = {};
    BUILTINS.forEach(function (b) { BUILTIN_BY_ID[b.id] = b; });

    /** The kinds a CUSTOM format may declare. 'options' is the described-enum case. */
    var CUSTOM_KINDS = [
      { id: 'options', label: 'Custom options', hint: 'A closed list of allowed values, each with a description.' },
      { id: 'number',  label: 'Number',         hint: 'A number, optionally bounded by min/max.' },
      { id: 'string',  label: 'Text',           hint: 'Free text, optionally matched against a pattern.' },
      { id: 'stringArray', label: 'String list', hint: 'A list of strings, one per line.' }
    ];

    /**
     * The captured JS type of a leaf → the built-in that fits it. This is what an item
     * with no explicit format uses, so the 106 booleans, 12 string lists and 7 numbers
     * in a real Knox capture get the right editor with zero configuration (VF-2).
     *
     * NOTE the tactical flattener reports numbers as `int`/`float` (it distinguishes
     * them for JSON-type fidelity), not `number` — both map to the numeric editor.
     * @param {string} capturedType  'bool'|'int'|'float'|'number'|'array'|'string'|'null'
     * @returns {string} a built-in format id
     */
    function inferId(capturedType, capturedValue) {
      if (capturedType === 'bool') return 'bool';
      if (capturedType === 'int' || capturedType === 'float' || capturedType === 'number') return 'number';
      if (capturedType === 'array') {
        // A list of strings (or an empty one) gets the friendly one-per-line editor.
        // Anything else — [1,2,3], [true,false] — would come back as strings through a
        // text editor and change the emitted JSON, so it stays raw JSON.
        if (!Array.isArray(capturedValue)) return 'stringArray';
        return capturedValue.every(function (v) { return typeof v === 'string'; }) ? 'stringArray' : 'json';
      }
      if (capturedType === 'null') return 'json';
      return 'string';
    }

    /** @param {Project} project @param {string} id @returns {Object|null} custom format */
    function findCustom(project, id) {
      if (!project || !id) return null;
      var list = project.valueFormats;
      if (!Array.isArray(list)) return null;
      for (var i = 0; i < list.length; i++) if (list[i] && list[i].id === id) return list[i];
      return null;
    }

    /**
     * The format actually in force for one item: its explicit `format` if that resolves,
     * otherwise the built-in inferred from the captured leaf type. Always returns a
     * usable format — a dangling ref degrades rather than breaking the row.
     * @param {Project} project
     * @param {RegisterItem} item
     * @param {string} [capturedType]  from the adapter's capturedDefaults
     * @returns {{id, name, kind, builtin, options?, description?, hint?, resolved:boolean, inferred:boolean}}
     */
    function resolve(project, item, capturedType, capturedValue) {
      var want = item && item.format;
      if (want) {
        if (BUILTIN_BY_ID[want]) return copy(BUILTIN_BY_ID[want], true, false);
        var c = findCustom(project, want);
        if (c) {
          return {
            id: c.id, name: c.name || c.id, kind: c.kind || 'options', builtin: false,
            options: (c.options || []).slice(), description: c.description || '',
            min: c.min, max: c.max, pattern: c.pattern, resolved: true, inferred: false
          };
        }
        // Dangling: fall through to the inferred built-in, but SAY it is dangling so the
        // UI can flag it rather than pretending the item has no format.
        var fb = copy(BUILTIN_BY_ID[inferId(capturedType, capturedValue)], false, true);
        fb.danglingRef = want;
        return fb;
      }
      return copy(BUILTIN_BY_ID[inferId(capturedType, capturedValue)], true, true);
    }
    function copy(b, resolved, inferred) {
      return { id: b.id, name: b.name, kind: b.kind, builtin: true, hint: b.hint, resolved: resolved, inferred: inferred };
    }

    /**
     * Does `value` satisfy `fmt`? Returns [] when it does.
     * @param {Object} fmt  from resolve()
     * @param {*} value     the decision's value (already a JS value, not editor text)
     * @param {string} [location]
     * @returns {Issue[]}
     */
    function validate(fmt, value, location) {
      function err(msg, fix) {
        return [{ category: 'validation', severity: 'error', message: msg, location: location || '', fix: fix }];
      }
      if (!fmt) return [];
      switch (fmt.kind) {
        case 'json':
          return []; // any JSON value is acceptable — this kind exists to preserve, not constrain
        case 'bool':
          if (typeof value !== 'boolean') return err('Value must be true or false.', 'Pick true or false.');
          return [];
        case 'number':
          if (typeof value !== 'number' || !isFinite(value)) return err('Value must be a number.', 'Enter a numeric value, e.g. 1500.');
          if (typeof fmt.min === 'number' && value < fmt.min) return err('Value must be at least ' + fmt.min + '.');
          if (typeof fmt.max === 'number' && value > fmt.max) return err('Value must be at most ' + fmt.max + '.');
          return [];
        case 'stringArray':
          if (!Array.isArray(value)) return err('Value must be a list of strings.', 'Enter one item per line.');
          for (var i = 0; i < value.length; i++) {
            if (typeof value[i] !== 'string') return err('List entry ' + (i + 1) + ' must be text.');
          }
          return [];
        case 'options':
          var allowed = (fmt.options || []).map(function (o) { return o.value; });
          if (!allowed.length) return []; // a format with no options yet constrains nothing
          if (typeof value !== 'string' || allowed.indexOf(value) === -1) {
            return err('Value must be one of: ' + allowed.join(', ') + '.', 'Pick one of the allowed options.');
          }
          return [];
        case 'string':
        default:
          if (typeof value !== 'string') return err('Value must be text.');
          if (fmt.pattern) {
            var re; try { re = new RegExp(fmt.pattern); } catch (e) { return []; } // a bad pattern must not brick the item
            if (!re.test(value)) return err('Value does not match the required pattern ' + fmt.pattern + '.');
          }
          return [];
      }
    }

    /**
     * Render a stored value as the text an editor shows. Inverse of parseInput.
     * @param {Object} fmt @param {*} value @returns {string}
     */
    function display(fmt, value) {
      if (value === undefined || value === null) return '';
      var kind = fmt ? fmt.kind : 'string';
      if (kind === 'json') return typeof value === 'string' ? value : stable(value);
      if (kind === 'stringArray') {
        return Array.isArray(value) ? value.join('\n') : String(value);
      }
      if (kind === 'bool') return value === true ? 'true' : value === false ? 'false' : '';
      if (kind === 'number') return typeof value === 'number' ? String(value) : String(value);
      if (typeof value === 'string') return value;
      return stable(value);
    }

    /**
     * Turn editor text into the stored JS value for this format. Inverse of display.
     * `blank` distinguishes the two meanings an empty box can have per kind:
     *   text        -> '' (a real blank value, review-16 #1)
     *   string list -> [] (a real empty list — a dozen Knox whitelists are exactly this)
     *   bool/number/options -> UNDECIDED (there is nothing sensible to mean)
     * @param {Object} fmt @param {string} raw
     * @returns {{ok:boolean, value?:*, undecided?:boolean, issues:Issue[]}}
     */
    function parseInput(fmt, raw) {
      var kind = fmt ? fmt.kind : 'string';
      var text = raw == null ? '' : String(raw);
      var trimmed = text.trim();
      if (kind === 'json') {
        if (trimmed === '') return { ok: true, undecided: true, issues: [] };
        try { return { ok: true, value: JSON.parse(trimmed), issues: [] }; }
        catch (e) {
          return { ok: false, issues: [{ category: 'validation', severity: 'error',
            message: 'Value must be valid JSON: ' + e.message, location: '', fix: 'Check the brackets, commas and quotes.' }] };
        }
      }
      if (kind === 'bool') {
        if (trimmed === '') return { ok: true, undecided: true, issues: [] };
        if (trimmed === 'true') return { ok: true, value: true, issues: [] };
        if (trimmed === 'false') return { ok: true, value: false, issues: [] };
        return { ok: false, issues: validate(fmt, trimmed) };
      }
      if (kind === 'number') {
        if (trimmed === '') return { ok: true, undecided: true, issues: [] };
        var n = Number(trimmed);
        if (trimmed === '' || isNaN(n) || !isFinite(n)) return { ok: false, issues: validate(fmt, trimmed) };
        var iss = validate(fmt, n);
        return iss.length ? { ok: false, issues: iss } : { ok: true, value: n, issues: [] };
      }
      if (kind === 'stringArray') {
        // One entry per line; blank lines dropped so a trailing newline is not an entry.
        var arr = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l !== ''; });
        return { ok: true, value: arr, issues: [] };
      }
      if (kind === 'options') {
        if (trimmed === '') return { ok: true, undecided: true, issues: [] };
        var iss2 = validate(fmt, trimmed);
        return iss2.length ? { ok: false, issues: iss2 } : { ok: true, value: trimmed, issues: [] };
      }
      // text: an empty box is a REAL blank value (review-16 #1), never "undecided".
      var iss3 = validate(fmt, text);
      return iss3.length ? { ok: false, issues: iss3 } : { ok: true, value: text, issues: [] };
    }

    /**
     * Every format offered by the picker for one project: the built-ins, then the
     * project's custom formats sorted by name.
     * @param {Project} project @returns {Object[]}
     */
    function list(project) {
      var custom = ((project && project.valueFormats) || []).slice().sort(function (a, b) {
        var an = (a.name || a.id), bn = (b.name || b.id);
        return an < bn ? -1 : an > bn ? 1 : 0;
      }).map(function (c) {
        return { id: c.id, name: c.name || c.id, kind: c.kind || 'options', builtin: false,
                 options: (c.options || []).slice(), description: c.description || '' };
      });
      return BUILTINS.map(function (b) { return copy(b, true, false); }).concat(custom);
    }

    /** How many register items reference this format id (for the manager + delete guard). */
    function usageCount(project, formatId) {
      var n = 0;
      Object.keys((project && project.items) || {}).forEach(function (dsId) {
        (project.items[dsId] || []).forEach(function (it) { if (it && it.format === formatId) n++; });
      });
      return n;
    }

    /** The description attached to one allowed option value ('' when none/not an enum). */
    function optionDescription(fmt, value) {
      if (!fmt || fmt.kind !== 'options') return '';
      var o = (fmt.options || []).filter(function (x) { return x.value === value; })[0];
      return (o && o.description) || '';
    }

    App.valueFormats = {
      BUILTINS: BUILTINS, CUSTOM_KINDS: CUSTOM_KINDS,
      inferId: inferId, resolve: resolve, validate: validate,
      display: display, parseInput: parseInput, list: list,
      usageCount: usageCount, optionDescription: optionDescription, findCustom: findCustom
    };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.overrides
   * PURPOSE: The single choke point (spec §19.2.3, OVR-3) that resolves the
   *          default → group → device decision chain for an (item, device) pair,
   *          classifies value divergence for highlighting, and lists deviations.
   *          Adapters stay override-blind: callers use effectiveItem(...) and pass
   *          the resulting item to adapters unchanged.
   * PURITY:  pure
   * DEPENDS: App.registry, App.util.stable
   * INVARIANTS:
   *   * Precedence device > group > default; classification is by VALUE (stableStringify),
   *     so a redundant override never mis-colours (OVR-8).
   *   * Overrides are value-only — applicability is unchanged (callers filter by snapshot).
   * ============================================================================= */
  (function (App) {
    'use strict';
    var stable = App.util.stable.stableStringify;

    function deviceById(project, deviceId) {
      return (project.deviceConfigs || []).filter(function (c) { return c.id === deviceId; })[0] || null;
    }

    /** The group whose deviceBaseIds includes this device's baseId, or null. */
    function groupForDevice(project, deviceId) {
      var dc = deviceById(project, deviceId);
      if (!dc) return null;
      var groups = project.groups || [];
      for (var i = 0; i < groups.length; i++) {
        if ((groups[i].deviceBaseIds || []).indexOf(dc.baseId) !== -1) return groups[i];
      }
      return null;
    }

    /** Read an override value (or undefined) from an overrides map. */
    function ovOf(map, dsId, key) {
      if (!map || !map[dsId] || !Object.prototype.hasOwnProperty.call(map[dsId], key)) return undefined;
      return map[dsId][key];
    }

    /** The default/group/device layered values for one (item, device). */
    function layers(project, datasetId, item, deviceId) {
      var dc = deviceById(project, deviceId);
      var dV = (item.decision != null) ? item.decision : null;
      var group = groupForDevice(project, deviceId);
      var gV = dV, hasGroup = false;
      if (group) { var go = ovOf(group.overrides, datasetId, item.key); if (go !== undefined) { gV = go; hasGroup = true; } }
      var eV = gV, hasDevice = false;
      if (dc) { var dov = ovOf(dc.overrides, datasetId, item.key); if (dov !== undefined) { eV = dov; hasDevice = true; } }
      return { dV: dV, gV: gV, eV: eV, hasGroup: hasGroup, hasDevice: hasDevice, group: group };
    }

    /**
     * Effective decision + provenance for one (item, device) (spec §19.2).
     * @returns {{decision:Object|null, source:'default'|'group'|'device'}}
     */
    function effectiveDecision(project, datasetId, item, deviceId) {
      var L = layers(project, datasetId, item, deviceId);
      return { decision: L.eV, source: L.hasDevice ? 'device' : (L.hasGroup ? 'group' : 'default') };
    }

    /** The item shallow-cloned with its decision replaced by the effective value. */
    function effectiveItem(project, datasetId, item, deviceId) {
      var eff = effectiveDecision(project, datasetId, item, deviceId);
      var out = {};
      for (var k in item) if (Object.prototype.hasOwnProperty.call(item, k)) out[k] = item[k];
      out.decision = eff.decision;
      return out;
    }

    /** Value-based divergence class for highlighting (OVR-4/OVR-8). */
    function classify(project, datasetId, item, deviceId) {
      var L = layers(project, datasetId, item, deviceId);
      if (stable(L.eV) !== stable(L.gV)) return 'device';
      if (stable(L.gV) !== stable(L.dV)) return 'group';
      return 'default';
    }

    function byDsKey(a, b) {
      if (a.datasetId !== b.datasetId) return a.datasetId < b.datasetId ? -1 : 1;
      return a.key < b.key ? -1 : a.key > b.key ? 1 : 0;
    }

    /** Every applicable item whose effective value diverges from default, for a device (§19.6). */
    function deviceDeviations(project, deviceId) {
      var dc = deviceById(project, deviceId);
      if (!dc) return [];
      var pid = project.platformProfileId, out = [];
      App.registry.datasetIds(pid).forEach(function (dsId) {
        var adapter = App.registry.getDataset(pid, dsId);
        var snap = dc.snapshots[dsId];
        if (!adapter || !snap) return;
        var keySet = {}; snap.keys.forEach(function (k) { keySet[k] = true; });
        var dispKey = adapter.displayKey || function (k) { return k; };
        (project.items[dsId] || []).forEach(function (it) {
          if (!keySet[it.key]) return;
          var cls = classify(project, dsId, it, deviceId);
          if (cls === 'default') return;
          var L = layers(project, dsId, it, deviceId);
          out.push({ datasetId: dsId, key: it.key, displayKey: dispKey(it.key), source: cls, defaultValue: L.dV, groupValue: L.gV, deviceValue: L.eV });
        });
      });
      out.sort(byDsKey);
      return out;
    }

    /** Every group override that diverges from default, for a group (§19.4/§19.6). */
    function groupDeviations(project, groupId) {
      var group = (project.groups || []).filter(function (g) { return g.id === groupId; })[0];
      if (!group) return [];
      var pid = project.platformProfileId, out = [];
      Object.keys(group.overrides || {}).forEach(function (dsId) {
        var adapter = App.registry.getDataset(pid, dsId);
        var dispKey = (adapter && adapter.displayKey) || function (k) { return k; };
        var itemsByKey = {}; (project.items[dsId] || []).forEach(function (it) { itemsByKey[it.key] = it; });
        Object.keys(group.overrides[dsId]).forEach(function (key) {
          var it = itemsByKey[key];
          var dV = (it && it.decision != null) ? it.decision : null;
          var gV = group.overrides[dsId][key];
          if (stable(gV) === stable(dV)) return; // redundant, not a real deviation
          out.push({ datasetId: dsId, key: key, displayKey: dispKey(key), source: 'group', defaultValue: dV, groupValue: gV, deviceValue: gV });
        });
      });
      out.sort(byDsKey);
      return out;
    }

    App.overrides = {
      groupForDevice: groupForDevice,
      effectiveDecision: effectiveDecision,
      effectiveItem: effectiveItem,
      classify: classify,
      deviceDeviations: deviceDeviations,
      groupDeviations: groupDeviations
    };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.report
   * PURPOSE: Platform-agnostic Word-targeted HTML report shell (spec §10.3, DOD-8).
   *          Produces one self-contained styled .html document that opens in
   *          Microsoft Word as a formatted document (headings, real tables, page
   *          breaks) suitable for Save-As .docx.
   * PURITY:  pure (string -> string)
   * DEPENDS: App.util.html (esc)
   * INVARIANTS: ALL dynamic text passes through esc(); CSS uses only Word-honoured
   *             constructs (real <table> borders, heading styles, page-break-before).
   * ============================================================================= */
  (function (App) {
    'use strict';
    var esc = App.util.html.esc;

    // Inline CSS limited to what Word's HTML import honours. Notes on the choices
    // (report-gen review): Word ignores `body{margin}` for the page box and keeps its
    // own 1-inch margins, so we set the page box explicitly via @page and zero the body
    // margin (#4); Word wraps every cell in its "Normal" style (~8pt space-after,
    // 1.08 line-height) which inflates rows, so we pin margin:0/line-height and trim
    // padding on p/td/th (#3); Word reapplies theme fonts unless declared per element,
    // so Arial (bold on headings) is set explicitly everywhere (#5); and long unbroken
    // values blew a value table to ~2.5x page width, so tables are width:100% +
    // table-layout:fixed with per-table colgroup widths and word-break on every cell (#6).
    var REPORT_CSS =
      '@page{margin:1in;}' +
      'body{font-family:Arial,sans-serif;font-size:11pt;color:#000;margin:0;line-height:1.05;}' +
      'h1{font-family:Arial,sans-serif;font-weight:bold;font-size:20pt;margin:0 0 8pt;line-height:1.05;}' +
      'h2{font-family:Arial,sans-serif;font-weight:bold;font-size:15pt;border-bottom:1px solid #888;padding-bottom:3pt;margin:12pt 0 6pt;line-height:1.05;}' +
      'p{font-family:Arial,sans-serif;margin:0;line-height:1.05;}' +
      'table{border-collapse:collapse;width:100%;table-layout:fixed;margin:6pt 0;}' +
      'th,td{border:1px solid #888;padding:2pt 4pt;text-align:left;vertical-align:top;font-size:10pt;font-family:Arial,sans-serif;line-height:1.05;margin:0;word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;}' +
      'th{background:#e6e6e6;font-weight:bold;}' +
      '.meta td{border:1px solid #bbb;}' +
      '.section{page-break-before:always;}' +
      '.classification{background:#a00;color:#fff;font-weight:bold;text-align:center;padding:5pt;margin:6pt 0;font-size:12pt;font-family:Arial,sans-serif;}' +
      '.muted{color:#555;}';

    /** The "Device Config Information" metadata section (spec §20.4). */
    function metaTable(meta) {
      var rows = meta.map(function (m) { return '<tr><th>' + esc(m.label) + '</th><td>' + esc(m.value) + '</td></tr>'; }).join('');
      return '<h2>Device Config Information</h2><table class="meta"><colgroup><col style="width:190pt"><col></colgroup><tbody>' + rows + '</tbody></table>';
    }

    /**
     * Wrap a complete report document from a title + ordered section fragments.
     * @param {string} title
     * @param {string[]} sections  Pre-built (already-escaped) HTML fragments, in order.
     * @param {{classification?:string}} [wrapOpts]  when classification is set, a banner
     *        is injected at the top and bottom of <body> (GEN-6).
     * @returns {string} a complete HTML document
     */
    function wrapReport(title, sections, wrapOpts) {
      wrapOpts = wrapOpts || {};
      var banner = wrapOpts.classification ? '<div class="classification">' + esc(wrapOpts.classification) + '</div>' : '';
      // First section flows after the title; subsequent sections start on a new page.
      var body = sections.map(function (sec, i) {
        return '<div class="' + (i === 0 ? '' : 'section') + '">' + sec + '</div>';
      }).join('');
      return '<!DOCTYPE html>\n<html><head><meta charset="utf-8"><title>' + esc(title) + '</title>' +
        '<style>' + REPORT_CSS + '</style></head><body>' +
        banner + '<h1>' + esc(title) + '</h1>' + body + banner +
        '</body></html>';
    }

    /**
     * Shared report table builder (spec §20.3). Emits `<h2>` + a fixed-width `<table>`
     * with a colgroup (widths from per-cell weights) and the single "None." empty row
     * (GEN-5). All text is escaped.
     * @param {string} title
     * @param {Array<string|{label:string,w?:number}>} headerCells  key col first
     * @param {string} rowsHtml  pre-built <tr> rows (already escaped); '' ⇒ "None." row
     * @returns {string}
     */
    function renderTable(title, headerCells, rowsHtml) {
      var cells = headerCells.map(function (h) { return (typeof h === 'string') ? { label: h, w: 1 } : h; });
      var total = cells.reduce(function (a, c) { return a + (c.w || 1); }, 0) || cells.length;
      var cols = cells.map(function (c) { return '<col style="width:' + Math.round((c.w || 1) / total * 100) + '%">'; }).join('');
      var head = '<tr>' + cells.map(function (c) { return '<th>' + esc(c.label) + '</th>'; }).join('') + '</tr>';
      var body = rowsHtml || ('<tr><td colspan="' + cells.length + '">None.</td></tr>');
      return '<h2>' + esc(title) + '</h2><table><colgroup>' + cols + '</colgroup><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
    }

    /**
     * Build one dataset report section — column- and group-aware (spec §20.3).
     * @param {string} sectionLabel
     * @param {{label:string,w?:number,get:Function}} keyCol  always-present first column
     * @param {Array<{id,label,optional?,w?,get:Function}>} columns  post-key columns
     * @param {RegisterItem[]} items
     * @param {{columns?:Object,groups?:Object}} [opts]  per-column / per-group include maps (missing ⇒ shown)
     * @param {DeviceContext} ctx
     * @param {?{field:string,options:Array<{value,label}>}} [groups]  reportGroups or null
     * @returns {string}
     */
    function buildSection(sectionLabel, keyCol, columns, items, opts, ctx, groups) {
      opts = opts || {};
      var colOpts = opts.columns || {};
      var visible = columns.filter(function (c) { return !c.optional || colOpts[c.id] !== false; });
      var headerCols = [keyCol].concat(visible);
      var headerCells = headerCols.map(function (c) { return { label: c.label, w: c.w || 1 }; });
      function rowsFor(list) {
        return list.slice().sort(function (a, b) { return a.key < b.key ? -1 : a.key > b.key ? 1 : 0; }).map(function (it) {
          return '<tr>' + headerCols.map(function (c) { return '<td>' + esc(c.get(it, ctx) == null ? '' : c.get(it, ctx)) + '</td>'; }).join('') + '</tr>';
        }).join('');
      }
      if (groups && groups.field) {
        var groupOpts = opts.groups || {};
        return groups.options.filter(function (g) { return groupOpts[g.value] !== false; }).map(function (g) {
          var list = items.filter(function (it) { return it.decision && it.decision[groups.field] === g.value; });
          return renderTable(sectionLabel + ' — ' + g.label, headerCells, rowsFor(list));
        }).join('');
      }
      return renderTable(sectionLabel, headerCells, rowsFor(items));
    }

    App.report = { wrapReport: wrapReport, renderTable: renderTable, buildSection: buildSection, metaTable: metaTable };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.generate
   * PURPOSE: Orchestrate the three INDEPENDENT generators (spec §7, §10): gather a
   *          device's applicable+complete items per dataset, call adapter generators
   *          + platform preamble/postamble, assemble a manifest (with per-file
   *          sha256 + the decision snapshot used), and produce ONE store-only ZIP.
   * PURITY:  pure up to the final Blob (download is the UI's job, via util.dom).
   * DEPENDS: App.registry, App.projectIo, App.report, App.util.{hash,zip,stable,clock}
   * INVARIANTS: identical project+device ⇒ identical zip bytes under a fixed clock
   *             (DOD-7). Item/output ordering is stable; timestamps come from clock.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var TOOL_VERSION = '1.0';
    var TOOL_NAME = 'CH Config Tool';
    var sha = App.util.hash.sha256Hex;
    var stable = App.util.stable.stableStringify;

    /**
     * Original RegisterItems that are applicable to a device for a dataset AND complete
     * under their EFFECTIVE decision (default→group→device, spec §19.2/OVR-3), sorted by key.
     */
    function applicableComplete(project, deviceId, dsId) {
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      if (!dc) return [];
      var snap = dc.snapshots[dsId];
      if (!snap) return [];
      var adapter = App.registry.getDataset(project.platformProfileId, dsId);
      var ks = {}; snap.keys.forEach(function (k) { ks[k] = true; });
      return (project.items[dsId] || []).filter(function (it) {
        if (!ks[it.key]) return false;
        var eff = App.overrides ? App.overrides.effectiveItem(project, dsId, it, deviceId) : it;
        return App.completeness.itemComplete(adapter, eff);
      }).slice().sort(function (a, b) { return a.key < b.key ? -1 : a.key > b.key ? 1 : 0; });
    }

    /**
     * Items applicable+complete, each with its decision replaced by the EFFECTIVE value
     * so adapters (generators/report) stay override-blind (spec §19.2, OVR-3).
     */
    function gather(project, deviceId, dsId) {
      return applicableComplete(project, deviceId, dsId).map(function (it) {
        return App.overrides ? App.overrides.effectiveItem(project, dsId, it, deviceId) : it;
      });
    }

    /** Compact a UTC ISO timestamp for a filename, e.g. 20260630T120000Z. */
    function stamp(iso) { return iso.replace(/\.\d+/, '').replace(/[-:]/g, ''); }

    /** Build the manifest.json content (deterministic except generatedUtc). */
    function buildManifest(project, dc, command, generatedUtc, platform, outputFiles) {
      var decisions = {};
      platform.datasets.forEach(function (ds) {
        // Record the EFFECTIVE decision + its source per item (spec §19.6 / OVR-7).
        decisions[ds.id] = applicableComplete(project, dc.id, ds.id).map(function (it) {
          var eff = App.overrides ? App.overrides.effectiveDecision(project, ds.id, it, dc.id) : { decision: it.decision, source: 'default' };
          return { key: it.key, decision: eff.decision, source: eff.source };
        });
      });
      var manifest = {
        tool: TOOL_NAME, toolVersion: TOOL_VERSION, command: command, generatedUtc: generatedUtc,
        projectSha256: sha(App.projectIo.serializeProject(project)),
        device: { id: dc.id, baseId: dc.baseId, version: dc.version, name: dc.name, model: dc.model, firmware: dc.firmware },
        outputs: outputFiles.map(function (f) { return { name: f.name, sha256: sha(f.content) }; })
          .sort(function (a, b) { return a.name < b.name ? -1 : 1; }),
        decisions: decisions
      };
      return stable(manifest);
    }

    function ctxFor(project, dc, generatedUtc) {
      return { device: dc, project: project, toolVersion: TOOL_VERSION, generatedUtc: generatedUtc };
    }
    function endsWith(s, suffix) { return s.lastIndexOf(suffix) === s.length - suffix.length; }

    /** Shared path for implementation/verification (scripts + data + manifest -> zip). */
    function buildScripts(project, deviceId, command, opts) {
      opts = opts || {};
      var platform = App.registry.getPlatform(project.platformProfileId);
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      if (!platform || !dc) return { issues: [{ category: 'generation', severity: 'error', message: 'Unknown device or platform.', location: deviceId }] };
      var generatedUtc = App.util.clock.nowIso();
      var ctx = ctxFor(project, dc, generatedUtc);
      var genName = command === 'implementation' ? 'generateImplementation' : 'generateVerification';
      var ext = platform.scriptExtension;
      var files = [];
      // v1.3 (§20.6/§20.7): optional CSV verification-results scaffold accumulates rows.
      var csvRows = [];
      // Only-deviations (§20.7): the set of deviating keys per dataset, once.
      var devKeysByDs = {};
      if (opts.onlyDeviations && App.overrides) {
        App.overrides.deviceDeviations(project, deviceId).forEach(function (d) {
          (devKeysByDs[d.datasetId] = devKeysByDs[d.datasetId] || {})[d.key] = true;
        });
      }
      try {
        platform.datasets.forEach(function (ds) {
          // Dataset include filter (§20.6/§20.7) — skip an unticked dataset entirely.
          if (opts.datasets && opts.datasets[ds.id] === false) return;
          var adapter = App.registry.getDataset(project.platformProfileId, ds.id);
          var items = gather(project, deviceId, ds.id);
          // Action subset (§20.6, enum datasets only) — discovered data-drivenly.
          if (opts.actions && opts.actions[ds.id]) {
            var enumField = ((adapter.decisionSchema || []).filter(function (f) { return f.kind === 'enum'; })[0] || {}).name;
            if (enumField) {
              var amap = opts.actions[ds.id];
              items = items.filter(function (it) { return it.decision && amap[it.decision[enumField]] !== false; });
            }
          }
          // Only items that deviate from default (§20.7).
          if (opts.onlyDeviations) {
            var dk = devKeysByDs[ds.id] || {};
            items = items.filter(function (it) { return dk[it.key]; });
          }
          (ds[genName](items, ctx) || []).forEach(function (f) {
            var isScript = ext && endsWith(f.name, ext);
            // review-3 #1: optionally rename generated SCRIPT files to .txt (wrapping
            // is decided on the original extension first, so the preamble is kept).
            var name = (isScript && opts.scriptsAsTxt) ? f.name.slice(0, -ext.length) + '.txt' : f.name;
            // review-9 #4: a platform-provided "how to run" header for THIS file (if any).
            var runc = (isScript && typeof platform.runInstructions === 'function') ? platform.runInstructions(name) + '\n' : '';
            // Wrap script files (per platform.scriptExtension) with preamble/postamble;
            // leave data files (e.g. tactical.json) unwrapped (spec §10.1).
            var content = isScript ? runc + platform.scriptPreamble(ctx) + '\n' + f.content + '\n' + platform.scriptPostamble(ctx) : f.content;
            files.push({ name: name, content: content });
          });
          // CSV results scaffold (§20.7): expected = adapter decision-column display.
          if (opts.csvResults) {
            var get = decisionColGet(adapter);
            var dispKey = (adapter && adapter.displayKey) || function (k) { return k; };
            items.forEach(function (it) { csvRows.push({ dataset: ds.label, key: dispKey(it.key), expected: String(get(it)), actual: '', result: '' }); });
          }
        });
        if (opts.csvResults) {
          var cols = [{ key: 'dataset', label: 'dataset' }, { key: 'key', label: 'key' }, { key: 'expected', label: 'expected' }, { key: 'actual', label: 'actual' }, { key: 'result', label: 'result' }];
          files.push({ name: 'verification-results.csv', content: App.util.csv.toCsv(csvRows, cols) });
        }
      } catch (e) {
        return { issues: [{ category: 'generation', severity: 'error', message: 'Generation failed: ' + e.message }] };
      }
      files.push({ name: 'manifest.json', content: buildManifest(project, dc, command, generatedUtc, platform, files) });
      return { blob: App.util.zip.zip(files), name: dc.id + '-' + command + '-' + stamp(generatedUtc) + '.zip', issues: [], files: files };
    }

    /** @returns {{blob:Blob,name:string,issues:Issue[],files?:Object[]}} */
    function buildImplementation(project, deviceId, opts) { return buildScripts(project, deviceId, 'implementation', opts); }
    /** @returns {{blob:Blob,name:string,issues:Issue[],files?:Object[]}} */
    function buildVerification(project, deviceId, opts) { return buildScripts(project, deviceId, 'verification', opts); }

    /** Build the Control-coverage section (spec §18.3 CTL-7): items grouped by
     *  control (title + type), sub-grouped by dataset. Unreferenced → "(no control)". */
    function buildControlSection(project, deviceId, platform) {
      var esc = App.util.html.esc;
      var byCtl = {}; var ctlLabel = {};
      var controlsById = {}; (project.controls || []).forEach(function (c) { controlsById[c.id] = c; });
      platform.datasets.forEach(function (ds) {
        var adapter = App.registry.getDataset(project.platformProfileId, ds.id);
        var dispKey = (adapter && adapter.displayKey) || function (k) { return k; };
        gather(project, deviceId, ds.id).forEach(function (it) {
          var refs = (it.controlRefs && it.controlRefs.length) ? it.controlRefs : ['__none__'];
          refs.forEach(function (ref) {
            var c = controlsById[ref];
            ctlLabel[ref] = ref === '__none__' ? '(no control)' : (c ? (c.title + ' (' + c.type + ')') : ref);
            byCtl[ref] = byCtl[ref] || {};
            (byCtl[ref][ds.label] = byCtl[ref][ds.label] || []).push(dispKey(it.key));
          });
        });
      });
      // Sort by displayed label for stable, human-friendly ordering.
      var rows = Object.keys(byCtl).sort(function (a, b) { return ctlLabel[a] < ctlLabel[b] ? -1 : ctlLabel[a] > ctlLabel[b] ? 1 : 0; }).map(function (ref) {
        var parts = Object.keys(byCtl[ref]).sort().map(function (dl) {
          return esc(dl) + ': ' + byCtl[ref][dl].slice().sort().map(esc).join(', ');
        }).join('<br>');
        return '<tr><td>' + esc(ctlLabel[ref]) + '</td><td>' + parts + '</td></tr>';
      }).join('');
      return '<h2>Control coverage</h2><table><colgroup><col style="width:28%"><col style="width:72%"></colgroup><thead><tr><th>Control</th><th>Items (by dataset)</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="2" class="muted">No decided items.</td></tr>') + '</tbody></table>';
    }

    /** Build the per-device "Deviations from default" section (spec §19.6 / OVR-7). */
    function buildDeviationsSection(project, deviceId, platform) {
      var esc = App.util.html.esc;
      var devs = App.overrides ? App.overrides.deviceDeviations(project, deviceId) : [];
      var group = App.overrides ? App.overrides.groupForDevice(project, deviceId) : null;
      var dsLabel = {}; platform.datasets.forEach(function (d) { dsLabel[d.id] = d.label; });
      function val(v) { return v == null ? '(undecided)' : (typeof v === 'object' ? stable(v) : String(v)); }
      var header = '<h2>Deviations from default</h2>' + (group ? '<p class="muted">Device group: ' + esc(group.name) + '</p>' : '');
      if (!devs.length) return header + '<p class="muted">No deviations from default.</p>';
      var rows = devs.map(function (d) {
        return '<tr><td>' + esc(d.displayKey) + '</td><td>' + esc(dsLabel[d.datasetId] || d.datasetId) + '</td><td>' + esc(d.source) + '</td>' +
          '<td>' + esc(val(d.defaultValue)) + ' &rarr; ' + esc(val(d.groupValue)) + ' &rarr; ' + esc(val(d.deviceValue)) + '</td></tr>';
      }).join('');
      return header + '<table><colgroup><col style="width:24%"><col style="width:12%"><col style="width:12%"><col style="width:52%"></colgroup><thead><tr><th>Key</th><th>Dataset</th><th>Source</th><th>Default &rarr; Group &rarr; Device</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function deviceMeta(project, dc, generatedUtc) {
      var meta = [
        { label: 'Project platform', value: project.platformProfileId },
        { label: 'Device', value: dc.name }, { label: 'Model', value: dc.model },
        { label: 'Firmware', value: dc.firmware }, { label: 'Version', value: 'v' + dc.version },
        { label: 'Generated (UTC)', value: generatedUtc },
        { label: 'Project SHA-256', value: sha(App.projectIo.serializeProject(project)) }
      ];
      Object.keys(dc.snapshots).sort().forEach(function (dsId) { meta.push({ label: dsId + ' snapshot SHA-256', value: dc.snapshots[dsId].sha256 }); });
      return meta;
    }

    /**
     * Ordered candidate-section descriptor (spec §20.4 / GEN-4): the "Sections included"
     * table and the body are built from THIS, so the UI and report never drift.
     * @returns {Array<{label:string,included:boolean}>}
     */
    function reportSectionDescriptor(project, platform, opts) {
      var sec = opts.sections || {}, dsSecAll = opts.datasetSections || {}, d = [];
      d.push({ label: 'Device Config Information', included: sec.meta !== false });
      platform.datasets.forEach(function (ds) {
        var adapter = App.registry.getDataset(project.platformProfileId, ds.id);
        var dsSec = dsSecAll[ds.id] || {};
        if (adapter && adapter.reportGroups && adapter.reportGroups.field) {
          adapter.reportGroups.options.forEach(function (g) { d.push({ label: ds.label + ' — ' + g.label, included: dsSec[g.value] !== false }); });
        } else {
          d.push({ label: ds.label, included: dsSec._all !== false });
        }
      });
      d.push({ label: 'Control coverage', included: sec.control !== false });
      d.push({ label: 'Deviations from default', included: sec.deviations !== false });
      return d;
    }

    /**
     * @param {Project} project @param {string} deviceId
     * @param {Object} [opts]  `_gen.report`-shaped (undefined ⇒ include everything).
     * @returns {{blob:Blob,name:string,issues:Issue[],files?:Object[]}}
     */
    function buildReport(project, deviceId, opts) {
      opts = opts || {};
      var esc = App.util.html.esc;
      var platform = App.registry.getPlatform(project.platformProfileId);
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      if (!platform || !dc) return { issues: [{ category: 'generation', severity: 'error', message: 'Unknown device or platform.', location: deviceId }] };
      var sec = opts.sections || {}, dsSecAll = opts.datasetSections || {}, colsAll = opts.columns || {};
      var generatedUtc = App.util.clock.nowIso();
      var ctx = ctxFor(project, dc, generatedUtc);

      // "Sections included" table (GEN-4), always first — self-documents composition.
      var descriptor = reportSectionDescriptor(project, platform, opts);
      var incRows = descriptor.map(function (x) { return '<tr><td>' + esc(x.label) + '</td><td>' + (x.included ? 'Included' : 'Omitted') + '</td></tr>'; }).join('');
      var sections = [App.report.renderTable('Sections included', [{ label: 'Section', w: 3 }, { label: 'Status', w: 1 }], incRows)];

      if (sec.meta !== false) sections.push(App.report.metaTable(deviceMeta(project, dc, generatedUtc)));
      platform.datasets.forEach(function (ds) {
        var adapter = App.registry.getDataset(project.platformProfileId, ds.id);
        var items = gather(project, deviceId, ds.id);
        var dsSec = dsSecAll[ds.id] || {}, colOpts = colsAll[ds.id];
        if (adapter && adapter.reportGroups && adapter.reportGroups.field) {
          var html = adapter.renderReportSection(items, ctx, { columns: colOpts, groups: dsSec });
          if (html) sections.push(html);
        } else if (dsSec._all !== false) {
          sections.push(adapter.renderReportSection(items, ctx, { columns: colOpts }));
        }
      });
      if (sec.control !== false) sections.push(buildControlSection(project, deviceId, platform));
      if (sec.deviations !== false) sections.push(buildDeviationsSection(project, deviceId, platform));

      var html = App.report.wrapReport('CH Configuration Report — ' + dc.name, sections, { classification: opts.classification ? 'OFFICIAL: Sensitive' : null });
      var files = [{ name: 'report.html', content: html }];
      files.push({ name: 'manifest.json', content: buildManifest(project, dc, 'reporting', generatedUtc, platform, files) });
      return { blob: App.util.zip.zip(files), name: dc.id + '-reporting-' + stamp(generatedUtc) + '.zip', issues: [], files: files };
    }

    /** The adapter's decision-column display getter (generic; no adapter change). */
    function decisionColGet(adapter) {
      var col = (adapter.columns || []).filter(function (c) { return c.key === 'decision'; })[0];
      return (col && col.get) ? col.get : function (it) { return it.decision ? stable(it.decision) : ''; };
    }

    /**
     * Standalone control-keyed report (spec §20.5 / GEN-7): one section per control
     * APPLIED to the device (referenced by ≥1 decided applicable item), each listing the
     * satisfying items (Dataset · Key · Decision). Items with no control fall under
     * "(no control)" only if opts.includeUncontrolled.
     * @param {Project} project @param {string} deviceId @param {Object} [opts]
     * @returns {{blob:Blob,name:string,issues:Issue[],files?:Object[]}}
     */
    function buildControlReport(project, deviceId, opts) {
      opts = opts || {};
      var esc = App.util.html.esc;
      var platform = App.registry.getPlatform(project.platformProfileId);
      var dc = project.deviceConfigs.filter(function (c) { return c.id === deviceId; })[0];
      if (!platform || !dc) return { issues: [{ category: 'generation', severity: 'error', message: 'Unknown device or platform.', location: deviceId }] };
      var generatedUtc = App.util.clock.nowIso();
      var controlsById = {}; (project.controls || []).forEach(function (c) { controlsById[c.id] = c; });
      var NONE = '__none__', byCtl = {};
      platform.datasets.forEach(function (ds) {
        var adapter = App.registry.getDataset(project.platformProfileId, ds.id);
        var get = decisionColGet(adapter);
        var dispKey = (adapter && adapter.displayKey) || function (k) { return k; };
        gather(project, deviceId, ds.id).forEach(function (it) {
          var refs = (it.controlRefs && it.controlRefs.length) ? it.controlRefs : [NONE];
          refs.forEach(function (ref) { (byCtl[ref] = byCtl[ref] || []).push({ dsLabel: ds.label, key: dispKey(it.key), decision: String(get(it)) }); });
        });
      });
      function labelFor(ref) { if (ref === NONE) return '(no control)'; var c = controlsById[ref]; return c ? (c.title + ' (' + c.type + ')') : ref; }
      var refs = Object.keys(byCtl).filter(function (ref) { return ref !== NONE || opts.includeUncontrolled; });
      refs.sort(function (a, b) { var la = labelFor(a), lb = labelFor(b); return la < lb ? -1 : la > lb ? 1 : 0; });

      var sections = [App.report.metaTable(deviceMeta(project, dc, generatedUtc))];
      if (!refs.length) {
        sections.push('<h2>Applied controls</h2><p class="muted">No controls are satisfied by this device\'s decided items.</p>');
      } else {
        refs.forEach(function (ref) {
          var c = controlsById[ref];
          var descP = (ref !== NONE && c && c.description) ? '<p class="muted">' + esc(c.description) + '</p>' : '';
          var rows = byCtl[ref].slice().sort(function (a, b) { return (a.dsLabel + a.key) < (b.dsLabel + b.key) ? -1 : 1; })
            .map(function (r) { return '<tr><td>' + esc(r.dsLabel) + '</td><td>' + esc(r.key) + '</td><td>' + esc(r.decision) + '</td></tr>'; }).join('');
          var table = '<table><colgroup><col style="width:20%"><col style="width:40%"><col style="width:40%"></colgroup>' +
            '<thead><tr><th>Dataset</th><th>Key</th><th>Decision</th></tr></thead><tbody>' + (rows || '<tr><td colspan="3">None.</td></tr>') + '</tbody></table>';
          sections.push('<h2>' + esc(labelFor(ref)) + '</h2>' + descP + table);
        });
      }
      var html = App.report.wrapReport('Control Report — ' + dc.name, sections, { classification: opts.classification ? 'OFFICIAL: Sensitive' : null });
      var files = [{ name: 'control-report.html', content: html }];
      files.push({ name: 'manifest.json', content: buildManifest(project, dc, 'control', generatedUtc, platform, files) });
      return { blob: App.util.zip.zip(files), name: dc.id + '-control-' + stamp(generatedUtc) + '.zip', issues: [], files: files };
    }

    App.generate = {
      buildImplementation: buildImplementation, buildVerification: buildVerification, buildReport: buildReport,
      buildControlReport: buildControlReport, _gather: gather
    };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.model
   * PURPOSE: PURE view-model helpers shared by the UI views: latest-version
   *          resolution, applicability map, and search/sort/filter of table rows.
   *          Kept pure so the table logic is unit-testable without the DOM.
   * PURITY:  pure
   * DEPENDS: (reads plain project data + an adapter's columns)
   * INVARIANTS: never mutates inputs; "latest" = config not referenced by any
   *             supersedesId (per the version-integrity invariant).
   * ============================================================================= */
  (function (App) {
    'use strict';

    /** @param {Project} project @returns {DeviceConfig[]} latest version per baseId */
    function getLatestConfigs(project) {
      var referenced = {};
      project.deviceConfigs.forEach(function (c) { if (c.supersedesId) referenced[c.supersedesId] = true; });
      return project.deviceConfigs.filter(function (c) { return !referenced[c.id]; });
    }

    /** @returns {boolean} true if deviceId is a latest (active) config */
    function isLatest(project, deviceId) {
      return getLatestConfigs(project).some(function (c) { return c.id === deviceId; });
    }

    /**
     * Map of item key -> [device names] whose latest snapshot for dsId has the key.
     * @returns {Object<string,string[]>}
     */
    function computeAppliesTo(project, dsId) {
      var map = {};
      getLatestConfigs(project).forEach(function (c) {
        var snap = c.snapshots[dsId];
        if (!snap || !snap.keys) return;
        snap.keys.forEach(function (k) { (map[k] = map[k] || []).push(c.name); });
      });
      return map;
    }

    /** @returns {number} count of not-decided items in a dataset */
    function countIncomplete(project, dsId) {
      return (project.items[dsId] || []).filter(function (it) { return it.status !== 'decided'; }).length;
    }

    // review-12 #3 / review-14: sort Security Relevance by SEVERITY (HIGH → MEDIUM →
    // CONTEXT → REPORTING → IRRELEVANT → unset), not alphabetically — alphabetical
    // would put CONTEXT above HIGH.
    var RELEVANCE_RANK = { HIGH: '1', MEDIUM: '2', CONTEXT: '3', REPORTING: '4', IRRELEVANT: '5' };

    /**
     * review-14: the row predicate for the relevance view.
     *  - no toggle on  ⇒ every item EXCEPT the parked categories (REPORTING/IRRELEVANT)
     *  - toggles on    ⇒ ONLY items in the toggled categories (both on ⇒ either)
     * @param {{onlyRelevance?:string[]}} ui
     * @returns {(row:{item:RegisterItem})=>boolean}
     */
    function relevanceViewFilter(ui) {
      var only = (ui && ui.onlyRelevance) || [];
      if (only.length) {
        return function (r) { return only.indexOf(r.item.relevance || '') !== -1; };
      }
      var parked = App.projectIo.RELEVANCE_PARKED;
      return function (r) { return parked.indexOf(r.item.relevance || '') === -1; };
    }

    function sortValue(r, key) {
      if (key === 'appliesTo') return r.appliesTo.join(',');
      if (key === 'status') return r.status;
      if (key === 'relevance') return RELEVANCE_RANK[r.item.relevance] || '6';
      if (Object.prototype.hasOwnProperty.call(r.cells, key)) return String(r.cells[key] == null ? '' : r.cells[key]);
      return String(r.item[key] == null ? '' : r.item[key]);
    }

    /**
     * Build display rows for a dataset, applying search/sort/incomplete filters.
     * @param {Project} project
     * @param {string} dsId
     * @param {DatasetAdapter} adapter
     * @param {{search?:string,sortKey?:string,sortDir?:string,incompleteOnly?:boolean,onlyRelevance?:string[]}} ui
     * @returns {Array<{item:RegisterItem, appliesTo:string[], status:string, cells:Object}>}
     */
    function filterSortRows(project, dsId, adapter, ui) {
      ui = ui || {};
      var appliesTo = computeAppliesTo(project, dsId);
      var rows = (project.items[dsId] || []).map(function (it) {
        var cells = {};
        adapter.columns.forEach(function (c) { cells[c.key] = c.get ? c.get(it) : it[c.key]; });
        cells.relevance = it.relevance || ''; // review-12 #3: Security Relevance (may be empty)
        return { item: it, appliesTo: appliesTo[it.key] || [], status: it.status, cells: cells };
      });
      // review-14: REPORTING/IRRELEVANT items are PARKED — hidden from the working view
      // unless their toggle is on, in which case ONLY those categories are listed.
      rows = rows.filter(relevanceViewFilter(ui));
      if (ui.incompleteOnly) rows = rows.filter(function (r) { return r.status !== 'decided'; });
      var q = (ui.search || '').toLowerCase().trim();
      if (q) rows = rows.filter(function (r) {
        return (r.item.key + ' ' + (r.item.description || '')).toLowerCase().indexOf(q) !== -1;
      });
      var sk = ui.sortKey || 'key';
      var dir = ui.sortDir === 'desc' ? -1 : 1;
      rows.sort(function (a, b) {
        var av = sortValue(a, sk), bv = sortValue(b, sk);
        if (av < bv) return -dir; if (av > bv) return dir;
        // stable tiebreak on key
        return a.item.key < b.item.key ? -1 : a.item.key > b.item.key ? 1 : 0;
      });
      return rows;
    }

    App.ui = App.ui || {};
    /**
     * BULK-1: the plan for "apply this control to everything currently shown".
     *
     * Shared by the button's LABEL and the button's ACTION so the two can never disagree
     * about what "shown" means — the label promises a count, and the click must act on
     * exactly that set. `removing` mirrors RV9-1: when every shown row already carries the
     * control, the click takes it away instead of being a no-op.
     * @param {Project} project @param {string} dsId @param {Object} ui  per-dataset UI state
     * @param {string} controlId
     * @returns {{items:RegisterItem[], removing:boolean, changing:number}}
     */
    function applyAllShownPlan(project, dsId, ui, controlId) {
      var adapter = project ? App.registry.getDataset(project.platformProfileId, dsId) : null;
      if (!project || !adapter || !controlId) return { items: [], removing: false, changing: 0 };
      var items = filterSortRows(project, dsId, adapter, ui || {}).map(function (r) { return r.item; });
      var have = items.filter(function (it) { return (it.controlRefs || []).indexOf(controlId) !== -1; }).length;
      var removing = items.length > 0 && have === items.length;
      return { items: items, removing: removing, changing: removing ? have : items.length - have };
    }

    App.ui.model = {
      getLatestConfigs: getLatestConfigs, isLatest: isLatest,
      computeAppliesTo: computeAppliesTo, countIncomplete: countIncomplete,
      filterSortRows: filterSortRows, relevanceViewFilter: relevanceViewFilter,
      applyAllShownPlan: applyAllShownPlan
    };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.activity
   * PURPOSE: The append-only Activity/Errors drawer log (spec §11.6). Nothing in
   *          the app fails silently — parse/validation/generation results land here.
   * PURITY:  holds a log array + emitter; no DOM (rendering is App.ui.app's job).
   * DEPENDS: App.util.clock
   * INVARIANTS: append-only until explicitly cleared; entries carry a timestamp.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var _entries = [];
    var _handlers = [];
    function emit() { _handlers.forEach(function (h) { try { h(_entries.slice()); } catch (e) {} }); }

    /**
     * Append a log entry.
     * @param {{severity:'error'|'warning'|'info'|'success', message:string, location?:string}} entry
     */
    function log(entry) {
      _entries.push({ ts: App.util.clock.nowIso(), severity: entry.severity || 'info', message: entry.message, location: entry.location });
      emit();
    }
    /** Append many Issues at once (parse/validation results). */
    function logIssues(issues, prefix) {
      (issues || []).forEach(function (i) {
        log({ severity: i.severity, message: (prefix ? prefix + ': ' : '') + i.message + (i.location ? ' [' + i.location + ']' : '') + (i.fix ? ' — ' + i.fix : '') });
      });
    }
    function list() { return _entries.slice(); }
    function clear() { _entries = []; emit(); }
    function onChange(h) { _handlers.push(h); return function () { var i = _handlers.indexOf(h); if (i >= 0) _handlers.splice(i, 1); }; }

    App.ui = App.ui || {};
    App.ui.activity = { log: log, logIssues: logIssues, list: list, clear: clear, onChange: onChange };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.ui.tables
   * PURPOSE: Render a data-driven data-table tab to an HTML string (spec §11.2).
   *          Columns come from adapter.columns plus computed "Applies to"/"Status".
   *          NO hardcoded dataset branching — fully data-driven.
   * PURITY:  render returns a string (pure); escaping via App.util.html.esc.
   * DEPENDS: App.registry, App.ui.model, App.util.html
   * INVARIANTS: every cell value passes through esc(); undecided rows flagged.
   * ============================================================================= */
  (function (App) {
    'use strict';
    var esc = App.util.html.esc;

    // review-13 #3: one source of truth for the Undo/Redo button tooltips (the toolbar
    // renders them; App.ui.app re-syncs them in place after a suppressed re-render).
    var UNDO_OFF_TITLE = 'Nothing to undo yet — no Delete Mode or Apply Control Mode change has been made';
    var REDO_OFF_TITLE = 'Nothing to redo — redo becomes available after an undo';
    function undoTitle(label) { return 'Undo the ' + (label || 'last bulk change') + ' — restores this table to its state just before that change'; }
    function redoTitle(label) { return 'Redo the ' + (label || 'undone change'); }

    /**
     * Render the toolbar (search/incomplete/count) for a dataset tab.
     * Kept separate from the table body so the search input is NOT re-rendered on
     * keystroke (preserves focus); only #table-host updates.
     */
    function renderToolbar(dsId, ui, total, shown, controls, undo) {
      // review-7 #2: "Apply Control Mode" — a searchable control picker + per-row
      // checkboxes for bulk-assigning one control to many items at once.
      var deleteMode = !!ui.deleteMode;
      var applyBtn = '<button data-apply-toggle="' + esc(dsId) + '"' + (ui.applyMode ? ' class="active"' : '') + (deleteMode ? ' disabled' : '') +
        ' title="' + (deleteMode ? 'Finish or cancel Delete Mode first' : 'Bulk-assign a control to many items via row checkboxes') + '">' + (ui.applyMode ? 'Exit control mode' : 'Apply Control Mode') + '</button>';
      // review-12 #2: "Delete Items" mirrors Apply Control Mode — click to arm, tick the
      // rows to remove, click again to action the selection (Cancel exits without change).
      var selCount = Object.keys(ui.deleteSel || {}).filter(function (k) { return (ui.deleteSel || {})[k]; }).length;
      var deleteBtn = '<button data-delete-toggle="' + esc(dsId) + '"' + (deleteMode ? ' class="active danger"' : ' class="danger"') + (ui.applyMode ? ' disabled' : '') +
        ' title="' + (ui.applyMode ? 'Exit control mode first' : (deleteMode ? 'Delete every ticked item' : 'Tick rows, then click again to delete them')) + '">' +
        (deleteMode ? 'Delete selected (' + selCount + ')' : 'Delete Items') + '</button>' +
        (deleteMode ? '<button data-delete-cancel="' + esc(dsId) + '" title="Leave Delete Mode without deleting anything">Cancel</button>' : '');
      // review-12 #2 / review-13 #3: undo + redo of the last Delete-Mode or
      // Apply-Control-Mode ACTION in THIS dataset (one whole apply run counts as one
      // action). Both are greyed out until there is something to step to.
      var canUndo = !!(undo && undo.canUndo), canRedo = !!(undo && undo.canRedo);
      var undoBtn = '<button data-undo="' + esc(dsId) + '"' + (canUndo ? '' : ' disabled') +
        ' title="' + esc(canUndo ? undoTitle(undo.label) : UNDO_OFF_TITLE) + '">↶ Undo</button>' +
        '<button data-redo="' + esc(dsId) + '"' + (canRedo ? '' : ' disabled') +
        ' title="' + esc(canRedo ? redoTitle(undo.redoLabel) : REDO_OFF_TITLE) + '">↷ Redo</button>';
      // BULK-1: one button that applies the selected control to EVERY ROW CURRENTLY
      // SHOWN — i.e. whatever the search box and filters have narrowed the table to.
      // This replaces the old "Apply to <action>" dropdown, which could only ever slice
      // by an enum decision field: it was packages-only, and it could not express
      // "everything Bluetooth-related", which is how people actually work. Search
      // `bluetooth`, click once. It toggles like RV9-1: if every shown item already has
      // the control, the click removes it from all of them.
      var applyToHtml = '';
      if (ui.applyMode && (controls || []).length) {
        var ready = !!ui.applyControlId;
        var plan = ready ? App.ui.model.applyAllShownPlan(App.store.getProject(), dsId, ui, ui.applyControlId)
                         : { removing: false, changing: 0 };
        var label = !ready ? 'Apply to all ' + shown + ' shown'
          : plan.removing ? 'Remove from all ' + shown + ' shown'
          : 'Apply to all ' + shown + ' shown';
        applyToHtml = '<button type="button" class="apply-all' + (plan.removing ? ' danger' : '') + '" data-apply-all="' + esc(dsId) + '"' +
          (ready && shown ? '' : ' disabled') +
          ' title="' + esc(!ready ? 'Select a control first'
            : !shown ? 'No rows are shown — adjust the search or filters'
            : (plan.removing
                ? 'Every row currently shown already has this control — click to remove it from all ' + shown
                : 'Add this control to the ' + plan.changing + ' of ' + shown + ' shown row(s) that do not have it yet. The search and filters above decide what "shown" means.')) + '">' +
          esc(label) + '</button>' +
          (ready && shown ? '<div class="muted apply-all-note">Acts on exactly what the table shows — narrow it with the search box first.</div>' : '');
      }
      // review-14: the two "parked" relevance views. Off (the default) the table hides
      // REPORTING/IRRELEVANT items entirely; ticking one shows ONLY that category.
      var only = ui.onlyRelevance || [];
      function parkedToggle(value, label) {
        var on = only.indexOf(value) !== -1;
        return '<label class="rel-view ' + relevanceClass(value) + (on ? ' active' : '') + '"><input type="checkbox" data-only-rel="' + esc(value) + '"' + (on ? ' checked' : '') +
          ' title="Show only items marked ' + esc(value) + ' (they are hidden from the normal view)"> ' + esc(label) + ' only</label>';
      }
      var parkedToggles = parkedToggle('REPORTING', 'Reporting') + parkedToggle('IRRELEVANT', 'Irrelevant');
      var parkedNote = only.length
        ? '<span class="muted">Showing only ' + esc(only.join(' + ')) + ' items.</span>'
        : '<span class="muted">Reporting &amp; Irrelevant items are hidden.</span>';

      // v2.1 (SP-1): the MODE controls (Apply Control Mode, Delete Items, Undo/Redo)
      // and the control picker no longer live in this toolbar — they moved to the
      // sticky side rail below, so changing the selected control no longer means
      // scrolling a 438-row table back to the top. Everything here is a FILTER.
      var railCollapsed = !!ui.railCollapsed;
      return '' +
        '<div class="toolbar">' +
        '<input class="grow" type="search" placeholder="Search key or description…" data-search="' + esc(dsId) + '" value="' + esc(ui.search || '') + '" aria-label="Search items">' +
        '<label><input type="checkbox" data-incomplete="' + esc(dsId) + '"' + (ui.incompleteOnly ? ' checked' : '') + '> Incomplete only</label>' +
        parkedToggles +
        '<span class="muted">' + esc(shown) + ' of ' + esc(total) + ' shown</span>' + parkedNote +
        '</div>' +
        '<div class="table-wrap' + (railCollapsed ? ' rail-collapsed' : '') + '">' +
          '<div id="table-host"></div>' +
          renderSideRail(dsId, ui, controls, { applyBtn: applyBtn, deleteBtn: deleteBtn, undoBtn: undoBtn, applyTo: applyToHtml }) +
        '</div>';
    }

    /**
     * SP-1/SP-2: the sticky right-hand rail. `position:sticky` inside the table wrapper
     * keeps it in view while a long register scrolls, which is the whole point — the
     * control you are bulk-assigning is reachable from row 400 without scrolling back
     * to row 1. Collapsible, because on a narrow screen the table matters more.
     *
     * SP-3: the control picker here is a real scrollable LIST, not the old
     * `<input list>` + `<datalist>`. A datalist can only ever show the value, so the
     * control's description — the thing that tells you what the control actually means
     * while you assign it — had nowhere to go. Each entry now shows title, type and
     * description, and the whole list is filterable.
     */
    function renderSideRail(dsId, ui, controls, btns) {
      if (ui.railCollapsed) {
        return '<aside class="side-rail collapsed" data-side-rail>' +
          '<button type="button" class="rail-toggle" data-rail-toggle="' + esc(dsId) + '" title="Show the tools panel" aria-expanded="false">‹ Tools</button>' +
          '</aside>';
      }
      var list = (controls || []).slice().sort(function (a, b) { return a.title < b.title ? -1 : a.title > b.title ? 1 : 0; });
      var filter = String(ui.railSearch || '').toLowerCase();
      var shownList = filter
        ? list.filter(function (c) {
            return (c.title || '').toLowerCase().indexOf(filter) !== -1 ||
                   (c.description || '').toLowerCase().indexOf(filter) !== -1 ||
                   (c.type || '').toLowerCase().indexOf(filter) !== -1;
          })
        : list;
      var picker = '';
      if (ui.applyMode) {
        if (!list.length) {
          picker = '<p class="muted rail-empty">No controls yet — add them in Control Manager.</p>';
        } else {
          var options = shownList.map(function (c) {
            var on = ui.applyControlId === c.id;
            return '<button type="button" class="ctl-card' + (on ? ' active' : '') + '" data-rail-control="' + esc(c.id) + '" data-ds="' + esc(dsId) + '"' +
              ' aria-pressed="' + on + '">' +
              '<span class="ctl-card-head"><span class="ctl-card-title">' + esc(c.title) + '</span>' +
              (c.type ? '<span class="ctl-card-type">' + esc(c.type) + '</span>' : '') + '</span>' +
              '<span class="ctl-card-desc">' + (c.description ? esc(c.description) : '<em>No description — add one in Control Manager.</em>') + '</span>' +
              '</button>';
          }).join('');
          picker =
            '<div class="rail-section">' +
              '<div class="rail-label">Control to apply</div>' +
              '<input type="search" class="rail-search" data-rail-search="' + esc(dsId) + '" placeholder="Filter controls…" value="' + esc(ui.railSearch || '') + '" aria-label="Filter controls">' +
              '<div class="ctl-cards">' + (options || '<p class="muted rail-empty">No control matches that filter.</p>') + '</div>' +
              '<div class="muted rail-count">' + shownList.length + ' of ' + list.length + ' shown</div>' +
              (btns.applyTo || '') +
            '</div>';
        }
      }
      return '<aside class="side-rail" data-side-rail>' +
        '<div class="rail-head">' +
          '<span class="rail-title">Tools</span>' +
          '<button type="button" class="rail-toggle" data-rail-toggle="' + esc(dsId) + '" title="Hide the tools panel" aria-expanded="true">Hide ›</button>' +
        '</div>' +
        '<div class="rail-section rail-modes">' + btns.applyBtn + btns.deleteBtn + '</div>' +
        '<div class="rail-section rail-history">' + btns.undoBtn + '</div>' +
        picker +
        '</aside>';
    }

    /** Merge each latest snapshot's captured defaults into one {key:{value,type}} map. */
    function buildCapturedMap(project, dsId, adapter) {
      var map = {};
      if (!adapter.capturedDefaults) return map;
      App.ui.model.getLatestConfigs(project).forEach(function (c) {
        var snap = c.snapshots[dsId];
        if (!snap) return;
        var d = adapter.capturedDefaults(snap);
        Object.keys(d).forEach(function (k) { if (!(k in map)) map[k] = d[k]; });
      });
      return map;
    }

    var MIN_COL_WIDTH = 60; // px (review-2 #4)
    /** Sensible default column widths (px) by column key; resized widths override.
     *  `dsId` is accepted (and passed by the caller) so a dataset can be given its
     *  own default without touching the call site — none needs one today. */
    function colDefaultWidth(key, dsId) {
      // review-15: descriptions are long prose, so Description starts 3× wider.
      switch (key) {
        case 'key': return 240;
        case 'description': return 660;
        case 'decision': return 280;
        case 'controlRefs': return 180;
        case 'relevance': return 150;
        case 'appliesTo': return 160;
        case 'status': return 100;
        default: return 160;
      }
    }

    /**
     * STAB-1: render cell text clamped to a fixed height, with the full value on the
     * element's title. Used for the cells that GROW when a checkbox is ticked, so a tick
     * never changes a row's height and never shifts the rows below it.
     * @param {string} text @returns {string} HTML
     */
    function clampCell(text) {
      var t = String(text == null ? '' : text);
      // The span is emitted even when EMPTY: its min-height makes an empty cell exactly as
      // tall as a one-line cell, so the very first tick — which turns '' into one name —
      // does not change the row height either.
      return '<span class="cell-clamp"' + (t ? ' title="' + esc(t) + '"' : '') + '>' + esc(t) + '</span>';
    }

    function ctrl(dsId, key, field, kind, extra) {
      return 'data-decision data-ds="' + esc(dsId) + '" data-key="' + esc(key) + '" data-field="' + esc(field) + '" data-kind="' + kind + '"' + (extra || '');
    }

    /**
     * VF-8: the editor for one item's VALUE, chosen by its resolved value format.
     * This is what replaces "every value is a textarea": a boolean gets true/false, a
     * number gets a numeric box, a custom-options format gets a real <select> whose
     * entries carry the description of what each option does, and a string list gets a
     * one-per-line box. `data-fmt-kind` tells the commit path how to read it back, so
     * parse/serialise stay in App.valueFormats and never leak into DOM handling.
     * @param {Object} fmt   from App.valueFormats.resolve
     * @param {string} attrs the shared data-* attribute string from ctrl()
     * @param {*} value      the value to show (decision value, else captured default)
     * @returns {string} HTML
     */
    function renderValueEditor(fmt, attrs, value) {
      var VF = App.valueFormats;
      var shown = VF ? VF.display(fmt, value) : (typeof value === 'string' ? value : App.util.stable.stableStringify(value));
      var kindAttr = ' data-fmt-kind="' + esc(fmt ? fmt.kind : 'string') + '"';
      if (fmt && fmt.kind === 'bool') {
        return '<select ' + attrs + kindAttr + ' class="val-edit val-bool" aria-label="value">' +
          '<option value=""' + (shown === '' ? ' selected' : '') + '>—</option>' +
          '<option value="true"' + (shown === 'true' ? ' selected' : '') + '>true</option>' +
          '<option value="false"' + (shown === 'false' ? ' selected' : '') + '>false</option>' +
          '</select>';
      }
      if (fmt && fmt.kind === 'options') {
        var opts = (fmt.options || []);
        // An options format with nothing defined yet must not trap the operator in an
        // empty dropdown — fall back to a text box until the format has options.
        if (!opts.length) {
          return '<textarea ' + attrs + kindAttr + ' rows="1" class="val-edit" aria-label="value">' + esc(shown) + '</textarea>';
        }
        var known = opts.some(function (o) { return o.value === shown; });
        return '<select ' + attrs + kindAttr + ' class="val-edit val-options" aria-label="value">' +
          '<option value=""' + (shown === '' ? ' selected' : '') + '>—</option>' +
          opts.map(function (o) {
            var label = o.description ? (o.value + ' — ' + o.description) : o.value;
            return '<option value="' + esc(o.value) + '"' + (shown === o.value ? ' selected' : '') +
              (o.description ? ' title="' + esc(o.description) + '"' : '') + '>' + esc(label) + '</option>';
          }).join('') +
          // Keep an off-vocabulary captured value visible and selected rather than
          // silently snapping it to the first option — it is exactly the mismatch the
          // operator needs to SEE and fix (VF-7).
          (!known && shown !== '' ? '<option value="' + esc(shown) + '" selected>' + esc(shown) + ' (not an allowed value)</option>' : '') +
          '</select>';
      }
      if (fmt && fmt.kind === 'number') {
        return '<input type="text" inputmode="decimal" ' + attrs + kindAttr + ' class="val-edit val-number" value="' + esc(shown) + '" aria-label="value">';
      }
      var rows = (fmt && fmt.kind === 'stringArray') ? Math.max(2, Math.min(8, shown.split('\n').length + 1)) : 1;
      return '<textarea ' + attrs + kindAttr + ' rows="' + rows + '" class="val-edit' + (fmt && fmt.kind === 'stringArray' ? ' val-list' : '') + '"' +
        (fmt && fmt.kind === 'stringArray' ? ' placeholder="one entry per line"' : '') +
        ' aria-label="value">' + esc(shown) + '</textarea>';
    }

    /** Render the decisionSchema-driven control(s) for one item's decision cell. */
    function renderDecisionControl(adapter, dsId, item, captured, project) {
      var d = item.decision, cap = captured[item.key];
      var VF = App.valueFormats;
      var fmt = VF ? VF.resolve(project || null, item, cap ? cap.type : undefined, cap ? cap.value : undefined) : null;
      var html = adapter.decisionSchema.map(function (f) {
        if (f.kind === 'enum') {
          var cur = d && d[f.name] != null ? d[f.name] : '';
          return '<select ' + ctrl(dsId, item.key, f.name, 'enum') + ' aria-label="' + esc(f.name) + '">' +
            '<option value=""' + (cur === '' ? ' selected' : '') + '>—</option>' +
            f.options.map(function (o) { return '<option value="' + esc(o) + '"' + (cur === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
            '</select>';
        }
        if (f.kind === 'string' || f.kind === 'value-typed') {
          // VF-8: both text primaries now route through the format-driven editor. The
          // captured leaf type still supplies the DEFAULT format (data-vtype is kept so
          // an item with no declared format coerces exactly as it did before).
          var rawVal = d && (f.name in d) ? d[f.name] : (cap ? cap.value : '');
          var vtype = (cap && cap.type) ? cap.type : (d && d.type ? d.type : 'string');
          var attrs = ctrl(dsId, item.key, f.name, f.kind, ' data-vtype="' + esc(vtype) + '"');
          return renderValueEditor(fmt, attrs, rawVal);
        }
        if (f.kind === 'bool') {
          var on = !!(d && d[f.name]);
          return '<input type="checkbox" ' + ctrl(dsId, item.key, f.name, 'bool') + (on ? ' checked' : '') + ' aria-label="' + esc(f.name) + '">';
        }
        return '';
      }).join(' ');
      // review-16 #1: an emptied TEXT box is committed as a blank value (e.g. clearing
      // a comma-separated list), so it can no longer double as "clear the decision" —
      // that gets this explicit button. Enum datasets keep their "—" option instead.
      // review-17 #2: value box and clear button share one flex row, so the button
      // sits beside the box instead of wrapping under it.
      if (d != null && isTextPrimary(adapter)) {
        html = '<div class="dec-row">' + html +
          '<button type="button" class="dec-clear" data-decision-clear data-ds="' + esc(dsId) + '" data-key="' + esc(item.key) + '"' +
          ' title="Clear this decision (back to undecided)">clear</button></div>';
      }
      return html;
    }
    /** True when the dataset's primary decision field is a free-text box, not an enum. */
    function isTextPrimary(adapter) {
      var f = adapter && adapter.decisionSchema && adapter.decisionSchema[0];
      return !!f && (f.kind === 'string' || f.kind === 'value-typed');
    }

    /** Render the expanded detail editor row (description/ISM/rationale/rollback + issues). */
    /**
     * Multi-select over the control catalogue (spec §18.3 CTL-5; review-5 #2).
     * A native <select multiple> made it impossible to add more than one ref or to
     * remove one without modifier-clicks, so this is a searchable CHECKBOX list:
     * each control is a checkbox (checked = referenced); ticking/unticking toggles
     * that single ref, so any number can be added and any one removed independently.
     * The search box filters the visible options client-side (no store round-trip).
     */
    function controlSelect(dsId, key, refs, controls) {
      if (!controls.length) return '<span class="muted" style="font-size:12px">No controls yet — add them in Control Manager.</span>';
