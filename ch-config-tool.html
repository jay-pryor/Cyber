<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CH Config Tool</title>
<!--
  =============================================================================
  CH CONFIG TOOL — single-file, offline, file:// hardening configuration manager
  =============================================================================
  Built per android-ch-config-tool-build-spec-v1.0.md (normative).

  file:// ENVIRONMENT CONSTRAINTS (do not reintroduce regressions — see spec §3):
    * NO cross-file ES module imports. This is ONE file of ordered classic
      <script> IIFEs attaching to a single global `App`. Not type="module".
    * crypto.subtle may be UNDEFINED on file:// (not a secure context). Hashing
      uses the VENDORED pure-JS SHA-256 below, never Web Crypto.
    * fetch()/XHR of local paths is blocked and FORBIDDEN. All input arrives via
      <input type="file">. No network access of any kind. No telemetry.
    * Downloads use Blob + URL.createObjectURL + programmatic <a download>.
      Browsers throttle rapid multiple downloads, so each generator emits exactly
      ONE .zip.
    * localStorage origin is unreliable (opaque/null, shared) under file://; it is
      NEVER canonical state — only an optional, clearly-labelled draft autosave.
    * Clipboard API may need a gesture/secure context; copy affordances degrade to
      a selectable textarea.

  DETERMINISM (spec §6 C-6, §8.6, §10.4):
    * All serialized state + emitted artifacts are byte-stable for identical input.
    * Timestamps come ONLY from App.util.clock (injectable). No Date.now()/Math.random
      in engine paths.
    * ZIP entries use FIXED DOS date/time (1980-01-01) and fixed attribute fields.

  ARCHITECTURE (spec §4): UI shell -> Engine (pure) -> Adapters (pure) -> Util/IO.
  Dependencies point downward only. Engine + adapters touch NO DOM and do NO I/O.

  LOAD ORDER (spec §14, MUST):
    types -> util.* -> registry -> projectIo -> store -> diff -> validation ->
    completeness -> report -> generate -> adapters(android.*) -> platform(android-adb)
    -> ui.* -> bootstrap
  =============================================================================
-->
<style>
  /* ---------------------------------------------------------------------------
     Inline design system (spec §11): CSS custom properties, neutral high-contrast
     print-friendly palette, no external fonts/CDNs.
     --------------------------------------------------------------------------- */
  :root {
    --c-bg: #f5f6f8;
    --c-surface: #ffffff;
    --c-surface-alt: #f0f2f5;
    --c-border: #d4d8de;
    --c-text: #1d2330;
    --c-text-muted: #5b6472;
    --c-accent: #1f5fb0;
    --c-accent-text: #ffffff;
    --c-ok: #1d7a46;
    --c-warn: #9a6700;
    --c-error: #b3261e;
    --c-undecided-border: #d99100;
    --c-badge-bg: #e7ecf3;
    /* Status tint backgrounds as variables so the dark theme overrides VARIABLES
       only (spec §18.1 DM-1) — no per-component restyle. */
    --c-ok-bg: #e7f5ec;
    --c-warn-bg: #fff5e0;
    --c-error-bg: #fdecea;
    /* review-12: a distinct informational (blue) tint for the CONTEXT relevance badge. */
    --c-info: #1f5fb0;
    --c-info-bg: #e7eefa;
    /* review-14: purple = REPORTING (IRRELEVANT reuses the muted/alt greys). */
    --c-purple: #6b3fa0;
    --c-purple-bg: #f1eafa;
    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;  --sp-4: 16px;  --sp-5: 24px;
    --radius: 6px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  /* Dark theme (spec §18.1): re-defines palette VARIABLES only; applied via the
     data-theme="dark" attribute on <html>. UI-only — never affects generated output. */
  :root[data-theme="dark"] {
    --c-bg: #14171c;
    --c-surface: #1d222b;
    --c-surface-alt: #262c37;
    --c-border: #3a414d;
    --c-text: #e6e9ee;
    --c-text-muted: #9aa4b2;
    --c-accent: #4f9bff;
    --c-accent-text: #0b1220;
    --c-ok: #4ec98a;
    --c-warn: #e0a64b;
    --c-error: #ff6b61;
    --c-undecided-border: #e0a64b;
    --c-badge-bg: #2a313c;
    --c-ok-bg: #16301f;
    --c-warn-bg: #3a2e16;
    --c-error-bg: #3a1f1d;
    --c-info: #4f9bff;
    --c-info-bg: #16233a;
    --c-purple: #c39bf5;
    --c-purple-bg: #2b2140;
  }
  html { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    color: var(--c-text);
    background: var(--c-bg);
    font-size: 14px;
    line-height: 1.45;
  }
  code, pre, .mono { font-family: var(--mono); }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--c-border);
    background: var(--c-surface); color: var(--c-text);
    padding: var(--sp-2) var(--sp-3); border-radius: var(--radius);
  }
  button:hover:not(:disabled) { background: var(--c-surface-alt); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--c-accent); color: var(--c-accent-text); border-color: var(--c-accent); }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  a { color: var(--c-accent); }

  /* Self-test panel */
  #selftest-root { padding: var(--sp-4); }
  .st-suite { margin-bottom: var(--sp-4); border: 1px solid var(--c-border); border-radius: var(--radius); background: var(--c-surface); }
  .st-suite > h3 { margin: 0; padding: var(--sp-2) var(--sp-3); background: var(--c-surface-alt); border-bottom: 1px solid var(--c-border); font-size: 14px; }
  .st-test { padding: var(--sp-1) var(--sp-3); border-bottom: 1px solid var(--c-surface-alt); font-family: var(--mono); font-size: 12px; }
  .st-pass { color: var(--c-ok); }
  .st-fail { color: var(--c-error); }
  .st-diff { white-space: pre-wrap; color: var(--c-error); margin: var(--sp-1) 0 var(--sp-1) var(--sp-4); }
  .st-summary { font-weight: 600; padding: var(--sp-2) var(--sp-3); }

  /* App chrome */
  /* SP-4: the app is a fixed-height shell whose MAIN area is the scroll region.
     This was previously `min-height:100vh`, which let #app-root grow with its content
     so the BODY scrolled and `.main{overflow:auto}` never actually scrolled. That
     combination silently breaks `position:sticky` inside .main: an overflow:auto
     ancestor becomes the nearest scrollport for sticky even when it never scrolls, so
     the tools rail was pinned to a viewport that never moved and scrolled away with
     the page. Making the height fixed (and letting .main shrink via min-height:0) puts
     the scrolling where the layout always intended it. */
  #app-root { height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-2) var(--sp-4); background: var(--c-surface);
    border-bottom: 1px solid var(--c-border); flex-wrap: wrap;
  }

  .topbar select, .toolbar select, .toolbar input { font: inherit; padding: 4px 6px; border: 1px solid var(--c-border); border-radius: var(--radius); background: var(--c-surface); }

  .tabnav { display: flex; gap: 2px; padding: 0 var(--sp-4); background: var(--c-surface); border-bottom: 1px solid var(--c-border); flex-wrap: wrap; }
  .tabnav button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: var(--sp-3) var(--sp-3); color: var(--c-text-muted); }
  .tabnav button.active { color: var(--c-text); border-bottom-color: var(--c-accent); font-weight: 600; }
  .tabnav .count-badge { background: var(--c-badge-bg); border-radius: 10px; padding: 0 6px; font-size: 11px; margin-left: 4px; }

  /* min-height:0 is required: without it a flex child refuses to shrink below its
     content height, .main would overflow the shell and nothing would scroll. */
  .main { flex: 1; min-height: 0; padding: var(--sp-4); overflow: auto; }
  .empty-state { color: var(--c-text-muted); padding: var(--sp-5); text-align: center; }

  .toolbar { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-3); flex-wrap: wrap; }
  .toolbar .grow { flex: 1; min-width: 180px; }
  .toolbar .muted { color: var(--c-text-muted); font-size: 12px; }
  /* review-7 #2: Apply Control Mode affordances + row checkbox column. */
  .toolbar button.active { background: var(--c-accent); color: #fff; border-color: var(--c-accent); }
  table.data th.apply-col, table.data td.apply-cell { text-align: center; width: 74px; }
  /* BULK-2: make the tick columns a full-cell hit target. The <label> fills the cell and
     is what a click lands on, so you no longer have to hit a 13px box; the checkbox is
     still a real focusable control underneath. `padding:0` on the td lets the label
     cover it completely. */
  table.data td.apply-cell, table.data td.del-cell { padding: 0; }
  .cell-check { display: flex; align-items: center; justify-content: center; width: 100%;
                min-height: 34px; padding: 4px 0; cursor: pointer; }
  .cell-check:hover { background: var(--c-surface-alt); }
  .cell-check input { width: 16px; height: 16px; cursor: pointer; }
  /* STAB-1: cells whose text GROWS when you tick a box (Control Refs, Applies to) are
     clamped to a fixed number of lines. Without this, ticking a checkbox adds a name to a
     neighbouring cell, the cell wraps onto another line, the ROW gets taller, and every row
     below it slides down under the cursor — so the next box you meant to click has moved.
     The scroll position is untouched; it is the content that shifts. Clamping keeps row
     heights constant, and the full text stays available via the cell's title tooltip.
     A RANGE is not enough — allowing 1-2 lines still grows the row on the first tick, so
     the height is FIXED at one line and long text ellipsises: the row is the same height
     whether the cell holds nothing, one name, or six. */
  .cell-clamp { display: block; height: 1.45em; line-height: 1.45; overflow: hidden;
                white-space: nowrap; text-overflow: ellipsis; }

  /* BULK-1: the apply-to-all-shown button + its caption. */
  .side-rail .apply-all { width: 100%; }
  .apply-all-note { font-size: 11px; line-height: 1.35; }
  /* TAG-1/2/3: control tags, the clickable device column heading, the tag tick column. */
  .badge.tag { background: var(--c-info-bg); color: var(--c-info); border-color: var(--c-info); font-size: 10px; }
  table.ctl-table .ctl-tags-cell { font-size: 12px; }
  table.ctl-table th.cm-dev-col { padding: 2px 4px; }
  .cm-dev-head { width: 100%; font: inherit; font-size: 12px; font-weight: 600; padding: 3px 4px;
                 background: none; border: 1px dashed transparent; border-radius: 4px; cursor: pointer;
                 color: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cm-dev-head:hover { border-color: var(--c-accent); color: var(--c-accent); background: var(--c-surface-alt); }
  .cm-dev-head.all-on { color: var(--c-ok); }
  table.ctl-table th.cm-tag-col, table.ctl-table td.cm-tag-cell { text-align: center; width: 74px; }
  table.ctl-table td.cm-tag-cell { padding: 0; }
  table.ctl-table td.cm-tag-cell input { width: 16px; }
  /* The CM rail carries more sections than the data tabs', so its card list is shorter. */
  .ctl-cards.cm-tag-cards { max-height: 32vh; }
  .cm-newtag { display: flex; gap: 6px; }
  .cm-newtag input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 4px 6px;
                     border: 1px solid var(--c-border); border-radius: 4px; background: var(--c-bg); color: var(--c-text); }
  .side-rail .ctl-card-type { border-radius: 8px; }

  /* ---- SP-1/SP-2/SP-3: the sticky tools rail ------------------------------------
     The table and the rail sit side by side; the rail is `position:sticky` so it
     stays in view as a long register scrolls (the whole point — you can change the
     control you are assigning from row 400 without scrolling back to row 1).
     `align-self:flex-start` is what lets sticky work inside a flex row. */
  .table-wrap { display: flex; align-items: flex-start; gap: var(--sp-3); }
  .table-wrap > #table-host { flex: 1; min-width: 0; }
  /* `top:0` is measured from the top of .main's scrollport, so the rail pins itself
     just under the tab bar. It scrolls internally if the viewport is too short for it. */
  .side-rail { position: sticky; top: 0; align-self: flex-start; flex: 0 0 300px; width: 300px;
               max-height: calc(100vh - 200px); overflow-y: auto; background: var(--c-surface);
               border: 1px solid var(--c-border); border-radius: 8px; padding: 10px; display: flex;
               flex-direction: column; gap: 10px; z-index: 2; }
  .side-rail.collapsed { flex-basis: auto; width: auto; padding: 6px; }
  .rail-head { display: flex; align-items: center; gap: 8px; }
  .rail-title { font-weight: 600; font-size: 13px; }
  .rail-toggle { margin-left: auto; font-size: 12px; padding: 2px 8px; }
  .rail-section { display: flex; flex-direction: column; gap: 6px; }
  .rail-modes button, .rail-history button { width: 100%; }
  .rail-history { flex-direction: row; }
  .rail-history button { flex: 1; }
  .rail-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--c-text-muted); }
  .rail-search { width: 100%; }
  .rail-count, .rail-empty { font-size: 11px; }
  .side-rail .apply-to { width: 100%; }
  .side-rail .apply-to:disabled { opacity: 0.5; cursor: not-allowed; }
  /* SP-3: control cards — title, type and DESCRIPTION, so you can tell what a control
     means while you are assigning it (a <datalist> could only ever show the value). */
  .ctl-cards { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow-y: auto;
               border: 1px solid var(--c-border); border-radius: 6px; padding: 6px; background: var(--c-bg); }
  .ctl-card { display: flex; flex-direction: column; gap: 3px; text-align: left; width: 100%;
              padding: 7px 8px; border: 1px solid var(--c-border); border-radius: 6px;
              background: var(--c-surface); cursor: pointer; font: inherit; color: inherit; }
  .ctl-card:hover { border-color: var(--c-accent); }
  .ctl-card.active { background: var(--c-accent); color: #fff; border-color: var(--c-accent); }
  .ctl-card-head { display: flex; align-items: baseline; gap: 6px; }
  .ctl-card-title { font-weight: 600; font-size: 13px; }
  .ctl-card-type { font-size: 10px; opacity: 0.75; border: 1px solid currentColor; border-radius: 8px; padding: 0 5px; }
  .ctl-card-desc { font-size: 11.5px; line-height: 1.35; opacity: 0.85; white-space: normal; }
  .ctl-card.active .ctl-card-desc { opacity: 0.95; }
  @media (max-width: 1100px) {
    .table-wrap { flex-direction: column; }
    .side-rail { position: static; width: 100%; flex-basis: auto; max-height: none; }
  }

  /* ---- VF-4/VF-5: value-format picker + manager --------------------------------- */
  .fmt-cell { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .fmt-cell select { min-width: 260px; }
  .fmt-hint { flex-basis: 100%; font-size: 11.5px; line-height: 1.4; }
  .fmt-warn { color: var(--c-error); font-size: 11.5px; }
  .fmt-body { display: flex; gap: 14px; align-items: flex-start; }
  .fmt-list { flex: 0 0 230px; display: flex; flex-direction: column; gap: 5px; max-height: 66vh; overflow-y: auto; }
  .fmt-pick { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 7px 9px; font: inherit;
              color: inherit; background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 6px; cursor: pointer; }
  .fmt-pick.active { background: var(--c-accent); color: #fff; border-color: var(--c-accent); }
  .fmt-pick-name { font-weight: 600; font-size: 13px; }
  .fmt-pick-meta { font-size: 11px; opacity: 0.8; }
  .fmt-pick.fmt-new { border-style: dashed; font-weight: 600; }
  .fmt-editor { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .fmt-editor h4, .fmt-editor h5 { margin: 0; font-size: 14px; }
  .fmt-grid { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; align-items: center; }
  .fmt-grid textarea { min-height: 40px; resize: vertical; }
  .fmt-grid input, .fmt-grid select, .fmt-grid textarea { font: inherit; font-size: 13px; width: 100%; padding: 4px 6px;
              border: 1px solid var(--c-border); border-radius: 4px; background: var(--c-bg); color: var(--c-text); }
  .fmt-usage { font-size: 12px; }
  table.fmt-opts { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.fmt-opts th, table.fmt-opts td { border: 1px solid var(--c-border); padding: 4px 6px; text-align: left; }
  table.fmt-opts th:last-child, table.fmt-opts td:last-child { width: 90px; }
  table.fmt-opts input { font: inherit; font-size: 13px; width: 100%; padding: 3px 5px; border: 1px solid var(--c-border);
              border-radius: 4px; background: var(--c-bg); color: var(--c-text); }
  .fmt-add-row { display: flex; gap: 6px; align-items: center; }
  .fmt-add-row input { flex: 1; font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--c-border);
              border-radius: 4px; background: var(--c-bg); color: var(--c-text); }
  .fmt-actions { display: flex; gap: 8px; justify-content: flex-end; }
  /* VF-8: the format-driven value editors. */
  select.val-edit { width: 100%; font: inherit; font-size: 13px; padding: 3px 5px; }
  input.val-number { width: 100%; font: inherit; font-size: 13px; padding: 3px 5px; border: 1px solid var(--c-border);
              border-radius: 4px; background: var(--c-bg); color: var(--c-text); }
  textarea.val-list { font-family: var(--font-mono, monospace); font-size: 12px; }
  /* review-12 #2: Delete Mode (mirrors Apply Control Mode) + the shared Undo button. */
  .toolbar button.active.danger { background: var(--c-error); color: #fff; border-color: var(--c-error); }
  /* review-14: the parked-relevance view toggles wear their category's colours when on. */
  .toolbar .rel-view { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border: 1px solid var(--c-border); border-radius: 10px; }
  .toolbar .rel-view input { margin: 0; }
  .toolbar .rel-view.rel-reporting.active { background: var(--c-purple-bg); color: var(--c-purple); border-color: var(--c-purple); }
  .toolbar .rel-view.rel-irrelevant.active { background: var(--c-surface-alt); color: var(--c-text-muted); border-color: var(--c-text-muted); }
  table.data th.del-col, table.data td.del-cell { text-align: center; width: 84px; }

  table.data { border-collapse: collapse; width: 100%; background: var(--c-surface); font-size: 13px; }
  table.data th, table.data td { border: 1px solid var(--c-border); padding: 6px 8px; text-align: left; vertical-align: top; }
  table.data thead th { background: var(--c-surface-alt); position: sticky; top: 0; cursor: pointer; user-select: none; white-space: nowrap; }
  table.data thead th .arrow { color: var(--c-accent); }
  /* Resizable, fixed-layout tables (review-2 #4) + wrapping cells (review-2 #3) */
  table.data.resizable { table-layout: fixed; width: auto; }
  table.data td { word-break: break-word; overflow-wrap: anywhere; }
  table.data th.lead-col { width: 34px; }
  table.data thead th { position: relative; }
  table.data thead th .col-resize { position: absolute; top: 0; right: -3px; width: 8px; height: 100%; cursor: col-resize; user-select: none; }
  table.data td.dcell .val-edit { width: 100%; box-sizing: border-box; resize: vertical; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.7em; font: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid var(--c-border); border-radius: 4px; background: var(--c-surface); color: var(--c-text); }
  /* review-16 #1: for text-valued datasets an EMPTY box is a real decision ("set this
     to blank"), so returning an item to undecided needs its own control.
     review-17 #2: it sits BESIDE the value box, not under it — one row per line. */
  table.data td.dcell .dec-row { display: flex; align-items: flex-start; gap: 4px; }
  table.data td.dcell .dec-row .val-edit { flex: 1 1 auto; min-width: 0; }
  table.data td.dcell .dec-clear { flex: 0 0 auto; align-self: flex-start; margin: 0; font: inherit; font-size: 11px; line-height: 1.5; padding: 0 6px; border: 1px solid var(--c-border); border-radius: 4px; background: var(--c-surface-alt); color: var(--c-text-muted); cursor: pointer; }
  table.data td.dcell .dec-clear:hover { color: var(--c-error); border-color: var(--c-error); }
  table.data tbody tr.undecided { border-left: 3px solid var(--c-undecided-border); }
  table.data tbody tr:nth-child(even) { background: var(--c-surface-alt); }
  /* review-13 #1: the delete-selection tint must beat the even-row stripe, so it is
     declared AFTER it and matches both parities explicitly. */
  table.data tbody tr.del-marked, table.data tbody tr.del-marked:nth-child(even) { background: var(--c-error-bg); }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--c-border); }
  .badge.undecided { background: var(--c-warn-bg); color: var(--c-warn); border-color: var(--c-undecided-border); }
  .badge.decided { background: var(--c-ok-bg); color: var(--c-ok); border-color: var(--c-ok); }
  /* HELD-1: "decided, but flagged for review". Deliberately its own colour: it counts as
     undecided, but it still HOLDS a value, and telling those two apart at a glance is the
     entire reason the state exists. */
  .badge.held { background: var(--c-info-bg); color: var(--c-info); border-color: var(--c-info); font-weight: 600; }
  /* review-17 #3: a status badge that flips the item's decided/undecided state on click. */
  .badge.flip { cursor: pointer; user-select: none; }
  .badge.flip:hover { filter: brightness(1.08); text-decoration: underline; }
  .badge.superseded { background: var(--c-surface-alt); color: var(--c-text-muted); }
  /* review-12 #3: Security Relevance badges — HIGH red, MEDIUM orange, CONTEXT blue.
     The table cell uses a <select> wearing the SAME badge skin so the value is both
     readable at a glance and editable in place (colour is never the sole signal). */
  .badge.rel-high, select.rel-select.rel-high { background: var(--c-error-bg); color: var(--c-error); border-color: var(--c-error); }
  .badge.rel-medium, select.rel-select.rel-medium { background: var(--c-warn-bg); color: var(--c-warn); border-color: var(--c-undecided-border); }
  .badge.rel-context, select.rel-select.rel-context { background: var(--c-info-bg); color: var(--c-info); border-color: var(--c-info); }
  /* review-14: REPORTING purple, IRRELEVANT grey. */
  .badge.rel-reporting, select.rel-select.rel-reporting { background: var(--c-purple-bg); color: var(--c-purple); border-color: var(--c-purple); }
  .badge.rel-irrelevant, select.rel-select.rel-irrelevant { background: var(--c-surface-alt); color: var(--c-text-muted); border-color: var(--c-border); }
  select.rel-select { font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--c-border); background: var(--c-surface); color: var(--c-text-muted); max-width: 100%; }
  /* review-12 #1: per-device control satisfaction. */
  .badge.satisfied { background: var(--c-ok-bg); color: var(--c-ok); border-color: var(--c-ok); }
  .badge.unsatisfied { background: var(--c-error-bg); color: var(--c-error); border-color: var(--c-error); }

  /* Activity / Errors drawer */
  .drawer { border-top: 1px solid var(--c-border); background: var(--c-surface); max-height: 30vh; display: flex; flex-direction: column; }
  .drawer .drawer-head { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-4); background: var(--c-surface-alt); border-bottom: 1px solid var(--c-border); }
  .drawer .drawer-head .title { font-weight: 600; }
  .drawer .log { overflow: auto; padding: var(--sp-2) var(--sp-4); font-family: var(--mono); font-size: 12px; }
  .drawer .log .entry { padding: 2px 0; border-bottom: 1px solid var(--c-surface-alt); }
  .drawer .log .error { color: var(--c-error); }
  .drawer .log .warning { color: var(--c-warn); }
  .drawer .log .info, .drawer .log .success { color: var(--c-text); }
  .drawer.collapsed .log { display: none; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* Inline decision editors */
  table.data td.dcell select, table.data td.dcell input, table.data td input.edit { font: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid var(--c-border); border-radius: 4px; background: var(--c-surface); }
  table.data td.dcell select { margin-right: 4px; }
  table.data td.dcell.invalid { background: var(--c-error-bg); }
  table.data .expand-btn { border: none; background: transparent; padding: 0 4px; cursor: pointer; color: var(--c-text-muted); }
  table.data tr.detail-row > td { background: var(--c-surface-alt); }
  .detail-form { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; align-items: start; padding: 6px 2px; max-width: 900px; }
  .detail-form label { font-size: 12px; color: var(--c-text-muted); padding-top: 4px; }
  .detail-form input, .detail-form textarea { font: inherit; font-size: 13px; width: 100%; padding: 4px 6px; border: 1px solid var(--c-border); border-radius: 4px; }
  .detail-form textarea { min-height: 42px; resize: vertical; }
  .detail-form .rationale-cell { display: flex; gap: 8px; align-items: flex-start; }
  .detail-form .rationale-cell textarea { flex: 1; }
  .detail-form .rationale-cell button { white-space: nowrap; flex: 0 0 auto; }
  .detail-issues { grid-column: 1 / -1; }
  .detail-issues .issue { font-size: 12px; padding: 2px 0; }
  .detail-issues .issue.error { color: var(--c-error); }
  .detail-issues .issue.warning { color: var(--c-warn); }

  /* Generate tab */
  .gen-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .gen-card { border: 1px solid var(--c-border); border-radius: 8px; background: var(--c-surface); padding: 16px; min-width: 220px; }
  .gen-card h3 { margin: 0 0 6px; font-size: 15px; }
  .gen-card .why { color: var(--c-warn); font-size: 12px; min-height: 16px; }
  .gen-ready { color: var(--c-ok); font-weight: 600; }
  .gen-blocked { color: var(--c-warn); font-weight: 600; }
  /* v1.3 per-command options (spec §20.8). */
  .gen-card { min-width: 260px; }
  .gen-options-toggle { font-size: 12px; }
  .gen-options { margin-top: 10px; border-top: 1px solid var(--c-border); padding-top: 8px; }
  .gen-opt-grp { margin-bottom: 8px; }
  .gen-opt-grp > strong { display: block; font-size: 12px; color: var(--c-text-muted); margin-bottom: 3px; }
  .gen-opt-sub { margin: 2px 0 2px 10px; font-size: 12px; }
  .gen-opt-sub > em { color: var(--c-text-muted); margin-right: 6px; }
  .gen-opt { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; margin: 1px 10px 1px 0; }

  /* Devices tab */
  .dev-group { border: 1px solid var(--c-border); border-radius: 8px; background: var(--c-surface); margin-bottom: 12px; overflow: hidden; }
  .dev-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--c-surface-alt); flex-wrap: wrap; }
  .dev-row:last-child { border-bottom: none; }
  .dev-row.superseded { background: var(--c-surface-alt); color: var(--c-text-muted); padding-left: 28px; }
  .dev-row .dev-name { font-weight: 600; }
  .dev-row .dev-meta { color: var(--c-text-muted); font-size: 12px; }
  .dev-row .counts { font-size: 12px; color: var(--c-text-muted); }
  .dev-row .spacer { flex: 1; }
  .dev-detail-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .superseded-banner { background: var(--c-warn-bg); border: 1px solid var(--c-undecided-border); color: var(--c-warn); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .panel { border: 1px solid var(--c-border); border-radius: 8px; background: var(--c-surface); display: flex; flex-direction: column; }
  .panel > h3 { margin: 0; padding: 8px 12px; background: var(--c-surface-alt); border-bottom: 1px solid var(--c-border); font-size: 14px; }
  .panel .panel-note { padding: 4px 12px; font-size: 12px; color: var(--c-text-muted); border-bottom: 1px solid var(--c-surface-alt); }
  .panel table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .panel th, .panel td { border-bottom: 1px solid var(--c-surface-alt); padding: 4px 8px; text-align: left; vertical-align: top; }
  .panel .empty { padding: 10px 12px; color: var(--c-text-muted); }

  /* Set-decisions-from-files section (Devices view) */
  .assign-section { margin-top: 16px; border-top: 1px solid var(--c-border); padding-top: 12px; }
  .assign-section h3 { margin: 0 0 4px; font-size: 15px; }
  .assign-block { border: 1px solid var(--c-border); border-radius: 6px; background: var(--c-surface); padding: 10px; margin: 8px 0; max-width: 760px; }
  .assign-result { margin-top: 6px; font-size: 12px; font-family: var(--mono); }
  .assign-result .error { color: var(--c-error); }
  .assign-result .success, .assign-result .info { color: var(--c-ok); }

  /* Control Manager */
  .ctl-add { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 16px; padding: 10px; border: 1px solid var(--c-border); border-radius: 6px; background: var(--c-surface); }

  <div id="root"></div>

  <!-- =========================================================================
       MODULE SCRIPTS — ordered per spec §14. Each is an IIFE attaching to `App`.
       Future-phase modules are inserted before the bootstrap marker.
       ========================================================================= -->

  <script>
    /* App namespace root. */
    var App = window.App || {};
    window.App = App;
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.types
   * PURPOSE: Central home for the JSDoc typedefs used as the shared type
   *          vocabulary across modules (spec §5/§6/§13.2). No runtime behaviour —
   *          typedefs are documentation that tooling and humans rely on.
   * PURITY:  pure (declarations only)
   * DEPENDS: (none)
   * INVARIANTS: typedefs here are the single source of truth for cross-module shapes.
   * ============================================================================= */
  (function (App) {
    'use strict';

    /**
     * @typedef {Object} Issue
     * @property {'parse'|'validation'|'state'|'completeness'|'generation'} category
     * @property {'error'|'warning'|'info'} severity
     * @property {string} message            Human-readable WHAT.
     * @property {string} [location]         WHERE (file/slot/line/key).
     * @property {string} [fix]              Suggested remediation.
     */

    /**
     * @typedef {Object} ParseResult
     * @property {RegisterItemSeed[]} items  Keyed items discovered in the capture.
     * @property {Issue[]} warnings
     * @property {Issue[]} errors
     * @property {*} [template]              Retained source structure (tactical JSON).
     * @property {Object<string,string>} [values]  Optional per-key capture value.
     * @property {string[]} keys             Sorted unique applicability keys.
     */

    /**
     * @typedef {Object} RegisterItemSeed
     * @property {string} key
     * @property {*} [defaultValue]          Captured value used to seed a decision default.
     */

    /**
     * @typedef {Object} RegisterItem
     * @property {string} key
     * @property {string} [description]
     * @property {Object|null} decision      Shape per adapter.decisionSchema; null = undecided.
     * @property {string[]} controlRefs
     * @property {string} [rationale]
     * @property {string} [rollback]
     * @property {'undecided'|'decided'} status   Derived (recompute on load).
     */

    /**
     * @typedef {Object} Snapshot
     * @property {string} capturedUtc
     * @property {string} sourceFilename
     * @property {string} sha256             Hash of raw uploaded bytes (hex 64).
     * @property {string[]} keys             Sorted unique; the applicability set.
     * @property {Object<string,string>} [values]
     * @property {*} [template]
     */

    /**
     * @typedef {Object} DeviceConfig
     * @property {string} id                 Slug, unique per version.
     * @property {string} baseId             Stable identity across versions.
     * @property {number} version            Integer >= 1.
     * @property {string|null} supersedesId
     * @property {string} name
     * @property {string} model
     * @property {string} firmware
     * @property {string} onboardedUtc
     * @property {Object<string,Snapshot>} snapshots   Keyed by dataset id.
     */

    /**
     * @typedef {Object} Project
     * @property {number} schemaVersion
     * @property {string} platformProfileId
     * @property {{createdUtc:string, modifiedUtc:string, appVersion:string}} meta
     * @property {DeviceConfig[]} deviceConfigs
     * @property {Object<string, RegisterItem[]>} items   Keyed by dataset id.
     */

    /**
     * @typedef {Object} DecisionField
     * @property {string} name
     * @property {'enum'|'string'|'value-typed'|'bool'} kind
     * @property {string[]} [options]        For kind 'enum'.
     * @property {boolean} [required]
     */

    /**
     * @typedef {Object} ColumnDef
     * @property {string} key                Logical column id.
     * @property {string} label
     * @property {(item:RegisterItem)=>string} [get]   Derived value accessor.
     */

    /**
     * @typedef {Object} GeneratedFile
     * @property {string} name               Path within the zip.
     * @property {string} content            File contents (text).
     */

    /**
     * @typedef {Object} DeviceContext
     * @property {DeviceConfig} device
     * @property {Project} project
     * @property {string} toolVersion
     * @property {string} generatedUtc
     */

    App.types = {}; // marker; all content above is documentation
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.util.clock
   * PURPOSE: Single, injectable time source so all timestamps are deterministic
   *          and testable (spec §13.4, C-6). Engine code MUST source time here.
   * PURITY:  pure (the injected fn is the only side-channel; default reads Date)
   * DEPENDS: (none)
   * INVARIANTS: nowIso() always returns a UTC ISO-8601 string with millisecond
   *             precision and trailing 'Z'.
   * ============================================================================= */
  (function (App) {
    'use strict';

    // Default clock reads the real wall clock; tests/determinism override via setClock.
    var _clock = function () { return new Date(); };

    /**
     * Current time as a UTC ISO-8601 string.
     * @returns {string} e.g. '2026-06-30T12:00:00.000Z'
     * @example App.util.clock.setClock(() => new Date('1980-01-01Z')); App.util.clock.nowIso();
     */
    function nowIso() {
      return new Date(_clock().getTime()).toISOString();
    }

    /**
     * Replace the time source. Pass a function returning a Date.
     * @param {() => Date} fn
     * @returns {void}
     */
    function setClock(fn) {
      if (typeof fn !== 'function') throw new TypeError('setClock requires a function');
      _clock = fn;
    }

    /**
     * Restore the default wall-clock source.
     * @returns {void}
     */
    function resetClock() { _clock = function () { return new Date(); }; }

    App.util = App.util || {};
    /**
     * Format a UTC ISO timestamp as AEST (UTC+10, no DST) — pure, deterministic.
     * Parses the given ISO (not the wall clock), so it is safe in generated artifacts.
     * @param {string} iso @returns {string} e.g. "2026-07-01 11:00:00 AEST"
     */
    function toAest(iso) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      var t = new Date(d.getTime() + 10 * 3600 * 1000); // UTC+10 = AEST
      var p = function (n) { return ('0' + n).slice(-2); };
      return t.getUTCFullYear() + '-' + p(t.getUTCMonth() + 1) + '-' + p(t.getUTCDate()) + ' ' +
        p(t.getUTCHours()) + ':' + p(t.getUTCMinutes()) + ':' + p(t.getUTCSeconds()) + ' AEST';
    }

    App.util.clock = { nowIso: nowIso, setClock: setClock, resetClock: resetClock, toAest: toAest };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.util.html
   * PURPOSE: HTML escaping and tiny string builders. ALL data-derived text written
   *          into HTML (tables, reports, generated docs) MUST pass through esc()
   *          to prevent markup corruption / injection (spec §10.3, §13.4).
   * PURITY:  pure (string -> string; no DOM)
   * DEPENDS: (none)
   * INVARIANTS: esc() is total over any input (coerces to string first).
   * ============================================================================= */
  (function (App) {
    'use strict';

    var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

    /**
     * Escape text for safe insertion into HTML element content or quoted attributes.
     * @param {*} s  Coerced to string.
     * @returns {string}
     * @example App.util.html.esc('<a>') // '&lt;a&gt;'
     */
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) { return ESC_MAP[ch]; });
    }

    /**
     * Escape a value for use inside a double-quoted HTML attribute.
     * (Same as esc; provided as an explicit, intention-revealing alias.)
     * @param {*} s
     * @returns {string}

    /**
     * Build an HTML element string from tag, attributes, and children.
     * Attribute values are escaped; children are NOT escaped (callers pass
     * already-escaped strings or nested el() output).
     * @param {string} tag
     * @param {Object<string,*>} [attrs]
     * @param {(string|string[])} [kids]
     * @returns {string}
     * @example App.util.html.el('span', {class:'x'}, esc(userText))

    function el(tag, attrs, kids) {
      var a = '';

        for (var k in attrs) {

      if (/^(br|hr|img|input|meta|link)$/i.test(tag)) return '<' + tag + a + '>';

    }

    App.util = App.util || {};
    App.util.html = { esc: esc, attr: attr, el: el };
  })(App);
  </script>

  <script>
  /* =============================================================================
   * MODULE: App.util.hash  — VENDORED SHA-256
   * PURPOSE: Pure-JS SHA-256 over UTF-8 strings/bytes. REQUIRED because

   * PURITY:  pure

   * ============================================================================= */
  (function (App) {
    'use strict';

    /* BEGIN VENDORED ----------------------------------------------------------
     * SHA-256, compact public-domain implementation (after the widely-used
